<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Arsenal — Municipality Directory Mockup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  /* ═══ DESIGN TOKENS ═══
     Structured for direct porting to React/Tailwind.
     WCAG AA compliant: secondary 8.2:1, muted 4.6:1 on --bg. */
  :root {
    /* Backgrounds */
    --bg:         #0C0C0C;
    --card:       #141412;
    --card2:      #1A1A17;
    --card-hover: #1F1F1C;

    /* Borders */
    --border:      rgba(255,255,255,0.08);
    --border-hover:rgba(255,255,255,0.16);

    /* Text — WCAG AA on #0C0C0C */
    --text:      #F0ECE6;   /* primary — 15.7:1 */
    --text-sec:  #B8B2AC;   /* secondary — 8.2:1 */
    --text-muted:#8F897F;   /* muted — 4.6:1 (AA pass) */
    --text-dim:  #5A5550;   /* decorative only — NOT for readable text */

    /* Accent — used on backgrounds/borders only, never as text */
    --orange:    #E85D26;
    --orange-dim:rgba(232,93,38,0.12);
    --blue:      #3B82F6;
    --blue-dim:  rgba(59,130,246,0.12);
    --green:     #22C55E;
    --green-dim: rgba(34,197,94,0.12);
    --purple:    #A855F7;
    --purple-dim:rgba(168,85,247,0.12);

    /* Accent text — AA on dark bgs */
    --orange-text:#FDBA74;
    --blue-text:  #93C5FD;
    --green-text: #86EFAC;
    --purple-text:#D8B4FE;

    /* Typography */
    --font-display: 'Syne', sans-serif;
    --font-body:    'Space Grotesk', sans-serif;
    --font-mono:    'JetBrains Mono', monospace;

    /* Radius */
    --radius-sm: 4px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --radius-xl: 16px;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  body::-webkit-scrollbar { width: 6px; }
  body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

  /* ═══ TOP BAR ═══ */
  .top-bar {
    position: sticky; top: 0; z-index: 100;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  .top-title-row {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 14px 20px 12px; flex-wrap: wrap;
  }
  .top-title-left { flex: 1; min-width: 0; }
  .top-title-inline { display: flex; align-items: center; gap: 10px; }
  .arsenal-badge {
    background: var(--orange); color: #fff;
    font-size: 10px; font-weight: 900; font-family: var(--font-mono);
    letter-spacing: 0.12em; padding: 3px 7px; border-radius: 3px;
    text-transform: uppercase; flex-shrink: 0;
  }
  .top-title-inline h1 {
    font-family: var(--font-display); font-weight: 900; font-size: 20px;
    color: var(--text); margin: 0; letter-spacing: -0.02em; white-space: nowrap;
  }
  .top-subtitle {
    font-size: 12px; color: var(--text-dim); margin-top: 2px;
  }
  .top-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .btn-stats {
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--text-muted); border-radius: 6px; padding: 7px 12px;
    font-size: 12px; font-family: var(--font-body); font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .btn-stats.active {
    background: var(--blue-dim); border-color: rgba(59,130,246,0.4);
    color: var(--blue-text);
  }
  .btn-export {
    background: var(--orange-dim); border: 1px solid rgba(232,93,38,0.3);
    color: var(--orange-text); border-radius: 6px; padding: 7px 14px;
    font-size: 12px; font-family: var(--font-body); font-weight: 700;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
  }

  /* ═══ STATS ROW (wrapping) ═══ */
  .stats-row {
    display: flex; flex-wrap: wrap; gap: 0;
    border-bottom: 1px solid var(--border);
  }
  .stat-cell {
    flex: 1 1 80px; min-width: 72px; padding: 10px 14px;
    border-right: 1px solid var(--border);
  }
  .stat-cell:last-child { border-right: none; }
  .stat-label {
    font-size: 10px; color: var(--text-dim); font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 2px;
  }
  .stat-value {
    font-size: 16px; font-weight: 900; font-family: var(--font-display);
  }

  /* ═══ FILTER BAR ═══ */
  .filter-bar {
    display: flex; gap: 8px; padding: 10px 20px 12px;
    flex-wrap: wrap; align-items: center;
  }
  .search-wrap {
    flex: 1 1 200px; min-width: 160px; position: relative;
  }
  .search-wrap input {
    width: 100%; background: var(--card2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 8px 12px 8px 32px;
    font-size: 14px; font-family: var(--font-body); outline: none;
  }
  .search-wrap input:focus { border-color: var(--border-hover); }
  .search-wrap input::placeholder { color: var(--text-dim); }
  .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-dim); font-size: 14px; pointer-events: none;
  }
  .filter-select {
    flex: 0 0 auto; background: var(--card2); border: 1px solid var(--border);
    color: var(--text-muted); border-radius: 6px; padding: 8px 10px;
    font-size: 13px; font-family: var(--font-body); outline: none; cursor: pointer;
  }
  .filter-select option { background: var(--card); color: var(--text); }
  .pop-pills { display: flex; gap: 4px; flex-wrap: wrap; }
  .pop-pill {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    color: var(--text-muted); border-radius: 5px; padding: 6px 10px;
    font-size: 11px; font-family: var(--font-mono); cursor: pointer;
    white-space: nowrap; transition: all 0.12s;
  }
  .pop-pill.active {
    background: var(--orange-dim); border-color: rgba(232,93,38,0.4);
    color: var(--orange-text); font-weight: 700;
  }
  .btn-clear {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 5px; padding: 6px 10px; font-size: 11px;
    font-family: var(--font-mono); cursor: pointer; display: none;
  }

  /* ═══ RESULTS BAR ═══ */
  .results-bar {
    padding: 8px 20px; background: #0F0F0D;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .results-count { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }
  .results-count .highlight { color: var(--blue-text); font-weight: 700; }
  .sort-pills { display: flex; gap: 6px; align-items: center; }
  .sort-label { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
  .sort-pill {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: var(--radius-sm); padding: 3px 8px; font-size: 11px;
    font-family: var(--font-mono); cursor: pointer;
  }
  .sort-pill.active {
    background: var(--orange-dim); border-color: rgba(232,93,38,0.3);
    color: var(--orange-text);
  }

  /* ═══ CARD GRID ═══ */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 12px;
    padding: 16px 20px;
  }
  @media (max-width: 480px) {
    .card-grid { grid-template-columns: 1fr; }
  }

  /* ═══ MUNICIPALITY CARD ═══ */
  .muni-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    position: relative;
    overflow: hidden;
  }
  .muni-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    border-color: var(--border-hover);
  }
  .muni-card-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    margin-bottom: 12px;
  }
  .muni-name {
    font-size: 16px; font-weight: 800; font-family: var(--font-display);
    color: var(--text); line-height: 1.2; letter-spacing: -0.01em;
  }
  .muni-state {
    font-size: 13px; color: var(--text-muted); margin-top: 2px;
  }
  .muni-pop {
    text-align: right; flex-shrink: 0;
  }
  .muni-pop-value {
    font-size: 18px; font-weight: 900; font-family: var(--font-display);
    color: var(--text); line-height: 1;
  }
  .muni-pop-label {
    font-size: 9px; color: var(--text-dim); font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.08em; text-align: right;
  }
  .muni-card-tags {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }

  /* Type badge */
  .type-badge {
    font-size: 10px; font-weight: 700; font-family: var(--font-mono);
    padding: 2px 8px; border-radius: 3px; letter-spacing: 0.06em;
    text-transform: uppercase; white-space: nowrap;
  }
  .type-badge.city    { background: var(--blue-dim);   border: 1px solid var(--blue);   color: var(--blue-text); }
  .type-badge.town    { background: var(--orange-dim); border: 1px solid var(--orange); color: var(--orange-text); }
  .type-badge.village { background: var(--green-dim);  border: 1px solid var(--green);  color: var(--green-text); }
  .type-badge.borough { background: var(--purple-dim); border: 1px solid var(--purple); color: var(--purple-text); }

  .muni-card-meta {
    display: flex; gap: 12px; margin-top: 12px;
    padding-top: 10px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-muted); font-family: var(--font-mono);
  }
  .muni-card-meta span { white-space: nowrap; }

  /* Contact preview on card */
  .muni-card-contact {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .contact-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--green);
    flex-shrink: 0;
  }
  .contact-name {
    font-size: 12px; font-weight: 600; color: var(--green-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .contact-title {
    font-size: 10px; color: var(--text-dim); font-family: var(--font-mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ═══ DETAIL MODAL ═══ */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    align-items: center; justify-content: center; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal-panel {
    background: var(--card); border: 1px solid var(--border-hover);
    border-radius: 10px; width: 100%; max-width: 480px;
    overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    max-height: 90dvh; overflow-y: auto;
    animation: modalIn 0.2s ease-out;
  }
  @keyframes modalIn { from { opacity:0; transform:scale(0.96) translateY(8px); } to { opacity:1; transform:none; } }
  .modal-panel::-webkit-scrollbar { width: 4px; }
  .modal-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

  /* Modal header */
  .modal-header {
    background: #181816; border-bottom: 1px solid var(--border);
    padding: 16px 20px; display: flex; align-items: flex-start; gap: 12px;
  }
  .modal-header-info { flex: 1; min-width: 0; }
  .modal-header-name {
    font-size: 18px; font-weight: 800; font-family: var(--font-display);
    color: var(--text); line-height: 1.2;
  }
  .modal-header-state {
    font-size: 13px; color: var(--text-muted); margin-top: 3px;
  }
  .modal-close {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    width: 32px; height: 32px; border-radius: 6px; cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: border-color 0.15s;
  }
  .modal-close:hover { border-color: var(--border-hover); color: var(--text); }

  /* Modal stat duo */
  .modal-stats {
    padding: 16px 20px 0; display: flex; gap: 12px;
  }
  .modal-stat-box {
    flex: 1; border-radius: var(--radius-md); padding: 12px 16px;
  }
  .modal-stat-box.pop {
    background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2);
  }
  .modal-stat-box.area {
    background: rgba(232,93,38,0.08); border: 1px solid rgba(232,93,38,0.2);
  }
  .modal-stat-label {
    font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .modal-stat-value {
    font-size: 26px; font-weight: 900; font-family: var(--font-display);
    margin-top: 2px;
  }
  .modal-stat-box.pop .modal-stat-value { color: var(--blue-text); }
  .modal-stat-box.area .modal-stat-value { color: var(--orange-text); }
  .modal-stat-sub {
    font-size: 11px; color: var(--text-dim);
  }

  /* Modal field rows */
  .modal-fields { padding: 12px 20px 8px; }
  .modal-field-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .modal-field-row:last-child { border-bottom: none; }
  .modal-field-label {
    font-size: 13px; color: var(--text-muted);
  }
  .modal-field-value {
    font-size: 13px; color: var(--text); text-align: right;
  }

  /* Modal contact block */
  .modal-contact-section { padding: 0 20px 8px; }
  .modal-contact-heading {
    font-size: 11px; color: var(--text-dim); font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;
    margin-bottom: 6px;
  }
  .modal-contact-card {
    background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2);
    border-radius: 6px; padding: 10px 12px;
  }
  .modal-contact-name {
    font-size: 14px; font-weight: 700; color: var(--text);
  }
  .modal-contact-title {
    font-size: 12px; color: var(--text-muted); margin-top: 1px;
  }
  .modal-contact-links {
    display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
  }
  .modal-contact-link {
    background: var(--green-dim); border: 1px solid rgba(34,197,94,0.3);
    color: var(--green-text); border-radius: 5px; padding: 6px 12px;
    font-size: 12px; font-family: var(--font-mono); font-weight: 600;
    text-decoration: none; display: flex; align-items: center; gap: 4px;
  }
  .modal-contact-link.email {
    background: var(--blue-dim); border-color: rgba(59,130,246,0.3);
    color: var(--blue-text);
  }

  /* Modal actions */
  .modal-actions {
    padding: 12px 20px 16px; display: flex; gap: 8px;
  }
  .modal-action-btn {
    flex: 1; border-radius: 6px; padding: 9px 0; text-align: center;
    font-size: 13px; font-family: var(--font-body); font-weight: 600;
    text-decoration: none; display: block; cursor: pointer;
  }
  .modal-action-btn.map {
    background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3);
    color: var(--blue-text);
  }
  .modal-action-btn.export {
    background: var(--orange-dim); border: 1px solid rgba(232,93,38,0.3);
    color: var(--orange-text);
  }

  /* ═══ EMPTY STATE ═══ */
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-muted); font-size: 14px;
  }

  /* ═══ FOOTER ═══ */
  .footer {
    border-top: 1px solid var(--border); padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .footer span, .footer a {
    font-size: 11px; color: var(--text-dim); font-family: var(--font-mono);
    text-decoration: none;
  }

  /* ═══ UTILITY ═══ */
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ═══ TOP BAR ═══ -->
<div class="top-bar">
  <div class="top-title-row">
    <div class="top-title-left">
      <div class="top-title-inline">
        <span class="arsenal-badge">Arsenal</span>
        <h1>Municipality Directory</h1>
      </div>
      <div class="top-subtitle">20 sample municipalities · 2020 Census · Card Layout Mockup</div>
    </div>
    <div class="top-actions">
      <button class="btn-stats" id="btnStats" onclick="toggleStats()">Stats</button>
      <button class="btn-export" onclick="exportCSV()">↓ Export CSV</button>
    </div>
  </div>

  <!-- Stats row (wrapping) -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="search-wrap">
      <span class="search-icon">&#x2315;</span>
      <input type="text" id="searchInput" placeholder="Search by city name or state..." oninput="applyFilters()">
    </div>
    <select class="filter-select" id="stateFilter" onchange="applyFilters()">
      <option value="">All States</option>
    </select>
    <select class="filter-select" id="typeFilter" onchange="applyFilters()">
      <option value="">All Types</option>
      <option value="city">City</option>
      <option value="town">Town</option>
      <option value="village">Village</option>
      <option value="borough">Borough</option>
    </select>
    <div class="pop-pills" id="popPills"></div>
    <button class="btn-clear" id="btnClear" onclick="clearFilters()">Clear</button>
  </div>
</div>

<!-- Results bar -->
<div class="results-bar">
  <div class="results-count" id="resultsCount"></div>
  <div class="sort-pills">
    <span class="sort-label">Sort:</span>
    <button class="sort-pill active" data-sort="population" onclick="setSort('population')">Population ↓</button>
    <button class="sort-pill" data-sort="name" onclick="setSort('name')">Name</button>
    <button class="sort-pill" data-sort="state" onclick="setSort('state')">State</button>
    <button class="sort-pill" data-sort="area" onclick="setSort('area')">Area</button>
  </div>
</div>

<!-- Card grid -->
<div class="card-grid" id="cardGrid"></div>

<!-- Empty state -->
<div class="empty-state hidden" id="emptyState">No municipalities match your filters.</div>

<!-- Footer -->
<div class="footer">
  <span>Source: 2024 Census Bureau Gazetteer · Population: 2020 US Decennial Census</span>
  <a href="#">aheadofmarket.com</a>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
  <div class="modal-panel" onclick="event.stopPropagation()" id="modalPanel"></div>
</div>

<script>

const POP_PRESETS = [
  { label: 'Any',       min: 0,       max: Infinity },
  { label: 'Under 10K', min: 0,       max: 10000    },
  { label: '10K-50K',   min: 10000,   max: 50000    },
  { label: '50K-250K',  min: 50000,   max: 250000   },
  { label: '250K+',     min: 250000,  max: Infinity  },
];

// ═══ STATE ═══════════════════════════════════════════════════════════════════
let currentSort = 'population';
let sortDir = 'desc';
let popPreset = 0;
let selectedPlace = null;

// ═══ HELPERS ═════════════════════════════════════════════════════════════════
function fmtPop(n) {
  if (n == null) return 'N/A';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(n >= 100000 ? 0 : 1) + 'K';
  return n.toLocaleString();
}

function fmtArea(n) {
  if (n == null) return 'N/A';
  return n.toFixed(1) + ' mi²';
}

function fmtPopFull(n) {
  if (n == null) return 'N/A';
  return n.toLocaleString();
}

// ═══ INIT ════════════════════════════════════════════════════════════════════
function init() {
  buildStateFilter();
  buildPopPills();
  buildStatsRow();
  applyFilters();
}

function buildStateFilter() {
  const states = [...new Set(MUNICIPALITIES.map(m => m.state_abbr))].sort();
  const sel = document.getElementById('stateFilter');
  states.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s + ' – ' + MUNICIPALITIES.find(m => m.state_abbr === s).state_name;
    sel.appendChild(opt);
  });
}

function buildPopPills() {
  const container = document.getElementById('popPills');
  POP_PRESETS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'pop-pill' + (i === 0 ? ' active' : '');
    btn.textContent = p.label;
    btn.onclick = () => { popPreset = i; updatePopPills(); applyFilters(); };
    container.appendChild(btn);
  });
}

function updatePopPills() {
  document.querySelectorAll('.pop-pill').forEach((btn, i) => {
    btn.className = 'pop-pill' + (i === popPreset ? ' active' : '');
  });
}

function buildStatsRow() {
  const types = { city: 0, town: 0, village: 0, borough: 0 };
  MUNICIPALITIES.forEach(m => { if (types[m.type] !== undefined) types[m.type]++; });
  const statesCount = new Set(MUNICIPALITIES.map(m => m.state_abbr)).size;

  const stats = [
    { label: 'Total',    value: MUNICIPALITIES.length, color: 'var(--text)' },
    { label: 'Cities',   value: types.city,    color: 'var(--blue-text)' },
    { label: 'Towns',    value: types.town,     color: 'var(--orange-text)' },
    { label: 'Villages', value: types.village,  color: 'var(--green-text)' },
    { label: 'Boroughs', value: types.borough,  color: 'var(--purple-text)' },
    { label: 'States',   value: statesCount,    color: 'var(--text-muted)' },
  ];

  const row = document.getElementById('statsRow');
  row.innerHTML = stats.map(s => `
    <div class="stat-cell">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value" style="color:${s.color}">${s.value}</div>
    </div>
  `).join('');
}

// ═══ FILTER + SORT ═══════════════════════════════════════════════════════════
function getFiltered() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const stateVal = document.getElementById('stateFilter').value;
  const typeVal = document.getElementById('typeFilter').value;
  const preset = POP_PRESETS[popPreset];

  let results = MUNICIPALITIES.filter(m => {
    if (stateVal && m.state_abbr !== stateVal) return false;
    if (typeVal && m.type !== typeVal) return false;
    const pop = m.population_2020 || 0;
    if (pop < preset.min) return false;
    if (preset.max !== Infinity && pop > preset.max) return false;
    if (q) {
      const name = (m.name || '').toLowerCase();
      const state = (m.state_name || '').toLowerCase();
      const abbr = (m.state_abbr || '').toLowerCase();
      if (!name.includes(q) && !state.includes(q) && !abbr.includes(q)) return false;
    }
    return true;
  });

  results.sort((a, b) => {
    let va, vb;
    switch (currentSort) {
      case 'population': va = a.population_2020 || 0; vb = b.population_2020 || 0; break;
      case 'name':       va = a.name.toLowerCase(); vb = b.name.toLowerCase(); break;
      case 'state':      va = a.state_abbr; vb = b.state_abbr; break;
      case 'area':       va = a.land_area_sqmi || 0; vb = b.land_area_sqmi || 0; break;
      default:           va = 0; vb = 0;
    }
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  return results;
}

function applyFilters() {
  const results = getFiltered();
  renderCards(results);
  updateResultsCount(results.length);
  updateClearBtn();
  updateFilteredStats(results);
}

function updateResultsCount(count) {
  const el = document.getElementById('resultsCount');
  if (count < MUNICIPALITIES.length) {
    el.innerHTML = `<span class="highlight">${count}</span> of ${MUNICIPALITIES.length} municipalities`;
  } else {
    el.textContent = `${MUNICIPALITIES.length} municipalities`;
  }
}

function updateFilteredStats(results) {
  // Update the "Total" cell to show filtered count if filtering
  const cells = document.querySelectorAll('.stat-cell');
  if (cells[0]) {
    const val = cells[0].querySelector('.stat-value');
    if (results.length < MUNICIPALITIES.length) {
      val.innerHTML = `<span style="color:var(--blue-text)">${results.length}</span><span style="font-size:12px;color:var(--text-dim)">/${MUNICIPALITIES.length}</span>`;
    } else {
      val.textContent = MUNICIPALITIES.length;
      val.style.color = 'var(--text)';
    }
  }
}

function updateClearBtn() {
  const q = document.getElementById('searchInput').value;
  const s = document.getElementById('stateFilter').value;
  const t = document.getElementById('typeFilter').value;
  const show = q || s || t || popPreset !== 0;
  document.getElementById('btnClear').style.display = show ? 'inline-block' : 'none';
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('stateFilter').value = '';
  document.getElementById('typeFilter').value = '';
  popPreset = 0;
  updatePopPills();
  applyFilters();
}

// ═══ SORT ════════════════════════════════════════════════════════════════════
function setSort(field) {
  if (currentSort === field) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort = field;
    sortDir = (field === 'population' || field === 'area') ? 'desc' : 'asc';
  }
  updateSortPills();
  applyFilters();
}

function updateSortPills() {
  document.querySelectorAll('.sort-pill').forEach(btn => {
    const s = btn.dataset.sort;
    btn.className = 'sort-pill' + (s === currentSort ? ' active' : '');
    if (s === currentSort) {
      const arrow = sortDir === 'asc' ? ' ↑' : ' ↓';
      const label = btn.textContent.replace(/ [↑↓]$/, '');
      btn.textContent = label + arrow;
    } else {
      btn.textContent = btn.textContent.replace(/ [↑↓]$/, '');
    }
  });
}

// ═══ STATS TOGGLE ════════════════════════════════════════════════════════════
function toggleStats() {
  const row = document.getElementById('statsRow');
  const btn = document.getElementById('btnStats');
  const visible = row.style.display !== 'none';
  row.style.display = visible ? 'none' : 'flex';
  btn.className = visible ? 'btn-stats' : 'btn-stats active';
}

// ═══ RENDER CARDS ════════════════════════════════════════════════════════════
function renderCards(data) {
  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');

  if (data.length === 0) {
    grid.innerHTML = '';
    grid.classList.add('hidden');
    empty.classList.remove('hidden');
    return;
  }

  empty.classList.add('hidden');
  grid.classList.remove('hidden');

  grid.innerHTML = data.map((m, i) => `
    <div class="muni-card" onclick="openModal(${i})" data-idx="${i}">
      <div class="muni-card-head">
        <div>
          <div class="muni-name">${esc(m.name)}</div>
          <div class="muni-state">${esc(m.state_name)} (${esc(m.state_abbr)})</div>
        </div>
        <div class="muni-pop">
          <div class="muni-pop-value">${fmtPop(m.population_2020)}</div>
          <div class="muni-pop-label">Pop</div>
        </div>
      </div>
      <div class="muni-card-tags">
        <span class="type-badge ${m.type}">${capitalize(m.type)}</span>
        ${m.land_area_sqmi ? `<span style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">${fmtArea(m.land_area_sqmi)}</span>` : ''}
      </div>
      <div class="muni-card-meta">
        <span>Lat ${m.latitude ? m.latitude.toFixed(2) : '—'}</span>
        <span>Lon ${m.longitude ? m.longitude.toFixed(2) : '—'}</span>
        ${m.status ? `<span style="color:var(--green-text)">${esc(m.status)}</span>` : ''}
      </div>
      ${m.contact_name ? `
        <div class="muni-card-contact">
          <span class="contact-dot"></span>
          <span class="contact-name">${esc(m.contact_name)}</span>
          ${m.contact_title ? `<span class="contact-title">· ${esc(m.contact_title)}</span>` : ''}
        </div>
      ` : ''}
    </div>
  `).join('');

  // Re-map onclick with actual filtered data
  grid._filteredData = data;
}

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ═══ DETAIL MODAL ════════════════════════════════════════════════════════════
function openModal(idx) {
  const grid = document.getElementById('cardGrid');
  const data = grid._filteredData;
  if (!data || !data[idx]) return;
  selectedPlace = data[idx];
  renderModal(selectedPlace);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  selectedPlace = null;
}

function renderModal(p) {
  const mapsUrl = (p.latitude && p.longitude)
    ? `https://www.google.com/maps?q=${p.latitude},${p.longitude}`
    : null;

  const fields = [
    { label: 'Type',       value: `<span class="type-badge ${p.type}">${capitalize(p.type)}</span>` },
    { label: 'Status',     value: esc(p.status || 'N/A') },
    { label: 'Water Area', value: fmtArea(p.water_area_sqmi) },
    { label: 'Latitude',   value: p.latitude ? p.latitude.toFixed(4) : 'N/A' },
    { label: 'Longitude',  value: p.longitude ? p.longitude.toFixed(4) : 'N/A' },
    { label: 'GEOID',      value: esc(p.geoid) },
  ];

  let contactHTML = '';
  if (p.contact_name) {
    contactHTML = `
      <div class="modal-contact-section">
        <div class="modal-contact-heading">Key Contact</div>
        <div class="modal-contact-card">
          <div class="modal-contact-name">${esc(p.contact_name)}</div>
          ${p.contact_title ? `<div class="modal-contact-title">${esc(p.contact_title)}</div>` : ''}
          <div class="modal-contact-links">
            ${p.contact_phone ? `<a href="tel:${esc(p.contact_phone)}" class="modal-contact-link">Call ${esc(p.contact_phone)}</a>` : ''}
            ${p.contact_email ? `<a href="mailto:${esc(p.contact_email)}" class="modal-contact-link email">Email ${esc(p.contact_email)}</a>` : ''}
          </div>
        </div>
      </div>
    `;
  }

  document.getElementById('modalPanel').innerHTML = `
    <!-- Header -->
    <div class="modal-header">
      <div class="modal-header-info">
        <div class="modal-header-name">${esc(p.name)}</div>
        <div class="modal-header-state">${esc(p.state_name)}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>

    <!-- Population + Area stat duo -->
    <div class="modal-stats">
      <div class="modal-stat-box pop">
        <div class="modal-stat-label">Population</div>
        <div class="modal-stat-value">${fmtPopFull(p.population_2020)}</div>
        <div class="modal-stat-sub">2020 Census</div>
      </div>
      <div class="modal-stat-box area">
        <div class="modal-stat-label">Land Area</div>
        <div class="modal-stat-value">${p.land_area_sqmi ? p.land_area_sqmi.toFixed(1) : 'N/A'}</div>
        <div class="modal-stat-sub">square miles</div>
      </div>
    </div>

    <!-- Field rows -->
    <div class="modal-fields">
      ${fields.map(f => `
        <div class="modal-field-row">
          <span class="modal-field-label">${f.label}</span>
          <span class="modal-field-value">${f.value}</span>
        </div>
      `).join('')}
    </div>

    <!-- Contact block -->
    ${contactHTML}

    <!-- Action buttons -->
    <div class="modal-actions">
      ${mapsUrl ? `<a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="modal-action-btn map">View on Map</a>` : ''}
      <button class="modal-action-btn export" onclick="exportSingleCSV()">Export Row</button>
    </div>
  `;
}

// ═══ CSV EXPORT ══════════════════════════════════════════════════════════════
function exportCSV() {
  const data = getFiltered();
  downloadCSV(data, 'arsenal-municipalities');
}

function exportSingleCSV() {
  if (selectedPlace) downloadCSV([selectedPlace], 'arsenal-municipality');
}

function downloadCSV(rows, prefix) {
  const headers = ['Name','State','Type','Population','Land Area (sqmi)','Latitude','Longitude','Status','Contact','Phone','Email'];
  const lines = [
    headers.join(','),
    ...rows.map(r => [
      `"${r.name}"`,
      r.state_abbr,
      r.type,
      r.population_2020 || '',
      r.land_area_sqmi ? r.land_area_sqmi.toFixed(2) : '',
      r.latitude || '',
      r.longitude || '',
      r.status || '',
      `"${r.contact_name || ''}"`,
      `"${r.contact_phone || ''}"`,
      `"${r.contact_email || ''}"`,
    ].join(','))
  ];
  const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${prefix}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});
