    }));
    document.querySelectorAll("[data-act='droprow']").forEach(el=>el.addEventListener("click",e=>{
      e.stopPropagation(); const [sec,idx]=el.closest("[data-row]").dataset.row.split(":"); const row=d[sec][+idx]; if(!row) return;
      const key=sec==="tasks"?row.text:sec==="asks"?row.detail:row.name; if(sec!=="milestones"&&(doc.engineTasks.includes(key)||doc.engineAsks.includes(key))){ doc.hiddenAuto.push(key); save(k); }
      d[sec].splice(+idx,1); touched(sec); toast("Removed. It will not come back on its own."); render();
    }));
    const ta=document.querySelector("[data-notes]"); if(ta) ta.addEventListener("input",()=>{ d.notes=ta.value; saveReport(k,{notes:ta.value}); });
  }
  wireHead(); wire();
}

// ---- Engine tab ----
function renderEngine(){
  const k=S.cur, c=D(k), doc=c;
  if(openSteps[k]===undefined) openSteps[k]=firstOpen();
  const all=c.steps.flatMap(s=>s.tasks).filter(t=>(t.btn||t.done)&&!isSnoozed(t));
  const doneN=all.filter(t=>t.done).length; const pct=all.length?Math.round(100*doneN/all.length):0;
  const seg=`<div class="seg" role="tablist">${[["week","This week"],["h30","30 days"],["h90","90 days"]].map(h=>`<button role="tab" data-h="${h[0]}" class="${S.horizon===h[0]?"on":""}">${h[1]}</button>`).join("")}</div>`;
  const hz=S.horizon==="week"?null:(c.hz[S.horizon]||[]);
  const endLbl=S.horizon==="h30"?"Sep 30":"Nov 30";
  const onTrack=hz?hz.filter(x=>x.s==="on"||x.s==="done").length:0;
  const barHtml=hz
    ? `<div class="bar"><i style="width:${Math.round(100*onTrack/4)}%;background:${hz.some(x=>x.s==="behind")?"var(--warn)":"var(--good)"}"></i></div>
       <div class="barlbl"><span><b>${onTrack} of 4</b> steps on track for ${endLbl}</span><span>${hz.filter(x=>x.s==="behind").length} behind</span></div>`
    : `<div class="bar"><i style="width:${pct}%"></i></div>
       <div class="barlbl"><span><b>${doneN} of ${all.length}</b> things done this week</span><span>${c.steps.filter(s=>stepState(s)==="done").length} of 4 steps green</span></div>`;
  const R=S.reports[k], d=R&&R.draft; const filled=reportFilled(k);
  document.getElementById("main").innerHTML=`
    ${topbar()}${headHtml()}
    ${seg}
    ${barHtml}
    ${c.steps.map((s,i)=>{
      const h=hz&&hz[i]; const st=hz?(h?(h.s==="behind"?"todo":h.s==="next"?"part":"done"):"part"):stepState(s);
      const lab=hz?(h?(h.s==="behind"?"Behind":h.s==="next"?"Not started":"On track"):"No target"):(st==="done"?"Good":st==="part"?"Almost":"Needs work");
      const why=hz?(h?h.t:"No "+endLbl+" target set for this step."):s.why;
      const touched=stepTouched(k,s);
      const body=hz
        ? (h?((h.p?`<div class="target"><h3>By ${endLbl}</h3><p>${esc(h.p)}</p></div>`:"")+(h.ms||[]).map(m=>`<div class="ms ${esc(m[2])}"><span class="d">${esc(m[0])}</span><span>${esc(m[1])}</span><span class="k">${m[2]==="done"?"Done":m[2]==="on"?"On track":m[2]==="behind"?"Behind":"Next"}</span></div>`).join("")):`<div class="target"><p>Targets for this horizon live in the engine document; none set yet.</p></div>`)
        : (s.tasks.length?s.tasks.map((t,j)=>{ const sn=isSnoozed(t); return `
          <div class="task ${t.done?"done":""} ${t.busy?"busy":""} ${t.you&&!t.done&&!sn?"you":""} ${sn?"snoozed":""}" data-j="${j}">
            <div><h3>${esc(t.t)}</h3>${t.p?`<p>${esc(t.p)}</p>`:""}${t.who?`<div class="who">${esc(t.who)}${sn?" · parked until "+shortDate(t.snoozedUntil):""}</div>`:""}</div>
            <div>${sn?`<button class="btn quiet small" data-act="unsnooze">Bring it back</button>`:t.btn&&!t.done&&!t.busy?`<button class="btn ${t.you?"gold":""}" data-act="do">${esc(t.btn)}</button> <button class="btn quiet" data-act="${t.you?"snooze":"skip"}">${t.you?"Remind me Friday":"Not now"}</button>`:""}${t.busy&&!t.done?`<button class="btn quiet small" data-act="markdone">Mark done</button>`:""}<span class="did">${t.busy?"Working on it"+(t.dispatchedAt?" since "+rel(t.dispatchedAt):""):t.done&&t.did?esc(t.did):""}</span></div>
          </div>`; }).join(""):`<div class="target"><p>No tasks under this step yet.</p></div>`);
      return `<section class="step ${st} ${openSteps[k]===i?"open":""}" data-i="${i}">
        <div class="step-h" role="button" tabindex="0"><div class="mark">${st==="done"?"✓":i+1}</div><div><h2>${esc(s.t)}</h2><p>${esc(why)}</p>${touched?`<span class="touch">last touched ${rel(touched.atMs)}: ${esc(short(touched.what,9))}${touched.what.split(/\s+/).length>9?"…":""}</span>`:""}</div><div class="st">${lab}</div></div>
        <div class="tasks">${body}</div>
      </section>`;
    }).join("")}
    <div class="report">
      <div><h2>Friday's report to ${esc(META[k].name)}</h2><p>${d?`${filled} of 5 sections filled (milestones, tasks, asks, notes, links). Everything you finish above and everything in the ledger goes in on its own. ${d.autoSend?"Sends Friday at noon.":"Held."}`:"No report draft in the store yet. It appears here once one exists at aheadofmarket.com/reports."}</p>
        <div class="fill">${[0,1,2,3,4].map(n=>`<i class="${n<filled?"on":""}"></i>`).join("")}</div></div>
      <div><button class="btn" data-act="openreport">Open the report</button></div>
    </div>`;
  document.querySelectorAll(".step-h").forEach(h=>{
    const go=()=>{const i=+h.closest(".step").dataset.i;openSteps[k]=openSteps[k]===i?-1:i;render();};
    h.addEventListener("click",go);h.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
  });
  wireHead(); wire();
}
function renderStrategy(){ document.getElementById("main").innerHTML=`${topbar()}${headHtml()}${strategyHtml()}`; wireStrategy(); wireHead(); wire(); }
function renderIdeas(){ document.getElementById("main").innerHTML=`${topbar()}${headHtml()}${ideasHtml()}`; wireIdeas(); wireHead(); wire(); }
function wire(){
  document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",onAct));
  document.querySelectorAll(".views [data-v]").forEach(b=>b.addEventListener("click",()=>{S.view=b.dataset.v;S.newweekArmed=null;render();}));
  document.querySelectorAll(".seg [data-h]").forEach(b=>b.addEventListener("click",()=>{S.horizon=b.dataset.h;openSteps[S.cur]=0;render();}));
}
function render(){
  if(!S.ready) return;
  renderNav();
  document.documentElement.dataset.view=S.view;
  document.querySelectorAll("#tabbar [data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
  setTimeout(renderDock,0);
  if(!D()){ document.getElementById("main").innerHTML=`<div class="loading">Loading ${esc(META[S.cur].name)}…</div>`; return; }
  if(S.view==="report"){renderReport();return;}
  if(S.view==="strategy"){renderStrategy();return;}
  if(S.view==="ideas"){renderIdeas();return;}
  renderEngine();
}

// ---- actions ----
async function dispatch(k,t){
  const doc=D(k), C=chatState(k);
  if(!S.me){ setNotice("Sign in on the dashboard first to send work to "+doc.agent+"."); return; }
  if(!C.loaded) await loadRoom(k);
  if(!C.roomId){ toast("No project room for "+META[k].name+" yet, nothing sent."); return; }
  const agent=agentSlugFor(t.who,doc.agent);
  const text=`@${agent} ${t.t} for ${META[k].name}.${t.p?" "+t.p:""}`;
  t.busy=true; t.dispatchedAt=Date.now(); save(k); render(); toast(cap(agent)+" is on it.");
  try{
    const id=await mu("messages:send",{roomId:C.roomId,text,role:"user",clientId:WORLD,clientMessageId:"ce-task-"+Date.now(),source:"client-engine",userId:S.me.userId||undefined,userEmail:S.me.email||undefined,userName:S.me.name||undefined});
    if(id) t.dispatchId=String(id); save(k);
    ledgerAppend(k,`Asked ${cap(agent)} to ${lc1(t.t)} for ${META[k].name}.`,"started");
    refreshThread(k).then(()=>{ if(chatOpen) renderDock(); });
  }catch(e){ t.busy=false; delete t.dispatchedAt; save(k); render(); failNotice(e,"send that to "+cap(agent)); }
}
function onAct(e){
  e.stopPropagation();
  const act=e.currentTarget.dataset.act, k=S.cur, doc=D(k), R=S.reports[k];
  if(act==="noticex"){ S.notice=""; const n=document.getElementById("notice"); if(n) n.innerHTML=""; return; }
  if(act==="preview"){ window.open("https://aheadofmarket.com/"+META[k].report,"_blank","noopener"); return; }
  if(act==="hold"){ if(!R||!R.draft) return; R.draft.autoSend=false; saveReport(k,{autoSend:false}); ledgerAppend(k,`Held the ${META[k].name} report; it will not send Friday.`,"decided"); toast("Held. It won't send Friday until you say so."); render(); return; }
  if(act==="send"){ if(!R||!R.draft) return; R.draft.autoSend=true; saveReport(k,{autoSend:true}); ledgerAppend(k,`Scheduled the ${META[k].name} report to send Friday at noon.`,"decided"); toast("Scheduled. Goes out Friday at noon."); render(); return; }
  if(act==="openreport"){ S.view="report"; render(); window.scrollTo({top:0}); return; }
  if(act==="newweek"){ S.newweekArmed=k; render(); return; }
  if(act==="newweek2"){ S.newweekArmed=null; newWeek(k); return; }
  if(act==="golive"){ wk.idx[k]=(R?R.weeks.length:0); render(); return; }
  if(act==="chatopen"){ chatOpen=true; focusNext=true; renderDock(); if(!chatState(k).loaded) loadRoom(k).then(renderDock); return; }
  if(act==="chatclose"){ chatOpen=false; renderDock(); return; }
  if(act==="chatsend"){ const inp=document.getElementById("chatin"); if(inp) sendChat(inp.value); return; }
  const sec=e.currentTarget.closest(".step"), row=e.currentTarget.closest(".task"); if(!sec||!row) return;
  const t=doc.steps[+sec.dataset.i].tasks[+row.dataset.j]; if(!t) return;
  if(act==="skip"){ t.done=true; t.doneAt=Date.now(); t.did="Skipped this week"; save(k); toast("Skipped. It'll come back next week."); render(); return; }
  if(act==="snooze"){ t.snoozedUntil=nextFridayMs(); save(k); syncReport(k); toast("Parked until "+shortDate(t.snoozedUntil)+". It stays off every list until then."); render(); return; }
  if(act==="unsnooze"){ delete t.snoozedUntil; save(k); syncReport(k); toast("Back on the list."); render(); return; }
  if(act==="markdone"){ t.busy=false; t.done=true; t.doneAt=Date.now(); t.did="Done."; save(k); ledgerAppend(k,`Finished "${t.t}" for ${META[k].name}.`,"did"); syncReport(k); toast("Done. It goes on Friday's report."); render(); return; }
  if(act==="do"){
    if(t.you){ const msg=ackDone(k,t); chatState(k).local.push({who:"ag",t:msg,acts:[],at:Date.now()}); toast("Got it. Off your list."); render(); return; }
    dispatch(k,t); return;
  }
}
async function newWeek(k){
  const R=S.reports[k]; if(!R||!R.draft) return; const doc=D(k); const oldLabel=draftLabel(R.draft);
  try{
    await mu("reports:publishAndRoll",{client:META[k].report});
    doc.steps.forEach(st=>st.tasks.forEach(t=>{ if(t.done&&t.did!=="Skipped this week") t.rolled=true; })); doc.engineTasks=[]; save(k);
    await loadReport(k); wk.idx[k]=S.reports[k].weeks.length; syncReport(k);
    const nl=draftLabel(S.reports[k].draft);
    ledgerAppend(k,`Published the ${META[k].name} ${oldLabel} report and started ${nl}.`,"did",["https://aheadofmarket.com/"+META[k].report]);
    toast(`Published ${oldLabel}. ${nl} is the live draft now.`); render();
  }catch(e){ failNotice(e,"start a new week"); }
}

// ---- boot ----
async function ensureLoaded(k){
  if(S.docs[k]&&S.reports[k]&&S.ledger[k]) return;
  try{ if(!S.docs[k]) await loadDoc(k); await Promise.all([S.ledger[k]?null:loadLedger(k),S.reports[k]?null:loadReport(k)].filter(Boolean)); syncReport(k); }catch(e){ console.warn("load",k,e); }
  if(S.cur===k){ if(openSteps[k]===undefined) openSteps[k]=firstOpen(); if(!editing()) render(); } else renderNav();
}
async function boot(){
  await loadMe();
  S.ready=true;
  await ensureLoaded(S.cur);
  render();
  ORDER.filter(k=>k!==S.cur).forEach(k=>ensureLoaded(k));
  setInterval(async()=>{ const k=S.cur; try{ await loadLedger(k); syncReport(k); if(!editing()&&!chatOpen) render(); else if(chatOpen&&!editing()) render(); }catch(e){} },60000);
  window.addEventListener("storage",e=>{ if(e.key===SESSION_KEY) loadMe().then(()=>{ if(!editing()) render(); }); });
}
document.getElementById("add").addEventListener("click",()=>toast("New client gets the same four steps and a Friday report. Add it to META and the reports store."));
// Mobile chrome: bottom tab bar, the compact sticky header, the edit hint, the keyboard-aware sheet.
document.querySelectorAll("#tabbar [data-v]").forEach(b=>b.addEventListener("click",()=>{ S.view=b.dataset.v; S.newweekArmed=null; render(); window.scrollTo({top:0}); }));
window.addEventListener("scroll",()=>{ const h=document.querySelector(".hd"); if(h) h.classList.toggle("shrink",window.scrollY>60); },{passive:true});
try{ if(sessionStorage.getItem("ce.edited")) document.documentElement.classList.add("edited"); }catch(e){}
document.addEventListener("input",e=>{ if(e.target&&e.target.isContentEditable){ document.documentElement.classList.add("edited"); try{ sessionStorage.setItem("ce.edited","1"); }catch(x){} } },true);
if(window.visualViewport){ visualViewport.addEventListener("resize",fitSheet); visualViewport.addEventListener("scroll",fitSheet); }
boot();

</script>
