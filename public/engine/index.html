:root{
  --paper:#F6F6F4;--card:#FFFFFF;--alt:#EEEDE8;
  --ink:#0B0B0B;--ink-2:#44443F;--ink-3:#6E6E66;--ink-4:#9A988F;
  --hair:#D8D5CE;--hair-2:#ECEAE4;
  --gold:#B58A38;--gold-deep:#9B7228;--gold-tint:#F3EAD6;
  --good:#2F7D4F;--good-tint:#E3F0E7;--warn:#B8721B;--warn-tint:#F7EBD6;--bad:#B4322B;--bad-tint:#F6E1DF;
  --shadow:0 1px 2px rgba(11,11,11,.05),0 6px 20px -14px rgba(11,11,11,.22);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0B0B0B;--card:#161615;--alt:#121211;
  --ink:#F6F6F4;--ink-2:#D8D5CE;--ink-3:#A8A59D;--ink-4:#7C7A72;
  --hair:#2A2A28;--hair-2:#1E1E1C;
  --gold:#C8A45C;--gold-deep:#B58A38;--gold-tint:#2A2314;
  --good:#6FBF8A;--good-tint:#132A1B;--warn:#E0A24C;--warn-tint:#2E2110;--bad:#E4746D;--bad-tint:#331412;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --paper:#0B0B0B;--card:#161615;--alt:#121211;
  --ink:#F6F6F4;--ink-2:#D8D5CE;--ink-3:#A8A59D;--ink-4:#7C7A72;
  --hair:#2A2A28;--hair-2:#1E1E1C;
  --gold:#C8A45C;--gold-deep:#B58A38;--gold-tint:#2A2314;
  --good:#6FBF8A;--good-tint:#132A1B;--warn:#E0A24C;--warn-tint:#2E2110;--bad:#E4746D;--bad-tint:#331412;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Schibsted Grotesk',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.druk{font-family:'Druk Cond','Schibsted Grotesk',Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:.92}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--hair);padding:22px 0}
nav .brand{padding:0 22px 18px;border-bottom:1px solid var(--hair);margin-bottom:10px}
nav .brand .druk{font-size:30px}
nav .brand small{display:block;color:var(--ink-3);font-size:13px;margin-top:2px}
nav .lbl{padding:14px 22px 6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
nav .cl{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:11px 22px;border:0;background:transparent;font-size:16px;font-weight:500}
nav .cl:hover{background:var(--alt)}
nav .cl.on{background:var(--gold-tint);box-shadow:inset 4px 0 0 var(--gold);font-weight:700}
nav .cl .n{font-size:13px;color:var(--ink-3);font-weight:500}
nav .cl .n.bad{color:var(--bad)}
nav .add{margin:12px 22px 0;padding:10px 12px;width:calc(100% - 44px);border:1px dashed var(--hair);background:transparent;border-radius:6px;color:var(--ink-3);font-size:14px}
nav .add:hover{border-color:var(--ink-3);color:var(--ink)}

main{padding:30px 40px 80px;max-width:900px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:8px}
.head h1{margin:0;font-size:60px}
.head .r{text-align:right;color:var(--ink-3);font-size:14px}
.head .r b{display:block;color:var(--ink);font-size:16px;font-weight:600}
.bar{height:8px;background:var(--hair-2);border-radius:999px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--good);border-radius:999px}
.barlbl{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-3);margin-bottom:28px}
.barlbl b{color:var(--ink);font-weight:600}

.step{background:var(--card);border:1px solid var(--hair);border-radius:8px;margin-bottom:14px;box-shadow:var(--shadow)}
.step-h{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px;cursor:pointer}
.step-h:hover{background:var(--alt)}
.step.open .step-h{border-bottom:1px solid var(--hair-2)}
.mark{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid var(--hair);color:var(--ink-4)}
.step.done .mark{background:var(--good);border-color:var(--good);color:#fff}
.step.todo .mark{border-color:var(--bad);color:var(--bad)}
.step.part .mark{border-color:var(--warn);color:var(--warn)}
.step-h h2{margin:0;font-size:19px;font-weight:700}
.step-h p{margin:3px 0 0;color:var(--ink-3);font-size:15px}
.step.done .step-h p{color:var(--good)}
.step-h .st{font-size:14px;font-weight:600;white-space:nowrap}
.step.done .st{color:var(--good)}.step.todo .st{color:var(--bad)}.step.part .st{color:var(--warn)}

.tasks{display:none}
.step.open .tasks{display:block}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px 16px 72px;border-bottom:1px solid var(--hair-2)}
.task:last-child{border-bottom:0}
.task h3{margin:0;font-size:16px;font-weight:600}
.task p{margin:3px 0 0;color:var(--ink-3);font-size:14.5px;max-width:58ch}
.task .who{font-size:13px;color:var(--ink-4);margin-top:4px}
.task.done{background:var(--good-tint)}
.task.done h3::before{content:"✓ ";color:var(--good)}
.task.done p{color:var(--ink-2)}
.task.busy h3::after{content:" · working";color:var(--warn);font-weight:500}
.task.you{background:var(--gold-tint)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 16px;font-size:15px;font-weight:600;border-radius:6px;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#0B0B0B}
.btn.gold:hover{background:var(--gold-deep);border-color:var(--gold-deep)}
.btn.quiet{background:transparent;color:var(--ink-3);border-color:var(--hair);font-weight:500}
.btn.quiet:hover{color:var(--ink);border-color:var(--ink-3)}
.task.done .btn,.task.busy .btn{display:none}
.task .did{display:none;font-size:14px;color:var(--good);font-weight:600;white-space:nowrap}
.task.done .did{display:block}
.task.busy .did{display:block;color:var(--warn)}

.report{margin-top:34px;background:var(--ink);color:var(--paper);border-radius:8px;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.report h2{margin:0;font-size:19px}
.report p{margin:4px 0 0;color:var(--hair);font-size:15px}
.report .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.report .btn:hover{background:var(--alt);border-color:var(--alt)}
.report .fill{display:flex;gap:6px;margin-top:12px}
.report .fill i{height:6px;flex:1;border-radius:999px;background:#2A2A28}
.report .fill i.on{background:var(--gold)}

.seg{display:inline-flex;border:1px solid var(--hair);border-radius:8px;padding:3px;background:var(--card);margin:18px 0 4px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:6px;font-size:15px;font-weight:500;color:var(--ink-3)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper);font-weight:600}
.target{padding:16px 20px 16px 72px;border-bottom:1px solid var(--hair-2)}
.target:last-child{border-bottom:0}
.target h3{margin:0;font-size:16px;font-weight:600}
.target p{margin:3px 0 0;color:var(--ink-3);font-size:14.5px;max-width:60ch}
.ms{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 20px 12px 72px;border-bottom:1px solid var(--hair-2);font-size:15px}
.ms:last-child{border-bottom:0}
.ms .d{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;min-width:64px}
.ms .k{font-size:13px;font-weight:600;white-space:nowrap}
.ms.on .k{color:var(--good)}.ms.behind .k{color:var(--bad)}.ms.done .k{color:var(--good)}.ms.next .k{color:var(--ink-4)}
.ms.done span:nth-child(2){color:var(--ink-3);text-decoration:line-through}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.views{display:inline-flex;gap:0;border:1px solid var(--hair);border-radius:8px;padding:3px;background:var(--card)}
.views button{border:0;background:transparent;padding:9px 20px;border-radius:6px;font-size:15px;font-weight:600;color:var(--ink-3)}
.views button.on{background:var(--gold);color:#0B0B0B}
.views button:hover:not(.on){color:var(--ink)}
.topbar .st{font-size:14px;color:var(--ink-3)}
.topbar .st b{color:var(--ink);font-weight:600}
/* The Report tab IS the live client page (aom-studio api/_lib/reportTemplate.js),
   same rules, same tags, same tables, with inline add rows and a marker on what
   the engine filled in by itself. Tokens are scoped so the page keeps its own
   ground regardless of the app theme. */
.rp{--ground:#F5F2EA;--paper:#FFFFFF;--ink:#151209;--ink-2:#45413A;--ink-3:#6E685B;--rule:#CFC8B8;--soft:#E6E0D2;--gold:#B58A38;--wash:#F3EBD9;--done:#1B6B3A;--doing:#8A6A1F;--next:#5A7A9E;
  background:var(--paper);color:var(--ink);max-width:800px;padding:36px 40px 40px;border:1px solid var(--rule);box-shadow:var(--shadow);font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.4}
.rp *{box-sizing:border-box}
.rp .hdr{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:1.5px solid var(--rule);margin-bottom:28px}
.rp .hdr h1{font-family:'Druk Cond',ui-sans-serif,sans-serif;text-transform:uppercase;font-weight:400;font-size:44px;line-height:.9;letter-spacing:.01em;margin:0 0 4px}
.rp .hdr-left p{font-size:13px;color:var(--ink-2);margin:0}
.rp .hdr-right{text-align:right;font-size:12px;color:var(--ink-3);line-height:1.5}
.rp .hdr-right strong{color:var(--ink);font-size:13px;display:block}
.rp .hdr-right a{color:var(--gold);text-decoration:none;margin-left:8px}
.rp .weeks{display:flex;gap:10px;margin-bottom:28px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-3);flex-wrap:wrap}
.rp .weeks span{padding:5px 10px;border:1.5px solid var(--rule)}
.rp .weeks span.on{color:var(--ink);border-color:var(--ink);font-weight:800}
.rp .sec{margin-bottom:30px}
.rp .sec-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--ink-3);margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.rp .sec-title small{letter-spacing:.06em;font-weight:600;color:var(--ink-3);text-transform:none;font-size:11px}
.rp table{width:100%;border-collapse:collapse;font-size:13px}
.rp th{font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--ink-3);padding:8px 12px 8px 0;text-align:left;border-bottom:1.5px solid var(--rule)}
.rp td{padding:11px 12px 11px 0;border-bottom:1px solid var(--soft);vertical-align:middle}
.rp .num{font-weight:800;color:var(--ink-3);text-align:center;width:28px;font-size:12px}
.rp .name{font-weight:600}
.rp .barc{width:120px;padding-right:14px}
.rp .ms-bar{height:7px;background:var(--soft);position:relative}
.rp .ms-fill{position:absolute;left:0;top:0;bottom:0;background:var(--next)}
.rp .ms-fill.done{background:var(--done)}.rp .ms-fill.wip{background:var(--doing)}
.rp .tag{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;padding:3px 8px;line-height:1;white-space:nowrap;border:1.5px solid var(--rule);color:var(--ink-3)}
.rp .tag.done{color:#fff;background:var(--done);border-color:var(--done)}
.rp .tag.wip{color:var(--doing);border-color:var(--doing)}
.rp .tag.next{color:var(--next);border-color:var(--next)}
.rp .pri{font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-left:16px}
.rp .chk{color:var(--done);font-weight:900;font-size:15px;text-align:center;width:28px}
.rp .src{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);opacity:.75;white-space:nowrap;width:70px;text-align:right}
.rp .src.you{color:var(--gold);opacity:1}
.rp tr.addrow td{padding:6px 0 0;border-bottom:0}
.rp .addin{width:100%;border:0;border-bottom:1.5px dashed var(--rule);background:transparent;padding:8px 0;font:inherit;font-size:13px;color:var(--ink)}
.rp .addin::placeholder{color:var(--ink-3)}
.rp .addin:focus{outline:0;border-bottom-color:var(--gold)}
.rp .ask-row{display:flex;gap:16px;margin-bottom:8px;font-size:13px;align-items:baseline}
.rp .ask-label{font-weight:700;min-width:176px}
.rp .ask-detail{color:var(--ink-2);flex:1}
.rp .notes{background:var(--wash);border:1.5px solid var(--rule);padding:14px 18px;font-size:13px}
.rp .notes textarea{width:100%;border:0;background:transparent;font:inherit;resize:vertical;min-height:44px;color:var(--ink)}
.rp .notes textarea:focus{outline:0}
.rp .ftr{margin-top:32px;padding-top:12px;border-top:1.5px solid var(--rule);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-weight:700;display:flex;justify-content:space-between}
.rp .x{border:0;background:transparent;color:var(--ink-3);font-size:11px;cursor:pointer;padding:2px 6px}
.rp .x:hover{color:var(--ink)}
@media (max-width:640px){.rp{padding:22px 16px}.rp .barc{width:70px}.rp .src{display:none}}
.rp [contenteditable]{border-bottom:1px dotted transparent;cursor:text;border-radius:2px;padding:0 2px;margin:0 -2px}
.rp [contenteditable]:hover{border-bottom-color:var(--rule);background:var(--wash)}
.rp [contenteditable]:focus{outline:0;background:var(--wash);border-bottom-color:var(--gold)}
.rp .tag.clk,.rp .pri.clk,.rp .ms-bar.clk{cursor:pointer}
.rp .tag.clk:hover{box-shadow:0 0 0 2px var(--wash)}
.rp .ms-bar.clk:hover{outline:1.5px solid var(--gold);outline-offset:2px}
.rp .rowx{border:0;background:transparent;color:var(--ink-3);font-size:14px;cursor:pointer;padding:0 6px;opacity:0;line-height:1}
.rp tr:hover .rowx,.rp .ask-row:hover .rowx{opacity:1}
.rp .rowx:hover{color:#B4322B}
.rp .weeks span{cursor:pointer;position:relative;padding-right:10px}
.rp .weeks span:hover{border-color:var(--ink-3);color:var(--ink)}
.rp .weeks span .wx{position:absolute;right:-7px;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;font-size:10px;line-height:16px;text-align:center;display:none;letter-spacing:0}
.rp .weeks span.on:hover .wx{display:block}
.rp .banner{background:var(--wash);border:1.5px solid var(--rule);padding:8px 12px;font-size:12px;color:var(--ink-2);margin:-14px 0 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.rp .banner b{color:var(--ink)}
.rp .hint{font-size:11px;color:var(--ink-3);margin:-18px 0 22px}
.toast button{margin-left:12px;border:1px solid var(--hair);background:transparent;color:var(--paper);padding:3px 10px;border-radius:4px;font-size:13px;cursor:pointer}
/* The report is a page the client receives, drawn as one sheet, not as more cards. */
.sheet{background:var(--card);border:1px solid var(--hair);border-radius:8px;box-shadow:var(--shadow);padding:34px 40px 30px;max-width:720px}
.sheet .kicker{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.sheet h1.druk{font-size:52px;margin:6px 0 4px}
.sheet .lede{font-size:19px;line-height:1.4;margin:0 0 22px;color:var(--ink);text-wrap:balance}
.sheet .strip{display:flex;gap:24px;padding:14px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin-bottom:22px}
.sheet .strip div{font-size:13px;color:var(--ink-3)}
.sheet .strip b{display:block;font-size:22px;color:var(--ink);font-weight:700;line-height:1.1}
.sheet p{margin:0 0 4px;font-size:16px;line-height:1.55;max-width:62ch}
.sheet .sec{margin-bottom:22px;position:relative}
.sheet .sec h2{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.sheet .sec .ed{position:absolute;right:0;top:-2px;font-size:13px;color:var(--ink-4);background:transparent;border:0;padding:2px 6px;border-radius:4px;opacity:0}
.sheet .sec:hover .ed{opacity:1}
.sheet .sec .ed:hover{color:var(--ink);background:var(--alt)}
.sheet .ask{background:var(--gold-tint);border-left:4px solid var(--gold);padding:14px 18px;border-radius:0 6px 6px 0}
.sheet .ask p{margin:0}
.sheet .ask p+p{margin-top:6px}
.sheet .chips{display:flex;flex-wrap:wrap;gap:8px}
.sheet .chip{border:1px solid var(--hair);border-radius:999px;padding:5px 12px;font-size:14px}
.sheet .chip small{color:var(--ink-3);margin-left:6px}
.sheet .ahead{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15.5px}
.sheet .ahead .d{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:3px;white-space:nowrap}
.sheet .sig{margin-top:26px;padding-top:16px;border-top:1px solid var(--hair);font-size:14px;color:var(--ink-3)}
.sheet .empty{color:var(--ink-4);font-style:italic}
.rep{background:var(--card);border:1px solid var(--hair);border-radius:8px;margin-bottom:14px;box-shadow:var(--shadow)}
.rep-h{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--hair-2)}
.rep-h h2{margin:0;font-size:18px;font-weight:700}
.rep-h .c{font-size:14px;font-weight:600;white-space:nowrap}
.rep.full .c{color:var(--good)}.rep.empty .c{color:var(--bad)}
.rep .mark{width:32px;height:32px}
.rep.full .mark{background:var(--good);border-color:var(--good);color:#fff}
.rep.empty .mark{border-color:var(--bad);color:var(--bad)}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 20px 12px 72px;border-bottom:1px solid var(--hair-2);font-size:15.5px}
.line:last-child{border-bottom:0}
.line .from{font-size:12px;color:var(--ink-4);margin-top:2px}
.line .x{border:0;background:transparent;color:var(--ink-4);font-size:13px;padding:4px 8px;border-radius:4px}
.line .x:hover{background:var(--alt);color:var(--ink)}
.line.add{color:var(--ink-3);cursor:text}
.line.add:hover{background:var(--alt)}
.line.add span::before{content:"+ ";}
.sendbar{margin-top:24px;background:var(--ink);color:var(--paper);border-radius:8px;padding:20px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.sendbar h2{margin:0;font-size:18px}
.sendbar p{margin:4px 0 0;color:var(--hair);font-size:15px}
.sendbar .btn{background:var(--gold);color:#0B0B0B;border-color:var(--gold)}
.sendbar .btn:hover{background:var(--gold-deep);border-color:var(--gold-deep)}
.sendbar .btn.quiet{background:transparent;color:var(--hair);border-color:#2A2A28}
.sendbar .btn.quiet:hover{color:var(--paper);border-color:var(--hair)}

/* Strategy board: the plan on one screen, editable. */
.strat{background:var(--card);border:1px solid var(--hair);border-radius:8px;box-shadow:var(--shadow);padding:22px 24px 18px;margin:18px 0 22px}
.strat .ns{font-size:22px;font-weight:700;line-height:1.3;text-wrap:balance;margin:0}
.strat .why{color:var(--ink-3);font-size:15px;margin:6px 0 18px;max-width:70ch}
.strat [contenteditable]{border-bottom:1px dotted transparent;border-radius:2px;padding:0 2px;margin:0 -2px;cursor:text}
.strat [contenteditable]:hover{border-bottom-color:var(--hair);background:var(--alt)}
.strat [contenteditable]:focus{outline:0;background:var(--gold-tint);border-bottom-color:var(--gold)}
.strat .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.strat .col h3{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;align-items:baseline}
.strat .col h3 b{color:var(--ink);font-weight:700}
.strat .col h3 small{color:var(--ink-4);letter-spacing:0;text-transform:none;font-size:12px;font-weight:500}
.strat .mv{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--hair-2);font-size:14.5px;line-height:1.35}
.strat .mv:first-of-type{border-top:0}
.strat .mv i{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--hair);cursor:pointer}
.strat .mv.on i{background:var(--good)}.strat .mv.behind i{background:var(--bad)}.strat .mv.done i{background:var(--good);box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 10px var(--good)}
.strat .mv.done span{color:var(--ink-3);text-decoration:line-through}
.strat .mv .x{border:0;background:transparent;color:var(--ink-4);cursor:pointer;opacity:0;padding:0 4px;font-size:14px}
.strat .mv:hover .x{opacity:1}.strat .mv .x:hover{color:var(--bad)}
.strat .addmv{width:100%;border:0;border-top:1px dashed var(--hair);background:transparent;padding:9px 0 2px;font:inherit;font-size:14px;color:var(--ink)}
.strat .addmv::placeholder{color:var(--ink-4)}
.strat .addmv:focus{outline:0;border-top-color:var(--gold)}
.strat .legend{margin-top:12px;font-size:12px;color:var(--ink-4)}
.strat .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 10px;vertical-align:middle}

/* Strategy as a bento grid: one dark anchor, big numbers, then the horizons as tiles. */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(150px,auto);gap:16px;margin:18px 0 24px}
.tile{background:var(--card);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);padding:20px 22px;min-width:0;display:flex;flex-direction:column}
.tile h3{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tile h3 small{letter-spacing:0;text-transform:none;font-weight:500;font-size:12px;color:var(--ink-4)}
.tile.north{grid-column:1/3;grid-row:1/3;background:var(--ink);color:var(--paper);border-color:var(--ink);justify-content:flex-start;gap:6px}
.tile.north .big{margin-top:2px}
.tile.north h3{color:var(--ink-4)}
.tile.north .big{font-family:'Druk Cond','Schibsted Grotesk',Impact,sans-serif;text-transform:uppercase;font-size:44px;line-height:.95;letter-spacing:.01em;margin:6px 0 14px;text-wrap:balance}
.tile.north .why{font-size:15.5px;line-height:1.5;color:var(--hair);max-width:52ch;margin:0}
.tile.north [contenteditable]:hover{background:rgba(255,255,255,.06)}
.tile.north [contenteditable]:focus{background:rgba(255,255,255,.1);outline:0}
.tile.nums{grid-column:3/4}
.tile.nums .n{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.tile.nums .v{font-family:'Druk Cond','Schibsted Grotesk',Impact,sans-serif;font-size:40px;line-height:.9;color:var(--gold-deep)}
.tile.nums .l{font-size:13px;color:var(--ink-2);line-height:1.25}
.tile.nums .l b{display:block;color:var(--ink);font-weight:600}
.tile.nums .l small{color:var(--ink-4)}
.tile.you{grid-column:4/5;background:var(--gold-tint);border-color:var(--gold)}
.tile.you h3{color:var(--gold-deep)}
.tile.you ul{margin:0;padding-left:18px;font-size:14.5px;line-height:1.45}
.tile.you li{margin:4px 0}
.tile.you .none{color:var(--ink-3);font-size:14px}
.tile.you li{display:flex;flex-direction:column;gap:4px}
.tile.you .ya{display:flex;gap:6px}
.tile.you .ya button{border:1px solid var(--gold);background:var(--card);color:var(--ink);font-size:12px;padding:3px 9px;border-radius:999px;cursor:pointer}
.tile.you .ya button:first-child{background:var(--gold);color:#0B0B0B;font-weight:600}
.tile.you .ya button:hover{filter:brightness(.97)}
.tile.steps{grid-column:3/5}
.tile.steps .sg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile.steps .s{border:1px solid var(--hair);border-radius:8px;padding:10px 12px;min-width:0}
.tile.steps .s b{display:block;font-size:13.5px;font-weight:700;line-height:1.25;margin-bottom:6px}
.tile.steps .s .pill{font-size:11px}
.tile.steps .s .bar{margin:8px 0 0;height:6px}
.tile.hz{grid-row:3/5}
.tile.hz.w{grid-column:1/2}.tile.hz.m30{grid-column:2/3}.tile.hz.m90{grid-column:3/4}
.tile.hz .mv{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--hair-2);font-size:14.5px;line-height:1.35}
.tile.hz .mv:first-of-type{border-top:0}
.tile.hz .mv i{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--hair);cursor:pointer;flex:none}
.tile.hz .mv.on i{background:var(--good)}.tile.hz .mv.behind i{background:var(--bad)}.tile.hz .mv.done i{background:var(--good);box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 10px var(--good)}
.tile.hz .mv.done span{color:var(--ink-3);text-decoration:line-through}
.tile.hz .mv .x{border:0;background:transparent;color:var(--ink-4);cursor:pointer;opacity:0;padding:0 4px;font-size:14px}
.tile.hz .mv:hover .x{opacity:1}.tile.hz .mv .x:hover{color:var(--bad)}
.tile.hz .addmv{width:100%;border:0;border-top:1px dashed var(--hair);background:transparent;padding:9px 0 2px;font:inherit;font-size:14px;color:var(--ink);margin-top:auto}
.tile.hz .addmv::placeholder{color:var(--ink-4)}
.tile.hz .addmv:focus{outline:0;border-top-color:var(--gold)}
.tile.hz .when{font-family:'Druk Cond','Schibsted Grotesk',Impact,sans-serif;text-transform:uppercase;font-size:26px;line-height:.95;margin:0 0 10px;color:var(--ink)}
.tile.hz .when small{font-family:'Schibsted Grotesk',sans-serif;text-transform:none;font-size:12px;color:var(--ink-3);letter-spacing:0;margin-left:8px}
.tile.hz .ok{color:var(--good)}.tile.hz .bad{color:var(--bad)}
.tile.dates{grid-column:4/5;grid-row:3/5}
.tile.dates .d{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;line-height:1.35;padding:7px 0;border-top:1px solid var(--hair-2)}
.tile.dates .d:first-of-type{border-top:0}
.tile.dates .d b{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-top:2px;white-space:nowrap}
.tile.dates .d.behind b{color:var(--bad)}.tile.dates .d.done{color:var(--ink-4)}
.tile [contenteditable]{border-bottom:1px dotted transparent;border-radius:2px;padding:0 2px;margin:0 -2px;cursor:text}
.tile [contenteditable]:hover{border-bottom-color:var(--hair);background:var(--alt)}
.tile [contenteditable]:focus{outline:0;background:var(--gold-tint);border-bottom-color:var(--gold)}
.blegend{font-size:12px;color:var(--ink-4);margin:-10px 0 6px}
.blegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 10px;vertical-align:middle}
@media (max-width:1000px){.bento{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto}.tile.north{grid-column:1/3;grid-row:auto}.tile.nums,.tile.you{grid-column:auto}.tile.steps{grid-column:1/3}.tile.hz{grid-row:auto}.tile.hz.w,.tile.hz.m30,.tile.hz.m90,.tile.dates{grid-column:auto;grid-row:auto}.tile.steps .sg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.bento{grid-template-columns:1fr}.tile.north,.tile.steps{grid-column:auto}.tile.north .big{font-size:36px}}

/* Strategy: north star, an overview chart, then plays as accordions. */
.north1{background:var(--ink);color:var(--paper);border-radius:12px;padding:28px 32px;margin:22px 0 20px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:32px;align-items:end}
.north1 .lbl{color:var(--ink-4)}
.north1 .big{font-family:'Druk Cond','Schibsted Grotesk',Impact,sans-serif;text-transform:uppercase;font-size:38px;line-height:.95;letter-spacing:.01em;margin:8px 0 12px;text-wrap:balance}
.north1 .why{font-size:15px;line-height:1.5;color:var(--hair);max-width:64ch;margin:0}
.north1 [contenteditable]:hover{background:rgba(255,255,255,.06)}.north1 [contenteditable]:focus{background:rgba(255,255,255,.1);outline:0}
.north1 .tot span{display:block;font-size:11px;color:var(--ink-4);letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.north1 .tot .track{height:10px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}
.north1 .tot .track i{display:block;height:100%;background:var(--gold);border-radius:999px}
.ovw{background:var(--card);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow);padding:22px 26px 20px;margin-bottom:22px}
.ovw h3{margin:0 0 12px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between}
.ovw h3 small{letter-spacing:0;text-transform:none;font-weight:500;font-size:12px;color:var(--ink-4)}
.ovw .rows{display:flex;flex-direction:column}
.ovw .row{display:grid;grid-template-columns:minmax(180px,.55fr) minmax(0,1fr) 92px;gap:20px;align-items:center;padding:13px 0;border-top:1px solid var(--hair-2);cursor:pointer}
.ovw .row:first-child{border-top:0}
.ovw .row:hover b{text-decoration:underline}
.ovw .row b{font-size:15px;font-weight:600;line-height:1.3}
.ovw .row .track{position:relative;height:18px;background:var(--hair-2);border-radius:999px}
.ovw .row .fill{position:absolute;left:0;top:0;bottom:0;background:var(--good);border-radius:999px;min-width:8px}
.ovw .row.behind .fill{background:var(--bad)}.ovw .row.wip .fill{background:var(--warn)}.ovw .row.done .fill{background:var(--good)}
.ovw .row .tick{position:absolute;top:-4px;width:2px;height:26px;background:var(--ink-3);opacity:.55}
.ovw .row .tick.end{background:var(--ink);opacity:.8}
.ovw .row .st{font-size:13px;font-weight:600;text-align:right;white-space:nowrap}
.ovw .row.done .st{color:var(--good)}.ovw .row.wip .st{color:var(--warn)}.ovw .row.behind .st{color:var(--bad)}.ovw .row.next .st{color:var(--ink-3)}
.ovw .axis{display:grid;grid-template-columns:minmax(180px,.55fr) minmax(0,1fr) 92px;gap:20px;margin-top:10px}
.ovw .axis div{position:relative;height:16px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.ovw .axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ovw .segs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px}
.ovw .seg{cursor:pointer}
.ovw .seg .track{height:14px;background:var(--hair-2);border:1px solid var(--hair);border-radius:999px;overflow:hidden}
.ovw .seg .fill{height:100%;min-width:6px;background:var(--good);border-radius:999px}
.ovw .seg.behind .fill{background:var(--bad)}.ovw .seg.wip .fill{background:var(--warn)}
.ovw .seg .cap{font-size:13px;color:var(--ink-2);margin-top:9px;line-height:1.35}
.ovw .seg .cap b{font-weight:600}
.ovw .seg:hover .cap b{text-decoration:underline}
.play{background:var(--card);border:1px solid var(--hair);border-radius:10px;margin-bottom:16px;box-shadow:var(--shadow)}
.play-h{display:grid;grid-template-columns:36px minmax(0,1fr) 200px auto 18px;gap:22px;align-items:center;padding:24px 26px;cursor:pointer}
.play-h:hover{background:var(--alt)}
.play.open .play-h{border-bottom:1px solid var(--hair-2)}
.play-h h2{margin:0;font-size:19px;font-weight:700;line-height:1.25}
.play-h p{margin:5px 0 0;color:var(--ink-3);font-size:15px;line-height:1.45;max-width:60ch}
.play-h .pb{height:12px;background:var(--hair-2);border-radius:999px;overflow:hidden}
.play-h .nx{margin:10px 0 0;font-size:14px;color:var(--ink-2);display:flex;gap:8px;align-items:baseline}
.play-h .nx em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);white-space:nowrap}
.play-h .nx.behind em{color:var(--bad)}
.play-h .pb i{display:block;height:100%;background:var(--good);border-radius:999px}
.play.behind .pb i{background:var(--bad)}.play.wip .pb i{background:var(--warn)}
.play-h .pct{display:none}
.play-h .st{font-size:13px;font-weight:600;white-space:nowrap}
.play.done .st{color:var(--good)}.play.wip .st{color:var(--warn)}.play.behind .st{color:var(--bad)}
.play-h .chev{color:var(--ink-4);font-size:14px;transition:transform .15s}
.play.open .chev{transform:rotate(90deg)}
.play .mark{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid var(--hair);color:var(--ink-4)}
.play.done .mark{background:var(--good);border-color:var(--good);color:#fff}.play.wip .mark{border-color:var(--warn);color:var(--warn)}.play.behind .mark{border-color:var(--bad);color:var(--bad)}
.play-b{display:none;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:0}
.play.open .play-b{display:grid}
.play-b .lft{padding:26px 28px 24px 84px;border-right:1px solid var(--hair-2)}
.play-b .rgt{padding:26px 28px 24px}
.play-b h4{margin:0 0 12px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.play-b .ov{font-size:15.5px;line-height:1.6;margin:0 0 26px;max-width:58ch}
.play-b .ov[contenteditable]:hover{background:var(--alt)}.play-b .ov[contenteditable]:focus{outline:0;background:var(--gold-tint)}
.ck{list-style:none;margin:0;padding:0}
.ck li{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:14px;align-items:start;padding:11px 0;border-top:1px solid var(--hair-2);font-size:15px;line-height:1.45}
.ck li:first-child{border-top:0}
.ck .box{width:18px;height:18px;border:2px solid var(--hair);border-radius:4px;margin-top:2px;cursor:pointer;display:grid;place-items:center;font-size:12px;color:#fff}
.ck li.done .box{background:var(--good);border-color:var(--good)}.ck li.done .box::after{content:"✓"}
.ck li.behind .box{border-color:var(--bad);background:var(--bad-tint)}
.ck li.on .box{border-color:var(--good)}
.ck li.done span.t{color:var(--ink-3);text-decoration:line-through}
.ck .when{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);white-space:nowrap;padding-top:4px}
.ck li.behind .when{color:var(--bad)}
.ck .x{border:0;background:transparent;color:var(--ink-4);cursor:pointer;opacity:0;padding:0 4px}
.ck li:hover .x{opacity:1}.ck .x:hover{color:var(--bad)}
.ck span.t[contenteditable]{border-bottom:1px dotted transparent;cursor:text;padding:0 2px;margin:0 -2px;border-radius:2px}
.ck span.t[contenteditable]:hover{border-bottom-color:var(--hair);background:var(--alt)}.ck span.t[contenteditable]:focus{outline:0;background:var(--gold-tint);border-bottom-color:var(--gold)}
.addck{width:100%;border:0;border-top:1px dashed var(--hair);background:transparent;padding:9px 0 2px;font:inherit;font-size:14px;color:var(--ink);margin-top:4px}
.addck::placeholder{color:var(--ink-4)}.addck:focus{outline:0;border-top-color:var(--gold)}
.prog{padding:8px 0 4px}
.prog .track{position:relative;height:12px;background:var(--hair-2);border-radius:999px;margin:26px 0 30px}
.prog .fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:999px}
.prog .mk{position:absolute;top:-4px;width:2px;height:20px;background:var(--ink-3)}
.prog .mk.end{background:var(--ink)}
.prog .mk span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.prog .mk.end span{color:var(--ink)}
.prog .now{position:absolute;top:-26px;transform:translateX(-50%);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep);white-space:nowrap}
.chart{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;height:150px;padding:6px 4px 0}
.chart .bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.chart .bar .v{font-family:'Druk Cond','Schibsted Grotesk',Impact,sans-serif;font-size:22px;line-height:1;color:var(--ink)}
.chart .bar .col{width:100%;max-width:64px;background:var(--hair-2);border-radius:6px 6px 2px 2px}
.chart .bar.now .col{background:var(--gold)}
.chart .bar .l{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.chart .bar .l small{display:block;font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-4)}
.measure{font-size:14px;color:var(--ink-3);margin:6px 0 0;line-height:1.5}
.measure b{color:var(--ink);font-weight:600}
@media (max-width:820px){.north1{grid-template-columns:1fr}.north1 .tot{text-align:left}.play-h{grid-template-columns:36px minmax(0,1fr) 18px}.play-h .pbw,.play-h .st{display:none}.play-b{grid-template-columns:1fr}.play-b .lft{padding-left:20px;border-right:0;border-bottom:1px solid var(--hair-2)}}
/* Conversation floats: a pill bottom-right, a panel when open, on every tab. */
#dock .pill-btn{position:fixed;right:24px;bottom:24px;background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:14px 20px;font:inherit;font-size:15px;font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);cursor:pointer;display:flex;align-items:center;gap:10px;z-index:40}
#dock .pill-btn i{width:8px;height:8px;border-radius:50%;background:var(--good)}
#dock .pill-btn:hover{background:var(--ink-2)}
#dock .panel{position:fixed;right:24px;bottom:24px;width:min(420px,calc(100vw - 32px));height:min(600px,calc(100vh - 100px));background:var(--card);border:1px solid var(--hair);border-radius:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden;z-index:41}
#dock .panel .th{padding:14px 16px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:center}
#dock .panel .th h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
#dock .panel .th small{display:block;color:var(--ink-3);font-size:12px;letter-spacing:0;text-transform:none;font-weight:500;margin-top:2px}
#dock .panel .th button{border:0;background:transparent;font-size:20px;color:var(--ink-3);cursor:pointer;padding:0 4px}
#dock .panel .msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
#dock .panel .sugg{padding:0 12px 10px}
#dock .panel .comp{padding:10px 12px;border-top:1px solid var(--hair);background:var(--paper)}
/* Conversation with the client's agent, at the bottom of the Engine. */
.talk{margin-top:30px;background:var(--card);border:1px solid var(--hair);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.talk .th{padding:14px 18px;border-bottom:1px solid var(--hair);display:flex;justify-content:space-between;align-items:baseline}
.talk .th h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.talk .th small{color:var(--ink-3);font-size:13px}
.talk .msgs{padding:14px 18px;display:flex;flex-direction:column;gap:12px;max-height:340px;overflow:auto}
.talk .m{max-width:78%;padding:10px 14px;border-radius:10px;font-size:15px;line-height:1.45}
.talk .m.me{align-self:flex-end;background:var(--ink);color:var(--paper);border-bottom-right-radius:3px}
.talk .m.ag{align-self:flex-start;background:var(--alt);border-bottom-left-radius:3px}
.talk .m.ag .who{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.talk .m.ag ul{margin:6px 0 0;padding-left:18px}
.talk .m.ag li{margin:2px 0}
.talk .m .acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.talk .m .acts button{border:1px solid var(--hair);background:var(--card);color:var(--ink-2);font-size:12px;padding:4px 9px;border-radius:999px;cursor:pointer}
.talk .m .acts button:hover{border-color:var(--ink-3);color:var(--ink)}
.talk .comp{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--hair);background:var(--paper)}
.talk .comp input{flex:1;border:1px solid var(--hair);border-radius:6px;padding:11px 14px;font:inherit;font-size:15px;background:var(--card);color:var(--ink)}
.talk .comp input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-tint)}
.talk .sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px;background:var(--paper)}
.talk .sugg button{border:1px solid var(--hair);background:transparent;color:var(--ink-3);font-size:12.5px;padding:5px 10px;border-radius:999px;cursor:pointer}
.talk .sugg button:hover{color:var(--ink);border-color:var(--ink-3)}
@media (max-width:820px){.strat .cols{grid-template-columns:1fr}.talk .m{max-width:95%}}

/* Ideas */
.ideas{background:var(--card);border:1px solid var(--hair);border-radius:8px;box-shadow:var(--shadow);padding:20px 22px 16px;margin-top:18px}
.ideas .ih{margin-bottom:12px}
.ideas h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ideas small{color:var(--ink-3);font-size:13px}
.ideas .idea{display:grid;grid-template-columns:12px 64px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--hair-2);font-size:15px;line-height:1.4}
.ideas .idea.empty{display:block;color:var(--ink-4);font-style:italic}
.ideas .idea .st{width:12px;height:12px;border-radius:50%;background:var(--hair);margin-top:5px;cursor:pointer}
.ideas .idea.planned .st{background:var(--gold)}.ideas .idea.done .st{background:var(--good)}
.ideas .idea.done .t{color:var(--ink-3);text-decoration:line-through}
.ideas .idea .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);border:1px solid var(--hair);border-radius:3px;padding:2px 6px;text-align:center;cursor:pointer;margin-top:2px}
.ideas .idea .k:hover{color:var(--ink);border-color:var(--ink-3)}
.ideas .idea .t{border-bottom:1px dotted transparent;cursor:text;padding:0 2px;margin:0 -2px;border-radius:2px}
.ideas .idea .t:hover{border-bottom-color:var(--hair);background:var(--alt)}
.ideas .idea .t:focus{outline:0;background:var(--gold-tint);border-bottom-color:var(--gold)}
.ideas .idea .acts{display:flex;gap:6px;opacity:0;white-space:nowrap}
.ideas .idea:hover .acts{opacity:1}
.ideas .idea .acts button{border:1px solid var(--hair);background:var(--card);color:var(--ink-2);font-size:12px;padding:4px 9px;border-radius:999px;cursor:pointer}
.ideas .idea .acts button:hover{border-color:var(--ink-3);color:var(--ink)}
.ideas .idea .acts .x{border:0;color:var(--ink-4);font-size:14px;padding:0 6px}
.ideas .idea .acts .x:hover{color:var(--bad)}
.ideas .addidea{width:100%;border:0;border-top:1px dashed var(--hair);background:transparent;padding:12px 0 6px;font:inherit;font-size:15px;color:var(--ink)}
.ideas .addidea::placeholder{color:var(--ink-4)}
.ideas .addidea:focus{outline:0;border-top-color:var(--gold)}
.ideas .legend{margin-top:10px;font-size:12px;color:var(--ink-4)}
.ideas .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 10px;vertical-align:middle}
@media (max-width:640px){.ideas .idea{grid-template-columns:12px minmax(0,1fr)}.ideas .idea .k,.ideas .idea .acts{grid-column:2}.ideas .idea .acts{opacity:1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;transition:all .25s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

/* Mobile chrome that is inert on desktop: the bottom tab bar, the sticky header wrapper, the sheet handle and shade. */
.tabbar{display:none}
.hd{display:block}
#dock .grab,#dock .shade{display:none}
@media (max-width:820px) and (orientation:landscape){
  .app{grid-template-columns:1fr}
  nav{border-right:0;border-bottom:1px solid var(--hair);padding:14px 0}
  nav .clients{display:flex;overflow-x:auto;gap:4px;padding:0 12px}
  nav .cl{width:auto;white-space:nowrap;border-radius:6px}
  nav .cl.on{box-shadow:inset 0 -3px 0 var(--gold)}
  nav .add{display:none}
  main{padding:22px 18px 60px;min-width:0}
  .topbar{flex-wrap:wrap}
  .head h1{font-size:44px}
  .task{grid-template-columns:1fr;padding-left:20px}
  .report{grid-template-columns:1fr}
}
/* ---- Mobile first (portrait phones, under 820px). Desktop at 1000px+ is untouched. ---- */
@media (max-width:819px) and (orientation:portrait){
  html{-webkit-text-size-adjust:100%}
  body{font-size:16px;line-height:1.5}
  .app{grid-template-columns:1fr}
  .app>*{min-width:0}
  main{padding:0 16px calc(56px + env(safe-area-inset-bottom,0px) + 84px);max-width:none}
  html[data-view="report"] main{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
  /* 2. Client switcher: a chip strip under the page title, snap-scrolling, the count as a red number. */
  nav{border-right:0;border-bottom:1px solid var(--hair);padding:14px 0 0}
  nav .brand{padding:0 16px 10px;border-bottom:0;margin-bottom:0}
  nav .brand .druk{font-size:28px}
  nav .brand small{font-size:14px}
  nav .lbl{display:none}
  nav .strip{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 14px;scroll-snap-type:x proximity;scroll-padding-left:16px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav .strip::-webkit-scrollbar{display:none}
  nav .clients{display:contents}
  nav .cl{flex:none;width:auto;min-height:44px;padding:0 14px;border:1px solid var(--hair);border-radius:999px;background:var(--card);gap:8px;font-size:15px;font-weight:600;white-space:nowrap;scroll-snap-align:start}
  nav .cl.on{background:var(--gold-tint);border-color:var(--gold);box-shadow:none;color:var(--ink)}
  nav .cl .n{font-size:0;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--alt);color:var(--ink-3);display:grid;place-items:center}
  nav .cl .n::after{content:attr(data-n);font-size:12px;font-weight:700;line-height:1}
  nav .cl .n.bad{background:var(--bad);color:#fff}
  nav .cl .n[data-n=""]{display:none}
  nav .add{flex:none;display:inline-flex;align-items:center;width:auto;margin:0;min-height:44px;padding:0 14px;border-radius:999px;font-size:15px;white-space:nowrap;scroll-snap-align:start}
  /* 1. The segmented control goes; the bottom tab bar takes over. */
  .topbar{margin:12px 0 8px;gap:8px;flex-wrap:wrap}
  .views{display:none}
  .topbar .st{font-size:14px;line-height:1.4}
  .tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--paper);border-top:1px solid var(--hair);z-index:39}
  .tabbar button{position:relative;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;justify-content:center;min-height:56px;padding:0;-webkit-tap-highlight-color:transparent}
  .tabbar button.on{color:var(--gold);font-weight:700}
  .tabbar button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
  /* 3. Sticky compact header: client name plus the dated Latest line. Shrinks once you scroll. */
  .hd{position:sticky;top:0;z-index:30;background:var(--paper);margin:0 -16px;padding:6px 16px 8px;border-bottom:1px solid transparent}
  .hd.shrink{border-bottom-color:var(--hair);padding:6px 16px}
  .head{display:block;margin-bottom:4px}
  .head h1{font-size:40px;line-height:.92;transition:font-size .15s}
  .head .r{text-align:left;font-size:14px;margin-top:6px}
  .head .r b{display:inline;font-size:15px;margin-left:6px}
  .head .r small{display:block;margin:2px 0 0;font-size:13px}
  .latest{font-size:14px;margin:2px 0 0}
  .hd.shrink .head h1{font-size:26px}
  .hd.shrink .head .r{display:none}

  if(!it) return `<div class="latest"><span class="none">Nothing recorded for ${esc(META[k].name)} since ${shortDate(Date.now()-7*DAY)}.</span>${link}</div>`;
  return `<div class="latest"><span><b>${rel(it.atMs)}, ${esc(whoLabel(it.who))}:</b> ${esc(it.what)}</span>${link}</div>`;
}
function weekSince(k){ const R=S.reports[k]; let since=Date.now()-7*DAY; if(R&&R.weeks.length){ const last=Math.max(...R.weeks.map(w=>w.publishedAt||0)); if(last>since) since=last; } return since; }

// ---- reports ----
async function loadReport(k){
  const c=META[k].report; const draft=await q("reports:get",{client:c}); const weeks=[];
  if(draft){ const n=Math.max(0,Math.min(60,(draft.weekNumber||1)-1)); const got=await Promise.all(Array.from({length:n},(_,i)=>q("reports:getWeek",{client:c,weekNumber:i+1}).catch(()=>null))); got.forEach(w=>{ if(w) weeks.push(w); }); }
  weeks.sort((a,b)=>a.weekNumber-b.weekNumber);
  S.reports[k]={draft,weeks};
}
const rsaveT={}, rpatch={};
function saveReport(k,patch){ Object.assign(rpatch[k]=rpatch[k]||{},patch); clearTimeout(rsaveT[k]); rsaveT[k]=setTimeout(()=>flushReport(k),800); }
async function flushReport(k){
  const p=rpatch[k]; rpatch[k]=null; if(!p) return; const args={client:META[k].report};
  if(p.milestones) args.milestones=p.milestones.map(m=>({name:String(m.name||""),progress:Number(m.progress)||0,status:String(m.status||"next"),statusLabel:String(m.statusLabel||"Next")}));
  if(p.tasks) args.tasks=p.tasks.map(t=>({text:String(t.text||""),status:String(t.status||"next"),statusLabel:String(t.statusLabel||"Next"),priority:String(t.priority||"Med")}));
  if(p.asks) args.asks=p.asks.map(a=>({label:String(a.label||""),detail:String(a.detail||"")}));
  if(p.links) args.links=p.links.map(l=>({label:String(l.label||""),url:String(l.url||"")}));
  for(const f of ["clientName","headerLine","headline","dateLabel","notes","footerNote","autoSend"]) if(p[f]!==undefined) args[f]=p[f];
  try{ await mu("reports:save",args); }catch(e){ failNotice(e,"save the report"); }
}
const labelFor={ task:{done:"Done",wip:"This week",next:"Next"}, ms:{done:"Done",wip:"In progress",next:"Next"} };
function youItems(k){ k=k||S.cur; return D(k).steps.flatMap(s=>s.tasks).filter(t=>t.you&&!t.done&&!(t.snoozedUntil&&t.snoozedUntil>Date.now())); }
// The engine fills the report. Rows it contributes are remembered in the doc
// (engineTasks / engineAsks) so they render as "auto"; rows Patrik hid never come back.
function syncReport(k){
  const R=S.reports[k], doc=S.docs[k]; if(!R||!R.draft||!doc) return; const d=R.draft; const since=weekSince(k);
  const hidden=new Set((doc.hiddenAuto||[]).map(norm)); let chT=false, chA=false, chD=false;
  d.tasks=d.tasks||[]; d.asks=d.asks||[];
  const addTask=(text)=>{ const n=norm(text); if(!n||hidden.has(n)) return; const have=d.tasks.map(t=>norm(t.text)); if(have.some(x=>x&&(x===n||n.includes(x)||x.includes(n)))) return; d.tasks.push({text,status:"done",statusLabel:"Done",priority:"Med"}); if(!doc.engineTasks.includes(text)){ doc.engineTasks.push(text); chD=true; } chT=true; };
  doc.steps.forEach(s=>s.tasks.forEach(t=>{ if(t.done&&!t.you&&t.doneAt>=since&&t.did!=="Skipped this week"&&!t.rolled) addTask(t.t); })); // gold (Patrik's own) items never become client-facing rows
  // Only deliverables and client-facing sends flow into the client's report. "did" items are internal narration and stay on the ledger.
  (S.ledger[k]||[]).filter(it=>["finished","sent"].includes(it.kind)&&it.atMs>=since).forEach(it=>addTask(it.what));
  // Asks are never auto-filled: Patrik's "needs you" items are his to-dos, not the client's asks (2026-09-03). The client's asks are typed on the Report tab.
  const wanted=[];
  const eng=new Set((doc.engineAsks||[]).map(norm));
  const before=d.asks.length;
  d.asks=d.asks.filter(a=>{ if(!eng.has(norm(a.detail))) return true; return wanted.some(w=>norm(w.detail)===norm(a.detail)); });
  if(d.asks.length!==before) chA=true;
  wanted.forEach(w=>{ if(hidden.has(norm(w.detail))) return; if(d.asks.some(a=>norm(a.detail)===norm(w.detail)||norm(a.label)===norm(w.label))) return; d.asks.push({label:w.label,detail:w.detail}); if(!doc.engineAsks.includes(w.detail)){ doc.engineAsks.push(w.detail); chD=true; } chA=true; });
  if(chT) saveReport(k,{tasks:d.tasks}); if(chA) saveReport(k,{asks:d.asks}); if(chD) save(k);
}
function reportRows(k,w){
  const doc=D(k); const et=new Set((doc.engineTasks||[]).map(norm)), ea=new Set((doc.engineAsks||[]).map(norm));
  return { milestones:(w.milestones||[]).map((m,i)=>({i,...m})), tasks:(w.tasks||[]).map((t,i)=>({i,...t,src:et.has(norm(t.text))?"auto":"you"})), asks:(w.asks||[]).map((a,i)=>({i,...a,src:ea.has(norm(a.detail))?"auto":"you"})) };
}
function reportFilled(k){ const R=S.reports[k]; if(!R||!R.draft) return 0; const d=R.draft; return [(d.milestones||[]).length,(d.tasks||[]).length,(d.asks||[]).length,String(d.notes||"").trim().length,(d.links||[]).length].filter(Boolean).length; }

// ---- rooms + conversation ----
function chatState(k){ return S.chat[k]=S.chat[k]||{msgs:[],local:[],pending:[],roomId:null,roomTitle:"",loaded:false,waiting:false}; }
async function loadRooms(){ if(S.roomsList) return S.roomsList; try{ const r=await q("rooms:listRooms",{worldId:WORLD}); S.roomsList=Array.isArray(r)?r:[]; }catch(e){ S.roomsList=[]; } return S.roomsList; }
async function loadRoom(k){
  const rooms=await loadRooms(); const C=chatState(k);
  if(!C.roomId){ for(const p of META[k].rooms){ const r=rooms.find(x=>x.kind==="project"&&String(x.project||"").toLowerCase()===p); if(r){ C.roomId=String(r._id); C.roomTitle=r.title||p; break; } }
    if(!C.roomId){ const r=rooms.find(x=>x.kind==="project"&&String(x.title||"").toLowerCase()===META[k].name.toLowerCase()); if(r){ C.roomId=String(r._id); C.roomTitle=r.title; } } }
  await refreshThread(k); C.loaded=true;
}
async function refreshThread(k){ const C=chatState(k); if(!C.roomId) return; try{ const rows=await q("messages:list",{roomId:C.roomId,limit:20}); if(Array.isArray(rows)) C.msgs=rows; }catch(e){ console.warn("thread",e); } }
function liveChat(k){ const C=chatState(k); return !!(C.roomId&&S.me); }
async function sendToRoom(k,text,wait){
  const C=chatState(k); const cid="ce-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
  C.pending.push({cid,t:text,at:Date.now()}); renderDock();
  try{
    const id=await mu("messages:send",{roomId:C.roomId,text,role:"user",clientId:WORLD,clientMessageId:cid,source:"client-engine",userId:S.me.userId||undefined,userEmail:S.me.email||undefined,userName:S.me.name||undefined});
    await refreshThread(k); C.pending=C.pending.filter(p=>p.cid!==cid); renderDock();
    if(wait&&id) pollDispatch(k,String(id));
    return id;
  }catch(e){ C.pending=C.pending.filter(p=>p.cid!==cid); C.local.push({who:"sys",t:"Not sent: "+(e.message||"error"),at:Date.now()}); renderDock(); if(e.auth) setNotice("Sign in on the dashboard first to talk to "+D(k).agent+"."); return null; }
}
async function pollDispatch(k,id){
  const C=chatState(k); C.waiting=true; renderDock(); const t0=Date.now(); let seen=0;
  while(Date.now()-t0<60000){ await sleep(2000); if(S.cur!==k) break;
    try{ const st=await q("messages:dispatchStatus",{messageId:id}); const n=(st&&st.replies||[]).length; if(n>seen){ seen=n; await refreshThread(k); renderDock(); } if(st&&["done","failed"].includes(st.status)) break; }catch(e){} }
  C.waiting=false; await refreshThread(k); renderDock();
}
function agentSlugFor(who,fallback){ const first=String(who||"").split(/[\s,]+/)[0].toLowerCase(); return KNOWN_AGENTS.includes(first)?first:String(fallback||"gary").toLowerCase(); }

// ---- acknowledge, clear, say what's next; never ask twice ----
function ackDone(k,t){
  const name=META[k].name; t.done=true; t.doneAt=Date.now(); t.busy=false; delete t.snoozedUntil; t.did="You told me. Off your list.";
  ledgerAppend(k,`Patrik took care of "${t.t}" for ${name}.`,"did");
  save(k); syncReport(k);
  return `Got it. <b>${esc(t.t)}</b> is off your list. Next: ${esc(NEXT_AFTER[t.t]||"we pick it up from here, and it shows on Friday's report as done.")}`;
}
function matchYou(k,text){
  const words=text.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>3&&!["that","this","with","them","have","done","sent","told","gave","just","about","from","they","what","ross","karen"].includes(w));
  let best=null,score=0;
  youItems(k).forEach(t=>{ const tw=(t.t+" "+(t.p||"")).toLowerCase(); const n=words.filter(w=>tw.includes(w)).length; if(n>score){score=n;best=t;} });
  return score>0?best:null;
}
const ACK_RE=/\b(sent|done|did|gave|shared|approved|approve|told|handled|finished|got it done|took care|updated|uploaded|signed|paid|confirmed|decided|it's done|its done|already)\b/;

// Local answers, only when the room or the sign-in is missing. Always from the ledger, dated.
function answerFromLedger(k,qs){
  const doc=D(k), items=S.ledger[k]||[], t=qs.toLowerCase(), name=META[k].name, P=doc.plan;
  const list=(L)=>L.length?`<ul>${L.map(m=>`<li>${esc(m.t)}${m.s==="behind"?" <b style='color:var(--bad)'>(behind)</b>":m.s==="done"?" (done)":""}</li>`).join("")}</ul>`:"";
  const quote=(L)=>L.length?`<ul>${L.slice(0,6).map(it=>`<li>${shortDate(it.atMs)}, ${esc(whoLabel(it.who))}: ${esc(it.what)}</li>`).join("")}</ul>`:`<p>Nothing recorded for ${esc(name)} since ${shortDate(Date.now()-7*DAY)}.</p>`;
  const note=`<div class="note">Answering from the ledger; sign in for ${esc(doc.agent)}.</div>`;
  const you=youItems(k);
  if(/(this )?week|today|happening|now|latest/.test(t)) return {t:`Recorded this week for ${esc(name)}:${quote(items.filter(it=>it.atMs>=weekSince(k)))}Planned:${list(P.week)||"<p>No moves on the plan for this week.</p>"}${you.length?`Waiting on you: ${esc(you.map(x=>x.t.toLowerCase()).join("; "))}.`:""}${note}`,acts:["Add as a task"]};
  if(/30|month|next 30/.test(t)) return {t:`By Sep 30 we want:${list(P.m30)||"<p>Nothing on the 30-day plan yet.</p>"}Latest recorded:${quote(items.slice(0,3))}${note}`,acts:["Add a move"]};
  if(/90|quarter|nov|long/.test(t)) return {t:`By Nov 30:${list(P.m90)||"<p>Nothing on the 90-day plan yet.</p>"}${P.why?`That is the whole thesis: ${esc(lc1(P.why))}`:""}${note}`,acts:["Add a move"]};
  if(/why|behind|stuck|late/.test(t)){ const b=P.week.concat(P.m30).filter(m=>m.s==="behind"); return {t:(b.length?`Behind right now:${list(b)}`:"Nothing is marked behind on the plan.")+`Last recorded:${quote(items.slice(0,3))}${note}`,acts:["Chase it"]}; }
  if(/report|friday/.test(t)){ const R=S.reports[k]; const d=R&&R.draft; return {t:d?`Friday's draft for ${esc(name)} has ${(d.milestones||[]).length} milestones, ${(d.tasks||[]).length} tasks and ${(d.asks||[]).length} asks, and ${d.autoSend?"sends Friday at noon":"is held"}. Open the Report tab to see it as the client will.`:`There is no report draft for ${esc(name)} yet.`,acts:[]}; }
  if(/strategy|plan|north|goal/.test(t)) return {t:`North star: ${esc(P.north)} Why: ${esc(P.why)}${note}`,acts:["Add a move"]};
  return {t:`Got it. I'll take "${esc(qs)}" as a note on ${esc(name)}. Want it as a task, a move on the plan, or a line on Friday's report?${note}`,acts:["Add as a task","Add a move","Put it on the report"]};
}
let chatOpen=false;
function renderDock(){
  const d=document.getElementById("dock"); if(!d||!S.ready) return; const doc=D(); if(!doc) return;
  d.innerHTML = chatOpen ? chatHtml() : `<button class="pill-btn" data-act="chatopen"><i></i>Ask ${esc(doc.agent)} about ${esc(META[S.cur].name)}</button>`;
  d.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",onAct));
  wireChat();
}
function threadRows(k){
  const C=chatState(k); const rows=[];
  C.msgs.forEach(m=>{ const role=m.role||(m.agentSlug?"assistant":"user"); if(role==="system") return; rows.push({who:role==="user"?"me":"ag",name:role==="user"?(m.userName||"You"):cap(m.agentSlug||"corner"),t:m.text||"",at:m.createdAt||0,server:true}); });
  C.local.forEach(m=>rows.push(m));
  C.pending.forEach(p=>rows.push({who:"me",name:S.me&&S.me.first||"You",t:p.t,at:p.at,pending:true}));
  rows.sort((a,b)=>(a.at||0)-(b.at||0));
  return rows;
}
function chatHtml(){
  const k=S.cur, doc=D(k), C=chatState(k); const live=liveChat(k);
  const sub=live?`in the ${esc(C.roomTitle||META[k].name)} room, answers include the ledger`:(!C.loaded?"connecting…":C.roomId?`answering from the ledger; sign in for ${esc(doc.agent)}`:`no project room for ${esc(META[k].name)}; answering from the ledger`);
  const rows=threadRows(k);
  const body=rows.length?rows.map(m=>{
    if(m.who==="sys") return `<div class="m sys">${esc(m.t)}</div>`;
    if(m.who==="me") return `<div class="m me">${m.name&&m.name!=="You"?`<div class="who">${esc(m.name)}</div>`:""}${esc(m.t)}<div class="when">${m.pending?"sending…":rel(m.at)}</div></div>`;
    return `<div class="m ag"><div class="who">${esc(m.name||doc.agent)}</div>${m.server?esc(m.t).replace(/\n/g,"<br>"):m.t}${m.acts&&m.acts.length?`<div class="acts">${m.acts.map(a=>`<button data-chatact="${esc(a)}" data-src="${encodeURIComponent(m.q||"")}">${esc(a)}</button>`).join("")}</div>`:""}${m.server?`<div class="when">${rel(m.at)}</div>`:""}</div>`;
  }).join(""):`<div class="m sys">${live?"No messages in this room yet.":"Nothing here yet. Ask a question; the answer comes from the ledger."}</div>`;
  return `<div class="shade" data-act="chatclose"></div><section class="talk panel">
    <div class="th"><div class="grab"></div><div><h3>${esc(doc.agent)} · ${esc(META[k].name)}</h3><small>${sub}</small></div><button data-act="chatclose" title="Close">×</button></div>
    <div class="msgs" id="msgs">${body}${C.waiting?`<div class="m wait"><i></i>${esc(doc.agent)} is answering…</div>`:""}</div>
    <div class="sugg">${["What's happening this week?","What are we doing in the next 30 days?","Where are we in 90 days?","Why are we behind?"].map(x=>`<button data-sugg="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <div class="comp"><input id="chatin" placeholder="Ask about ${esc(META[k].name)}, or tell me something to remember"><button class="btn" data-act="chatsend">Send</button></div>
  </section>`;
}
async function sendChat(text){
  text=String(text||"").trim(); if(!text) return; const k=S.cur, C=chatState(k); const inp=document.getElementById("chatin"); if(inp) inp.value="";
  if(ACK_RE.test(text.toLowerCase())){
    const you=youItems(k); const m=matchYou(k,text)||(you.length===1?you[0]:null); const at=Date.now();
    if(m){ C.local.push({who:"me",t:text,at,name:S.me&&S.me.first||"You"}); C.local.push({who:"ag",t:ackDone(k,m),acts:[],at:at+1}); renderDock(); render(); if(liveChat(k)) sendToRoom(k,text,false); return; }
    if(you.length>1){ C.local.push({who:"me",t:text,at,name:S.me&&S.me.first||"You"}); C.local.push({who:"ag",t:"Got it. Which one is that?",acts:you.map(x=>"Done: "+x.t),at:at+1}); renderDock(); return; }
  }
  if(liveChat(k)){ await sendToRoom(k,text,true); return; }
  const at=Date.now(); C.local.push({who:"me",t:text,at,name:S.me&&S.me.first||"You"}); const a=answerFromLedger(k,text); C.local.push({who:"ag",t:a.t,acts:a.acts,q:text,at:at+1}); renderDock();
}
// Mobile (portrait, under 820px): the panel is a bottom sheet. It is sized to the
// visual viewport so the composer stays above the keyboard, and drags down to close.
const isMobile=()=>window.matchMedia("(max-width:819px) and (orientation:portrait)").matches;
function fitSheet(){
  const p=document.querySelector("#dock .panel"); if(!p) return;
  if(!isMobile()){ p.style.height=p.style.top=p.style.bottom=""; return; }
  const vv=window.visualViewport; if(!vv) return;
  if(vv.height>=window.innerHeight-80){ p.style.height=p.style.top=p.style.bottom=""; return; } // no keyboard: the CSS sheet (90dvh, bottom 0) is right
  const h=Math.round(vv.height*0.9); p.style.height=h+"px"; p.style.top=Math.round(vv.offsetTop+vv.height-h)+"px"; p.style.bottom="auto";
  const box=document.getElementById("msgs"); if(box) box.scrollTop=box.scrollHeight;
}
let focusNext=false;
function wireChat(){
  const inp=document.getElementById("chatin"); if(!inp) return;
  fitSheet();
  if(!isMobile()||focusNext) inp.focus(); focusNext=false;
  const th=document.querySelector("#dock .panel .th"), panel=document.querySelector("#dock .panel");
  if(th&&panel){ let y0=null, dy=0;
    th.addEventListener("touchstart",e=>{ y0=e.touches[0].clientY; dy=0; panel.style.transition="none"; },{passive:true});
    th.addEventListener("touchmove",e=>{ if(y0===null) return; dy=Math.max(0,e.touches[0].clientY-y0); panel.style.transform=`translateY(${dy}px)`; },{passive:true});
    th.addEventListener("touchend",()=>{ if(y0===null) return; y0=null; panel.style.transition=""; if(dy>110){ chatOpen=false; renderDock(); } else panel.style.transform=""; });
  }
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ sendChat(inp.value); } });
  document.querySelectorAll("[data-sugg]").forEach(b=>b.addEventListener("click",()=>sendChat(b.dataset.sugg)));
  document.querySelectorAll("[data-chatact]").forEach(b=>b.addEventListener("click",()=>{
    const k=S.cur, doc=D(k), C=chatState(k), what=b.dataset.chatact, qq=decodeURIComponent(b.dataset.src||"")||"From the conversation";
    if(what.startsWith("Done: ")){ const t=youItems(k).find(x=>x.t===what.slice(6)); if(t){ C.local.push({who:"ag",t:ackDone(k,t),acts:[],at:Date.now()}); } render(); return; }
    if(what==="Add as a task"){ doc.steps[3].tasks.push({t:qq,p:"Added from the conversation.",who:doc.agent,btn:"Do it",did:"Done."}); save(k); ledgerAppend(k,`Started "${qq}" as a task for ${META[k].name}.`,"started"); toast("Added as a task under "+doc.steps[3].t+"."); }
    else if(what==="Add a move"){ doc.plan.week.push({t:qq,s:"on"}); save(k); toast("Added to this week on the plan."); }
    else if(what==="Put it on the report"){ const R=S.reports[k]; if(R&&R.draft){ R.draft.tasks.push({text:qq,status:"wip",statusLabel:"This week",priority:"Med"}); saveReport(k,{tasks:R.draft.tasks}); toast("Added to Friday's report."); } else toast("No report draft for "+META[k].name+" yet."); }
    else if(what==="Chase it"){ if(liveChat(k)) sendToRoom(k,"Please chase what is behind for "+META[k].name+" and report back here.",true); else toast("Sign in to send that to "+doc.agent+"."); }
    render();
  }));
  const box=document.getElementById("msgs"); if(box) box.scrollTop=box.scrollHeight;
}

// ---- Strategy ----
function playPct(pl){ const d=pl.ck.filter(c=>c.s==="done").length; const measurePct=pl.m&&pl.m.m90?Math.round(100*pl.m.now/pl.m.m90):0; return Math.max(Math.round(100*d/Math.max(pl.ck.length,1)), Math.min(measurePct,100)); }
function playState(pl){ const pct=playPct(pl); if(pct>=100) return "done"; if(pl.ck.some(c=>c.s==="behind")) return "behind"; return pct>0?"wip":"next"; }
function strategyHtml(){
  const cur=S.cur, P=D().plan, plays=D().plays||[];
  const total=plays.length?Math.round(plays.reduce((a,pl)=>a+playPct(pl),0)/plays.length):0;
  if(openPlay[cur]===undefined) openPlay[cur]=plays.findIndex(pl=>playState(pl)==="behind")>=0?plays.findIndex(pl=>playState(pl)==="behind"):0;
  const bar=(pl,i)=>{ const st=playState(pl), pct=playPct(pl), m=pl.m||{now:0,m30:0,m90:0}, max=Math.max(m.now,m.m30,m.m90,1), p30=Math.min(100,Math.round(100*m.m30/max));
    return `<div class="row ${st}" data-openplay="${i}"><b>${i+1}. ${esc(pl.t)}</b><div class="track"><div class="fill" style="width:${pct}%"></div><i class="tick" style="left:${p30}%"></i><i class="tick end" style="left:100%"></i></div><span class="st">${st==="done"?"Done":st==="behind"?"Behind":st==="wip"?"Moving":"Not started"}</span></div>`; };
  const play=(pl,i)=>{ const st=playState(pl), pct=playPct(pl), m=pl.m||{label:"",now:0,m30:0,m90:0,unit:""}; const max=Math.max(m.now,m.m30,m.m90,1);
    const nowPct=Math.min(100,Math.round(100*m.now/max)), p30=Math.min(100,Math.round(100*m.m30/max));
    const chart=`<div class="prog"><div class="track"><div class="fill" style="width:${nowPct}%"></div><span class="now" style="left:${nowPct}%">Today</span><div class="mk" style="left:${p30}%"><span>Sep 30</span></div><div class="mk end" style="left:100%"><span>Nov 30</span></div></div></div>`;

function isSnoozed(t){ return !!(t.snoozedUntil&&t.snoozedUntil>Date.now()); }
function stepState(st){
  const live=st.tasks.filter(x=>x.t!=="Nothing this week"&&x.t!=="Not in scope"&&!isSnoozed(x));
  if(live.length&&live.every(x=>x.done)) return "done";

}
