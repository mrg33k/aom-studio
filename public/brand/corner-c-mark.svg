<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Compact gradient "c" mark — favicon size, reads crisp at 16px -->
  <defs>
    <linearGradient id="surge-gradient-mark" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Gradient "c" centered -->
  <text x="60" y="95" font-family="Outfit, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="100" font-weight="800" fill="url(#surge-gradient-mark)" text-anchor="middle" dominant-baseline="middle">c</text>
</svg>