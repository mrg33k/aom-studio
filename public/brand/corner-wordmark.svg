<svg viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Light background version: charcoal text with gradient "c" -->
  <defs>
    <linearGradient id="surge-gradient" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Gradient "c" -->
  <text x="20" y="95" font-family="Outfit, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="100" font-weight="800" fill="url(#surge-gradient)" letter-spacing="-2">c</text>

  <!-- Charcoal "orner" -->
  <text x="110" y="95" font-family="Outfit, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="100" font-weight="800" fill="#2d2d2d" letter-spacing="-2">orner</text>
</svg>