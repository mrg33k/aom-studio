<title>Ahead of Market — You never built a marketing department. So we become it.</title>
<style>
/* ============================================================
   Ahead of Market — homepage hero, ROUND 2: THE FIELD REPORT.

   Round 1 shipped the sentence alone and its own judge named the
   defect: "a beautiful block of type sitting on top of nothing."
   Measured 2026-08-06 against scripts/design_screen_check.py, the
   live round-1 hero returned 0 content graphics on the first
   screen. Round 2 keeps the monument Patrik chose (and the line
   sizing that fixed its spacing) and gives it a ground to stand
   on: one real, graded, black-and-white documentary frame of the
   buyer's own world, labelled as an anonymous example by a
   hand-drawn gold mark.

   Direction is not new — it is the ratified one in
   missions/aom-website/creative-brief.md ("THE FIELD REPORT"),
   which round 1 never executed because the cage-match brief
   forbade every form of evidence.
   ============================================================ */
@font-face{font-family:'Druk Cond';src:url('/hero-2/assets/fonts/DrukCond-Super-subset.woff2') format('woff2'),url('/hero-2/assets/fonts/DrukCond-Super-Trial.otf') format('opentype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Schibsted Grotesk';src:url('/hero-2/assets/fonts/SchibstedGrotesk-var.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}

:root{
  /* MEASURED, NOT GUESSED (2026-08-06). The first attempt STACKED the
     photograph under the monument. Measured at 1440x900 it collapsed the
     column to 459px and drove the display face to 84px — under the 104px
     Druk Cond aperture floor derived yesterday. A stacked plate and a
     full-measure monument cannot both have the screen's height.
     So the photograph takes WIDTH instead: the obsidian slab holds the
     type at its own scale, the picture holds the rest of the frame, and
     they meet on one hard vertical seam. */
  --pad-l:100px;
  --pad-r:64px;
  /* fixed vertical chrome inside the slab: masthead 97 + stage padding 48
     + answer 105 + base 71 */
  --chrome:321px;
  --h-coef:1.8202;        /* 1 / (0.79 x (0.2484 + 0.1826 + 0.2644)) */
  /* LOOKED AT IT (r2-desktop, first capture): at a 786px measure the
     monument only used 432 of the stage's 631, and the 100px of slack
     under the last line read as a dead band above the rule — the same
     void defect round 1 was pulled up on. The measure is raised until
     the block nearly fills the stage (432 -> 494, slack 100 -> 42), which
     costs the photograph 114px of width it can afford (34.8% -> 26% of
     the first screen, well clear of the 8% floor). */
  --measure:min(900px, calc(0.74 * 100vw - var(--pad-l) - var(--pad-r)), calc((100svh - var(--chrome)) * var(--h-coef)));
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--paper);
  font-family:'Schibsted Grotesk',system-ui,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  caret-color:var(--accent);
  scrollbar-color:var(--divider) var(--bg);
}
::selection{background:var(--accent);color:var(--text-on-accent)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--paper);outline-offset:3px}

/* ---------- the frame: slab meets picture on one seam ---------- */
.frame{
  min-height:100svh;
  display:flex;
  align-items:stretch;
}
.hero{
  width:calc(var(--measure) + var(--pad-l) + var(--pad-r));
  flex:0 0 auto;
  padding:0 var(--pad-r) 0 var(--pad-l);
  background:var(--bg);
  display:flex;
  flex-direction:column;
}

/* ---------- masthead ---------- */
.masthead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:var(--space-8) 0;
  border-bottom:1px solid var(--divider);
}
.identity{display:flex;align-items:center;gap:var(--space-4)}
.mark{width:32px;height:32px;display:block;color:var(--paper);transition:color 160ms cubic-bezier(0.2,0,0,1)}
.mark:hover{color:var(--accent)}
.mark svg{width:100%;height:100%;display:block}
.label{
  font-size:12px;
  font-weight:500;
  letter-spacing:0.18em;
  text-transform:uppercase;
  line-height:1.2;
}
.identity .label{color:var(--paper)}
.nav{display:flex;align-items:center;gap:var(--space-16)}
.nav a{color:var(--text-muted);transition:color 160ms cubic-bezier(0.2,0,0,1)}
.nav a:hover{color:var(--paper)}
.menu{display:flex;align-items:center;gap:var(--space-2)}
.menu svg{display:block;width:16px;height:16px;stroke:currentColor;stroke-width:2;stroke-linecap:square;fill:none}

/* ---------- the monument ---------- */
.stage{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:var(--space-6) 0;
  container-type:inline-size;
}
.monument{
  margin:0;
  font-family:'Druk Cond','Schibsted Grotesk',system-ui,Helvetica,Arial,sans-serif;
  font-weight:400;
  line-height:0.79;
  text-transform:uppercase;
  color:var(--paper);
}
.monument span{display:block;white-space:nowrap;letter-spacing:0.005em}
.monument .m{display:none}
/* Each line is SIZED to the measure at one uniform tracking (the round-1
   fix for "the text spacing is weird"): the block stays flush on both
   edges and the type colour is even, because nothing is pried apart. */
.d1{font-size:24.84cqw}
.d2{font-size:18.26cqw}
.d3{font-size:26.44cqw}

/* ---------- the plate: the evidence ---------- */
.plate{
  position:relative;
  flex:1 1 auto;
  margin:0;
  min-width:0;
  overflow:hidden;
  background:var(--ink-700);
}
.plate img{
  width:100%;
  height:100%;
  object-fit:cover;
  /* the tech and the opened unit sit right of centre in the frame, so the
     crop is pulled that way — the seam must not cut the subject in half */
  object-position:68% 46%;
  display:block;
}
/* NOT a scrim over the picture — a short gradient in the bottom fifth
   only, so the photograph reads as a photograph and not as texture. The
   incumbent's "ghost photograph" was killed for the opposite treatment. */
.plate::after{
  content:"";
  position:absolute;
  inset:auto 0 0 0;
  height:30%;
  background:linear-gradient(to bottom,rgba(11,11,11,0) 0%,rgba(11,11,11,0.78) 76%,rgba(11,11,11,0.9) 100%);
  pointer-events:none;
}
.example{
  position:absolute;
  left:var(--space-8);
  bottom:var(--space-8);
  width:224px;
  z-index:1;
  pointer-events:none;
}
.example svg{width:100%;height:auto;display:block}

/* ---------- the answer ---------- */
.answer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--space-12);
  padding:var(--space-6) 0;
  border-top:1px solid var(--divider);
}
.subline{
  margin:0;
  font-size:20px;
  font-weight:400;
  line-height:1.4;
  color:var(--text-muted);
  max-width:62ch;
  text-wrap:balance;
}
.subline b{font-weight:500;color:var(--paper)}
.cta{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:var(--space-6);
  padding:var(--space-4) var(--space-8);
  background:var(--accent);
  border:1px solid var(--accent);
  color:var(--bg);
  transition:color 180ms cubic-bezier(0.2,0,0,1);
  font-size:14px;
  font-weight:600;
  letter-spacing:0.14em;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
}
.cta span,.cta svg{position:relative;z-index:1}
.cta svg{display:block;width:14px;height:14px;stroke:currentColor;stroke-width:2;stroke-linecap:square;fill:none}
.cta::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--bg);
  transform:scaleX(0);
  transform-origin:left center;
  transition:transform 180ms cubic-bezier(0.2,0,0,1);
}
.cta:hover::before{transform:scaleX(1)}
.cta:hover{color:var(--accent)}
.cta:active{transform:translateY(1px)}

/* ---------- the base band ---------- */
/* rule 9: the base of a screen NAMES, it does not explain. Three words. */
.disciplines{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--divider);
  padding:var(--space-6) 0 var(--space-8);
}
.disciplines span{color:var(--text-muted)}
.disciplines span+span{
  border-left:1px solid var(--divider);
  padding-left:var(--space-6);
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:1ms !important}
}

/* ---------- tablet ---------- */
@media (max-width:1024px){
  :root{--pad-l:48px;--pad-r:40px}
  .nav{gap:var(--space-8)}
}

/* ---------- 390: the seam turns horizontal ---------- */
@media (max-width:640px){
  :root{
    --pad-l:24px;
    --pad-r:24px;
    /* four hand-placed lines here; slab chrome MEASURED on the phone,
       not carried over: masthead 81 + stage padding 32 + answer 170 +
       base 119 = 402. */
    --chrome:315px;
    --h-coef:0.9903;   /* 1 / (0.82 x (0.2736+0.3471+0.3464+0.2642)) */
    /* svh is the right unit on a real phone but over-reports by ~7px under
       CDP emulation, so the phone layout is sized to fit on the WIDTH cap
       alone (81 + 32 + 345 + 154 + 119 + 96 = 827 at 390x844) and never
       depends on the height term being exact. Slack: 17px. */
    --plate-h:168px;
    --measure:min(calc(100vw - var(--pad-l) - var(--pad-r)), calc((100svh - var(--plate-h) - var(--chrome)) * var(--h-coef)));
  }
  .frame{flex-direction:column}
  .hero{width:100%;flex:1 1 auto}
  .plate{flex:0 0 auto;height:var(--plate-h);border-top:1px solid var(--divider)}
  .masthead{padding:var(--space-6) 0}
  .identity .label{display:none}
  .nav{gap:var(--space-6)}
  .nav .role{display:none}
  .stage{padding:var(--space-4) 0}
  .example{left:var(--space-6);bottom:var(--space-4);width:160px}
  .plate img{object-position:74% 52%}
  .plate::after{height:56%}
  .monument{line-height:0.82}
  .monument .d{display:none}
  .monument .m{display:block}
  .m1{font-size:27.36cqw}
  .m2{font-size:34.71cqw}
  .m3{font-size:34.64cqw}
  .m4{font-size:26.42cqw}
  .answer{
    flex-direction:column;
    align-items:stretch;
    gap:var(--space-4);
    padding:var(--space-4) 0;
  }
  .subline{font-size:16px}
  .cta{justify-content:space-between;padding:var(--space-4)}
  /* LOOKED AT IT (r2-mobile, first capture): stacked, the base band ate
     119px for three words and squeezed the photograph to a 96px strip.
     One row says the same thing in 48 and hands the picture the rest. */
  .disciplines{padding:var(--space-4) 0}
  .disciplines span+span{padding-left:var(--space-4)}
  .label{font-size:10px;letter-spacing:0.1em}
}
</style>
</head>
