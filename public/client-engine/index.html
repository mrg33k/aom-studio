<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client parts</title>
<style>
    :root {
      color-scheme: light dark;
      --bg: #ede7dc;
      --sidebar: #ede7dc;
      --panel: #fefcf9;
      --surface: #ffffff;
      --surface-strong: #ffffff;
      --text: #262823;
      --muted: #6d7068;
      --line: #ddd8ce;
      --line-strong: #c9c3b7;
      --accent: #176c61;
      --accent-soft: #dbece7;
      --accent-text: #0d5249;
      --good: #26715b;
      --good-soft: #e2f1eb;
      --warn: #9b651b;
      --warn-soft: #faecd3;
      --bad: #a6473f;
      --bad-soft: #f8e3df;
      --quiet: #747870;
      --quiet-soft: #ecece7;
      --shadow: 0 12px 28px rgba(75, 58, 32, .08), 0 2px 8px rgba(75, 58, 32, .04);
      --shadow-hover: 0 18px 38px rgba(75, 58, 32, .14), 0 5px 14px rgba(75, 58, 32, .07);
      --panel-shadow: 0 28px 72px rgba(75, 58, 32, .13), 0 6px 20px rgba(75, 58, 32, .06);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    button, input { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      align-items: start;
      min-height: 100vh;
      align-items: stretch;
    }

    .sidebar {
      position: relative;
      z-index: 1;
      align-self: stretch;
      padding: 32px 24px;
      background: var(--sidebar);
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 4px 24px;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 16px rgba(23, 108, 97, .24);
    }

    .brand-mark svg { width: 20px; height: 20px; }

    .brand-title { font-size: 16px; font-weight: 750; letter-spacing: -.01em; }
    .brand-subtitle { color: var(--muted); font-size: 12px; }

    .search-wrap { position: relative; margin-bottom: 24px; }

    .search-wrap svg {
      position: absolute;
      bottom: 12px;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      height: 40px;
      padding: 0 12px 0 32px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      transition: border-color .2s, box-shadow .2s;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .side-label {
      margin: 0 8px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .client-list { display: grid; gap: 4px; }

    .client {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: background .2s, color .2s, border-color .2s;
    }

    .client:hover { background: color-mix(in srgb, var(--surface) 62%, transparent); color: var(--text); }

    .client.selected {
      border-color: var(--line);
      background: var(--surface-strong);
      color: var(--text);
      box-shadow: 0 4px 16px rgba(56, 45, 26, .05);
    }

    .avatar {
      display: grid;
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-size: 12px;
      font-weight: 800;
    }

    .avatar.wolfpack { background: #176c61; }
    .avatar.ambition { background: #a5613c; }
    .avatar.kohrs { background: #6264a7; }
    .client-name { font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
    .empty-clients { display: none; padding: 12px; color: var(--muted); font-size: 13px; }

    main {
      min-width: 0;
      min-height: calc(100vh - 48px);
      margin: 24px 24px 24px 0;
      padding: 56px clamp(32px, 4vw, 56px) 72px;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--panel-shadow);
    }

    .main-inner { max-width: 1320px; margin: 0 auto; }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 56px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: -.035em;
    }

    .hero-copy { margin: 12px 0 0; color: var(--muted); font-size: 16px; }

    .summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .summary span {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .summary strong { color: var(--text); }

    .group { margin-top: 56px; scroll-margin-top: 24px; }

    .group-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h2 { margin: 0; font-size: 20px; line-height: 1.25; letter-spacing: -.025em; }
    .group-count { color: var(--muted); font-size: 13px; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
    }

    .part-card {
      position: relative;
      display: flex;
      min-height: 236px;
      flex-direction: column;
      padding: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .part-card:hover {
      z-index: 1;
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .part-card:focus-visible, .client:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 2px;
    }

    .part-card.unseen {
      border: 1px dashed var(--line-strong);
      background: color-mix(in srgb, var(--surface) 76%, var(--bg));
      box-shadow: none;
      opacity: .62;
    }

    .part-card.unseen:hover { opacity: .92; }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .glyph {
      display: grid;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 0;
      border-radius: 13px;
    }

    .glyph svg { width: 24px; height: 24px; }
    /* ── ONE RULE FOR THE ICON COLUMN ────────────────────────────────────────
       If the platform owns the mark, we show the mark in its own colours on its
       own ground — Google, Yelp, LinkedIn, Jobber. Recognising the platform in
       one glance is the entire job of those four.

       If WE drew it, it is our ink on our ground. It was not: the set invented
       indigo, hot pink, orange, cyan, lime, coral and two purples on a page
       whose palette contains none of them, and the loudest of them was a
       two-point sparkle in ChatGPT purple on the "AI answers" tile. Sparkle
       icons are banned outright and there is no purple here. A drawn glyph's
       hue was carrying no information at all, so it now carries none loudly:
       one ink, one warm tile, and the four brand marks become the only colour
       in the column — which is correct, because they are the wayfinding. */
    .glyph.google { background: #e8f0fe; }
    .glyph.reviews { background: var(--surface-soft); }
    .glyph.website { background: var(--surface-soft); }
    .glyph.yelp { background: #fde8e8; }
    .glyph.linkedin { background: #0a66c2; }
    .glyph.ai { background: var(--surface-soft); }
    .glyph.photo { background: var(--surface-soft); }
    .glyph.video { background: var(--surface-soft); }
    .glyph.case-study { background: var(--surface-soft); }
    .glyph.folder { background: var(--surface-soft); }
    .glyph.jobber { background: #def5e7; }
    .glyph.recurring { background: var(--surface-soft); }
    .glyph.follow-up { background: var(--surface-soft); }
    .glyph.insurance { background: var(--surface-soft); }
    .glyph.target { background: var(--surface-soft); }
    .glyph.memberships { background: var(--surface-soft); }
    .glyph.outreach { background: var(--surface-soft); }
    .glyph.report { background: var(--surface-soft); }

    .health {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px;
      border-radius: 999px;
      background: var(--warn-soft);
      color: var(--warn);
      font-size: 12px;
      font-weight: 750;
    }

    .health::before { width: 7px; height: 7px; border-radius: 50%; background: currentColor; content: ""; }
    .health.blocked { background: var(--bad-soft); color: var(--bad); }
    /* The class the renderer actually emits is the state key — `cannot`, not
       `unseen-health`. The old selector matched nothing, so every "Cannot see"
       part fell through to the amber .health base and wore the exact colour of
       "Needs work". That collision erases the one distinction the board exists
       to make: "we were never given the login" is not "this is bad". */
    .health.cannot { background: var(--quiet-soft); color: var(--quiet); }

    .part-card h3 { margin: 0 0 8px; font-size: 16px; line-height: 1.3; letter-spacing: -.01em; }

    .status-line {
      display: -webkit-box;
      margin: 0 0 24px;
      overflow: hidden;
      color: var(--muted);
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .access-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .access-label { color: var(--muted); font-size: 12px; }

    .access-pill {
      white-space: nowrap;
      display: inline-flex;
      max-width: 75%;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--quiet-soft);
      color: var(--quiet);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.2;
      text-align: right;
    }

    .access-pill.connected { background: var(--good-soft); color: var(--good); }
    .access-pill.pending, .access-pill.expired, .access-pill.wrong { background: var(--warn-soft); color: var(--warn); }
    .access-pill.never { background: var(--quiet-soft); color: var(--quiet); }

    .arrow {
      margin-left: 4px;
      color: var(--accent);
      font-size: 16px;
      transition: transform .2s;
    }

    .part-card:hover .arrow { transform: translateX(3px); }

    @media (max-width: 1180px) {
      .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .app { display: block; }

      .sidebar {
        position: relative;
        z-index: 2;
        width: 100%;
        height: auto;
        padding: 16px;
        border-right: 0;
        border-bottom: 0;
      }

      .sidebar-head { margin: 0 0 16px; }
      .search-wrap { margin-bottom: 12px; }
      .side-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

      .client-list {
        display: flex;
        padding-bottom: 4px;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .client { flex: 0 0 auto; padding: 8px 12px; }
      .avatar { width: 24px; height: 24px; }
      main {
        min-height: 0;
        margin: 0 12px 12px;
        padding: 40px 24px 56px;
        border-radius: 24px;
      }
      .hero { display: block; margin-bottom: 32px; }
      .summary { justify-content: flex-start; margin-top: 24px; }
      .group { margin-top: 40px; }
    }

    @media (max-width: 560px) {
      .card-grid { grid-template-columns: 1fr; }
      .part-card { min-height: 196px; }
      .group-heading { align-items: center; }
      .hero-copy { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

      
    /* ---- v2 additions ---- */
    /* The counts line sat directly on top of the meeting bar — the header had
       no bottom margin and the bar's own margin is below it, so the two touched
       at every width and read as one block. */
    .page-head { margin: 0 0 24px; }
    .meeting {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin: 0 0 24px; padding: 12px 16px; border-radius: 12px;
      background: var(--accent-soft); color: var(--accent);
      font-size: 13px; font-weight: 600;
    }
    .meeting .lbl { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; opacity: .8; }

    .counts { display: flex; gap: 8px; flex-wrap: wrap; }
    /* The arrow is the affordance that says "this opens" — it must survive any
       label length. The pill is the only element allowed to give up space. */
    .access-row { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
      min-width: 0; }
    .access-row .arrow { flex: none; margin-left: auto; }
    .access-pill { min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; }
    .conn { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700;
      white-space: nowrap; flex: none; }
    .conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
    .conn.yes { color: var(--good); } .conn.yes::before { background: var(--good); }
    .conn.no { color: var(--warn); } .conn.no::before { background: var(--warn); }
    .conn.na { color: var(--quiet); } .conn.na::before { background: var(--quiet); }

    .health.completed { background: var(--good-soft); color: var(--good); }

    /* ── WHAT IT COSTS ────────────────────────────────────────────────────────
       status_line is the finding and suggestion is the fix. A card carrying
       only those two tells you what is wrong and what to type, and never once
       says why a busy morning should be spent on it — "Needs work · rebuild the
       site" is a failed card no matter how neatly it is set.
       No uppercase key over it. The card already has one on "Do next", and
       three labelled blocks in a 288px column means nothing is emphasised. A
       rule down the left says "this follows from the line above" and costs a
       row of nothing. It is --line-strong, not the accent: the cost is not a
       state and must not pick up the state vocabulary. */
    .cost {
      margin: 0 0 8px; padding-left: 12px;
      border-left: 2px solid var(--line-strong);
      color: var(--text); font-size: 13px; line-height: 1.5;
    }
    /* The finding and what it costs are one thought, so they sit at the tight
       gap. 24px between them read as two unrelated paragraphs, and the dashed
       rule above "Do next" is already doing the separating. */
    .part-card .status-line { margin-bottom: 8px; }

    .suggest {
      margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--line);
      font-size: 13px; color: var(--text); font-weight: 600;
    }

    /* ── THE ROW THAT SAID NOTHING ────────────────────────────────────────────
       Ten of Wolfpack's nineteen cards spent their last line on the words "Not
       applicable" under a divider. Photography, case studies, the capability
       folder — there is no login for any of them, so there is no access
       question, so there was never an answer to print. It read as a status the
       eye had to check and discard ten times per page.
       The divider goes with it: a rule whose whole job was to separate the card
       from that line has nothing left to separate. The arrow stays, in the same
       corner it sits in on every other card — it is the affordance that says
       this opens, and losing it on ten of nineteen cards would read as a bug. */

    /* ── A CARD YOU CAN ACT ON ────────────────────────────────────────────────
       The card used to be one anchor wrapping everything, which is exactly the
       shape the day row was in before it grew controls: there was nowhere to
       put a button that was not also a navigation click, and a <button> inside
       an <a> is not a thing you can ship.
       So the card is a container now. The anchor covers the part you READ and
       carries the padding itself, so clicking near the edge still opens the
       part instead of landing on dead inset. The foot sits outside it and holds
       the things you DO. */
    .part-card { padding: 0; }
    .card-link {
      display: flex; flex: 1; min-width: 0; flex-direction: column;
      padding: 24px 24px 0; color: inherit; text-decoration: none;
    }
    .card-link:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: -4px;
    }
    /* margin-top:auto is gone with the anchor taking flex:1 — the foot is the
       last child of the card and the link absorbs any height the grid adds. */
    /* justify-content was space-between, which was invisible for as long as the
       foot fit on one line: an auto margin eats every pixel of free space
       before justify-content sees any, so the controls were pushed right by the
       margin and nothing was being spread. The moment the foot wraps — which it
       does on a phone — the first line has no auto margin left on it, and
       space-between threw "Connected" and "Manager" to opposite edges of the
       card. They are one fact, "connected, at Manager level", and reading them
       32px apart with nothing between makes them look like two.
       Packed left; the auto margins still do the right-hand alignment. */
    .access-row { margin: 0 24px; padding: 16px 0 24px; flex-wrap: wrap;
      justify-content: flex-start; }
    .access-row.bare { padding: 0 0 24px; border-top: 0; }
    /* Two controls, a state and an arrow will not fit on one 288px line, and a
       card is not allowed to clip its own buttons. The access facts stay left,
       the things you do stay right, and on a narrow card they stack. */
    .access-row .row-acts { flex: none; margin-left: auto; }
    .access-row .row-acts ~ .arrow { margin-left: 4px; }

    /* ── WHERE TO START ───────────────────────────────────────────────────────
       Nineteen cards at identical volume answers "how is this client" and never
       answers "what do I do right now", which is the one question this page
       exists for. This is that answer and nothing more: the open part that the
       most other work is waiting on, what it costs, and one way in.
       There is no impact score and no time estimate here on purpose. Neither
       exists in the record — 36 of 38 parts have never been machine-checked and
       there is no history to derive either from — and a made-up number at the
       top of the page would teach you to distrust every real one under it.
       Surface, not another tinted band: the meeting bar directly above is
       already accent-soft, and two coloured bars stacked read as one. The
       accent is spent on a rule down the left and on the way in. */
    .next-up {
      margin: 0 0 24px; padding: 24px;
      border: 1px solid var(--line); border-left: 4px solid var(--accent);
      border-radius: 16px; background: var(--surface); box-shadow: var(--shadow);
    }
    .next-up-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .next-up .k {
      color: var(--muted); font-size: 12px; font-weight: 750;
      letter-spacing: .08em; text-transform: uppercase;
    }
    .next-up-name { margin: 0 0 8px; font-size: 20px; line-height: 1.25; letter-spacing: -.025em; }
    .next-up-why { margin: 0 0 8px; font-size: 16px; line-height: 1.5; max-width: 62ch; }
    .next-up-basis { margin: 0 0 16px; color: var(--muted); font-size: 13px; max-width: 62ch; }
    /* Outlined, like every other button on this board. A solid pill is a STATE
       here, and the one thing this control must not look like is a badge saying
       the part is fine. */
    .next-up-go {
      display: inline-flex; align-items: center; padding: 12px 24px;
      border: 1px solid var(--accent); border-radius: 999px;
      color: var(--accent-text); font-size: 14px; font-weight: 700;
      text-decoration: none;
    }
    .next-up-go:hover { background: var(--accent-soft); }
    .next-up-go:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 2px;
    }

    /* The prompt opens across the whole grid rather than inside one 288px
       column: "https://..." plus two buttons in a card-width box is a form you
       have to fight. Full width puts it under the card you clicked and gives
       the receipt field room to hold a receipt. */
    .card-grid > .prompt { grid-column: 1 / -1; }
    .suggest .k { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

    .recheck-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 24px; }
    /* Outlined, and NEUTRAL. It was a solid accent pill, which was survivable
       while it was the only control on the page — but "Start here" now sits
       directly above it, and a filled green button under an outlined one makes
       the refresh the loudest thing on a screen about what to do next. Two
       accent pills would be flat; accent for the way through and the board's
       ordinary outlined vocabulary for the utility is a hierarchy.
       (It is also the rule everywhere else here: a solid pill is a STATE.) */
    .recheck-btn {
      display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
      padding: 12px 24px; border-radius: 999px;
      border: 1px solid var(--line-strong); background: transparent; color: var(--muted);
      font-size: 14px; font-weight: 700; font-family: inherit;
    }
    .recheck-btn:hover { border-color: var(--accent); color: var(--accent-text); }
    .recheck-btn[disabled] { opacity: .55; cursor: not-allowed; }
    .recheck-note { font-size: 13px; color: var(--muted); font-weight: 600; }

    /* .progress-wrap / .progress-track / .progress-fill / .progress-line
       deleted 2026-08-05 along with their markup. A percentage-fill bar with no
       JS behind it, sitting one line away from being switched on, on a board
       that is 0 completed and has machine-checked 2 of 38 parts. There is no
       number here it could honestly fill to; the first person to wire it would
       have had to invent one, and the whole product rests on not doing that. */

    .summary { display: none; margin: 0 0 24px; padding: 16px; border-radius: 12px;
      background: var(--good-soft); color: var(--good); font-size: 13px; font-weight: 600; }
    .summary.on { display: block; }
    .summary ul { margin: 8px 0 0; padding-left: 16px; font-weight: 600; }

    /* base.css pins the grid to exactly 4 columns at any width. That was fine
       when the board owned the whole page; with a 380px rail beside it the four
       cards squeeze until "Needs work" wraps to two lines and "Manager"
       truncates to "Man...". Let the grid choose how many columns fit at a
       width a card is actually readable at. */
    .card-grid { grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); }
    /* A state pill that wraps stops looking like one pill. */
    .health { white-space: nowrap; }

    /* The rail is the second half of the tool: the board tells you what is
       true, the rail is where you change it and where the work lands. */
    .app.has-rail { grid-template-columns: 248px minmax(0, 1fr) 380px; }
    .rail {
      position: sticky; top: 0; align-self: stretch; height: 100vh;
      display: flex; flex-direction: column;
      background: var(--panel); border-left: 1px solid var(--line);
    }
    .rail-tabs { display: flex; gap: 4px; padding: 16px 16px 0; flex: none; }
    .rail-tab {
      flex: 1; padding: 8px 12px; border: 0; border-radius: 8px; cursor: pointer;
      background: transparent; color: var(--muted); font-family: inherit;
      font-size: 13px; font-weight: 700; letter-spacing: .02em;
    }
    .rail-tab.on { background: var(--accent-soft); color: var(--accent); }
    .rail-pane { display: none; flex: 1; min-height: 0; flex-direction: column; }
    .rail-pane.on { display: flex; }

    .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
    .msg { margin: 0 0 12px; font-size: 13px; line-height: 1.5; }
    .msg .who { display: block; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
      margin-bottom: 4px; }
    .msg .bubble { padding: 12px; border-radius: 12px; background: var(--surface);
      border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.me .bubble { background: var(--accent-soft); border-color: transparent;
      color: var(--text); }
    .composer { flex: none; padding: 16px; border-top: 1px solid var(--line);
      display: flex; gap: 8px; align-items: flex-end; }
    .composer textarea {
      flex: 1; min-width: 0; resize: none; font-family: inherit; font-size: 13px;
      padding: 12px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--surface); color: var(--text); max-height: 120px;
    }
    .composer button {
      flex: none; border: 0; cursor: pointer; padding: 12px 16px;
      border-radius: 999px; background: var(--accent); color: #fff;
      font-family: inherit; font-size: 13px; font-weight: 700;
    }
    .composer button[disabled] { opacity: .55; cursor: not-allowed; }

    .files { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
    .file-group { margin: 0 0 16px; }
    .file-group h4 { margin: 0 0 8px; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .file-row { display: flex; align-items: center; gap: 8px; padding: 8px;
      border-radius: 8px; font-size: 13px; color: var(--text);
      text-decoration: none; }
    .file-row:hover { background: var(--accent-soft); }
    .file-row .nm { flex: 1; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .file-row .wh { flex: none; font-size: 12px; color: var(--muted); }
    .rail-note { padding: 16px; font-size: 13px; color: var(--muted);
      font-weight: 600; line-height: 1.5; }

    @media (max-width: 1180px) {
      .app.has-rail { grid-template-columns: 248px minmax(0, 1fr); }
      .rail { display: none; }
    }

    .avatar.day { background: var(--accent); color: #fff; }
    .day-nav { margin-bottom: 16px; }
    .bucket { margin: 0 0 32px; }
    .bucket-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; }
    .bucket-head h2 { margin: 0; }
    .bucket-why { font-size: 13px; color: var(--muted); font-weight: 600; }
    .day-row { display: flex; align-items: center; gap: 16px; padding: 16px;
      border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
      margin: 0 0 8px; text-decoration: none; color: var(--text); }
    .day-row:hover { border-color: var(--accent); }
    .day-row .who { flex: none; width: 152px; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .day-row .what { flex: 1; min-width: 0; }
    .day-row .what b { display: block; font-size: 14px; }
    .day-row .what span { font-size: 13px; color: var(--muted); font-weight: 600; }
    /* The state pill is the last thing in the row and its label sets its width:
       measured, "Blocked" is 80px and "Needs work" is 103px. With the buttons
       sitting immediately left of it, that 23px difference pushed every Blocked
       row's controls out of line with every other row's — a ragged edge down a
       38-row list. Pinning the column lines the whole right side up. */
    .day-row .st { flex: none; min-width: 104px; text-align: right; }

    /* ── CLOSING THINGS OUT ───────────────────────────────────────────────────
       The row was one anchor wrapping everything, so there was nowhere to put a
       control that was not also a navigation click. It is a container now: the
       anchor covers the part of the row you read, the buttons sit outside it.

       Outlined, never filled — the same lesson the blocks chip taught. Every
       state on this board is a solid pill, so a solid button would read as a
       state at a glance. These are things you DO, not things the part IS.

       Contextual by bucket, because a button that does not apply is noise on a
       23-row list: ours-to-move gets Done and Waiting, waiting-on-them gets Done
       and "not waiting" (the chase ended), and Running gets nothing — it is
       already done, and the only honest way back is the record disagreeing. */
    .row-acts { display: inline-flex; align-items: center; gap: 8px; flex: none; }
    .act {
      padding: 4px 12px; border-radius: 999px; cursor: pointer;
      background: transparent; color: var(--muted);
      border: 1px solid var(--line-strong);
      font-family: inherit; font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .act:hover { border-color: var(--accent); color: var(--accent-text); }
    .act[disabled] { opacity: .5; cursor: progress; }
    .day-row .link { display: flex; align-items: center; gap: 16px; flex: 1;
      min-width: 0; text-decoration: none; color: inherit; }

    /* The prompt opens UNDER the row rather than over it. A modal for a one-line
       answer stops the list you are working; this keeps every other row on
       screen, so closing six things out stays one motion. */
    .prompt { margin: 0 0 8px; padding: 16px; border-radius: 12px;
      background: var(--panel); border: 1px solid var(--line-strong); }
    .prompt label { display: block; font-size: 12px; font-weight: 700;
      color: var(--muted); margin: 0 0 4px; }
    /* The prompt is as wide as the row it opened under, which on the day is
       about 1100px and under a queue item about 1400. The sentence explaining
       what the field is for is not; measured on the feedback prompt, it set as
       one 1400px line. It reads at a measure like everything else here. */
    .prompt .why { font-size: 13px; color: var(--muted); font-weight: 600;
      margin: 0 0 12px; max-width: 78ch; }
    .prompt-row { display: flex; gap: 8px; align-items: center; }
    .prompt input {
      flex: 1; min-width: 0; padding: 8px 12px; border-radius: 8px;
      border: 1px solid var(--line-strong); background: var(--surface);
      font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text);
    }
    .prompt input:focus { outline: none; border-color: var(--accent); }
    /* Outlined in the accent, not filled with it. Every state on this board is
       a solid pill, so a solid button reads as a state at a glance — the lesson
       the "blocks 3" chip and the refresh button have both already been taught
       here, and this was the last control still breaking it. It is still
       obviously the way through: it is the only accent-coloured thing in the
       prompt, sitting beside a neutral Cancel. */
    .act.go { background: transparent; color: var(--accent-text); border-color: var(--accent); }
    .act.go:hover { background: var(--accent-soft); color: var(--accent-text); }

    /* ── WHO WE ARE CHASING ───────────────────────────────────────────────────
       The API has stored waiting_on since the day the prompt started refusing a
       wait without a name — and no screen has ever printed it. Six rows sat in
       "Waiting on a client" and the board could not say who any of them was
       waiting on, which is the one fact that turns that bucket into calls. A
       wait is a state, so it is a filled pill. */
    .waiting-on { display: inline-flex; align-items: center; gap: 8px; flex: none;
      padding: 4px 8px; border-radius: 999px; background: var(--quiet-soft);
      color: var(--text); font-size: 12px; font-weight: 750; white-space: nowrap; }
    .waiting-on::before { content: ""; width: 8px; height: 8px; flex: none;
      border-radius: 50%; background: var(--quiet); }
    /* On a card it is a line, not a pill — see waitingLine() for why. */
    .waiting-line { display: flex; align-items: center; gap: 8px; margin: 0 0 8px;
      color: var(--quiet); font-size: 13px; font-weight: 700; }
    .waiting-line::before { content: ""; width: 8px; height: 8px; flex: none;
      border-radius: 50%; background: var(--quiet); }

    /* ── A LONE CARD ON THE LAST ROW ──────────────────────────────────────────
       "Found by buyers" holds seven cards and the grid resolves to two columns
       beside the rail, so the seventh sits alone with half a row of nothing next
       to it and the next group's heading directly underneath — an enclosed hole
       in the middle of the page, which reads as a mistake rather than as space.
       Which cards are alone is measured in JS: CSS cannot count the columns an
       auto-fill grid chose, and :nth-child(odd) is only accidentally right at
       two — at three it would stretch a card that was not alone.

       A CARD WITH ITS PROMPT OPEN takes the whole row too, and for a plainer
       reason: the prompt is a full-width grid item, so opening one on a card in
       column 1 left that card sitting alone with a hole beside it and the form
       underneath — measured, live, 2026-08-05: rows went [2,2,2,1] to
       [1,2,2,1,1], two holes where there had been none. The card and the
       question it just asked are one thing on the page, so they occupy one
       width. */
    .part-card.wide, .part-card.open { grid-column: 1 / -1; }
    /* Filling the row must not stretch the measure with it. Ninety characters
       to a line is a different defect from the one this fixes. */
    .part-card.wide .card-link > :not(.card-top),
    .part-card.open .card-link > :not(.card-top) { max-width: 62ch; }
    .prompt .err { margin: 12px 0 0; font-size: 13px; font-weight: 650;
      color: var(--bad); }
    .sweep-line { margin: 0 0 24px; padding: 12px 16px; border-radius: 12px;
      background: var(--panel); font-size: 13px; font-weight: 600; color: var(--muted); }
    .sweep-line.bad { background: var(--bad-soft); color: var(--bad); }

    /* ── SOMEBODY PRESSED GET STARTED ────────────────────────────────────────
       A stranger read their own scan report, left a name and a number, and
       until now that landed in a store no screen on this board read. The
       report told them it was in front of Patrik; it was not. This is the
       screen that makes the sentence true, and it sits ABOVE the overnight
       line and every bucket because a person waiting on a call outranks a
       part waiting on a person.

       It is a day-row, not a new component — same 152px identity column, same
       middle, same right-hand state pill — because it is read in the same
       sweep as the rows under it. What separates it is the accent outline and
       the fact that the identity column is a company we do not work for yet.

       The pill is the base amber: "ours to move". Accent is this board's
       "way through" colour and never a state, so the row's border carries the
       urgency and the pill keeps the vocabulary the other 38 rows use. */
    /* TWO LINES, NOT ONE. A part row fits on one line because its middle is a
       label; this row's middle is a sentence a stranger typed, and it was
       competing with a phone number, an email address, a button and a pill for
       the same 900px. Measured on the deploy: the note got a 110px ribbon and
       wrapped six times, with 600px of white beside it. So what they wrote
       takes the whole first line, and what you can DO about it becomes an
       action bar under it — the state pill still pinned right, where every
       other row on this board keeps it. */
    .day-row.lead { align-items: flex-start; flex-wrap: wrap; row-gap: 12px;
      border-color: var(--accent); }
    .day-row.lead .link { flex: 1 0 100%; align-items: flex-start; }
    .day-row.lead .st { margin-left: auto; }
    .day-row.lead .who { color: var(--accent-text); }
    .day-row.lead .what b { font-size: 16px; }
    .day-row.lead .what .when { font-weight: 650; color: var(--muted); }
    /* Scoped through .what on purpose: `.day-row .what span` is (0,2,1) and
       would out-specify a bare `.lead-note`, greying out the one sentence on
       this row that the person themselves wrote. */
    .day-row.lead .what .lead-note { display: block; margin-top: 4px;
      font-size: 13px; font-weight: 600; color: var(--text); }
    /* NOT `.act`. The day's delegated click handler swallows every `.act` it
       finds inside #groups and calls preventDefault() on it — a tel: link
       wearing that class would look like a button and do nothing. Same
       outlined shape, different name, so it stays a link. */
    .lead-reach { display: inline-flex; align-items: center; flex: none;
      flex-wrap: wrap; gap: 8px; }
    .reach { display: inline-flex; align-items: center; flex: none;
      padding: 4px 12px; border-radius: 999px;
      border: 1px solid var(--line-strong); background: transparent;
      color: var(--text); font-size: 12px; font-weight: 700;
      white-space: nowrap; text-decoration: none; }
    .reach:hover { border-color: var(--accent); color: var(--accent-text); }
    .lead-done { margin: 0 0 24px; font-size: 13px; font-weight: 600;
      color: var(--muted); }
    .lead-done a { color: var(--accent-text); }

    .board-message { padding: 24px; border-radius: 12px; background: var(--panel);
      border: 1px solid var(--line); }
    .board-message b { display: block; font-size: 16px; margin-bottom: 8px; }
    .board-message p { margin: 0 0 16px; font-size: 14px; color: var(--muted);
      font-weight: 600; max-width: 52ch; }
    .board-message .recheck-btn { text-decoration: none; }
    .board-message .said { margin: 12px 0 0; max-width: 52ch; color: var(--muted);
      font-size: 13px; font-weight: 650; }
    .count-pill.quiet { color: var(--quiet); }

    @keyframes flash { 0% { box-shadow: 0 0 0 4px var(--accent-soft); } 100% { box-shadow: none; } }
    .part-card.updated { animation: flash 2.4s ease-out; border-color: var(--accent); }

    /* ── WHAT THIS ONE HOLDS UP ───────────────────────────────────────────────
       The only ranking signal on the board that is not an opinion. Twenty-three
       rows wearing the same amber chip is a wall; the same rows with the one
       that frees three others sitting on top is a list. Teal because it is the
       accent for "this is the way through", never a state colour — it must not
       read as a fifth state beside completed / needs / blocked / cannot see. */
    /* Outlined, not filled — and that is the whole point. Every state reads as a
       SOLID pill, so hue alone was never going to keep this out of the state
       vocabulary: accent-soft (#dbece7) and good-soft (#e2f1eb) are the same pale
       mint within a few percent, which made "blocks 3" sit beside "Completed"
       looking like a cousin of it. Structure separates them where colour could
       not — an outline is not a state, at any hue, at any zoom. */
    .blocks {
      display: inline-flex; align-items: center; flex: none;
      padding: 4px 8px; border-radius: 999px;
      background: transparent; color: var(--accent-text);
      box-shadow: inset 0 0 0 1px var(--accent-text);
      font-size: 12px; font-weight: 750; white-space: nowrap;
    }
    .card-flags { display: inline-flex; align-items: center; justify-content: flex-end;
      gap: 8px; min-width: 0; flex-wrap: wrap; }

    /* ── THE FOUR COUNTS ──────────────────────────────────────────────────────
       Four real numbers, read straight off the record, with nothing drawn under
       them. A sparkline here would need a history, and the first machine check
       ran yesterday — 36 of 38 parts have never been looked at by anything. A
       trend line on that is the same lie as a green check with no receipt, and
       it teaches you to distrust every other number on the screen.
       The colour is the state vocabulary the rest of the board already uses:
       amber is ours to move, grey is we were never given the keys (which is not
       a failure), green is holding, muted is unverified. */
    .tiles {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px; margin: 24px 0 16px;
    }
    .tile {
      padding: 24px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--surface); box-shadow: var(--shadow);
    }
    .tile b { display: block; font-size: 32px; font-weight: 800;
      line-height: 1.12; letter-spacing: -.035em; }
    .tile span { display: block; margin-top: 4px; color: var(--muted);
      font-size: 13px; font-weight: 650; }
    .tile.needs b { color: var(--warn); }
    .tile.waiting b { color: var(--quiet); }
    .tile.running b { color: var(--good); }
    /* --muted (#6d7068) and --quiet (#747870) are the same grey to the eye, so
       "Waiting on a client" and "Never checked" arrived as one tone and two of
       the four tiles said nothing to each other. They are not the same kind of
       thing: waiting is a bucket you work (chase them), never-checked is the
       honesty counter behind everything else. It stays legible — it is the line
       that says do not trust the greens — but 36 is the biggest number here and
       the least actionable, and it should not win a screen about what to do. */
    .tile.unchecked b { color: #9a9c94; }

    /* ── WRITTEN FOR YOU, AND NOT SENT ────────────────────────────────────────
       The steward writes drafts; it does not send them, and it has no way to.
       That is a property of the store rather than a promise made here —
       prepared_messages has no address column, so nothing downstream can
       address a message from one — and it is the only reason a standing agent
       was allowed anywhere near a client's name. A screen that let a reader
       forget it would be the version that was blocked.

       So it is said twice, in the two places a person actually looks: once at
       the top of the section, and once on every item, as the pill it wears
       until he says otherwise. A pill and not a footnote, because every other
       state on this board is a pill and "nothing has gone out" is a state.

       The item is a ROW of the same family as a day row — surface, one line of
       rule, 12px radius — not a card. Cards are for parts, of which there are
       nineteen; these are eight things to read in order, and the day view
       already has one reading vocabulary. */
    .queue { margin: 0 0 32px; }
    .queue-note {
      margin: 0 0 16px; padding: 12px 16px; border-radius: 12px;
      background: var(--quiet-soft); color: var(--text);
      font-size: 13px; font-weight: 600; max-width: 78ch;
    }
    .queue-note b { font-weight: 750; }

    /* Grouped by the person it is addressed to, because that is how it gets
       done: nobody writes Ross four separate times, they deal with Ross. */
    .q-person { margin: 0 0 24px; }
    .q-person-head { display: flex; align-items: baseline; gap: 12px;
      flex-wrap: wrap; margin: 0 0 12px; }
    .q-person-head h3 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
    .q-person-head .who { font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

    .q-item { margin: 0 0 8px; padding: 16px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--line); }
    .q-item-top { display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap; margin: 0 0 12px; }
    .q-about { flex: 1; min-width: 0; font-size: 14px; font-weight: 750; }
    .q-about span { display: block; font-size: 13px; font-weight: 600;
      color: var(--muted); }
    .health.unsent { background: var(--quiet-soft); color: var(--quiet); }
    .health.sent { background: var(--good-soft); color: var(--good); }
    .health.answered { background: var(--warn-soft); color: var(--warn); }

    /* TWO COLUMNS, AND THE SPLIT IS THE POINT.
       Left is the message. Right is everything that is NOT the message and must
       never end up in it — what it costs the client (written for the operator's
       card, third person about the person it is addressed to), and the receipts
       under it. Measured first at one column: the draft box came out 1020px
       wide around a 537px text measure, so 47% of the band was background, and
       the label "Not in the message" was the only thing keeping two audiences
       apart. Structure says it better than a label, and it spends the width. */
    .q-cols { display: grid; align-items: start; gap: 24px; margin: 0 0 12px;
      grid-template-columns: minmax(0, 72ch) minmax(0, 1fr); }

    /* THE DRAFT, AS IT WOULD ACTUALLY GO OUT — the words, never a summary of
       them. Judging a message you have not read is the thing this queue exists
       to prevent, so the body is never behind a click. The measure lives on the
       column, not on the paragraph, so the box ends where the reading ends. */
    .q-draft { padding: 16px; border-radius: 12px;
      background: var(--panel); border: 1px solid var(--line); }
    .q-subject { margin: 0 0 8px; font-size: 14px; font-weight: 750; }
    .q-body { margin: 0; color: var(--text); font-size: 13px;
      font-weight: 600; line-height: 1.6; white-space: pre-wrap;
      overflow-wrap: anywhere; }

    .q-aside { margin: 0 0 12px; color: var(--muted);
      font-size: 13px; font-weight: 600; }
    .q-aside b { display: block; color: var(--text); font-weight: 750; }

    /* Under about 1240 the right column is narrower than the quotes it holds,
       and a receipt that wraps every four words stops being readable. It goes
       under the draft instead, which is where it was to begin with. */
    @media (max-width: 1240px) {
      .q-cols { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .q-body { max-width: 72ch; }
    }

    /* The receipts are folded, and that is a judgement worth writing down. The
       BODY is the thing being judged and must be readable without a click; the
       receipts are the appeal against it. Eight items times two receipts printed
       inline is a wall, and a wall is how receipts stop being read at all. The
       count is in the summary so nobody has to open one to learn there are
       none — a draft with no receipts cannot exist, and if one ever appears
       here the summary is where it shows. */
    .q-sources { font-size: 13px; }
    .q-sources > summary { cursor: pointer; color: var(--accent-text);
      font-weight: 700; list-style: none; }
    .q-sources > summary::-webkit-details-marker { display: none; }
    /* A non-breaking space, not a plain one: a CSS hex escape swallows the
       space that terminates it, so "\2212 " is the sign and nothing else, and
       the summary rendered as "-Where every line came from". */
    .q-sources > summary::before { content: "+\00a0"; }
    .q-sources[open] > summary::before { content: "\2212\00a0"; }
    .q-src { margin: 12px 0 0; padding-left: 12px;
      border-left: 2px solid var(--line-strong); }
    .q-src .ref { display: block; color: var(--muted); font-size: 12px;
      font-weight: 700; overflow-wrap: anywhere; }
    .q-src .quote { display: block; margin-top: 4px; max-width: 78ch;
      color: var(--text); font-weight: 600; overflow-wrap: anywhere; }

    .q-acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .q-outcome { margin: 12px 0 0; padding: 12px; border-radius: 12px;
      background: var(--good-soft); color: var(--good); font-size: 13px;
      font-weight: 650; max-width: 78ch; }

    /* The chosen channel goes SOLID because at that moment it stops being a
       thing you can press and becomes the thing the record will say. Same law
       as everywhere else here: outlined is a verb, filled is a state. */
    .q-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
    .act.on { background: var(--accent-soft); color: var(--accent-text);
      border-color: var(--accent); }
    /* A FIELD IS AS WIDE AS WHAT GOES IN IT. The queue's prompt spans the whole
       item, so an unconstrained input ran 1400px for an optional one-line note
       and made the accent button beside it read as the smaller thing on the
       row. Everything here is capped at the same measure the drafts are read
       at. (The day row's receipt field is deliberately not touched: it holds a
       URL, and that one was measured and set where it is.) */
    .prompt textarea { width: 100%; max-width: 62ch; min-height: 72px;
      padding: 12px; border-radius: 8px; border: 1px solid var(--line-strong);
      background: var(--surface); color: var(--text); font-family: inherit;
      font-size: 13px; font-weight: 600; resize: vertical; }
    .prompt textarea:focus { outline: none; border-color: var(--accent); }
    .prompt-row input.q-note { flex: 0 1 62ch; }
    .q-fix { display: grid; gap: 8px; margin: 12px 0; max-width: 62ch; }
    .prompt .k { display: block; margin: 0 0 8px; color: var(--muted);
      font-size: 12px; font-weight: 700; }
    .q-fix input { width: 100%; }
    .prompt .ok { margin: 12px 0 0; color: var(--good); font-size: 13px;
      font-weight: 650; }

    @media (max-width: 720px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    /* ── THE PHONE ────────────────────────────────────────────────────────────
       He reads this between job sites, so 390x844 is not a courtesy width.
       Measured there, three things were broken and one was invisible:

       THE DAY ROW IS A DESKTOP TABLE. A 152px client column, a flexible middle,
       then chips, controls and a state pinned to a 104px right column. At 390
       the middle collapses to about 90px, so "Google Business Profile" sets one
       word per line and the row grows to 334px tall; the client name lands
       underneath the blocks chip; and the state pill is pushed 20px past the
       right edge of the screen, which is what was making the whole page scroll
       sideways. It stops being a table here: the part you read takes the first
       line, and the chip, the controls and the state share the second.

       CONTROLS UNDER THE TOUCH FLOOR. Every button on the board measured 28px
       tall — fine under a mouse, a coin toss under a thumb. 8px of vertical
       padding takes them to 36px without touching the desktop layout, where the
       gaps and the type are already right.

       A BUCKET HEAD IS NOT TWO COLUMNS. "Needs you" beside its explanation left
       the heading wrapping to two lines against a sentence that had room. */
    @media (max-width: 720px) {
      /* 16px between the controls is a desktop gap. At 390 there are 286px on
         the second line and "Waiting · Done · Needs work" needs 282 of them —
         the 16 was the difference between one control line and two. The row
         gap stays wide: that one IS separating groups. */
      .day-row { flex-wrap: wrap; gap: 12px 8px; }
      .day-row .link { flex: 1 0 100%; flex-wrap: wrap; row-gap: 4px; }
      .day-row .who { flex: 1 0 100%; width: auto; }
      .day-row .what { flex: 1 0 100%; }
      .day-row .st { min-width: 0; margin-left: auto; text-align: right; }

      /* 36px was the old answer here and it is under the floor: a thumb in a
         truck needs 44. The horizontal padding does NOT grow with it — there
         are 286px on the second line of a row and "Waiting · Done · Needs work"
         needs 282 of them, so a wider button is a second control line. */
      .act { padding: 12px; min-height: 44px; }

      /* THE FIELD CARRYING THE WHOLE RECEIPT RULE WAS THE SMALLEST THING IN ITS
         ROW. At 390 the input measured 72px beside two buttons that were wider
         than it, while its own placeholder needs 164px and a real Yelp URL
         needs 287. On its own line it gets the width the rule deserves. */
      .prompt-row { flex-wrap: wrap; }
      .prompt input { flex: 1 0 100%; padding: 12px; }

      .bucket-head { display: block; }
      .bucket-head h2 { margin: 0 0 4px; }

      /* A part name long enough to wrap must wrap inside the pill rather than
         push it off the card — "Open Association memberships" is wider than a
         390px screen has room for. */
      .next-up-go { max-width: 100%; justify-content: center; text-align: center; }

      /* THE QUEUE ON A PHONE. The item is already one column, so what breaks is
         everything that was laid out as a LINE, and the fix is never "let it
         wrap" on its own — measured at 390, free wrapping put the icon alone on
         one row, the name on the next and the pill on a third, and turned a
         three-part heading into three separate headings 12px apart.

         The name keeps the icon's line and the pill takes the next one: at 342
         usable, the icon and its 12px gap leave 290, and "Google Business
         Profile" needs 214 of them while the pill needs 150 — one of the two
         has to move, and it is not the thing you read first.

         The heading's three parts close to 4px so they read as one heading, and
         the two verbs split the width so neither is the small one. A thumb
         should not have to pick the smaller of two buttons when one of them
         releases a message to a client. */
      .q-item-top { align-items: flex-start; gap: 8px 12px; }
      .q-about { flex: 1 1 180px; }
      .q-acts .act { flex: 1 1 0; justify-content: center; text-align: center; }
      .q-chips .act { flex: 1 0 auto; }
      .q-person-head { gap: 4px 12px; }
      .q-person-head h3 { flex: 1 0 100%; }
    }
</style>

<script>
  // \u2500\u2500 WHO THE CLIENTS ARE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  // The sidebar markup is the only copy. This was a META literal that also
  // carried a hardcoded meeting line for every client: a typed weekday that was
  // wrong (7 Aug 2026 is a Friday, not a Thursday) on a date somebody sets an
  // alarm against, and a line that could only ever expire - it would have gone
  // on presenting a meeting that had already happened, every morning after.
  //
  // The meeting now comes from the API and from nowhere else. Keeping any copy
  // of it here "as a fallback" would reinstate exactly that bug the first time
  // the API answered null - which is the answer it gives the moment a meeting
  // starts. The same literal was also being written out twice to build NAMES;
  // one source on the markup means a client cannot be renamed in one place and
  // not the other.
  const CLIENTS = Object.fromEntries(
    Array.from(document.querySelectorAll('.client[data-client]')).map((a) => [
      a.dataset.client,
      { name: a.querySelector('.client-name').textContent.trim(),
        trade: a.dataset.trade || '' },
    ]));
  const NAMES = Object.fromEntries(Object.entries(CLIENTS).map(([k, v]) => [k, v.name]));
  const ICONS  = {"google": "<svg viewBox=\"0 0 24 24\"><path fill=\"#4285F4\" d=\"M21.6 12.23c0-.71-.06-1.4-.18-2.05H12v3.87h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.35Z\"/><path fill=\"#34A853\" d=\"M12 22c2.7 0 4.97-.9 6.62-2.42l-3.24-2.51c-.9.6-2.05.96-3.38.96-2.6 0-4.81-1.76-5.6-4.13H3.06v2.59A10 10 0 0 0 12 22Z\"/><path fill=\"#262823\" d=\"M6.4 13.9A6 6 0 0 1 6.08 12c0-.66.11-1.3.32-1.9V7.51H3.06A10 10 0 0 0 2 12c0 1.61.38 3.14 1.06 4.49L6.4 13.9Z\"/><path fill=\"#EA4335\" d=\"M12 5.97c1.47 0 2.78.5 3.81 1.49l2.86-2.86A9.58 9.58 0 0 0 12 2a10 10 0 0 0-8.94 5.51L6.4 10.1C7.19 7.73 9.4 5.97 12 5.97Z\"/></svg>", "reviews": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"m12 2.6 2.75 5.58 6.16.9-4.46 4.34 1.05 6.14L12 16.66l-5.5 2.9 1.05-6.14-4.46-4.34 6.16-.9L12 2.6Z\"/></svg>", "website": "<svg viewBox=\"0 0 24 24\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#262823\"/><path fill=\"#fff\" d=\"M2 8h20v2H2z\"/><circle cx=\"5.2\" cy=\"6\" r=\"1\" fill=\"#fff\"/><circle cx=\"8.2\" cy=\"6\" r=\"1\" fill=\"#fff\"/><rect x=\"5\" y=\"12\" width=\"14\" height=\"6\" rx=\"1.5\" fill=\"#fff\" opacity=\".9\"/></svg>", "yelp": "<svg viewBox=\"0 0 24 24\"><path fill=\"#D32323\" d=\"M10.6 10.2 8.9 3.15A1.45 1.45 0 0 1 10.1 1.4l2.15-.34a1.45 1.45 0 0 1 1.66 1.58l-.75 7.42c-.12 1.16-2.28 1.28-2.56.14ZM14.35 10.95l4.72-2.8a1.45 1.45 0 0 1 2.1.74l.7 1.86a1.45 1.45 0 0 1-1.24 1.95l-5.72.24c-1.12.05-1.53-1.42-.56-2ZM14.26 14.42l4.56 2.94a1.45 1.45 0 0 1 .27 2.2l-1.4 1.44a1.45 1.45 0 0 1-2.3-.3l-2.56-4.9c-.5-.96.52-1.97 1.43-1.38ZM10.76 15.1l-1.5 5.44a1.45 1.45 0 0 1-1.93.96l-1.87-.75a1.45 1.45 0 0 1-.7-2.22l3.42-4.38c.67-.86 2.88-.1 2.58.95ZM8.4 11.6l-5.36-1.56a1.45 1.45 0 0 1-.93-1.98l.82-1.84a1.45 1.45 0 0 1 2.24-.64l4.25 3.57c.84.71.03 2.75-1.02 2.45Z\"/></svg>", "linkedin": "<svg viewBox=\"0 0 24 24\"><path fill=\"#fff\" d=\"M6.15 8.55H2.9V19h3.25V8.55ZM4.53 3.35a1.89 1.89 0 1 0 0 3.78 1.89 1.89 0 0 0 0-3.78ZM18.47 8.3c-1.75 0-2.93.96-3.41 1.88h-.05V8.55H11.9V19h3.24v-5.17c0-1.36.26-2.68 1.95-2.68 1.66 0 1.68 1.55 1.68 2.77V19H22v-5.72c0-2.81-.61-4.98-3.53-4.98Z\"/></svg>", "ai": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9.6L5 21.2V17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z\"/><path fill=\"#fff\" d=\"M6 7.5h12v1.8H6zM6 11h9v1.8H6z\"/></svg>", "photo": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"M4 6h3.4l1.45-2h6.3l1.45 2H20a2 2 0 0 1 2 2v10.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z\"/><circle cx=\"12\" cy=\"13\" r=\"4.2\" fill=\"#fff\"/><circle cx=\"12\" cy=\"13\" r=\"2.45\" fill=\"#262823\"/><circle cx=\"18.5\" cy=\"8.8\" r=\"1\" fill=\"#fff\"/></svg>", "video": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#262823\"/><path fill=\"#fff\" d=\"M9.3 7.8c0-.73.8-1.18 1.43-.8l7.05 4.2c.61.36.61 1.25 0 1.62l-7.05 4.18a.94.94 0 0 1-1.43-.8V7.8Z\"/></svg>", "case-study": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"M5 2h9l5 5v15H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z\"/><path fill=\"#fff\" opacity=\".9\" d=\"M14 2v5h5ZM7 11h8v2H7zM7 15h8v2H7zM7 19h5v2H7z\"/></svg>", "folder": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"M2 5.5A2.5 2.5 0 0 1 4.5 3H10l2.2 2.5h7.3A2.5 2.5 0 0 1 22 8v9.5a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 17.5v-12Z\"/><path fill=\"#8d8f87\" d=\"M2 9h20l-2.25 9H4.25L2 9Z\"/></svg>", "jobber": "<svg viewBox=\"0 0 24 24\"><path fill=\"#12A150\" d=\"M8 3h9v12.1C17 19.5 14.55 22 10.45 22 7 22 4.75 20.1 4.3 16.8l4.2-.65c.2 1.35.78 2.05 1.8 2.05 1.28 0 1.9-.9 1.9-2.75V7H8V3Z\"/></svg>", "recurring": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"M12 3a9 9 0 0 1 7.15 3.53L21 4.7V11h-6.3l1.92-1.92A5.9 5.9 0 0 0 6.3 11H3.06A9 9 0 0 1 12 3Zm8.94 10A9 9 0 0 1 4.85 17.47L3 19.3V13h6.3l-1.92 1.92A5.9 5.9 0 0 0 17.7 13h3.24Z\"/></svg>", "follow-up": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#262823\"/><path fill=\"#fff\" d=\"M11 6h2v5.2l4 2.3-1 1.73-5-2.9V6Z\"/><circle cx=\"12\" cy=\"12\" r=\"1.45\" fill=\"#fff\"/></svg>", "insurance": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"m12 1.5 9 3.85v6.1c0 5.7-3.52 9.3-9 11.05-5.48-1.75-9-5.35-9-11.05v-6.1L12 1.5Z\"/><path fill=\"#fff\" d=\"m7.5 11.8 2.72 2.72 6.35-7.02 1.78 1.6-8.04 8.9-4.5-4.5 1.69-1.7Z\"/></svg>", "target": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#262823\"/><circle cx=\"12\" cy=\"12\" r=\"6.2\" fill=\"#fff\"/><circle cx=\"12\" cy=\"12\" r=\"3.1\" fill=\"#262823\"/><circle cx=\"12\" cy=\"12\" r=\"1.15\" fill=\"#fff\"/></svg>", "memberships": "<svg viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"7.5\" r=\"4\" fill=\"#262823\"/><circle cx=\"17.2\" cy=\"8.2\" r=\"3.2\" fill=\"#8d8f87\"/><path fill=\"#262823\" d=\"M1.5 21c.2-5.25 2.35-8 6.5-8s6.3 2.75 6.5 8h-13Z\"/><path fill=\"#8d8f87\" d=\"M13.2 21c.15-4.35 1.65-6.7 4.8-6.7 2.9 0 4.38 2.35 4.5 6.7h-9.3Z\"/></svg>", "outreach": "<svg viewBox=\"0 0 24 24\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#262823\"/><path fill=\"#fff\" d=\"m3.15 6.3 8.85 7 8.85-7 1.25 1.6L12 15.9 1.9 7.9l1.25-1.6Z\" opacity=\".95\"/></svg>", "report": "<svg viewBox=\"0 0 24 24\"><rect x=\"2\" y=\"13\" width=\"5\" height=\"9\" rx=\"1.5\" fill=\"#a3a59d\"/><rect x=\"9.5\" y=\"7\" width=\"5\" height=\"15\" rx=\"1.5\" fill=\"#8d8f87\"/><rect x=\"17\" y=\"2\" width=\"5\" height=\"20\" rx=\"1.5\" fill=\"#262823\"/></svg>"};
  const LABEL  = {"completed": "Completed", "needs": "Needs work", "blocked": "Blocked", "cannot": "Cannot see"};

  let current = 'wolfpack';
  let lastLoad = {};          // client -> the parts array we last rendered

  // ── ORDER BY WHAT UNBLOCKS THE MOST ───────────────────────────────────────
  // The board's only honest ranking. Every other candidate would be invented:
  // there is no age, no effort estimate, no score, and 36 of 38 parts have
  // never been machine-checked, so there is no history to rank on either.
  // What DOES exist is the dependency chain the part page already names —
  // "while this is open, 3 other parts cannot be fixed" — and until now no
  // other screen could see it.
  //
  // blocks_open_count, not blocks_count: the sort has to answer "what does
  // doing this actually free up", and a dependency that is already finished
  // frees up nothing. Ties keep the record's own order — Array#sort is stable
  // by specification, so equal rows do not shuffle between renders, which on a
  // list you read every morning matters more than it sounds.
  const unblocks = p => p.blocks_open_count || 0;
  const byUnblocks = list => list.slice().sort((a, b) => unblocks(b) - unblocks(a));

  // Shown only when it is greater than zero. A "blocks 0" chip on 37 of 38 rows
  // would be noise wearing the costume of information.
  function blocksChip(p) {
    const n = unblocks(p);
    if (!n) return '';
    return '<span class="blocks" title="' + n + ' unfinished part' + (n === 1 ? '' : 's') +
      ' cannot be fixed until this one is">blocks ' + n + '</span>';
  }

  const shortDate = (t) => t
    ? new Date(t).toLocaleDateString('en-US', { day: 'numeric', month: 'short' }) : '';

  // The name the API refused to accept a wait without, finally on a screen.
  // Only where there is one — a "waiting on nobody" chip would be the noise
  // wearing information's costume that "blocks 0" would have been.
  function waitingChip(p) {
    if (!p.waiting_on) return '';
    const since = p.waiting_since ? ' since ' + shortDate(p.waiting_since) : '';
    return '<span class="waiting-on" title="Recorded on the board' + esc(since) +
      '">Waiting on ' + esc(p.waiting_on) + '</span>';
  }

  // The same fact, in the shape each surface has room for. The day row is a
  // horizontal line and takes the pill without growing — measured, 77px, the
  // same height as every other row. A 288px card header does NOT: the pill and
  // the state wrapped to two lines there and pushed the title 28px below its
  // neighbour's, so on a card the wait is a line of type in the body, where it
  // can wrap without dragging anything with it.
  function waitingLine(p) {
    if (!p.waiting_on) return '';
    return '<p class="waiting-line">Waiting on ' + esc(p.waiting_on) +
      (p.waiting_since ? ' since ' + esc(shortDate(p.waiting_since)) : '') + '</p>';
  }

  // ── WHICH CONTROLS A ROW EARNS ────────────────────────────────────────────
  // ONE definition, used by the day AND by every card on a client page. Two
  // implementations of "what can I do to this part" drift, and the one that
  // drifts is always the one nobody is looking at.
  //
  // It takes the part and nothing else. It used to take the day's bucket as a
  // second argument, which is how `.map(actsFor)` would have handed it an array
  // INDEX — the same trap this file already walked into once. There is no
  // second argument to get wrong now, and the row's own fields answer the
  // question anyway:
  //
  //   completed        nothing. It is done, and the honest way one comes back
  //                    is a check disagreeing with the record, not a button.
  //   waiting on a NAME   "Not waiting" (the chase ended) and "Done".
  //   everything else  "Waiting" (name who) and "Done".
  //
  // "Not waiting" used to be offered on the whole waiting bucket, and it did
  // nothing on all of it: mark_waiting {clear:true} answers 200 {already:true}
  // and changes no row when waiting_on is null, and not one part in the record
  // has a waiting_on today — every row in that bucket is there because of
  // ACCESS. Six visible buttons, six no-ops. Where there is no name, the useful
  // action is putting one there: that is what turns "we never asked" into "we
  // asked Ross on 5 Aug", and that is the whole of the chase.
  const actsFor = (p) => {
    if (p.state === 'completed') return '';
    const b = (act, label) =>
      '<button type="button" class="act" data-act="' + act +
      '" data-client="' + esc(p.client || p.project_slug || current) +
      '" data-part="' + esc(p.part_key) +
      '" data-name="' + esc(p.name) + '">' + label + '</button>';
    return '<span class="row-acts">' +
      (p.waiting_on ? b('unwait', 'Not waiting') : b('waiting', 'Waiting')) +
      b('done', 'Done') + '</span>';
  };

  const $ = s => document.querySelector(s);
  const groupsEl = $('#groups'), hello = $('#hello'), trade = $('#trade'),
        meeting = $('#meeting-text'), countsEl = $('#counts'),
        btn = $('#recheck'), note = $('#recheck-note'),
        summary = $('#summary'),
        // The eyebrow was written once into the static markup as "Client home"
        // and never touched again, so the cross-client day — the screen whose
        // whole point is that it is NOT one client — carried a CLIENT HOME
        // label directly above "Your day." Both views set it now, for the same
        // reason `hello` is set in both: whatever the boot markup happens to
        // say is the wrong answer for one of them.
        eyebrow = $('.eyebrow');

  // ── THE SESSION LIVES IN localStorage, NOT IN A COOKIE ────────────────────
  // src/dashboard/lib/supabase.js calls createClient() with no storage option,
  // so supabase-js uses its default: localStorage under sb-<ref>-auth-token.
  // There is no cookie to ride on. Reading the token here and sending it as a
  // Bearer header is the ONLY way this page can see the session the dashboard
  // already established — verifyTenant accepts either, and only one exists.
  const SB_REF = 'mcngatprgluexjjcqpkp';
  function sessionToken() {
    try {
      let raw = localStorage.getItem('sb-' + SB_REF + '-auth-token');
      if (!raw) {
        // older/newer key shapes, and any other project ref on this origin
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (/^sb-.*-auth-token$/.test(k)) { raw = localStorage.getItem(k); break; }
        }
      }
      if (!raw) return null;
      if (raw.startsWith('base64-')) raw = atob(raw.slice(7));
      const v = JSON.parse(raw);
      if (typeof v === 'string') return v;
      if (Array.isArray(v)) return v[0] || null;
      return v.access_token || v?.currentSession?.access_token || null;
    } catch (e) { return null; }
  }

  // Every call to a gated endpoint goes through this.
  function authed(extra) {
    const t = sessionToken();
    const h = Object.assign({}, extra || {});
    if (t) h.Authorization = 'Bearer ' + t;
    return h;
  }

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  // The database carries six connection values; the card shows three states.
  // Keeping the DB's word in the pill means "wrong level" and "expired" stay
  // visible instead of both flattening into a generic "not connected" —
  // the Jobber invite that was field-crew-level is a different problem from
  // never having asked, and the board is useless if it cannot tell them apart.
  const CONN = {
    connected:      ['yes', 'Connected'],
    not_applicable: ['na',  'Not applicable'],
    wrong_level:    ['no',  'Wrong level'],
    pending:        ['no',  'Invite pending'],
    expired:        ['no',  'Access expired'],
    never_asked:    ['no',  'Never asked'],
  };

  function card(p) {
    const [cls, connLabel] = CONN[p.connection] || ['no', 'Not connected'];
    const dim = p.state === 'cannot' ? ' dim' : '';
    const icon = ICONS[p.icon] || '';
    // access_detail is meant to carry the ACCESS LEVEL — "Manager", "Editor",
    // "Read only", "Via Google" — which is the fact the connection state cannot
    // tell you and the one that decides what you can actually do. Often it just
    // restates the state instead ("Not connected", "Not applicable"), and then
    // printing both gives you "Not applicable  Not applicable".
    //
    // So: show it only when it adds a level, and only when it fits. The one
    // long value in the data, "Field crew level, no reporting", is already
    // spelled out in the card's status line — truncating it to "Field crew le…"
    // in the pill costs a readable row and returns nothing.
    const detail = (p.access_detail || '').trim();
    const norm = t => t.toLowerCase().replace(/[^a-z]/g, '');
    const RESTATES = ['connected', 'notconnected', 'notapplicable'];
    const adds = detail &&
                 !RESTATES.includes(norm(detail)) &&
                 norm(detail) !== norm(connLabel) &&
                 detail.length <= 12;

    // NOT_APPLICABLE IS NOT AN ANSWER. Every other connection value reports
    // something you can act on — connected, never asked, wrong level, expired.
    // "Not applicable" reports that the question does not apply: there is no
    // login for a photo shoot and there never will be. Printing it gave ten of
    // nineteen cards a line to say nothing, and made the nine that DO carry an
    // access state harder to pick out of the page.
    const access = (p.connection === 'not_applicable'
        ? '' : '<span class="conn ' + cls + '">' + esc(connLabel) + '</span>') +
      (adds ? '<span class="access-pill" title="' + esc(detail) + '">' + esc(detail) + '</span>' : '');

    // WHAT IT COSTS, in the client's money terms. Falls back to the finding
    // rather than rendering an empty rule down the side of nothing — a card
    // with no sentence at all is the failure this line exists to prevent.
    const cost = p.why_it_matters || '';

    // The same controls the day has, on the card, from the same function. The
    // cards used to end in a sentence — "ask ten recent commercial customers
    // for a review this week" — with no way to say you had. Every card was a
    // dead end, and the only surface that could close anything out was a list
    // that does not show you one client at a time.
    const acts = actsFor(p);

    return '<div class="part-card' + dim + '" data-part="' + esc(p.name) +
      '" data-key="' + esc(p.part_key) + '" data-state="' + esc(p.state) + '">' +
      '<a class="card-link" href="/client-engine/part.html?client=' + encodeURIComponent(current) +
      '&part=' + encodeURIComponent(p.part_key) + '">' +
      '<div class="card-top"><span class="glyph ' + esc(p.icon) + '" aria-hidden="true">' + icon + '</span>' +
      '<span class="card-flags">' + blocksChip(p) +
      '<span class="health ' + esc(p.state) + '">' + esc(LABEL[p.state] || p.state) + '</span></span></div>' +
      '<h3>' + esc(p.name) + '</h3>' +
      '<p class="status-line">' + esc(p.status_line) + '</p>' +
      waitingLine(p) +
      (cost ? '<p class="cost">' + esc(cost) + '</p>' : '') +
      '<p class="suggest"><span class="k">Do next</span>' + esc(p.suggestion) + '</p></a>' +
      '<div class="access-row' + (access || acts ? '' : ' bare') + '">' + access + acts +
      '<span class="arrow" aria-hidden="true">&rarr;</span></div></div>';
  }

  function groupsHtml(parts) {
    if (!parts.length) {
      // It used to say "Add the parts we look after and they will show here" on
      // a screen with no way to add one. Naming the correct absence instead was
      // half the fix and it stopped there: "parts are created when the client is
      // onboarded" is true, and it is still a closed door with a sign on it.
      //
      // There is no create action on /api/client-parts, and inventing a form
      // that posts to one would be a button that 404s. What DOES exist is the
      // room sitting against the right-hand edge of this very page — the place
      // this board has always said the work is asked for and where it lands. So
      // the door is that one, and the button is honest about what it does: it
      // writes the ask and leaves the cursor in it. It does not send it, and it
      // does not promise the parts will appear on their own.
      return '<div class="board-message"><b>No parts have been set up for ' +
        esc((CLIENTS[current] || {}).name || current) + ' yet.</b>' +
        '<p>So there is nothing here to be right or wrong about, and this board will not ' +
        'invent a list to fill the space. It reads parts; it does not create them. The room ' +
        'beside it is where they get asked for.</p>' +
        '<button type="button" class="act go" data-act="ask-parts">' +
        'Ask for them in the room</button></div>';
    }
    const order = [];
    const byGroup = {};
    for (const p of parts) {
      if (!byGroup[p.group_name]) { byGroup[p.group_name] = []; order.push(p.group_name); }
      byGroup[p.group_name].push(p);
    }
    // Same ranking inside a group as the day view uses inside a bucket: the
    // card that frees the most others sits first. Everything else keeps the
    // record's order, so this reorders exactly what it has a reason to.
    return order.map(g =>
      '<section class="group"><div class="group-head"><h2>' + esc(g) + '</h2>' +
      '<span class="group-count">' + byGroup[g].length + ' parts</span></div>' +
      '<div class="card-grid">' + byUnblocks(byGroup[g]).map(card).join('') + '</div></section>'
    ).join('');
  }

  // ── A LONE CARD ON THE LAST ROW ───────────────────────────────────────────
  // Measured rather than guessed, and now measured off the CARDS rather than
  // off the column count.
  //
  // The old version counted the tracks and did `cards.length % cols === 1`,
  // which is only the same question while the grid contains nothing but cards.
  // It does not: an open prompt is a full-width grid item, so opening one on
  // the first card of "Found by buyers" pushed everything down by a row and a
  // half. Measured live on 2026-08-05 at 1440, seven cards in two columns went
  // from [2,2,2,1] to [1,2,2,1,1] — the arithmetic still said "one on the last
  // row, already handled" while the page had grown TWO holes, one beside the
  // card that had just been clicked.
  //
  // Reading the rendered tops cannot drift from what is on screen, because it
  // IS what is on screen. getBoundingClientRect flushes layout, so these are
  // the positions after the class above came off, not the ones before it.
  function balanceGrids() {
    document.querySelectorAll('.card-grid').forEach((grid) => {
      const cards = [...grid.querySelectorAll('.part-card')];
      cards.forEach((c) => c.classList.remove('wide'));
      if (cards.length < 2) return;
      const tops = cards.map((c) => Math.round(c.getBoundingClientRect().top));
      const last = tops[tops.length - 1];
      if (tops[0] === last) return;   // one row: nothing is alone on it
      if (tops.filter((t) => t === last).length === 1) {
        cards[cards.length - 1].classList.add('wide');
      }
    });
  }

  // The column count changes with the window, and a card stretched for two
  // columns is wrong at three. Cheap enough to run on every resize settle.
  let balanceTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(balanceTimer);
    balanceTimer = setTimeout(balanceGrids, 120);
  });

  // An honest state for every way this can fail to show real data. A board
  // that renders empty when it is actually signed out teaches you to distrust
  // it, which is worse than showing nothing.
  const meetingBar = $('#meeting-bar'), recheckBar = $('#recheck-bar'),
        nextUpEl = $('#next-up');

  // Hide the client data and the actions, not just the cards. A page that says
  // "you are signed out" while still displaying a named client's next meeting
  // is contradicting itself, and offering a refresh button that cannot refresh
  // anything is a control that does nothing.
  function chrome(on) {
    // The meeting bar is NOT turned back on here — renderMeeting owns it, and
    // only the API can say there is one to show. Turning it on with the rest of
    // the chrome would put an empty coloured bar under the greeting on every
    // client with nothing booked.
    if (!on) { meetingBar.style.display = 'none'; nextUpEl.style.display = 'none'; }
    recheckBar.style.display = on ? '' : 'none';
  }

  // ── THE MEETING, ONLY WHILE IT IS STILL TRUE ──────────────────────────────
  // Whether there IS one is the API's call, not this screen's: it serves the
  // meeting while the start time is ahead of us and null the moment it is not.
  // null covers both "never set" and "been and gone", and this renders nothing
  // for it. There is no honest third thing to say — a "nothing booked" chip is
  // a nag, and a stale badge is the bug this replaced.
  //
  // The expiry is deliberately NOT computed here. If it were, the next surface
  // to render a meeting would have to remember to, and one of them would not.
  // ── WHERE TO START ────────────────────────────────────────────────────────
  // One item, chosen by the only ranking on this board that is not an opinion:
  // how many unfinished parts are waiting on this one. Same key the day sorts
  // its buckets by, same reason — there is no age, no effort estimate and no
  // score in the record, so every other candidate would have to be invented.
  //
  // Two rules on top of that ordering, both borrowed rather than invented:
  //
  //   COMPLETED PARTS ARE NOT ACTIONS. Nothing to start on something finished.
  //
