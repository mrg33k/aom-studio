<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client parts</title>
<style>
    :root {
      color-scheme: light dark;
      --bg: #ede7dc;
      --sidebar: #ede7dc;
      --panel: #fefcf9;
      --surface: #ffffff;
      --surface-strong: #ffffff;
      --text: #262823;
      --muted: #6d7068;
      --line: #ddd8ce;
      --line-strong: #c9c3b7;
      --accent: #176c61;
      --accent-soft: #dbece7;
      --accent-text: #0d5249;
      --good: #26715b;
      --good-soft: #e2f1eb;
      --warn: #9b651b;
      --warn-soft: #faecd3;
      --bad: #a6473f;
      --bad-soft: #f8e3df;
      --quiet: #747870;
      --quiet-soft: #ecece7;
      --shadow: 0 12px 28px rgba(75, 58, 32, .08), 0 2px 8px rgba(75, 58, 32, .04);
      --shadow-hover: 0 18px 38px rgba(75, 58, 32, .14), 0 5px 14px rgba(75, 58, 32, .07);
      --panel-shadow: 0 28px 72px rgba(75, 58, 32, .13), 0 6px 20px rgba(75, 58, 32, .06);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    button, input { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      align-items: start;
      min-height: 100vh;
      align-items: stretch;
    }

    .sidebar {
      position: relative;
      z-index: 1;
      align-self: stretch;
      padding: 32px 24px;
      background: var(--sidebar);
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 4px 24px;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 16px rgba(23, 108, 97, .24);
    }

    .brand-mark svg { width: 20px; height: 20px; }

    .brand-title { font-size: 16px; font-weight: 750; letter-spacing: -.01em; }
    .brand-subtitle { color: var(--muted); font-size: 12px; }

    .search-wrap { position: relative; margin-bottom: 24px; }

    .search-wrap svg {
      position: absolute;
      bottom: 12px;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      height: 40px;
      padding: 0 12px 0 32px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      transition: border-color .2s, box-shadow .2s;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .side-label {
      margin: 0 8px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .client-list { display: grid; gap: 4px; }

    .client {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: background .2s, color .2s, border-color .2s;
    }

    .client:hover { background: color-mix(in srgb, var(--surface) 62%, transparent); color: var(--text); }

    .client.selected {
      border-color: var(--line);
      background: var(--surface-strong);
      color: var(--text);
      box-shadow: 0 4px 16px rgba(56, 45, 26, .05);
    }

    .avatar {
      display: grid;
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-size: 12px;
      font-weight: 800;
    }

    .avatar.wolfpack { background: #176c61; }
    .avatar.ambition { background: #a5613c; }
    .avatar.kohrs { background: #6264a7; }
    .client-name { font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
    .empty-clients { display: none; padding: 12px; color: var(--muted); font-size: 13px; }

    main {
      min-width: 0;
      min-height: calc(100vh - 48px);
      margin: 24px 24px 24px 0;
      padding: 56px clamp(32px, 4vw, 56px) 72px;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--panel-shadow);
    }

    .main-inner { max-width: 1320px; margin: 0 auto; }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 56px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: -.035em;
    }

    .hero-copy { margin: 12px 0 0; color: var(--muted); font-size: 16px; }

    .summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .summary span {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .summary strong { color: var(--text); }

    .group { margin-top: 56px; scroll-margin-top: 24px; }

    .group-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h2 { margin: 0; font-size: 20px; line-height: 1.25; letter-spacing: -.025em; }
    .group-count { color: var(--muted); font-size: 13px; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
    }

    .part-card {
      position: relative;
      display: flex;
      min-height: 236px;
      flex-direction: column;
      padding: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .part-card:hover {
      z-index: 1;
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .part-card:focus-visible, .client:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 2px;
    }

    .part-card.unseen {
      border: 1px dashed var(--line-strong);
      background: color-mix(in srgb, var(--surface) 76%, var(--bg));
      box-shadow: none;
      opacity: .62;
    }

    .part-card.unseen:hover { opacity: .92; }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .glyph {
      display: grid;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 0;
      border-radius: 13px;
    }

    .glyph svg { width: 24px; height: 24px; }
    /* ── ONE RULE FOR THE ICON COLUMN ────────────────────────────────────────
       If the platform owns the mark, we show the mark in its own colours on its
       own ground — Google, Yelp, LinkedIn, Jobber. Recognising the platform in
       one glance is the entire job of those four.

       If WE drew it, it is our ink on our ground. It was not: the set invented
       indigo, hot pink, orange, cyan, lime, coral and two purples on a page
       whose palette contains none of them, and the loudest of them was a
       two-point sparkle in ChatGPT purple on the "AI answers" tile. Sparkle
       icons are banned outright and there is no purple here. A drawn glyph's
       hue was carrying no information at all, so it now carries none loudly:
       one ink, one warm tile, and the four brand marks become the only colour
       in the column — which is correct, because they are the wayfinding. */
    .glyph.google { background: #e8f0fe; }
    .glyph.reviews { background: var(--surface-soft); }
    .glyph.website { background: var(--surface-soft); }
    .glyph.yelp { background: #fde8e8; }
    .glyph.linkedin { background: #0a66c2; }
    .glyph.ai { background: var(--surface-soft); }
    .glyph.photo { background: var(--surface-soft); }
    .glyph.video { background: var(--surface-soft); }
    .glyph.case-study { background: var(--surface-soft); }
    .glyph.folder { background: var(--surface-soft); }
    .glyph.jobber { background: #def5e7; }
    .glyph.recurring { background: var(--surface-soft); }
    .glyph.follow-up { background: var(--surface-soft); }
    .glyph.insurance { background: var(--surface-soft); }
    .glyph.target { background: var(--surface-soft); }
    .glyph.memberships { background: var(--surface-soft); }
    .glyph.outreach { background: var(--surface-soft); }
    .glyph.report { background: var(--surface-soft); }

    .health {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px;
      border-radius: 999px;
      background: var(--warn-soft);
      color: var(--warn);
      font-size: 12px;
      font-weight: 750;
    }

    .health::before { width: 7px; height: 7px; border-radius: 50%; background: currentColor; content: ""; }
    .health.blocked { background: var(--bad-soft); color: var(--bad); }
    /* The class the renderer actually emits is the state key — `cannot`, not
       `unseen-health`. The old selector matched nothing, so every "Cannot see"
       part fell through to the amber .health base and wore the exact colour of
       "Needs work". That collision erases the one distinction the board exists
       to make: "we were never given the login" is not "this is bad". */
    .health.cannot { background: var(--quiet-soft); color: var(--quiet); }

    .part-card h3 { margin: 0 0 8px; font-size: 16px; line-height: 1.3; letter-spacing: -.01em; }

    .status-line {
      display: -webkit-box;
      margin: 0 0 24px;
      overflow: hidden;
      color: var(--muted);
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .access-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .access-label { color: var(--muted); font-size: 12px; }

    .access-pill {
      white-space: nowrap;
      display: inline-flex;
      max-width: 75%;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--quiet-soft);
      color: var(--quiet);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.2;
      text-align: right;
    }

    .access-pill.connected { background: var(--good-soft); color: var(--good); }
    .access-pill.pending, .access-pill.expired, .access-pill.wrong { background: var(--warn-soft); color: var(--warn); }
    .access-pill.never { background: var(--quiet-soft); color: var(--quiet); }

    .arrow {
      margin-left: 4px;
      color: var(--accent);
      font-size: 16px;
      transition: transform .2s;
    }

    .part-card:hover .arrow { transform: translateX(3px); }

    @media (max-width: 1180px) {
      .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .app { display: block; }

      .sidebar {
        position: relative;
        z-index: 2;
        width: 100%;
        height: auto;
        padding: 16px;
        border-right: 0;
        border-bottom: 0;
      }

      .sidebar-head { margin: 0 0 16px; }
      .search-wrap { margin-bottom: 12px; }
      .side-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

      .client-list {
        display: flex;
        padding-bottom: 4px;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .client { flex: 0 0 auto; padding: 8px 12px; }
      .avatar { width: 24px; height: 24px; }
      main {
        min-height: 0;
        margin: 0 12px 12px;
        padding: 40px 24px 56px;
        border-radius: 24px;
      }
      .hero { display: block; margin-bottom: 32px; }
      .summary { justify-content: flex-start; margin-top: 24px; }
      .group { margin-top: 40px; }
    }

    @media (max-width: 560px) {
      .card-grid { grid-template-columns: 1fr; }
      .part-card { min-height: 196px; }
      .group-heading { align-items: center; }
      .hero-copy { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

      
    /* ---- v2 additions ---- */
    /* The counts line sat directly on top of the meeting bar — the header had
       no bottom margin and the bar's own margin is below it, so the two touched
       at every width and read as one block. */
    .page-head { margin: 0 0 24px; }
    .meeting {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin: 0 0 24px; padding: 12px 16px; border-radius: 12px;
      background: var(--accent-soft); color: var(--accent);
      font-size: 13px; font-weight: 600;
    }
    .meeting .lbl { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; opacity: .8; }

    .counts { display: flex; gap: 8px; flex-wrap: wrap; }
    /* The arrow is the affordance that says "this opens" — it must survive any
       label length. The pill is the only element allowed to give up space. */
    .access-row { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
      min-width: 0; }
    .access-row .arrow { flex: none; margin-left: auto; }
    .access-pill { min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; }
    .conn { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700;
      white-space: nowrap; flex: none; }
    .conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
    .conn.yes { color: var(--good); } .conn.yes::before { background: var(--good); }
    .conn.no { color: var(--warn); } .conn.no::before { background: var(--warn); }
    .conn.na { color: var(--quiet); } .conn.na::before { background: var(--quiet); }

    .health.completed { background: var(--good-soft); color: var(--good); }

    /* ── WHAT IT COSTS ────────────────────────────────────────────────────────
       status_line is the finding and suggestion is the fix. A card carrying
       only those two tells you what is wrong and what to type, and never once
       says why a busy morning should be spent on it — "Needs work · rebuild the
       site" is a failed card no matter how neatly it is set.
       No uppercase key over it. The card already has one on "Do next", and
       three labelled blocks in a 288px column means nothing is emphasised. A
       rule down the left says "this follows from the line above" and costs a
       row of nothing. It is --line-strong, not the accent: the cost is not a
       state and must not pick up the state vocabulary. */
    .cost {
      margin: 0 0 8px; padding-left: 12px;
      border-left: 2px solid var(--line-strong);
      color: var(--text); font-size: 13px; line-height: 1.5;
    }
    /* The finding and what it costs are one thought, so they sit at the tight
       gap. 24px between them read as two unrelated paragraphs, and the dashed
       rule above "Do next" is already doing the separating. */
    .part-card .status-line { margin-bottom: 8px; }

    .suggest {
      margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--line);
      font-size: 13px; color: var(--text); font-weight: 600;
    }

    /* ── THE ROW THAT SAID NOTHING ────────────────────────────────────────────
       Ten of Wolfpack's nineteen cards spent their last line on the words "Not
       applicable" under a divider. Photography, case studies, the capability
       folder — there is no login for any of them, so there is no access
       question, so there was never an answer to print. It read as a status the
       eye had to check and discard ten times per page.
       The divider goes with it: a rule whose whole job was to separate the card
       from that line has nothing left to separate. The arrow stays, in the same
       corner it sits in on every other card — it is the affordance that says
       this opens, and losing it on ten of nineteen cards would read as a bug. */

    /* ── A CARD YOU CAN ACT ON ────────────────────────────────────────────────
       The card used to be one anchor wrapping everything, which is exactly the
       shape the day row was in before it grew controls: there was nowhere to
       put a button that was not also a navigation click, and a <button> inside
       an <a> is not a thing you can ship.
       So the card is a container now. The anchor covers the part you READ and
       carries the padding itself, so clicking near the edge still opens the
       part instead of landing on dead inset. The foot sits outside it and holds
       the things you DO. */
    .part-card { padding: 0; }
    .card-link {
      display: flex; flex: 1; min-width: 0; flex-direction: column;
      padding: 24px 24px 0; color: inherit; text-decoration: none;
    }
    .card-link:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: -4px;
    }
    /* margin-top:auto is gone with the anchor taking flex:1 — the foot is the
       last child of the card and the link absorbs any height the grid adds. */
    /* justify-content was space-between, which was invisible for as long as the
       foot fit on one line: an auto margin eats every pixel of free space
       before justify-content sees any, so the controls were pushed right by the
       margin and nothing was being spread. The moment the foot wraps — which it
       does on a phone — the first line has no auto margin left on it, and
       space-between threw "Connected" and "Manager" to opposite edges of the
       card. They are one fact, "connected, at Manager level", and reading them
       32px apart with nothing between makes them look like two.
       Packed left; the auto margins still do the right-hand alignment. */
    .access-row { margin: 0 24px; padding: 16px 0 24px; flex-wrap: wrap;
      justify-content: flex-start; }
    .access-row.bare { padding: 0 0 24px; border-top: 0; }
    /* Two controls, a state and an arrow will not fit on one 288px line, and a
       card is not allowed to clip its own buttons. The access facts stay left,
       the things you do stay right, and on a narrow card they stack. */
    .access-row .row-acts { flex: none; margin-left: auto; }
    .access-row .row-acts ~ .arrow { margin-left: 4px; }

    /* ── WHERE TO START ───────────────────────────────────────────────────────
       Nineteen cards at identical volume answers "how is this client" and never
       answers "what do I do right now", which is the one question this page
       exists for. This is that answer and nothing more: the open part that the
       most other work is waiting on, what it costs, and one way in.
       There is no impact score and no time estimate here on purpose. Neither
       exists in the record — 36 of 38 parts have never been machine-checked and
       there is no history to derive either from — and a made-up number at the
       top of the page would teach you to distrust every real one under it.
       Surface, not another tinted band: the meeting bar directly above is
       already accent-soft, and two coloured bars stacked read as one. The
       accent is spent on a rule down the left and on the way in. */
    .next-up {
      margin: 0 0 24px; padding: 24px;
      border: 1px solid var(--line); border-left: 4px solid var(--accent);
      border-radius: 16px; background: var(--surface); box-shadow: var(--shadow);
    }
    .next-up-top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .next-up .k {
      color: var(--muted); font-size: 12px; font-weight: 750;
      letter-spacing: .08em; text-transform: uppercase;
    }
    .next-up-name { margin: 0 0 8px; font-size: 20px; line-height: 1.25; letter-spacing: -.025em; }
    .next-up-why { margin: 0 0 8px; font-size: 16px; line-height: 1.5; max-width: 62ch; }
    .next-up-basis { margin: 0 0 16px; color: var(--muted); font-size: 13px; max-width: 62ch; }
    /* Outlined, like every other button on this board. A solid pill is a STATE
       here, and the one thing this control must not look like is a badge saying
       the part is fine. */
    .next-up-go {
      display: inline-flex; align-items: center; padding: 12px 24px;
      border: 1px solid var(--accent); border-radius: 999px;
      color: var(--accent-text); font-size: 14px; font-weight: 700;
      text-decoration: none;
    }
    .next-up-go:hover { background: var(--accent-soft); }
    .next-up-go:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 2px;
    }

    /* The prompt opens across the whole grid rather than inside one 288px
       column: "https://..." plus two buttons in a card-width box is a form you
       have to fight. Full width puts it under the card you clicked and gives
       the receipt field room to hold a receipt. */
    .card-grid > .prompt { grid-column: 1 / -1; }
    .suggest .k { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

    .recheck-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 24px; }
    /* Outlined, and NEUTRAL. It was a solid accent pill, which was survivable
       while it was the only control on the page — but "Start here" now sits
       directly above it, and a filled green button under an outlined one makes
       the refresh the loudest thing on a screen about what to do next. Two
       accent pills would be flat; accent for the way through and the board's
       ordinary outlined vocabulary for the utility is a hierarchy.
       (It is also the rule everywhere else here: a solid pill is a STATE.) */
    .recheck-btn {
      display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
      padding: 12px 24px; border-radius: 999px;
      border: 1px solid var(--line-strong); background: transparent; color: var(--muted);
      font-size: 14px; font-weight: 700; font-family: inherit;
    }
    .recheck-btn:hover { border-color: var(--accent); color: var(--accent-text); }
    .recheck-btn[disabled] { opacity: .55; cursor: not-allowed; }
    .recheck-note { font-size: 13px; color: var(--muted); font-weight: 600; }

    /* .progress-wrap / .progress-track / .progress-fill / .progress-line
       deleted 2026-08-05 along with their markup. A percentage-fill bar with no
       JS behind it, sitting one line away from being switched on, on a board
       that is 0 completed and has machine-checked 2 of 38 parts. There is no
       number here it could honestly fill to; the first person to wire it would
       have had to invent one, and the whole product rests on not doing that. */

    .summary { display: none; margin: 0 0 24px; padding: 16px; border-radius: 12px;
      background: var(--good-soft); color: var(--good); font-size: 13px; font-weight: 600; }
    .summary.on { display: block; }
    .summary ul { margin: 8px 0 0; padding-left: 16px; font-weight: 600; }

    /* base.css pins the grid to exactly 4 columns at any width. That was fine
       when the board owned the whole page; with a 380px rail beside it the four
       cards squeeze until "Needs work" wraps to two lines and "Manager"
       truncates to "Man...". Let the grid choose how many columns fit at a
       width a card is actually readable at. */
    .card-grid { grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); }
    /* A state pill that wraps stops looking like one pill. */
    .health { white-space: nowrap; }

    /* The rail is the second half of the tool: the board tells you what is
       true, the rail is where you change it and where the work lands. */
    .app.has-rail { grid-template-columns: 248px minmax(0, 1fr) 380px; }
    .rail {
      position: sticky; top: 0; align-self: stretch; height: 100vh;
      display: flex; flex-direction: column;
      background: var(--panel); border-left: 1px solid var(--line);
    }
    .rail-tabs { display: flex; gap: 4px; padding: 16px 16px 0; flex: none; }
    .rail-tab {
      flex: 1; padding: 8px 12px; border: 0; border-radius: 8px; cursor: pointer;
      background: transparent; color: var(--muted); font-family: inherit;
      font-size: 13px; font-weight: 700; letter-spacing: .02em;
    }
    .rail-tab.on { background: var(--accent-soft); color: var(--accent); }
    .rail-pane { display: none; flex: 1; min-height: 0; flex-direction: column; }
    .rail-pane.on { display: flex; }

    .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
    .msg { margin: 0 0 12px; font-size: 13px; line-height: 1.5; }
    .msg .who { display: block; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
      margin-bottom: 4px; }
    .msg .bubble { padding: 12px; border-radius: 12px; background: var(--surface);
      border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
    .msg.me .bubble { background: var(--accent-soft); border-color: transparent;
      color: var(--text); }
    .composer { flex: none; padding: 16px; border-top: 1px solid var(--line);
      display: flex; gap: 8px; align-items: flex-end; }
    .composer textarea {
      flex: 1; min-width: 0; resize: none; font-family: inherit; font-size: 13px;
      padding: 12px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--surface); color: var(--text); max-height: 120px;
    }
    .composer button {
      flex: none; border: 0; cursor: pointer; padding: 12px 16px;
      border-radius: 999px; background: var(--accent); color: #fff;
      font-family: inherit; font-size: 13px; font-weight: 700;
    }
    .composer button[disabled] { opacity: .55; cursor: not-allowed; }

    .files { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; }
    .file-group { margin: 0 0 16px; }
    .file-group h4 { margin: 0 0 8px; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .file-row { display: flex; align-items: center; gap: 8px; padding: 8px;
      border-radius: 8px; font-size: 13px; color: var(--text);
      text-decoration: none; }
    .file-row:hover { background: var(--accent-soft); }
    .file-row .nm { flex: 1; min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .file-row .wh { flex: none; font-size: 12px; color: var(--muted); }
    .rail-note { padding: 16px; font-size: 13px; color: var(--muted);
      font-weight: 600; line-height: 1.5; }

    @media (max-width: 1180px) {
      .app.has-rail { grid-template-columns: 248px minmax(0, 1fr); }
      .rail { display: none; }
    }

    .avatar.day { background: var(--accent); color: #fff; }
    .day-nav { margin-bottom: 16px; }
    .bucket { margin: 0 0 32px; }
    .bucket-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 16px; }
    .bucket-head h2 { margin: 0; }
    .bucket-why { font-size: 13px; color: var(--muted); font-weight: 600; }
    .day-row { display: flex; align-items: center; gap: 16px; padding: 16px;
      border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
      margin: 0 0 8px; text-decoration: none; color: var(--text); }
    .day-row:hover { border-color: var(--accent); }
    .day-row .who { flex: none; width: 152px; font-size: 12px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .day-row .what { flex: 1; min-width: 0; }
    .day-row .what b { display: block; font-size: 14px; }
    .day-row .what span { font-size: 13px; color: var(--muted); font-weight: 600; }
    /* The state pill is the last thing in the row and its label sets its width:
       measured, "Blocked" is 80px and "Needs work" is 103px. With the buttons
       sitting immediately left of it, that 23px difference pushed every Blocked
       row's controls out of line with every other row's — a ragged edge down a
       38-row list. Pinning the column lines the whole right side up. */
    .day-row .st { flex: none; min-width: 104px; text-align: right; }

    /* ── CLOSING THINGS OUT ───────────────────────────────────────────────────
       The row was one anchor wrapping everything, so there was nowhere to put a
       control that was not also a navigation click. It is a container now: the
       anchor covers the part of the row you read, the buttons sit outside it.

       Outlined, never filled — the same lesson the blocks chip taught. Every
       state on this board is a solid pill, so a solid button would read as a
       state at a glance. These are things you DO, not things the part IS.

       Contextual by bucket, because a button that does not apply is noise on a
       23-row list: ours-to-move gets Done and Waiting, waiting-on-them gets Done
       and "not waiting" (the chase ended), and Running gets nothing — it is
       already done, and the only honest way back is the record disagreeing. */
    .row-acts { display: inline-flex; align-items: center; gap: 8px; flex: none; }
    .act {
      padding: 4px 12px; border-radius: 999px; cursor: pointer;
      background: transparent; color: var(--muted);
      border: 1px solid var(--line-strong);
      font-family: inherit; font-size: 12px; font-weight: 700; white-space: nowrap;
    }
    .act:hover { border-color: var(--accent); color: var(--accent-text); }
    .act[disabled] { opacity: .5; cursor: progress; }
    .day-row .link { display: flex; align-items: center; gap: 16px; flex: 1;
      min-width: 0; text-decoration: none; color: inherit; }

    /* The prompt opens UNDER the row rather than over it. A modal for a one-line
       answer stops the list you are working; this keeps every other row on
       screen, so closing six things out stays one motion. */
    .prompt { margin: 0 0 8px; padding: 16px; border-radius: 12px;
      background: var(--panel); border: 1px solid var(--line-strong); }
    .prompt label { display: block; font-size: 12px; font-weight: 700;
      color: var(--muted); margin: 0 0 4px; }
    .prompt .why { font-size: 13px; color: var(--muted); font-weight: 600;
      margin: 0 0 12px; }
    .prompt-row { display: flex; gap: 8px; align-items: center; }
    .prompt input {
      flex: 1; min-width: 0; padding: 8px 12px; border-radius: 8px;
      border: 1px solid var(--line-strong); background: var(--surface);
      font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text);
    }
    .prompt input:focus { outline: none; border-color: var(--accent); }
    /* Outlined in the accent, not filled with it. Every state on this board is
       a solid pill, so a solid button reads as a state at a glance — the lesson
       the "blocks 3" chip and the refresh button have both already been taught
       here, and this was the last control still breaking it. It is still
       obviously the way through: it is the only accent-coloured thing in the
       prompt, sitting beside a neutral Cancel. */
    .act.go { background: transparent; color: var(--accent-text); border-color: var(--accent); }
    .act.go:hover { background: var(--accent-soft); color: var(--accent-text); }

    /* ── WHO WE ARE CHASING ───────────────────────────────────────────────────
       The API has stored waiting_on since the day the prompt started refusing a
       wait without a name — and no screen has ever printed it. Six rows sat in
       "Waiting on a client" and the board could not say who any of them was
       waiting on, which is the one fact that turns that bucket into calls. A
       wait is a state, so it is a filled pill. */
    .waiting-on { display: inline-flex; align-items: center; gap: 8px; flex: none;
      padding: 4px 8px; border-radius: 999px; background: var(--quiet-soft);
      color: var(--text); font-size: 12px; font-weight: 750; white-space: nowrap; }
    .waiting-on::before { content: ""; width: 8px; height: 8px; flex: none;
      border-radius: 50%; background: var(--quiet); }
    /* On a card it is a line, not a pill — see waitingLine() for why. */
    .waiting-line { display: flex; align-items: center; gap: 8px; margin: 0 0 8px;
      color: var(--quiet); font-size: 13px; font-weight: 700; }
    .waiting-line::before { content: ""; width: 8px; height: 8px; flex: none;
      border-radius: 50%; background: var(--quiet); }

    /* ── A LONE CARD ON THE LAST ROW ──────────────────────────────────────────
       "Found by buyers" holds seven cards and the grid resolves to two columns
       beside the rail, so the seventh sits alone with half a row of nothing next
       to it and the next group's heading directly underneath — an enclosed hole
       in the middle of the page, which reads as a mistake rather than as space.
       Which cards are alone is measured in JS: CSS cannot count the columns an
       auto-fill grid chose, and :nth-child(odd) is only accidentally right at
       two — at three it would stretch a card that was not alone. */
    .part-card.wide { grid-column: 1 / -1; }
    /* Filling the row must not stretch the measure with it. Ninety characters
       to a line is a different defect from the one this fixes. */
    .part-card.wide .card-link > :not(.card-top) { max-width: 62ch; }
    .prompt .err { margin: 12px 0 0; font-size: 13px; font-weight: 650;
      color: var(--bad); }
    .sweep-line { margin: 0 0 24px; padding: 12px 16px; border-radius: 12px;
      background: var(--panel); font-size: 13px; font-weight: 600; color: var(--muted); }
    .sweep-line.bad { background: var(--bad-soft); color: var(--bad); }

    /* ── SOMEBODY PRESSED GET STARTED ────────────────────────────────────────
       A stranger read their own scan report, left a name and a number, and
       until now that landed in a store no screen on this board read. The
       report told them it was in front of Patrik; it was not. This is the
       screen that makes the sentence true, and it sits ABOVE the overnight
       line and every bucket because a person waiting on a call outranks a
       part waiting on a person.

       It is a day-row, not a new component — same 152px identity column, same
       middle, same right-hand state pill — because it is read in the same
       sweep as the rows under it. What separates it is the accent outline and
       the fact that the identity column is a company we do not work for yet.

       The pill is the base amber: "ours to move". Accent is this board's
       "way through" colour and never a state, so the row's border carries the
       urgency and the pill keeps the vocabulary the other 38 rows use. */
    /* TWO LINES, NOT ONE. A part row fits on one line because its middle is a
       label; this row's middle is a sentence a stranger typed, and it was
       competing with a phone number, an email address, a button and a pill for
       the same 900px. Measured on the deploy: the note got a 110px ribbon and
       wrapped six times, with 600px of white beside it. So what they wrote
       takes the whole first line, and what you can DO about it becomes an
       action bar under it — the state pill still pinned right, where every
       other row on this board keeps it. */
    .day-row.lead { align-items: flex-start; flex-wrap: wrap; row-gap: 12px;
      border-color: var(--accent); }
    .day-row.lead .link { flex: 1 0 100%; align-items: flex-start; }
    .day-row.lead .st { margin-left: auto; }
    .day-row.lead .who { color: var(--accent-text); }
    .day-row.lead .what b { font-size: 16px; }
    .day-row.lead .what .when { font-weight: 650; color: var(--muted); }
    /* Scoped through .what on purpose: `.day-row .what span` is (0,2,1) and
       would out-specify a bare `.lead-note`, greying out the one sentence on
       this row that the person themselves wrote. */
    .day-row.lead .what .lead-note { display: block; margin-top: 4px;
      font-size: 13px; font-weight: 600; color: var(--text); }
    /* NOT `.act`. The day's delegated click handler swallows every `.act` it
       finds inside #groups and calls preventDefault() on it — a tel: link
       wearing that class would look like a button and do nothing. Same
       outlined shape, different name, so it stays a link. */
    .lead-reach { display: inline-flex; align-items: center; flex: none;
      flex-wrap: wrap; gap: 8px; }
    .reach { display: inline-flex; align-items: center; flex: none;
      padding: 4px 12px; border-radius: 999px;
      border: 1px solid var(--line-strong); background: transparent;
      color: var(--text); font-size: 12px; font-weight: 700;
      white-space: nowrap; text-decoration: none; }
    .reach:hover { border-color: var(--accent); color: var(--accent-text); }
    .lead-done { margin: 0 0 24px; font-size: 13px; font-weight: 600;
      color: var(--muted); }
    .lead-done a { color: var(--accent-text); }

    .board-message { padding: 24px; border-radius: 12px; background: var(--panel);
      border: 1px solid var(--line); }
    .board-message b { display: block; font-size: 16px; margin-bottom: 8px; }
    .board-message p { margin: 0 0 16px; font-size: 14px; color: var(--muted);
      font-weight: 600; max-width: 52ch; }
    .board-message .recheck-btn { text-decoration: none; }
    .count-pill.quiet { color: var(--quiet); }

    @keyframes flash { 0% { box-shadow: 0 0 0 4px var(--accent-soft); } 100% { box-shadow: none; } }
    .part-card.updated { animation: flash 2.4s ease-out; border-color: var(--accent); }

    /* ── WHAT THIS ONE HOLDS UP ───────────────────────────────────────────────
       The only ranking signal on the board that is not an opinion. Twenty-three
       rows wearing the same amber chip is a wall; the same rows with the one
       that frees three others sitting on top is a list. Teal because it is the
       accent for "this is the way through", never a state colour — it must not
       read as a fifth state beside completed / needs / blocked / cannot see. */
    /* Outlined, not filled — and that is the whole point. Every state reads as a
       SOLID pill, so hue alone was never going to keep this out of the state
       vocabulary: accent-soft (#dbece7) and good-soft (#e2f1eb) are the same pale
       mint within a few percent, which made "blocks 3" sit beside "Completed"
       looking like a cousin of it. Structure separates them where colour could
       not — an outline is not a state, at any hue, at any zoom. */
    .blocks {
      display: inline-flex; align-items: center; flex: none;
      padding: 4px 8px; border-radius: 999px;
      background: transparent; color: var(--accent-text);
      box-shadow: inset 0 0 0 1px var(--accent-text);
      font-size: 12px; font-weight: 750; white-space: nowrap;
    }
    .card-flags { display: inline-flex; align-items: center; justify-content: flex-end;
      gap: 8px; min-width: 0; flex-wrap: wrap; }

    /* ── THE FOUR COUNTS ──────────────────────────────────────────────────────
       Four real numbers, read straight off the record, with nothing drawn under
       them. A sparkline here would need a history, and the first machine check
       ran yesterday — 36 of 38 parts have never been looked at by anything. A
       trend line on that is the same lie as a green check with no receipt, and
       it teaches you to distrust every other number on the screen.
       The colour is the state vocabulary the rest of the board already uses:
       amber is ours to move, grey is we were never given the keys (which is not
       a failure), green is holding, muted is unverified. */
    .tiles {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px; margin: 24px 0 16px;
    }
    .tile {
      padding: 24px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--surface); box-shadow: var(--shadow);
    }
    .tile b { display: block; font-size: 32px; font-weight: 800;
      line-height: 1.12; letter-spacing: -.035em; }
    .tile span { display: block; margin-top: 4px; color: var(--muted);
      font-size: 13px; font-weight: 650; }
    .tile.needs b { color: var(--warn); }
    .tile.waiting b { color: var(--quiet); }
    .tile.running b { color: var(--good); }
    /* --muted (#6d7068) and --quiet (#747870) are the same grey to the eye, so
       "Waiting on a client" and "Never checked" arrived as one tone and two of
       the four tiles said nothing to each other. They are not the same kind of
       thing: waiting is a bucket you work (chase them), never-checked is the
       honesty counter behind everything else. It stays legible — it is the line
       that says do not trust the greens — but 36 is the biggest number here and
       the least actionable, and it should not win a screen about what to do. */
    .tile.unchecked b { color: #9a9c94; }

    @media (max-width: 720px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    /* ── THE PHONE ────────────────────────────────────────────────────────────
       He reads this between job sites, so 390x844 is not a courtesy width.
       Measured there, three things were broken and one was invisible:

       THE DAY ROW IS A DESKTOP TABLE. A 152px client column, a flexible middle,
       then chips, controls and a state pinned to a 104px right column. At 390
       the middle collapses to about 90px, so "Google Business Profile" sets one
       word per line and the row grows to 334px tall; the client name lands
       underneath the blocks chip; and the state pill is pushed 20px past the
       right edge of the screen, which is what was making the whole page scroll
       sideways. It stops being a table here: the part you read takes the first
       line, and the chip, the controls and the state share the second.

       CONTROLS UNDER THE TOUCH FLOOR. Every button on the board measured 28px
       tall — fine under a mouse, a coin toss under a thumb. 8px of vertical
       padding takes them to 36px without touching the desktop layout, where the
       gaps and the type are already right.

       A BUCKET HEAD IS NOT TWO COLUMNS. "Needs you" beside its explanation left
       the heading wrapping to two lines against a sentence that had room. */
    @media (max-width: 720px) {
      /* 16px between the controls is a desktop gap. At 390 there are 286px on
         the second line and "Waiting · Done · Needs work" needs 282 of them —
         the 16 was the difference between one control line and two. The row
         gap stays wide: that one IS separating groups. */
      .day-row { flex-wrap: wrap; gap: 12px 8px; }
      .day-row .link { flex: 1 0 100%; flex-wrap: wrap; row-gap: 4px; }
      .day-row .who { flex: 1 0 100%; width: auto; }
      .day-row .what { flex: 1 0 100%; }
      .day-row .st { min-width: 0; margin-left: auto; text-align: right; }

      /* 36px was the old answer here and it is under the floor: a thumb in a
         truck needs 44. The horizontal padding does NOT grow with it — there
         are 286px on the second line of a row and "Waiting · Done · Needs work"
         needs 282 of them, so a wider button is a second control line. */
      .act { padding: 12px; min-height: 44px; }

      /* THE FIELD CARRYING THE WHOLE RECEIPT RULE WAS THE SMALLEST THING IN ITS
         ROW. At 390 the input measured 72px beside two buttons that were wider
         than it, while its own placeholder needs 164px and a real Yelp URL
         needs 287. On its own line it gets the width the rule deserves. */
      .prompt-row { flex-wrap: wrap; }
      .prompt input { flex: 1 0 100%; padding: 12px; }

      .bucket-head { display: block; }
      .bucket-head h2 { margin: 0 0 4px; }

      /* A part name long enough to wrap must wrap inside the pill rather than
         push it off the card — "Open Association memberships" is wider than a
         390px screen has room for. */
      .next-up-go { max-width: 100%; justify-content: center; text-align: center; }
    }
</style>
</head>
<body>
  <div class="app has-rail">
    <aside class="sidebar" aria-label="Clients">
      <div class="sidebar-head">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7.5h14M5 12h9M5 16.5h6"/><circle cx="18" cy="16.5" r="2" fill="currentColor" stroke="none"/></svg>
        </span>
        <div><div class="brand-title">Client parts</div><div class="brand-subtitle">Agency workspace</div></div>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <label for="client-search" class="side-label">Search clients</label>
        <input id="client-search" type="search" placeholder="Search clients" autocomplete="off">
      </div>
      <nav class="client-list day-nav">
        <a class="client day-link selected" href="#" data-day="1"><span class="avatar day">D</span><span class="client-name">The day</span></a>

        <a class="client" href="#" data-client="ambition-mechanical" data-trade="Commercial HVAC and refrigeration &middot; Phoenix"><span class="avatar ambition">A</span><span class="client-name">Ambition Mechanical</span></a>
        <a class="client" href="#" data-client="kohrs" data-trade="Demolition and renovation &middot; Phoenix"><span class="avatar kohrs">K</span><span class="client-name">Kohrs</span></a>
      </nav>
    </aside>

    <main class="main">
      <header class="page-head">
        <p class="eyebrow">Client home</p>

      <div class="summary" id="summary"></div>

      <div id="groups"></div>
    </main>
    <aside class="rail" id="rail" aria-label="Chat and files">
      <div class="rail-tabs">
        <button class="rail-tab on" id="tab-chat" type="button">Chat</button>
        <button class="rail-tab" id="tab-files" type="button">Files</button>
      </div>
      <div class="rail-pane on" id="pane-chat">
        <div class="thread" id="thread"></div>
        <div class="composer">
          <label for="composer-input" class="side-label" style="display:none">Message</label>
          <textarea id="composer-input" rows="1" placeholder="Tell the board what changed..."></textarea>
          <button id="send" type="button">Send</button>
        </div>
      </div>
      <div class="rail-pane" id="pane-files">
        <div class="files" id="files"></div>
      </div>
    </aside>
  </div>
<script>
  // \u2500\u2500 WHO THE CLIENTS ARE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
  // The sidebar markup is the only copy. This was a META literal that also
  // carried a hardcoded meeting line for every client: a typed weekday that was
  // wrong (7 Aug 2026 is a Friday, not a Thursday) on a date somebody sets an
  // alarm against, and a line that could only ever expire - it would have gone
  // on presenting a meeting that had already happened, every morning after.
  //
  // The meeting now comes from the API and from nowhere else. Keeping any copy
  // of it here "as a fallback" would reinstate exactly that bug the first time
  // the API answered null - which is the answer it gives the moment a meeting

  const LABEL  = {"completed": "Completed", "needs": "Needs work", "blocked": "Blocked", "cannot": "Cannot see"};

  let current = 'wolfpack';
  let lastLoad = {};          // client -> the parts array we last rendered

  // ── ORDER BY WHAT UNBLOCKS THE MOST ───────────────────────────────────────
  // The board's only honest ranking. Every other candidate would be invented:
  // there is no age, no effort estimate, no score, and 36 of 38 parts have
  // never been machine-checked, so there is no history to rank on either.
  // What DOES exist is the dependency chain the part page already names —
  // "while this is open, 3 other parts cannot be fixed" — and until now no
  // other screen could see it.
  //
  // blocks_open_count, not blocks_count: the sort has to answer "what does
  // doing this actually free up", and a dependency that is already finished
  // frees up nothing. Ties keep the record's own order — Array#sort is stable
  // by specification, so equal rows do not shuffle between renders, which on a
  // list you read every morning matters more than it sounds.

  const byUnblocks = list => list.slice().sort((a, b) => unblocks(b) - unblocks(a));

  // would be noise wearing the costume of information.

    const n = unblocks(p);
    if (!n) return '';
    return '<span class="blocks" title="' + n + ' unfinished part' + (n === 1 ? '' : 's') +
      ' cannot be fixed until this one is">blocks ' + n + '</span>';
  }

  const shortDate = (t) => t
    ? new Date(t).toLocaleDateString('en-US', { day: 'numeric', month: 'short' }) : '';

    if (!p.waiting_on) return '';
    const since = p.waiting_since ? ' since ' + shortDate(p.waiting_since) : '';

      '">Waiting on ' + esc(p.waiting_on) + '</span>';
  }

  // the state wrapped to two lines there and pushed the title 28px below its

  // can wrap without dragging anything with it.

  // It takes the part and nothing else. It used to take the day's bucket as a
