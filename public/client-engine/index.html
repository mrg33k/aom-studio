<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client parts</title>
<style>
    :root {
      color-scheme: light dark;
      --bg: #ede7dc;
      --sidebar: #ede7dc;
      --panel: #fefcf9;
      --surface: #ffffff;
      --surface-strong: #ffffff;
      --text: #262823;
      --muted: #6d7068;
      --line: #ddd8ce;
      --line-strong: #c9c3b7;
      --accent: #176c61;
      --accent-soft: #dbece7;
      --accent-text: #0d5249;
      --good: #26715b;
      --good-soft: #e2f1eb;
      --warn: #9b651b;
      --warn-soft: #faecd3;
      --bad: #a6473f;
      --bad-soft: #f8e3df;
      --quiet: #747870;
      --quiet-soft: #ecece7;
      --shadow: 0 12px 28px rgba(75, 58, 32, .08), 0 2px 8px rgba(75, 58, 32, .04);
      --shadow-hover: 0 18px 38px rgba(75, 58, 32, .14), 0 5px 14px rgba(75, 58, 32, .07);
      --panel-shadow: 0 28px 72px rgba(75, 58, 32, .13), 0 6px 20px rgba(75, 58, 32, .06);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    button, input { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      align-items: start;
      min-height: 100vh;
      align-items: stretch;
    }

    .sidebar {
      position: relative;
      z-index: 1;
      align-self: stretch;
      padding: 32px 24px;
      background: var(--sidebar);
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 4px 24px;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 16px rgba(23, 108, 97, .24);
    }

    .brand-mark svg { width: 20px; height: 20px; }

    .brand-title { font-size: 16px; font-weight: 750; letter-spacing: -.01em; }
    .brand-subtitle { color: var(--muted); font-size: 12px; }

    .search-wrap { position: relative; margin-bottom: 24px; }

    .search-wrap svg {
      position: absolute;
      bottom: 12px;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      height: 40px;
      padding: 0 12px 0 32px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      transition: border-color .2s, box-shadow .2s;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .side-label {
      margin: 0 8px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .client-list { display: grid; gap: 4px; }

    .client {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: background .2s, color .2s, border-color .2s;
    }

    .client:hover { background: color-mix(in srgb, var(--surface) 62%, transparent); color: var(--text); }

    .client.selected {
      border-color: var(--line);
      background: var(--surface-strong);
      color: var(--text);
      box-shadow: 0 4px 16px rgba(56, 45, 26, .05);
    }

    .avatar {
      display: grid;
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-size: 12px;
      font-weight: 800;
    }

    .avatar.wolfpack { background: #176c61; }
    .avatar.ambition { background: #a5613c; }
    .avatar.kohrs { background: #6264a7; }
    .client-name { font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
    .empty-clients { display: none; padding: 12px; color: var(--muted); font-size: 13px; }

    main {
      min-width: 0;
      min-height: calc(100vh - 48px);
      margin: 24px 24px 24px 0;
      padding: 56px clamp(32px, 4vw, 56px) 72px;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--panel-shadow);
    }

    .main-inner { max-width: 1320px; margin: 0 auto; }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 56px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: -.035em;
    }

    .hero-copy { margin: 12px 0 0; color: var(--muted); font-size: 16px; }

    .summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .summary span {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .summary strong { color: var(--text); }

    .group { margin-top: 56px; scroll-margin-top: 24px; }

    .group-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h2 { margin: 0; font-size: 20px; line-height: 1.25; letter-spacing: -.025em; }
    .group-count { color: var(--muted); font-size: 13px; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
    }

    .part-card {
      position: relative;
      display: flex;
      min-height: 236px;
      flex-direction: column;
      padding: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .part-card:hover {
      z-index: 1;
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .part-card:focus-visible, .client:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 2px;
    }

    .part-card.unseen {
      border: 1px dashed var(--line-strong);
      background: color-mix(in srgb, var(--surface) 76%, var(--bg));
      box-shadow: none;
      opacity: .62;
    }

    .part-card.unseen:hover { opacity: .92; }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .glyph {
      display: grid;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 0;
      border-radius: 13px;
    }

    .glyph svg { width: 24px; height: 24px; }
    .glyph.google { background: #e8f0fe; }
    .glyph.reviews { background: #fff4cf; }
    .glyph.website { background: #ecebff; }
    .glyph.yelp { background: #fde8e8; }
    .glyph.linkedin { background: #0a66c2; }
    .glyph.ai { background: #f1e9ff; }
    .glyph.photo { background: #dff7f4; }
    .glyph.video { background: #ffe7ed; }
    .glyph.case-study { background: #fff0cc; }
    .glyph.folder { background: #ffead5; }
    .glyph.jobber { background: #def5e7; }
    .glyph.recurring { background: #dcf7fb; }
    .glyph.follow-up { background: #e1f2ff; }
    .glyph.insurance { background: #ddf7ec; }
    .glyph.target { background: #ffe4dd; }
    .glyph.memberships { background: #f0e7ff; }
    .glyph.outreach { background: #e4efff; }
    .glyph.report { background: #eff9d5; }

    .health {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px;
      border-radius: 999px;
      background: var(--warn-soft);
      color: var(--warn);
      font-size: 12px;
      font-weight: 750;
    }

    .health::before { width: 7px; height: 7px; border-radius: 50%; background: currentColor; content: ""; }
    .health.blocked { background: var(--bad-soft); color: var(--bad); }
    .health.unseen-health { background: var(--quiet-soft); color: var(--quiet); }

    .part-card h3 { margin: 0 0 8px; font-size: 16px; line-height: 1.3; letter-spacing: -.01em; }

    .status-line {
      display: -webkit-box;
      margin: 0 0 24px;
      overflow: hidden;
      color: var(--muted);
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .access-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .access-label { color: var(--muted); font-size: 12px; }

    .access-pill {
      white-space: nowrap;
      display: inline-flex;
      max-width: 75%;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--quiet-soft);
      color: var(--quiet);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.2;
      text-align: right;
    }

    .access-pill.connected { background: var(--good-soft); color: var(--good); }
    .access-pill.pending, .access-pill.expired, .access-pill.wrong { background: var(--warn-soft); color: var(--warn); }
    .access-pill.never { background: var(--quiet-soft); color: var(--quiet); }

    .arrow {
      margin-left: 4px;
      color: var(--accent);
      font-size: 16px;
      transition: transform .2s;
    }

    .part-card:hover .arrow { transform: translateX(3px); }

    @media (max-width: 1180px) {
      .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .app { display: block; }

      .sidebar {
        position: relative;
        z-index: 2;
        width: 100%;
        height: auto;
        padding: 16px;
        border-right: 0;
        border-bottom: 0;
      }

      .sidebar-head { margin: 0 0 16px; }
      .search-wrap { margin-bottom: 12px; }
      .side-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

      .client-list {
        display: flex;
        padding-bottom: 4px;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .client { flex: 0 0 auto; padding: 8px 12px; }
      .avatar { width: 24px; height: 24px; }
      main {
        min-height: 0;
        margin: 0 12px 12px;
        padding: 40px 24px 56px;
        border-radius: 24px;
      }
      .hero { display: block; margin-bottom: 32px; }
      .summary { justify-content: flex-start; margin-top: 24px; }
      .group { margin-top: 40px; }
    }

    @media (max-width: 560px) {
      .card-grid { grid-template-columns: 1fr; }
      .part-card { min-height: 196px; }
      .group-heading { align-items: center; }
      .hero-copy { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

      
    /* ---- v2 additions ---- */
    .meeting {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin: 0 0 24px; padding: 12px 16px; border-radius: 12px;
      background: var(--accent-soft); color: var(--accent);
      font-size: 13px; font-weight: 600;
    }
    .meeting .lbl { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; opacity: .8; }

    .counts { display: flex; gap: 8px; flex-wrap: wrap; }
    .access-row { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
    .access-pill { white-space: nowrap; }
    .conn { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700;
      white-space: nowrap; flex: none; }
    .conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
    .conn.yes { color: var(--good); } .conn.yes::before { background: var(--good); }
    .conn.no { color: var(--warn); } .conn.no::before { background: var(--warn); }
    .conn.na { color: var(--quiet); } .conn.na::before { background: var(--quiet); }

    .health.completed { background: var(--good-soft); color: var(--good); }

    .suggest {
      margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--line);
      font-size: 13px; color: var(--text); font-weight: 600;
    }
    .suggest .k { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

    .recheck-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 24px; }
    .recheck-btn {
      display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
      padding: 12px 24px; border-radius: 999px; background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 700; font-family: inherit;
    }
    .recheck-btn[disabled] { opacity: .55; cursor: not-allowed; }
    .recheck-note { font-size: 13px; color: var(--muted); font-weight: 600; }

    .progress-wrap { display: none; margin: 0 0 24px; }
    .progress-wrap.on { display: block; }
    .progress-track { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; border-radius: 999px; background: var(--accent);
      transition: width .4s ease; }
    .progress-line { margin: 8px 0 0; font-size: 13px; color: var(--muted); font-weight: 600; }

    .summary { display: none; margin: 0 0 24px; padding: 16px; border-radius: 12px;
      background: var(--good-soft); color: var(--good); font-size: 13px; font-weight: 600; }
    .summary.on { display: block; }
    .summary ul { margin: 8px 0 0; padding-left: 16px; font-weight: 600; }

    @keyframes flash { 0% { box-shadow: 0 0 0 4px var(--accent-soft); } 100% { box-shadow: none; } }
    .part-card.updated { animation: flash 2.4s ease-out; border-color: var(--accent); }
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Clients">
      <div class="sidebar-head">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7.5h14M5 12h9M5 16.5h6"/><circle cx="18" cy="16.5" r="2" fill="currentColor" stroke="none"/></svg>
        </span>
        <div><div class="brand-title">Client parts</div><div class="brand-subtitle">Agency workspace</div></div>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <label for="client-search" class="side-label">Search clients</label>
        <input id="client-search" type="search" placeholder="Search clients" autocomplete="off">
      </div>
      <p class="side-label">Clients</p>
      <nav class="client-list">
        <a class="client selected" href="#" data-client="wolfpack"><span class="avatar wolfpack">W</span><span class="client-name">Wolfpack</span></a>
        <a class="client" href="#" data-client="ambition"><span class="avatar ambition">A</span><span class="client-name">Ambition Mechanical</span></a>
        <a class="client" href="#" data-client="kohrs"><span class="avatar kohrs">K</span><span class="client-name">Kohrs</span></a>
      </nav>
    </aside>

    <main class="main">
      <header class="page-head">
        <p class="eyebrow">Client home</p>
        <h1 id="hello">Hello, Wolfpack.</h1>
        <p class="subtitle" id="trade"></p>
        <div class="counts" id="counts"></div>
      </header>

      <div class="meeting"><span class="lbl">Next meeting</span><span id="meeting-text"></span></div>

      <div class="recheck-bar">
        <button class="recheck-btn" id="recheck" type="button">Re-check everything</button>
        <span class="recheck-note" id="recheck-note"></span>
      </div>

      <div class="progress-wrap" id="progress">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <p class="progress-line" id="progress-line"></p>
      </div>

      <div class="summary" id="summary"></div>

      <div id="groups"></div>
    </main>
  </div>
<script>

\"#84B91E\"/><rect x=\"9.5\" y=\"7\" width=\"5\" height=\"15\" rx=\"1.5\" fill=\"#6EA511\"/><rect x=\"17\" y=\"2\" width=\"5\" height=\"20\" rx=\"1.5\" fill=\"#568A08\"/></svg></span><span class=\"health completed\">Completed</span></div>\n              <h3>Monthly report</h3>\n              <p class=\"status-line\">June was sent and opened. Notes resolved.</p>\n              <p class=\"suggest\"><span class=\"k\">Do next</span>Prepare the July recap.</p>\n              <div class=\"access-row\"><span class=\"conn na\">Not applicable</span><span class=\"access-pill\">Not applicable</span><span class=\"arrow\" aria-hidden=\"true\">\u2192</span></div>\n            </a>\n          </div>\n        </section>", "counts": {"total": 19, "attention": 9, "cannot": 1, "done": 9}}, "kohrs": {"name": "Kohrs", "trade": "Demolition and renovation \u00b7 Phoenix", "meeting": "Nothing booked", "html": "        <p class=\"status-line\">This client is not set up yet. Add the parts we look after and they will show here.</p>", "counts": {"total": 0, "attention": 0, "cannot": 0, "done": 0}}};
  const COOLDOWN = 120000;
  let lastRun = 0, running = false, current = 'wolfpack';

  const $ = s => document.querySelector(s);
  const groupsEl = $('#groups'), hello = $('#hello'), trade = $('#trade'),
        meeting = $('#meeting-text'), counts = $('#counts'),
        btn = $('#recheck'), note = $('#recheck-note'),
        pWrap = $('#progress'), pFill = $('#progress-fill'), pLine = $('#progress-line'),
        summary = $('#summary');

  function render(key) {
    const c = CLIENTS[key]; current = key;
    hello.textContent = 'Hello, ' + c.name + '.';
    trade.textContent = c.trade;
    meeting.textContent = c.meeting;
    groupsEl.innerHTML = c.html;
    counts.innerHTML = '<span class="count-pill"><b>' + c.counts.total + '</b> parts</span>' +
      '<span class="count-pill"><b>' + c.counts.attention + '</b> need attention</span>' +
      '<span class="count-pill"><b>' + c.counts.cannot + '</b> cannot see</span>' +
      '<span class="count-pill"><b>' + c.counts.done + '</b> completed</span>';
    document.querySelectorAll('.client').forEach(a =>
      a.classList.toggle('selected', a.dataset.client === key));
    summary.classList.remove('on');
  }

  $('#client-search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.client').forEach(a => {
      const hit = a.querySelector('.client-name').textContent.toLowerCase().includes(q);
      a.style.display = hit ? '' : 'none';
    });
  });

  document.querySelectorAll('.client').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); render(a.dataset.client);
  }));

  // Honest: parts we cannot get into report that they could not be reached.
  const STEPS = [
    ['Opening the Google Business Profile...', 900],
    ['Reading both listings...', 900],
    ['Searching our inbox for anything from Wolfpack...', 1100],
    ['Opening the shared Google Drive folder...', 900],
    ['Checking the website for changes since 28 Jul...', 1000],
    ['Checking Yelp...', 800],
    ['Could not check Company LinkedIn - no access', 700],
    ['Could not check Jobber - not connected', 700],
    ['Checking association directories...', 900],
    ['Writing up what changed...', 800]
  ];

  function tick(msLeft) {
    const s = Math.ceil(msLeft / 1000);
    note.textContent = 'Just ran. You can check again in ' + s + 's.';
    if (msLeft <= 0) { note.textContent = ''; btn.disabled = false; return; }
    setTimeout(() => tick(msLeft - 1000), 1000);
  }

  btn.addEventListener('click', () => {
    if (running) return;
    const since = Date.now() - lastRun;
    if (lastRun && since < COOLDOWN) { btn.disabled = true; tick(COOLDOWN - since); return; }
    running = true; btn.disabled = true; summary.classList.remove('on');
    pWrap.classList.add('on'); pFill.style.width = '0%'; note.textContent = '';
    let i = 0;
    (function step() {
      if (i >= STEPS.length) return finish();
      pLine.textContent = STEPS[i][0];
      pFill.style.width = Math.round(((i + 1) / STEPS.length) * 100) + '%';
      setTimeout(() => { i++; step(); }, STEPS[i][1]);
    })();
  });

  function finish() {
    running = false; lastRun = Date.now();
    pWrap.classList.remove('on');
    // only the cards that actually changed are highlighted -- and they really do change
    const changed = {
      'Website': 'Placeholder site. No change since 28 Jul. Five enquiries in two years.',
      'Online reviews': 'Two new reviews since the last check. Neither names commercial work.',
      'Yelp': 'Live, but the Saturday hours are wrong.'
    };
    Object.keys(changed).forEach(n => {
      const el = document.querySelector('[data-part="' + n + '"]');
      if (!el) return;
      const line = el.querySelector('.status-line');
      if (line) line.textContent = changed[n];
      el.classList.add('updated');
      setTimeout(() => el.classList.remove('updated'), 2600);
    });
    summary.innerHTML = '<b>Check finished.</b> 3 parts updated, 13 unchanged, 3 could not be reached.' +
      '<ul><li>Website - no change since 28 Jul, still a placeholder</li>' +
      '<li>Online reviews - two new reviews, neither names commercial work</li>' +
      '<li>Yelp - hours are wrong for Saturdays</li>' +
      '<li>Company LinkedIn, Owner\'s LinkedIn and Jobber could not be reached - no access</li></ul>';
    summary.classList.add('on');
    btn.disabled = true; tick(COOLDOWN);
  }

  render('wolfpack');
</script>
