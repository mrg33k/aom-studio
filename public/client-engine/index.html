<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client parts</title>
<style>
    :root {
      color-scheme: light dark;
      --bg: #ede7dc;
      --sidebar: #ede7dc;
      --panel: #fefcf9;
      --surface: #ffffff;
      --surface-strong: #ffffff;
      --text: #262823;
      --muted: #6d7068;
      --line: #ddd8ce;
      --line-strong: #c9c3b7;
      --accent: #176c61;
      --accent-soft: #dbece7;
      --accent-text: #0d5249;
      --good: #26715b;
      --good-soft: #e2f1eb;
      --warn: #9b651b;
      --warn-soft: #faecd3;
      --bad: #a6473f;
      --bad-soft: #f8e3df;
      --quiet: #747870;
      --quiet-soft: #ecece7;
      --shadow: 0 12px 28px rgba(75, 58, 32, .08), 0 2px 8px rgba(75, 58, 32, .04);
      --shadow-hover: 0 18px 38px rgba(75, 58, 32, .14), 0 5px 14px rgba(75, 58, 32, .07);
      --panel-shadow: 0 28px 72px rgba(75, 58, 32, .13), 0 6px 20px rgba(75, 58, 32, .06);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    button, input { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      align-items: start;
      min-height: 100vh;
      align-items: stretch;
    }

    .sidebar {
      position: relative;
      z-index: 1;
      align-self: stretch;
      padding: 32px 24px;
      background: var(--sidebar);
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 4px 24px;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 6px 16px rgba(23, 108, 97, .24);
    }

    .brand-mark svg { width: 20px; height: 20px; }

    .brand-title { font-size: 16px; font-weight: 750; letter-spacing: -.01em; }
    .brand-subtitle { color: var(--muted); font-size: 12px; }

    .search-wrap { position: relative; margin-bottom: 24px; }

    .search-wrap svg {
      position: absolute;
      bottom: 12px;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      height: 40px;
      padding: 0 12px 0 32px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      transition: border-color .2s, box-shadow .2s;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
    }

    .side-label {
      margin: 0 8px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .client-list { display: grid; gap: 4px; }

    .client {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--muted);
      text-decoration: none;
      transition: background .2s, color .2s, border-color .2s;
    }

    .client:hover { background: color-mix(in srgb, var(--surface) 62%, transparent); color: var(--text); }

    .client.selected {
      border-color: var(--line);
      background: var(--surface-strong);
      color: var(--text);
      box-shadow: 0 4px 16px rgba(56, 45, 26, .05);
    }

    .avatar {
      display: grid;
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      color: white;
      font-size: 12px;
      font-weight: 800;
    }

    .avatar.wolfpack { background: #176c61; }
    .avatar.ambition { background: #a5613c; }
    .avatar.kohrs { background: #6264a7; }
    .client-name { font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
    .empty-clients { display: none; padding: 12px; color: var(--muted); font-size: 13px; }

    main {
      min-width: 0;
      min-height: calc(100vh - 48px);
      margin: 24px 24px 24px 0;
      padding: 56px clamp(32px, 4vw, 56px) 72px;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--panel-shadow);
    }

    .main-inner { max-width: 1320px; margin: 0 auto; }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 56px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: -.035em;
    }

    .hero-copy { margin: 12px 0 0; color: var(--muted); font-size: 16px; }

    .summary {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .summary span {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .summary strong { color: var(--text); }

    .group { margin-top: 56px; scroll-margin-top: 24px; }

    .group-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    h2 { margin: 0; font-size: 20px; line-height: 1.25; letter-spacing: -.025em; }
    .group-count { color: var(--muted); font-size: 13px; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
    }

    .part-card {
      position: relative;
      display: flex;
      min-height: 236px;
      flex-direction: column;
      padding: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .part-card:hover {
      z-index: 1;
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .part-card:focus-visible, .client:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 2px;
    }

    .part-card.unseen {
      border: 1px dashed var(--line-strong);
      background: color-mix(in srgb, var(--surface) 76%, var(--bg));
      box-shadow: none;
      opacity: .62;
    }

    .part-card.unseen:hover { opacity: .92; }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .glyph {
      display: grid;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 0;
      border-radius: 13px;
    }

    .glyph svg { width: 24px; height: 24px; }
    .glyph.google { background: #e8f0fe; }
    .glyph.reviews { background: #fff4cf; }
    .glyph.website { background: #ecebff; }
    .glyph.yelp { background: #fde8e8; }
    .glyph.linkedin { background: #0a66c2; }
    .glyph.ai { background: #f1e9ff; }
    .glyph.photo { background: #dff7f4; }
    .glyph.video { background: #ffe7ed; }
    .glyph.case-study { background: #fff0cc; }
    .glyph.folder { background: #ffead5; }
    .glyph.jobber { background: #def5e7; }
    .glyph.recurring { background: #dcf7fb; }
    .glyph.follow-up { background: #e1f2ff; }
    .glyph.insurance { background: #ddf7ec; }
    .glyph.target { background: #ffe4dd; }
    .glyph.memberships { background: #f0e7ff; }
    .glyph.outreach { background: #e4efff; }
    .glyph.report { background: #eff9d5; }

    .health {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px;
      border-radius: 999px;
      background: var(--warn-soft);
      color: var(--warn);
      font-size: 12px;
      font-weight: 750;
    }

    .health::before { width: 7px; height: 7px; border-radius: 50%; background: currentColor; content: ""; }
    .health.blocked { background: var(--bad-soft); color: var(--bad); }
    .health.unseen-health { background: var(--quiet-soft); color: var(--quiet); }

    .part-card h3 { margin: 0 0 8px; font-size: 16px; line-height: 1.3; letter-spacing: -.01em; }

    .status-line {
      display: -webkit-box;
      margin: 0 0 24px;
      overflow: hidden;
      color: var(--muted);
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .access-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .access-label { color: var(--muted); font-size: 12px; }

    .access-pill {
      white-space: nowrap;
      display: inline-flex;
      max-width: 75%;
      align-items: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--quiet-soft);
      color: var(--quiet);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.2;
      text-align: right;
    }

    .access-pill.connected { background: var(--good-soft); color: var(--good); }
    .access-pill.pending, .access-pill.expired, .access-pill.wrong { background: var(--warn-soft); color: var(--warn); }
    .access-pill.never { background: var(--quiet-soft); color: var(--quiet); }

    .arrow {
      margin-left: 4px;
      color: var(--accent);
      font-size: 16px;
      transition: transform .2s;
    }

    .part-card:hover .arrow { transform: translateX(3px); }

    @media (max-width: 1180px) {
      .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .app { display: block; }

      .sidebar {
        position: relative;
        z-index: 2;
        width: 100%;
        height: auto;
        padding: 16px;
        border-right: 0;
        border-bottom: 0;
      }

      .sidebar-head { margin: 0 0 16px; }
      .search-wrap { margin-bottom: 12px; }
      .side-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

      .client-list {
        display: flex;
        padding-bottom: 4px;
        overflow-x: auto;
        scrollbar-width: thin;
      }

      .client { flex: 0 0 auto; padding: 8px 12px; }
      .avatar { width: 24px; height: 24px; }
      main {
        min-height: 0;
        margin: 0 12px 12px;
        padding: 40px 24px 56px;
        border-radius: 24px;
      }
      .hero { display: block; margin-bottom: 32px; }
      .summary { justify-content: flex-start; margin-top: 24px; }
      .group { margin-top: 40px; }
    }

    @media (max-width: 560px) {
      .card-grid { grid-template-columns: 1fr; }
      .part-card { min-height: 196px; }
      .group-heading { align-items: center; }
      .hero-copy { font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

      
    /* ---- v2 additions ---- */
    .meeting {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin: 0 0 24px; padding: 12px 16px; border-radius: 12px;
      background: var(--accent-soft); color: var(--accent);
      font-size: 13px; font-weight: 600;
    }
    .meeting .lbl { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; opacity: .8; }

    .counts { display: flex; gap: 8px; flex-wrap: wrap; }
    /* The arrow is the affordance that says "this opens" — it must survive any
       label length. The pill is the only element allowed to give up space. */
    .access-row { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
      min-width: 0; }
    .access-row .arrow { flex: none; margin-left: auto; }
    .access-pill { min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; }
    .conn { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700;
      white-space: nowrap; flex: none; }
    .conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
    .conn.yes { color: var(--good); } .conn.yes::before { background: var(--good); }
    .conn.no { color: var(--warn); } .conn.no::before { background: var(--warn); }
    .conn.na { color: var(--quiet); } .conn.na::before { background: var(--quiet); }

    .health.completed { background: var(--good-soft); color: var(--good); }

    .suggest {
      margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--line);
      font-size: 13px; color: var(--text); font-weight: 600;
    }
    .suggest .k { display: block; font-size: 12px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }

    .recheck-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 24px; }
    .recheck-btn {
      display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer;
      padding: 12px 24px; border-radius: 999px; background: var(--accent); color: #fff;
      font-size: 14px; font-weight: 700; font-family: inherit;
    }
    .recheck-btn[disabled] { opacity: .55; cursor: not-allowed; }
    .recheck-note { font-size: 13px; color: var(--muted); font-weight: 600; }

    .progress-wrap { display: none; margin: 0 0 24px; }
    .progress-wrap.on { display: block; }
    .progress-track { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; border-radius: 999px; background: var(--accent);
      transition: width .4s ease; }
    .progress-line { margin: 8px 0 0; font-size: 13px; color: var(--muted); font-weight: 600; }

    .summary { display: none; margin: 0 0 24px; padding: 16px; border-radius: 12px;
      background: var(--good-soft); color: var(--good); font-size: 13px; font-weight: 600; }
    .summary.on { display: block; }
    .summary ul { margin: 8px 0 0; padding-left: 16px; font-weight: 600; }

    .board-message { padding: 24px; border-radius: 12px; background: var(--panel);
      border: 1px solid var(--line); }
    .board-message b { display: block; font-size: 16px; margin-bottom: 8px; }
    .board-message p { margin: 0 0 16px; font-size: 14px; color: var(--muted);
      font-weight: 600; max-width: 52ch; }
    .board-message .recheck-btn { text-decoration: none; }
    .count-pill.quiet { color: var(--quiet); }

    @keyframes flash { 0% { box-shadow: 0 0 0 4px var(--accent-soft); } 100% { box-shadow: none; } }
    .part-card.updated { animation: flash 2.4s ease-out; border-color: var(--accent); }
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Clients">
      <div class="sidebar-head">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7.5h14M5 12h9M5 16.5h6"/><circle cx="18" cy="16.5" r="2" fill="currentColor" stroke="none"/></svg>
        </span>
        <div><div class="brand-title">Client parts</div><div class="brand-subtitle">Agency workspace</div></div>
      </div>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <label for="client-search" class="side-label">Search clients</label>
        <input id="client-search" type="search" placeholder="Search clients" autocomplete="off">
      </div>
      <p class="side-label">Clients</p>
      <nav class="client-list">
        <a class="client selected" href="#" data-client="wolfpack"><span class="avatar wolfpack">W</span><span class="client-name">Wolfpack</span></a>
        <a class="client" href="#" data-client="ambition-mechanical"><span class="avatar ambition">A</span><span class="client-name">Ambition Mechanical</span></a>
        <a class="client" href="#" data-client="kohrs"><span class="avatar kohrs">K</span><span class="client-name">Kohrs</span></a>
      </nav>
    </aside>

    <main class="main">
      <header class="page-head">
        <p class="eyebrow">Client home</p>
        <h1 id="hello">Hello, Wolfpack.</h1>
        <p class="subtitle" id="trade"></p>
        <div class="counts" id="counts"></div>
      </header>

      <div class="meeting" id="meeting-bar"><span class="lbl">Next meeting</span><span id="meeting-text"></span></div>

      <div class="recheck-bar" id="recheck-bar">
        <button class="recheck-btn" id="recheck" type="button">Refresh from the record</button>
        <span class="recheck-note" id="recheck-note"></span>
      </div>

      <div class="progress-wrap" id="progress">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <p class="progress-line" id="progress-line"></p>
      </div>

      <div class="summary" id="summary"></div>

      <div id="groups"></div>
    </main>
  </div>
<script>
  const META   = {"wolfpack": {"name": "Wolfpack", "trade": "Commercial plumbing and hydro jetting \u00b7 Phoenix", "meeting": "Thursday 7 Aug, 10:00am \u00b7 Ross, site walk"}, "ambition-mechanical": {"name": "Ambition Mechanical", "trade": "Commercial HVAC and refrigeration \u00b7 Phoenix", "meeting": "Tuesday 12 Aug, 2:00pm \u00b7 Mo, monthly review"}, "kohrs": {"name": "Kohrs", "trade": "Demolition and renovation \u00b7 Phoenix", "meeting": "Nothing booked"}};
  const ICONS  = {"google": "<svg viewBox=\"0 0 24 24\"><path fill=\"#4285F4\" d=\"M21.6 12.23c0-.71-.06-1.4-.18-2.05H12v3.87h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.35Z\"/><path fill=\"#34A853\" d=\"M12 22c2.7 0 4.97-.9 6.62-2.42l-3.24-2.51c-.9.6-2.05.96-3.38.96-2.6 0-4.81-1.76-5.6-4.13H3.06v2.59A10 10 0 0 0 12 22Z\"/><path fill=\"#FBBC05\" d=\"M6.4 13.9A6 6 0 0 1 6.08 12c0-.66.11-1.3.32-1.9V7.51H3.06A10 10 0 0 0 2 12c0 1.61.38 3.14 1.06 4.49L6.4 13.9Z\"/><path fill=\"#EA4335\" d=\"M12 5.97c1.47 0 2.78.5 3.81 1.49l2.86-2.86A9.58 9.58 0 0 0 12 2a10 10 0 0 0-8.94 5.51L6.4 10.1C7.19 7.73 9.4 5.97 12 5.97Z\"/></svg>", "reviews": "<svg viewBox=\"0 0 24 24\"><path fill=\"#FBBC05\" d=\"m12 2.6 2.75 5.58 6.16.9-4.46 4.34 1.05 6.14L12 16.66l-5.5 2.9 1.05-6.14-4.46-4.34 6.16-.9L12 2.6Z\"/></svg>", "website": "<svg viewBox=\"0 0 24 24\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#4F46E5\"/><path fill=\"#fff\" d=\"M2 8h20v2H2z\"/><circle cx=\"5.2\" cy=\"6\" r=\"1\" fill=\"#fff\"/><circle cx=\"8.2\" cy=\"6\" r=\"1\" fill=\"#fff\"/><rect x=\"5\" y=\"12\" width=\"14\" height=\"6\" rx=\"1.5\" fill=\"#fff\" opacity=\".9\"/></svg>", "yelp": "<svg viewBox=\"0 0 24 24\"><path fill=\"#D32323\" d=\"M10.6 10.2 8.9 3.15A1.45 1.45 0 0 1 10.1 1.4l2.15-.34a1.45 1.45 0 0 1 1.66 1.58l-.75 7.42c-.12 1.16-2.28 1.28-2.56.14ZM14.35 10.95l4.72-2.8a1.45 1.45 0 0 1 2.1.74l.7 1.86a1.45 1.45 0 0 1-1.24 1.95l-5.72.24c-1.12.05-1.53-1.42-.56-2ZM14.26 14.42l4.56 2.94a1.45 1.45 0 0 1 .27 2.2l-1.4 1.44a1.45 1.45 0 0 1-2.3-.3l-2.56-4.9c-.5-.96.52-1.97 1.43-1.38ZM10.76 15.1l-1.5 5.44a1.45 1.45 0 0 1-1.93.96l-1.87-.75a1.45 1.45 0 0 1-.7-2.22l3.42-4.38c.67-.86 2.88-.1 2.58.95ZM8.4 11.6l-5.36-1.56a1.45 1.45 0 0 1-.93-1.98l.82-1.84a1.45 1.45 0 0 1 2.24-.64l4.25 3.57c.84.71.03 2.75-1.02 2.45Z\"/></svg>", "linkedin": "<svg viewBox=\"0 0 24 24\"><path fill=\"#fff\" d=\"M6.15 8.55H2.9V19h3.25V8.55ZM4.53 3.35a1.89 1.89 0 1 0 0 3.78 1.89 1.89 0 0 0 0-3.78ZM18.47 8.3c-1.75 0-2.93.96-3.41 1.88h-.05V8.55H11.9V19h3.24v-5.17c0-1.36.26-2.68 1.95-2.68 1.66 0 1.68 1.55 1.68 2.77V19H22v-5.72c0-2.81-.61-4.98-3.53-4.98Z\"/></svg>", "ai": "<svg viewBox=\"0 0 24 24\"><path fill=\"#7C3AED\" d=\"M12 1.5c.62 5.2 2.8 8.2 8.3 9.5-5.5 1.3-7.68 4.3-8.3 9.5-.62-5.2-2.8-8.2-8.3-9.5C9.2 9.7 11.38 6.7 12 1.5Z\"/><path fill=\"#A78BFA\" d=\"M19.1 15.2c.25 2.12 1.14 3.35 3.4 3.88-2.26.53-3.15 1.76-3.4 3.88-.25-2.12-1.14-3.35-3.4-3.88 2.26-.53 3.15-1.76 3.4-3.88Z\"/></svg>", "photo": "<svg viewBox=\"0 0 24 24\"><path fill=\"#0F9F95\" d=\"M4 6h3.4l1.45-2h6.3l1.45 2H20a2 2 0 0 1 2 2v10.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z\"/><circle cx=\"12\" cy=\"13\" r=\"4.2\" fill=\"#fff\"/><circle cx=\"12\" cy=\"13\" r=\"2.45\" fill=\"#0F9F95\"/><circle cx=\"18.5\" cy=\"8.8\" r=\"1\" fill=\"#fff\"/></svg>", "video": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#E84A6F\"/><path fill=\"#fff\" d=\"M9.3 7.8c0-.73.8-1.18 1.43-.8l7.05 4.2c.61.36.61 1.25 0 1.62l-7.05 4.18a.94.94 0 0 1-1.43-.8V7.8Z\"/></svg>", "case-study": "<svg viewBox=\"0 0 24 24\"><path fill=\"#D99A08\" d=\"M5 2h9l5 5v15H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z\"/><path fill=\"#fff\" opacity=\".9\" d=\"M14 2v5h5ZM7 11h8v2H7zM7 15h8v2H7zM7 19h5v2H7z\"/></svg>", "folder": "<svg viewBox=\"0 0 24 24\"><path fill=\"#F07A19\" d=\"M2 5.5A2.5 2.5 0 0 1 4.5 3H10l2.2 2.5h7.3A2.5 2.5 0 0 1 22 8v9.5a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 17.5v-12Z\"/><path fill=\"#FFB36B\" d=\"M2 9h20l-2.25 9H4.25L2 9Z\"/></svg>", "jobber": "<svg viewBox=\"0 0 24 24\"><path fill=\"#12A150\" d=\"M8 3h9v12.1C17 19.5 14.55 22 10.45 22 7 22 4.75 20.1 4.3 16.8l4.2-.65c.2 1.35.78 2.05 1.8 2.05 1.28 0 1.9-.9 1.9-2.75V7H8V3Z\"/></svg>", "recurring": "<svg viewBox=\"0 0 24 24\"><path fill=\"#06AFC7\" d=\"M12 3a9 9 0 0 1 7.15 3.53L21 4.7V11h-6.3l1.92-1.92A5.9 5.9 0 0 0 6.3 11H3.06A9 9 0 0 1 12 3Zm8.94 10A9 9 0 0 1 4.85 17.47L3 19.3V13h6.3l-1.92 1.92A5.9 5.9 0 0 0 17.7 13h3.24Z\"/></svg>", "follow-up": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#238FD0\"/><path fill=\"#fff\" d=\"M11 6h2v5.2l4 2.3-1 1.73-5-2.9V6Z\"/><circle cx=\"12\" cy=\"12\" r=\"1.45\" fill=\"#fff\"/></svg>", "insurance": "<svg viewBox=\"0 0 24 24\"><path fill=\"#14966D\" d=\"m12 1.5 9 3.85v6.1c0 5.7-3.52 9.3-9 11.05-5.48-1.75-9-5.35-9-11.05v-6.1L12 1.5Z\"/><path fill=\"#fff\" d=\"m7.5 11.8 2.72 2.72 6.35-7.02 1.78 1.6-8.04 8.9-4.5-4.5 1.69-1.7Z\"/></svg>", "target": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#F06449\"/><circle cx=\"12\" cy=\"12\" r=\"6.2\" fill=\"#fff\"/><circle cx=\"12\" cy=\"12\" r=\"3.1\" fill=\"#F06449\"/><circle cx=\"12\" cy=\"12\" r=\"1.15\" fill=\"#fff\"/></svg>", "memberships": "<svg viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"7.5\" r=\"4\" fill=\"#8247C9\"/><circle cx=\"17.2\" cy=\"8.2\" r=\"3.2\" fill=\"#A56DE8\"/><path fill=\"#8247C9\" d=\"M1.5 21c.2-5.25 2.35-8 6.5-8s6.3 2.75 6.5 8h-13Z\"/><path fill=\"#A56DE8\" d=\"M13.2 21c.15-4.35 1.65-6.7 4.8-6.7 2.9 0 4.38 2.35 4.5 6.7h-9.3Z\"/></svg>", "outreach": "<svg viewBox=\"0 0 24 24\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#3478D4\"/><path fill=\"#fff\" d=\"m3.15 6.3 8.85 7 8.85-7 1.25 1.6L12 15.9 1.9 7.9l1.25-1.6Z\" opacity=\".95\"/></svg>", "report": "<svg viewBox=\"0 0 24 24\"><rect x=\"2\" y=\"13\" width=\"5\" height=\"9\" rx=\"1.5\" fill=\"#84B91E\"/><rect x=\"9.5\" y=\"7\" width=\"5\" height=\"15\" rx=\"1.5\" fill=\"#6EA511\"/><rect x=\"17\" y=\"2\" width=\"5\" height=\"20\" rx=\"1.5\" fill=\"#568A08\"/></svg>"};
  const LABEL  = {"completed": "Completed", "needs": "Needs work", "blocked": "Blocked", "cannot": "Cannot see"};

  let current = 'wolfpack';
  let lastLoad = {};          // client -> the parts array we last rendered

  const $ = s => document.querySelector(s);
  const groupsEl = $('#groups'), hello = $('#hello'), trade = $('#trade'),
        meeting = $('#meeting-text'), countsEl = $('#counts'),
        btn = $('#recheck'), note = $('#recheck-note'),
        summary = $('#summary');

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  // The database carries six connection values; the card shows three states.
  // Keeping the DB's word in the pill means "wrong level" and "expired" stay
  // visible instead of both flattening into a generic "not connected" —
  // the Jobber invite that was field-crew-level is a different problem from
  // never having asked, and the board is useless if it cannot tell them apart.
  const CONN = {
    connected:      ['yes', 'Connected'],
    not_applicable: ['na',  'Not applicable'],
    wrong_level:    ['no',  'Wrong level'],
    pending:        ['no',  'Invite pending'],
    expired:        ['no',  'Access expired'],
    never_asked:    ['no',  'Never asked'],
  };

  function card(p) {
    const [cls, connLabel] = CONN[p.connection] || ['no', 'Not connected'];
    const dim = p.state === 'cannot' ? ' dim' : '';
    const icon = ICONS[p.icon] || '';
    // access_detail is meant to carry the ACCESS LEVEL — "Manager", "Editor",
    // "Read only", "Via Google" — which is the fact the connection state cannot
    // tell you and the one that decides what you can actually do. Often it just
    // restates the state instead ("Not connected", "Not applicable"), and then
    // printing both gives you "Not applicable  Not applicable".
    //
    // So: show it only when it adds a level, and only when it fits. The one
    // long value in the data, "Field crew level, no reporting", is already
    // spelled out in the card's status line — truncating it to "Field crew le…"
    // in the pill costs a readable row and returns nothing.
    const detail = (p.access_detail || '').trim();
    const norm = t => t.toLowerCase().replace(/[^a-z]/g, '');
    const RESTATES = ['connected', 'notconnected', 'notapplicable'];
    const adds = detail &&
                 !RESTATES.includes(norm(detail)) &&
                 norm(detail) !== norm(connLabel) &&
                 detail.length <= 12;
    return '<a class="part-card' + dim + '" href="part.html?client=' + encodeURIComponent(current) +
      '&part=' + encodeURIComponent(p.part_key) + '" data-part="' + esc(p.name) +
      '" data-key="' + esc(p.part_key) + '" data-state="' + esc(p.state) + '">' +
      '<div class="card-top"><span class="glyph ' + esc(p.icon) + '" aria-hidden="true">' + icon + '</span>' +
      '<span class="health ' + esc(p.state) + '">' + esc(LABEL[p.state] || p.state) + '</span></div>' +
      '<h3>' + esc(p.name) + '</h3>' +
      '<p class="status-line">' + esc(p.status_line) + '</p>' +
      '<p class="suggest"><span class="k">Do next</span>' + esc(p.suggestion) + '</p>' +
      '<div class="access-row"><span class="conn ' + cls + '">' + esc(connLabel) + '</span>' +
      (adds ? '<span class="access-pill" title="' + esc(detail) + '">' + esc(detail) + '</span>' : '') +
      '<span class="arrow" aria-hidden="true">&rarr;</span></div></a>';
  }

  function groupsHtml(parts) {
    if (!parts.length) {
      return '<p class="status-line">This client is not set up yet. ' +
             'Add the parts we look after and they will show here.</p>';
    }
    const order = [];
    const byGroup = {};
    for (const p of parts) {
      if (!byGroup[p.group_name]) { byGroup[p.group_name] = []; order.push(p.group_name); }
      byGroup[p.group_name].push(p);
    }
    return order.map(g =>
      '<section class="group"><div class="group-head"><h2>' + esc(g) + '</h2>' +
      '<span class="group-count">' + byGroup[g].length + ' parts</span></div>' +
      '<div class="card-grid">' + byGroup[g].map(card).join('') + '</div></section>'
    ).join('');
  }

  // An honest state for every way this can fail to show real data. A board
  // that renders empty when it is actually signed out teaches you to distrust
  // it, which is worse than showing nothing.
  const meetingBar = $('#meeting-bar'), recheckBar = $('#recheck-bar');

  // Hide the client data and the actions, not just the cards. A page that says
  // "you are signed out" while still displaying a named client's next meeting
  // is contradicting itself, and offering a refresh button that cannot refresh
  // anything is a control that does nothing.
  function chrome(on) {
    meetingBar.style.display = on ? '' : 'none';
    recheckBar.style.display = on ? '' : 'none';
  }

  function message(title, body, action) {
    groupsEl.innerHTML = '<div class="board-message"><b>' + esc(title) + '</b>' +
      '<p>' + esc(body) + '</p>' + (action || '') + '</div>';
    countsEl.innerHTML = '';
    summary.classList.remove('on');
    chrome(false);
  }

  async function load(key, { silent = false } = {}) {
    current = key;
    const meta = META[key] || { name: key, trade: '', meeting: '' };
    hello.textContent = 'Hello, ' + meta.name + '.';
    trade.textContent = meta.trade;
    meeting.textContent = meta.meeting;
    document.querySelectorAll('.client').forEach(a =>
      a.classList.toggle('selected', a.dataset.client === key));
    if (!silent) { summary.classList.remove('on'); groupsEl.innerHTML =
      '<p class="status-line">Reading the record...</p>'; }

    let res, data;
    try {
      res = await fetch('/api/client-parts?client=' + encodeURIComponent(key),
                        { credentials: 'same-origin', cache: 'no-store' });
      data = await res.json();
    } catch (e) {
      message('Could not reach the board.',
              'The record did not answer, so nothing below would be trustworthy. ' +
              'Check your connection and try again.');
      return null;
    }

    if (res.status === 401 || res.status === 403 || data.auth === false) {
      message('You are signed out.',
              'This board shows client information, so it needs you signed in. ' +
              'Sign in and it will load.',
              '<a class="recheck-btn" href="/dashboard">Sign in</a>');
      return null;
    }
    if (!res.ok) {
      message('The board could not load.', data.error || ('Error ' + res.status));
      return null;
    }

    chrome(true);
    const parts = data.parts || [];
    lastLoad[key] = parts;
    groupsEl.innerHTML = groupsHtml(parts);

    const c = data.counts || {};
    // "Never checked" is on the board on purpose. Every part here was typed in
    // by a person; nothing has been machine-checked yet. Hiding that number
    // would let the board imply a verification that has not happened.
    const pill = (n, label, tone) =>
      '<span class="count-pill' + (tone ? ' ' + tone : '') + '"><b>' + n + '</b> ' + label + '</span>';
    countsEl.innerHTML =
      pill(c.total || 0, 'parts') +
      pill(c.attention || 0, 'need attention') +
      pill(c.cannot || 0, 'cannot see') +
      pill(c.completed || 0, 'completed') +
      (parts.length ? pill(c.unchecked || 0, 'never checked', 'quiet') : '');

    return data;
  }

  $('#client-search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.client').forEach(a => {
      const hit = a.querySelector('.client-name').textContent.toLowerCase().includes(q);
      a.style.display = hit ? '' : 'none';
    });
  });

  document.querySelectorAll('.client').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); load(a.dataset.client);
  }));

  // ── REFRESH, NOT "RE-CHECK" ────────────────────────────────────────────────
  // This button used to run a scripted animation and then announce that three
  // named cards had updated, while nothing had been read and nothing had
  // changed. With the board on live data that is not a harmless placeholder,
  // it is the board asserting a verification it never performed.
  //
  // What it does now is exactly what it says: re-reads the record and reports
  // the difference, including "nothing changed", which is the honest and most
  // common answer. Going out and actually looking at Google, Yelp and Jobber is
  // the dispatched re-check — a real task that appends evidence as it works —
  // and until that exists this button must not imply it.
  btn.addEventListener('click', async () => {
    const before = lastLoad[current] || [];
    btn.disabled = true; note.textContent = 'Reading the record...';
    summary.classList.remove('on');

    const data = await load(current, { silent: true });
    btn.disabled = false; note.textContent = '';
    if (!data) return;

    const was = Object.fromEntries(before.map(p => [p.part_key, p]));
    const changed = (data.parts || []).filter(p => {
      const b = was[p.part_key];
      return b && (b.state !== p.state || b.status_line !== p.status_line ||
                   b.connection !== p.connection || b.suggestion !== p.suggestion);
    });

    if (!before.length) {
      summary.innerHTML = '<b>Record loaded.</b> ' + (data.counts?.total || 0) +
        ' parts. Nothing here has been machine-checked yet, so every state is ' +
        'what a person entered.';
    } else if (!changed.length) {
      summary.innerHTML = '<b>Nothing changed.</b> Re-read all ' +
        (data.counts?.total || 0) + ' parts and every one matches what was ' +
        'already on screen.';
    } else {
      summary.innerHTML = '<b>' + changed.length + ' part' +
        (changed.length === 1 ? '' : 's') + ' changed.</b><ul>' +
        changed.map(p => '<li>' + esc(p.name) + ' &mdash; ' + esc(p.status_line) + '</li>').join('') +
        '</ul>';
      changed.forEach(p => {
        const el = document.querySelector('[data-key="' + p.part_key + '"]');
        if (!el) return;
        el.classList.add('updated');
        setTimeout(() => el.classList.remove('updated'), 2600);
      });
    }
    summary.classList.add('on');
  });

  load('wolfpack');
</script>
</body>
