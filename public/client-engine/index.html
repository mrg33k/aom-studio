  function groupsHtml(parts) {
    if (!parts.length) {
      // It used to say "Add the parts we look after and they will show here"
      // on a screen with no way to add one. An empty state that names an action
      // it does not offer is a dead end wearing an instruction's clothes; this
      // one says what is true and where the work actually happens.
      return '<p class="status-line">No parts have been set up for this client yet, ' +
             'so there is nothing here to be right or wrong about. Parts are ' +
             'created when the client is onboarded — this board reads them, it ' +
             'does not create them.</p>';
    }
    const order = [];
    const byGroup = {};
    for (const p of parts) {
      if (!byGroup[p.group_name]) { byGroup[p.group_name] = []; order.push(p.group_name); }
      byGroup[p.group_name].push(p);
    }
    // Same ranking inside a group as the day view uses inside a bucket: the
    // card that frees the most others sits first. Everything else keeps the
    // record's order, so this reorders exactly what it has a reason to.
    return order.map(g =>
      '<section class="group"><div class="group-head"><h2>' + esc(g) + '</h2>' +
      '<span class="group-count">' + byGroup[g].length + ' parts</span></div>' +
      '<div class="card-grid">' + byUnblocks(byGroup[g]).map(card).join('') + '</div></section>'
    ).join('');
  }

  // ── A LONE CARD ON THE LAST ROW ───────────────────────────────────────────
  // Measured rather than guessed. getComputedStyle resolves an auto-fill grid
  // to its actual track list, so this is the real column count at this width,
  // not an assumption about a breakpoint. A card is stretched only when it is
  // genuinely alone on the last row — never when the group happens to be odd.
  function balanceGrids() {
    document.querySelectorAll('.card-grid').forEach((grid) => {
      const cols = getComputedStyle(grid).gridTemplateColumns.split(/\s+/).filter(Boolean).length;
      const cards = grid.querySelectorAll('.part-card');
      cards.forEach((c) => c.classList.remove('wide'));
      if (cols > 1 && cards.length > cols && cards.length % cols === 1) {
        cards[cards.length - 1].classList.add('wide');
      }
    });
  }

  // The column count changes with the window, and a card stretched for two
  // columns is wrong at three. Cheap enough to run on every resize settle.
  let balanceTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(balanceTimer);
    balanceTimer = setTimeout(balanceGrids, 120);
  });

  // An honest state for every way this can fail to show real data. A board
  // that renders empty when it is actually signed out teaches you to distrust
  // it, which is worse than showing nothing.
  const meetingBar = $('#meeting-bar'), recheckBar = $('#recheck-bar'),
        nextUpEl = $('#next-up');

  // Hide the client data and the actions, not just the cards. A page that says
  // "you are signed out" while still displaying a named client's next meeting
  // is contradicting itself, and offering a refresh button that cannot refresh
  // anything is a control that does nothing.
  function chrome(on) {
    // The meeting bar is NOT turned back on here — renderMeeting owns it, and
    // only the API can say there is one to show. Turning it on with the rest of
    // the chrome would put an empty coloured bar under the greeting on every
    // client with nothing booked.
    if (!on) { meetingBar.style.display = 'none'; nextUpEl.style.display = 'none'; }
    recheckBar.style.display = on ? '' : 'none';
  }

  // ── THE MEETING, ONLY WHILE IT IS STILL TRUE ──────────────────────────────
  // Whether there IS one is the API's call, not this screen's: it serves the
  // meeting while the start time is ahead of us and null the moment it is not.
  // null covers both "never set" and "been and gone", and this renders nothing
  // for it. There is no honest third thing to say — a "nothing booked" chip is
  // a nag, and a stale badge is the bug this replaced.
  //
  // The expiry is deliberately NOT computed here. If it were, the next surface
  // to render a meeting would have to remember to, and one of them would not.
  // ── WHERE TO START ────────────────────────────────────────────────────────
  // One item, chosen by the only ranking on this board that is not an opinion:
  // how many unfinished parts are waiting on this one. Same key the day sorts
  // its buckets by, same reason — there is no age, no effort estimate and no
  // score in the record, so every other candidate would have to be invented.
  //
  // Two rules on top of that ordering, both borrowed rather than invented:
  //
  //   COMPLETED PARTS ARE NOT ACTIONS. Nothing to start on something finished.
  //
  //   NEITHER IS SOMETHING WE CANNOT MOVE. The day already refuses to put an
  //   access-blocked part in "Needs you", because a part we were never given
  //   keys to is not a task anyone can do today. Putting one under "Start here"
  //   would contradict the screen next door. If EVERY open part is like that,
  //   the chase is the work and the top one is still the answer.
  const oursToMove = (p) => !p.waiting_on &&
    p.connection !== 'never_asked' && p.connection !== 'pending' &&
    p.connection !== 'wrong_level' && p.connection !== 'expired';

  function nextUp(parts) {
    const open = (parts || []).filter((p) => p.state !== 'completed');
    if (!open.length) return null;
    const ours = open.filter(oursToMove);
    return byUnblocks(ours.length ? ours : open)[0] || null;
  }

  function renderNextUp(parts) {
    const p = nextUp(parts);
    if (!p) { nextUpEl.style.display = 'none'; nextUpEl.innerHTML = ''; return; }
    // The chip carries the number; the sentence carries the reason. Printing
    // "3" twice would be one fact wearing two costumes.
    const basis = unblocks(p)
      ? 'It is first because more of this client\'s work is waiting on this one than on anything else.'
      : 'Nothing on this client is holding anything else up, so there is no order to these — ' +
        'this is simply the first one on the board.';
    nextUpEl.style.display = '';
    nextUpEl.innerHTML =
      '<div class="next-up-top"><span class="k">Start here</span>' + blocksChip(p) + '</div>' +
      '<h2 class="next-up-name">' + esc(p.name) + '</h2>' +
      '<p class="next-up-why">' + esc(p.why_it_matters || p.status_line || '') + '</p>' +
      '<p class="next-up-basis">' + esc(basis) + '</p>' +
      '<a class="next-up-go" href="/client-engine/part.html?client=' + encodeURIComponent(current) +
      '&part=' + encodeURIComponent(p.part_key) + '">Open ' + esc(p.name) + '</a>';
  }

  function renderMeeting(m) {
    const line = m ? [m.when, m.label].filter(Boolean).join(' · ') : '';
    meetingBar.style.display = line ? '' : 'none';
    meeting.textContent = line;
  }

  // The rail is a CLIENT's room and a CLIENT's folder. The day spans every
  // client, so there is no room to show — leaving it mounted put an empty pane
  // and a composer with nowhere to send beside the list.
  function showRail(on) {
    rail.style.display = on ? '' : 'none';
    document.querySelector('.app').classList.toggle('has-rail', on);
  }

  function message(title, body, action) {
    groupsEl.innerHTML = '<div class="board-message"><b>' + esc(title) + '</b>' +
      '<p>' + esc(body) + '</p>' + (action || '') + '</div>';
    countsEl.className = 'counts';
    countsEl.innerHTML = '';
    summary.classList.remove('on');
    chrome(false);
  }

  async function load(key, { silent = false } = {}) {
    current = key;
    const meta = CLIENTS[key] || { name: key, trade: '' };
    eyebrow.textContent = 'Client home';
    hello.textContent = 'Hello, ' + meta.name + '.';
    trade.textContent = meta.trade;
    // Hide it while the fetch is in flight. Leaving the previous client's
    // meeting up under a new client's name is a sentence about the wrong
    // person, and it is on screen for as long as the request takes.
    renderMeeting(null);
    nextUpEl.style.display = 'none';
    document.querySelectorAll('.client').forEach(a =>
      a.classList.toggle('selected', !!a.dataset.client && a.dataset.client === key));
    if (!silent) { summary.classList.remove('on'); groupsEl.innerHTML =
      '<p class="status-line">Reading the record...</p>'; }

    let res, data;
    try {
      res = await fetch('/api/client-parts?client=' + encodeURIComponent(key),
                        { credentials: 'same-origin', cache: 'no-store', headers: authed() });
      data = await res.json();
    } catch (e) {
      message('Could not reach the board.',
              'The record did not answer, so nothing below would be trustworthy. ' +
              'Check your connection and try again.');
      return null;
    }

    if (res.status === 401 || res.status === 403 || data.auth === false) {
      message('You are signed out.',
              'This board shows client information, so it needs you signed in. ' +
              'Sign in and it will load.',
              '<a class="recheck-btn" href="/dashboard?next=' +
              encodeURIComponent(location.pathname) + '">Sign in on the dashboard, ' +
              'then come back to this page</a>');
      return null;
    }
    if (!res.ok) {
      message('The board could not load.', data.error || ('Error ' + res.status));
      return null;
    }

    chrome(true);
    showRail(true);
    renderMeeting(data.next_meeting);
    const parts = data.parts || [];
    lastLoad[key] = parts;
    renderNextUp(parts);
    groupsEl.innerHTML = groupsHtml(parts);
    balanceGrids();

    const c = data.counts || {};
    // "Never checked" is on the board on purpose. Every part here was typed in
    // by a person; nothing has been machine-checked yet. Hiding that number
    // would let the board imply a verification that has not happened.
    const pill = (n, label, tone) =>
      '<span class="count-pill' + (tone ? ' ' + tone : '') + '"><b>' + n + '</b> ' + label + '</span>';
    countsEl.className = 'counts';   // the day view borrows this element as tiles
    countsEl.innerHTML =
      pill(c.total || 0, 'parts') +
      pill(c.attention || 0, 'need attention') +
      pill(c.cannot || 0, 'cannot see') +
      pill(c.completed || 0, 'completed') +
      (parts.length ? pill(c.unchecked || 0, 'never checked', 'quiet') : '');

    return data;
  }

  $('#client-search').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.client[data-client]').forEach(a => {
      const hit = a.querySelector('.client-name').textContent.toLowerCase().includes(q);
      a.style.display = hit ? '' : 'none';
    });
  });

  document.querySelectorAll('.client[data-client]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); load(a.dataset.client);
  }));

  // ── REFRESH, NOT "RE-CHECK" ────────────────────────────────────────────────
  // This button used to run a scripted animation and then announce that three
  // named cards had updated, while nothing had been read and nothing had
  // changed. With the board on live data that is not a harmless placeholder,
  // it is the board asserting a verification it never performed.
  //
  // What it does now is exactly what it says: re-reads the record and reports
  // the difference, including "nothing changed", which is the honest and most
  // common answer. Going out and actually looking at Google, Yelp and Jobber is
  // the dispatched re-check — a real task that appends evidence as it works —
  // and until that exists this button must not imply it.
  btn.addEventListener('click', async () => {
    const before = lastLoad[current] || [];
    btn.disabled = true; summary.classList.remove('on');

    // Ask for the REAL check — a dispatched pass that opens what it has an
    // address for and writes down what it saw. It runs outside the page, so
    // this reports what it STARTED, never what it found. The watcher below
    // shows findings as they land.
    note.textContent = 'Asking for a check...';
    let started = null;
    try {
      const rq = await fetch('/api/client-parts', {
        method: 'POST', credentials: 'same-origin',
        headers: authed({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ action: 'request_check', client: current }),
      });
      started = await rq.json();
      if (!rq.ok) started = null;
    } catch (e) { started = null; }

    const data = await load(current, { silent: true });
    btn.disabled = false; note.textContent = '';
    if (!data) return;

    if (started) {
      const unchecked = data.counts?.unchecked ?? 0;
      summary.innerHTML = '<b>' + (started.already
          ? 'A check is already running for this client.'
          : 'A check has started.') +
        '</b> It opens every part we have an address for and writes down what it ' +
        'saw, with the link it opened. Parts change here as it works — nothing ' +
        'below has been updated yet by this run.' +
        (unchecked ? ' <br>' + unchecked + ' of ' + (data.counts?.total ?? 0) +
          ' parts have no address recorded, so the check will report what is ' +
          'missing rather than pass them.' : '');
      summary.classList.add('on');
      watch();
      return;
    }
    summary.innerHTML = '<b>Could not start a check.</b> The board below is still ' +
      'the current record — it just has not been re-checked.';
    summary.classList.add('on');
    return;

    const was = Object.fromEntries(before.map(p => [p.part_key, p]));
    const changed = (data.parts || []).filter(p => {
      const b = was[p.part_key];
      return b && (b.state !== p.state || b.status_line !== p.status_line ||
                   b.connection !== p.connection || b.suggestion !== p.suggestion);
    });

    if (!before.length) {
      summary.innerHTML = '<b>Record loaded.</b> ' + (data.counts?.total || 0) +
        ' parts. Nothing here has been machine-checked yet, so every state is ' +
        'what a person entered.';
    } else if (!changed.length) {
      summary.innerHTML = '<b>Nothing changed.</b> Re-read all ' +
        (data.counts?.total || 0) + ' parts and every one matches what was ' +
        'already on screen.';
    } else {
      summary.innerHTML = '<b>' + changed.length + ' part' +
        (changed.length === 1 ? '' : 's') + ' changed.</b><ul>' +
        changed.map(p => '<li>' + esc(p.name) + ' &mdash; ' + esc(p.status_line) + '</li>').join('') +
        '</ul>';
      changed.forEach(p => {
        const el = document.querySelector('[data-key="' + p.part_key + '"]');
        if (!el) return;
        el.classList.add('updated');
        setTimeout(() => el.classList.remove('updated'), 2600);
      });
    }
    summary.classList.add('on');
  });

  // ── THE RAIL ──────────────────────────────────────────────────────────────
  // Chat goes through /api/dashboard/supabase-messages, the authenticated
  // production chat endpoint, NOT the embed widget pipeline. The embed door is
  // deliberately public and wildcard-CORS because it serves anonymous visitors
  // on other people's websites; pointing it at a client room would install an
  // unauthenticated write pump into AOM's own project rooms. This board is an
  // internal signed-in tool, so it uses the internal signed-in path — same
  // origin, same cookie, same tenant gate as the rest of the dashboard.
  const thread = $('#thread'), composer = $('#composer-input'), sendBtn = $('#send'),
        filesEl = $('#files'), rail = $('#rail');
  const AGENT = 'elon';   // a real EA slug; never project:<slug>, which routes nowhere
  let seenIds = new Set(), poller = null;

  document.querySelectorAll('.rail-tab').forEach(t => t.addEventListener('click', () => {
    const chat = t.id === 'tab-chat';
    $('#tab-chat').classList.toggle('on', chat);
    $('#tab-files').classList.toggle('on', !chat);
    $('#pane-chat').classList.toggle('on', chat);
    $('#pane-files').classList.toggle('on', !chat);
    if (!chat) loadFiles(current);
  }));

  // The agents write markdown. Escaping first and formatting second means the
  // bubble can never render caller-controlled HTML, but **bold** still reads as
  // bold instead of as four asterisks.
  function fmt(t) {
    return esc(t)
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  function msgHtml(m) {
    const mine = m.role === 'user';
    const who = mine ? (m.user_name || 'You') : (m.agent || 'Agent');
    return '<div class="msg' + (mine ? ' me' : '') + '"><span class="who">' + esc(who) +
      '</span><div class="bubble">' + fmt(m.text || '') + '</div></div>';
  }

  async function loadChat(key, { append = false } = {}) {
    if (!append) { thread.innerHTML = '<p class="rail-note">Reading the room...</p>'; seenIds = new Set(); }
    let rows;
    try {
      const r = await fetch('/api/dashboard/supabase-messages?client=aom&limit=50&project=' +
                            encodeURIComponent(key),
                            { credentials: 'same-origin', cache: 'no-store', headers: authed() });
      if (r.status === 401 || r.status === 403) {
        thread.innerHTML = '<p class="rail-note">Sign in to see this client\'s room.</p>'; return;
      }
      const d = await r.json();
      rows = Array.isArray(d) ? d : (d.messages || []);
    } catch (e) {
      thread.innerHTML = '<p class="rail-note">Could not reach the room.</p>'; return;
    }
    const fresh = rows.filter(m => !seenIds.has(m.id));
    fresh.forEach(m => seenIds.add(m.id));
    if (!append) {
      thread.innerHTML = rows.length
        ? rows.map(msgHtml).join('')
        : '<p class="rail-note">Nothing in this room yet. Tell the board what changed and it lands here.</p>';
    } else if (fresh.length) {
      thread.insertAdjacentHTML('beforeend', fresh.map(msgHtml).join(''));
    }
    if (fresh.length || !append) thread.scrollTop = thread.scrollHeight;
    return fresh;
  }

  async function send() {
    const text = composer.value.trim();
    if (!text) return;
    // Clear optimistically so the box feels responsive, but keep the text: if
    // the send fails, putting it back is the difference between "try again"
    // and "retype the paragraph you just lost".
    sendBtn.disabled = true; composer.value = '';
    const restore = () => { if (!composer.value) composer.value = text; };
    try {
      const r = await fetch('/api/dashboard/supabase-messages', {
        method: 'POST', credentials: 'same-origin',
        headers: authed({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({
          text, role: 'user', source: 'corner-dashboard',
          agent: AGENT, project: current, client_id: 'aom',
        }),
      });
      if (!r.ok) {
        const d = await r.json().catch(() => ({}));
        thread.insertAdjacentHTML('beforeend',
          '<p class="rail-note">Not sent: ' + esc(d.error || ('error ' + r.status)) + '</p>');
        thread.scrollTop = thread.scrollHeight;
        restore();
        return;
      }
      await loadChat(current, { append: true });
      // The agent replies asynchronously, and it may also change the record —
      // so poll for BOTH: new messages, and a board that no longer matches.
      watch();
    } catch (e) {
      thread.insertAdjacentHTML('beforeend',
        '<p class="rail-note">Not sent: could not reach the room.</p>');
      thread.scrollTop = thread.scrollHeight;
      restore();
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', send);
  composer.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // "Chat and see this whole thing update in real time." The agent's reply and
  // its edits to the record arrive at different moments, so this watches both
  // for two minutes after a send and stops on its own.
  function watch() {
    if (poller) clearInterval(poller);
    let ticks = 0;
    poller = setInterval(async () => {
      if (++ticks > 40) { clearInterval(poller); poller = null; return; }
      await loadChat(current, { append: true });
      await refreshBoardIfChanged();
    }, 3000);
  }

  async function refreshBoardIfChanged() {
    const before = lastLoad[current] || [];
    if (!before.length) return;
    const key = current;
    let data;
    try {
      const r = await fetch('/api/client-parts?client=' + encodeURIComponent(key),
                            { credentials: 'same-origin', cache: 'no-store', headers: authed() });
      if (!r.ok) return;
      data = await r.json();
    } catch (e) { return; }
    if (key !== current) return;   // the user switched clients mid-flight
    const was = Object.fromEntries(before.map(p => [p.part_key, p]));
    const changed = (data.parts || []).filter(p => {
      const b = was[p.part_key];
      return b && (b.state !== p.state || b.status_line !== p.status_line ||
                   b.connection !== p.connection || b.suggestion !== p.suggestion);
    });
    if (!changed.length) return;
    await load(key, { silent: true });
    changed.forEach(p => {
      const el = document.querySelector('[data-key="' + p.part_key + '"]');
      if (!el) return;
      el.classList.add('updated');
      setTimeout(() => el.classList.remove('updated'), 2600);
    });
  }

  // ── FILES ─────────────────────────────────────────────────────────────────
  // A client whose folder does not exist must SAY SO. Files reach a room by
  // path, so a folderless room is structurally undeliverable: the next file
  // written for it lands somewhere else and is simply gone. Rendering "no
  // files" for that case is the bug, not the report of it.
  async function loadFiles(key) {
    filesEl.innerHTML = '<p class="rail-note">Reading the folder...</p>';
    let d;
    try {
      const r = await fetch('/api/dashboard/project-files?slug=' + encodeURIComponent(key),
                            { credentials: 'same-origin', cache: 'no-store', headers: authed() });
      if (r.status === 401 || r.status === 403) {
        filesEl.innerHTML = '<p class="rail-note">Sign in to see this client\'s files.</p>'; return;
      }
      d = await r.json();
      if (!r.ok) {
        filesEl.innerHTML = '<p class="rail-note">' +
          esc(d.error || ('Error ' + r.status)) + '</p>'; return;
      }
    } catch (e) {
      filesEl.innerHTML = '<p class="rail-note">Could not reach the folder.</p>'; return;
    }
    if (key !== current) return;

    const canon = d.files || [], missions = d.missions || [];
    if (!canon.length && !missions.length) {
      filesEl.innerHTML = '<p class="rail-note"><b>This client has no folder yet.</b><br>' +
        'Until one exists, anything sent here has nowhere to land. Set the client up ' +
        'and its files will show.</p>';
      return;
    }
    const when = t => t ? new Date(t).toLocaleDateString('en-US',
      { month: 'short', day: 'numeric' }) : '';
    const row = f => '<div class="file-row"><span class="nm" title="' + esc(f.path || f.name) +
      '">' + esc(f.name) + '</span><span class="wh">' + esc(when(f.last_modified)) + '</span></div>';
    let html = '';
    if (canon.length) {
      html += '<div class="file-group"><h4>The client\'s own files</h4>' +
              canon.map(row).join('') + '</div>';
    }
    for (const m of missions) {
      if (!(m.files || []).length) continue;
      html += '<div class="file-group"><h4>' + esc(m.slug) + '</h4>' +
              m.files.map(row).join('') + '</div>';
    }
    filesEl.innerHTML = html;
  }

  // Switching clients must switch the rail too, or you are reading one
  // client's board beside another client's room.
  const _load = load;
  load = async function (key, opts) {
    const out = await _load(key, opts);
    if (!opts || !opts.silent) {
      if (poller) { clearInterval(poller); poller = null; }
      loadChat(key);
      if ($('#pane-files').classList.contains('on')) loadFiles(key);
    }
    return out;
  };

  // ── THE DAY ───────────────────────────────────────────────────────────────
  // The 8am question is not "how is Wolfpack", it is "what needs ME". The
  // split that matters is ours vs theirs: a part blocked because we were never
  // given access is not a task Patrik can do today, and mixing those into one
  // list is how a to-do list stops being believed.
  // ── acting on a row ────────────────────────────────────────────────────
  // Two of the three actions need a fact from Patrik before the API will take
  // them, and that is deliberate on the API's side, not an obstacle to route
  // around: `mark_done` refuses without a receipt, because nothing on this
  // board goes green on somebody's word alone, and `mark_waiting` refuses
  // without a name, because a row that says "waiting on a client" without
  // naming them is a row nobody ever chases. So the button opens the question
  // rather than firing and eating a 422.
  const ASK = {
    done: {
      label: 'What is the proof?',
      why: 'A link to what changed, or the exact words you saw. Nothing here goes ' +
           'green on memory alone — this line is what the next person reads.',
      place: 'https://... or what you saw',
      go: 'Mark it done',
      // A receipt that parses as a web address goes in the field the API
      // validates as one; anything else is a quote. Guessing wrong here is the
      // difference between a clickable receipt and a 400.
      body: (v) => /^https?:\/\//i.test(v.trim())
        ? { action: 'mark_done', artifact_url: v.trim(), artifact_kind: 'link' }
        : { action: 'mark_done', artifact_quote: v.trim() },
    },
    waiting: {
      label: 'Who are we waiting on?',
      // NOT "it moves to Waiting on a client". Every row already in that bucket
      // is there because of ACCESS — a different axis entirely — so this
      // sentence told six rows they were about to become something they had
      // been all along, on a screen whose credibility is that it does not say
      // things that are not so.
      why: 'Their name, so this becomes a call you can make rather than a row ' +
           'that sits. The board will show who we are chasing, and since when.',
      place: 'Ross, Robert, Mo...',
      go: 'Move it',
      body: (v) => ({ action: 'mark_waiting', waiting_on: v.trim() }),
    },
  };

  function closePrompt() {
    const open = groupsEl.querySelector('.prompt');
    if (open) open.remove();
  }

  // The controls now live on two surfaces, so "reload what you are looking at"
  // has to ask which one that is. It used to be `loadDay()` unconditionally,
  // which on a client page would have swapped the whole screen out from under
  // the card you just closed out.
  const refreshCurrent = () =>
    current === '__day__' ? loadDay() : load(current, { silent: true });

  // A row on the day, a card on a client page. Both open the question under
  // themselves rather than over the list, so closing six things out stays one
  // motion instead of six dialogs.
  const rowOf = (el) => el.closest('.day-row, .part-card');

  // ── NOT NAMED `send` ──────────────────────────────────────────────────────
  // It was, and the rail already had one. Two `function send` declarations in
  // one classic script is not a redeclaration error — the second silently wins
  // for BOTH names, so `sendBtn.addEventListener('click', send)` has been
  // wired to this one. Clicking Send in the chat posted a MouseEvent as the
  // payload and `undefined` as the client to /api/client-parts, got a 400, and
  // threw into nothing: no message sent, no error on screen, every client page.
  async function postAction(payload, client) {
    const r = await fetch('/api/client-parts', {
      method: 'POST', credentials: 'same-origin',
      headers: authed({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(Object.assign({ client }, payload)),
    });
    let out = null;
    try { out = await r.json(); } catch (e) { out = null; }
    if (!r.ok) throw new Error((out && out.error) || ('The board said no (' + r.status + ').'));
    return out;
  }

  // A lead lives in the scanner's store, so it is closed out against the
  // scanner's endpoint. Same session, same contract: the refusal comes back as
  // a sentence and is shown as written.
  async function postPickup(token, note) {
    const r = await fetch('/api/prospect-report?r=' + encodeURIComponent(token), {
      method: 'POST', credentials: 'same-origin',
      headers: authed({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ picked_up: { note } }),
    });
    let out = null;
    try { out = await r.json(); } catch (e) { out = null; }
    if (!r.ok) throw new Error((out && out.error) || ('The record said no (' + r.status + ').'));
    return out;
  }

  groupsEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('.act');
    if (!btn || !groupsEl.contains(btn)) return;
    e.preventDefault();
    const act = btn.dataset.act;

    if (act === 'cancel') return closePrompt();

    // "Not waiting" needs nothing from anyone — the chase simply ended.
    if (act === 'unwait') {
      btn.disabled = true;
      try {
        await postAction({ action: 'mark_waiting', part_key: btn.dataset.part, clear: true },
                         btn.dataset.client);
        await refreshCurrent();
      } catch (err) {
        btn.disabled = false;
        alertInline(btn, err.message);
      }
      return;
    }

    // Taking a person off the list asks the same kind of question as marking a
    // part done, for the same reason: "picked up" with nothing behind it is a
    // green tick with no receipt, and the next person to open this row is
    // about to phone a stranger who has already spoken to us once.
    if (act === 'pickup') {
      closePrompt();
      const rowEl = rowOf(btn);
      const box = document.createElement('div');
      box.className = 'prompt';
      box.innerHTML =
        '<label>What happened? &middot; ' + esc(btn.dataset.name) + '</label>' +
        '<p class="why">One line: what you said, or what they said. It is what the next person ' +
        'reads before calling them again, and it is the only thing that takes them off this list.</p>' +
        '<div class="prompt-row"><input type="text" ' +
        'placeholder="Called him, walking his Google listing Thursday">' +
        '<button type="button" class="act go" data-act="commit">Picked it up</button>' +
        '<button type="button" class="act" data-act="cancel">Cancel</button></div>';
      box.dataset.act = 'pickup';
      box.dataset.token = btn.dataset.token;
      rowEl.insertAdjacentElement('afterend', box);
      const pin = box.querySelector('input');
      pin.focus();
      pin.addEventListener('keydown', (k) => {
        if (k.key === 'Enter') box.querySelector('[data-act="commit"]').click();
        if (k.key === 'Escape') closePrompt();
      });
      return;
    }

    if (act === 'done' || act === 'waiting') {
      closePrompt();
      const ask = ASK[act];
      const rowEl = rowOf(btn);
      const box = document.createElement('div');
      box.className = 'prompt';
      box.innerHTML =
        '<label>' + esc(ask.label) + ' &middot; ' + esc(btn.dataset.name) + '</label>' +
        '<p class="why">' + esc(ask.why) + '</p>' +
        '<div class="prompt-row"><input type="text" placeholder="' + esc(ask.place) + '">' +
        '<button type="button" class="act go" data-act="commit">' + esc(ask.go) + '</button>' +
        '<button type="button" class="act" data-act="cancel">Cancel</button></div>';
      box.dataset.act = act;
      box.dataset.client = btn.dataset.client;
      box.dataset.part = btn.dataset.part;
      rowEl.insertAdjacentElement('afterend', box);
      const input = box.querySelector('input');
      input.focus();
      input.addEventListener('keydown', (k) => {
        if (k.key === 'Enter') box.querySelector('[data-act="commit"]').click();
        if (k.key === 'Escape') closePrompt();
      });
      return;
    }

    if (act === 'commit') {
      const box = btn.closest('.prompt');
      const input = box.querySelector('input');
      const val = input.value.trim();
      const old = box.querySelector('.err');
      if (old) old.remove();
      if (!val) { input.focus(); return; }
      btn.disabled = true;
      try {
        if (box.dataset.act === 'pickup') {
          await postPickup(box.dataset.token, val);
        } else {
          const ask = ASK[box.dataset.act];
          await postAction(Object.assign({ part_key: box.dataset.part }, ask.body(val)),
                           box.dataset.client);
        }
        await refreshCurrent();
      } catch (err) {
        // The refusal is the API's own sentence and it is written to be read.
        // Surfacing it beats replacing it with something vaguer of my own, and
        // the typed value stays put so nothing has to be typed twice.
        btn.disabled = false;
        const p = document.createElement('p');
        p.className = 'err';
        p.textContent = err.message;
        box.appendChild(p);
      }
    }
  });

  function alertInline(btn, msg) {
    const rowEl = rowOf(btn);
    closePrompt();
    const box = document.createElement('div');
    box.className = 'prompt';
    box.innerHTML = '<p class="err" style="margin:0">' + esc(msg) + '</p>';
    rowEl.insertAdjacentElement('afterend', box);
  }


  // ── SOMEBODY PRESSED GET STARTED ──────────────────────────────────────────
  // Read from the scanner's own store (/api/prospect-report?started=1), not
  // from client_parts. A lead is not a part: it has no client, no state, no
  // receipt, and it must never be counted in the four tiles — every one of
  // those numbers is the length of a list of PARTS, and it stops meaning that
  // the moment a stranger is added to one.
  const leadWhen = (t) => t
    ? new Date(t).toLocaleString('en-US',
        { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
    : '';

  // Still open = nobody has picked it up SINCE the last time they pressed.
  // Pressing again on a report we already called about is a new ask, not a
  // duplicate of the handled one, and the API refuses a second pickup by this
  // same comparison — one rule, both ends.
  const leadOpen = (l) => !l.picked_up || String(l.at || '') > String(l.picked_up.at || '');

  function leadRow(l) {
    const tel = String(l.phone || '').replace(/[^\d+]/g, '');
    const reach =
      (tel ? '<a class="reach" href="tel:' + esc(tel) + '">' + esc(l.phone) + '</a>' : '') +
      (l.email ? '<a class="reach" href="mailto:' + esc(l.email) + '">' + esc(l.email) + '</a>' : '');
    return '<div class="day-row lead" data-row="lead::' + esc(l.token) + '">' +
      '<a class="link" href="/scan/?r=' + encodeURIComponent(l.token) + '">' +
      '<span class="who">' + esc(l.company || 'Company not on the scan') + '</span>' +
      '<span class="what"><b>' + esc(l.name) +
      '<span class="when"> &middot; ' + esc(leadWhen(l.at)) + '</span></b>' +
      '<span class="lead-note">' +
      (l.note ? '&ldquo;' + esc(l.note) + '&rdquo;' : 'No note left.') +
      '</span></span></a>' +
      '<span class="lead-reach">' + reach + '</span>' +
      '<span class="row-acts"><button type="button" class="act" data-act="pickup" data-token="' +
      esc(l.token) + '" data-name="' + esc(l.name) + '">Picked it up</button></span>' +
      '<span class="st"><span class="health">Not picked up</span></span></div>';
  }

  async function loadDay() {
    current = '__day__';
    document.querySelectorAll('.client').forEach(a => a.classList.remove('selected'));
    document.querySelector('.day-link').classList.add('selected');
    eyebrow.textContent = 'Every client';
    hello.textContent = 'Your day.';
    trade.textContent = 'Every client, in one place.';
    chrome(false);
    showRail(false);
    groupsEl.innerHTML = '<p class="status-line">Reading every client...</p>';

    // Started before the parts read and awaited after it, so the list of people
    // waiting on a call costs the morning nothing. It resolves to its own error
    // object rather than throwing: a scanner that is down must not take the
    // client board down with it, and it must not silently print an empty list
    // either — an empty Get Started section and a broken one look identical,
    // and one of them is a person nobody called.
    const leadsReq = fetch('/api/prospect-report?started=1',
                           { credentials: 'same-origin', cache: 'no-store', headers: authed() })
      .then((r) => (r.ok ? r.json() : Promise.reject(new Error('Error ' + r.status))))
      .catch((e) => ({ error: String(e.message || e) }));

    let res, d;
    try {
      res = await fetch('/api/client-parts?view=day',
                        { credentials: 'same-origin', cache: 'no-store', headers: authed() });
      d = await res.json();
    } catch (e) {
      return message('Could not reach the record.',
                     'Nothing here would be trustworthy, so nothing is shown.');
    }
    if (res.status === 401 || res.status === 403 || d.auth === false) {
      return message('You are signed out.',
        'This board shows client information, so it needs you signed in.',
        '<a class="recheck-btn" href="/dashboard">Sign in on the dashboard, then come back</a>');
    }
    if (!res.ok) return message('Could not load your day.', d.error || ('Error ' + res.status));

    // Four tiles instead of one run-on line. Same four numbers, same source,
    // read at a glance instead of scanned. Nothing is derived, averaged or
    // trended — every value below is a length of a list on this response.
    const c = d.counts || {};
    countsEl.className = 'tiles';
    const tile = (n, label, tone) =>
      '<div class="tile ' + tone + '"><b>' + n + '</b><span>' + label + '</span></div>';
    countsEl.innerHTML =
      tile(c.needs_me || 0, 'Needs you', 'needs') +
      tile(c.waiting_on_client || 0, 'Waiting on a client', 'waiting') +
      tile(c.running || 0, 'Running', 'running') +
      tile(c.unchecked || 0, 'Never checked', 'unchecked');

    // Whether the overnight sweep actually ran is part of the answer. A board
    // that looks checked at 8am while nothing ran is the exact failure the
    // roadmap bans, so a bad night says so here rather than being invisible.
    const sw = d.sweep;
    let sweepHtml = '';
    if (!sw) {
      sweepHtml = '<div class="sweep-line bad">No overnight check is set up yet, so ' +
        'nothing below has been verified since someone last did it by hand.</div>';
    } else if (sw.last_error) {
      sweepHtml = '<div class="sweep-line bad">The last overnight check failed: ' +
        esc(sw.last_error) + '</div>';
    } else {
      sweepHtml = '<div class="sweep-line">Checked overnight' +
        (sw.last_run_at ? ' &middot; last run ' +
          new Date(sw.last_run_at).toLocaleString('en-US',
            { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '') +
        ' &middot; ' + (c.checked || 0) + ' of ' + (c.total || 0) +
        ' parts have ever been machine-checked.</div>';
    }

    // actsFor lives at the top of this file now — the client-page cards use the
    // same one. It reads the part instead of the bucket, so this row no longer
    // has to tell it which list it came out of.
    const row = (p) =>
      '<div class="day-row" data-row="' + esc(p.client) + '::' + esc(p.part_key) + '">' +
      '<a class="link" href="/client-engine/part.html?client=' + encodeURIComponent(p.client) +
      '&part=' + encodeURIComponent(p.part_key) + '">' +
      '<span class="who">' + esc(NAMES[p.client] || p.client) + '</span>' +
      '<span class="what"><b>' + esc(p.name) + '</b><span>' +
      esc(p.suggestion || p.status_line || '') + '</span></span></a>' +
      waitingChip(p) +
      blocksChip(p) +
      actsFor(p) +
      '<span class="st"><span class="health ' + esc(p.state) + '">' +
      esc(LABEL[p.state] || p.state) + '</span></span></div>';

    // Every bucket is ranked, not just "Needs you". A finished part that three
    // others were waiting on is the first thing you want to see confirmed, and
    // an access chase that frees three parts is the first call to make.
    // `.map(row)` is safe only because `row` takes exactly one argument — this
    // file has already shipped a bug where map handed an ARRAY INDEX into a
    // second parameter and every row past the first earned the wrong controls,
    // so it is still written out rather than passed by reference.
    const bucket = (title, why, list) => !list.length ? '' :
      '<section class="bucket"><div class="bucket-head"><h2>' + esc(title) + '</h2>' +
      '<span class="bucket-why">' + esc(why) + '</span></div>' +
      byUnblocks(list).map((p) => row(p)).join('') + '</section>';

    // ── the people, above the parts ───────────────────────────────────────
    // Oldest first, which is the only ranking here that is not invented: how
    // long somebody has been waiting for a call is a fact on the record. The
    // newest-first order the store returns is a filing order, not a call order.
    const lj = await leadsReq;
    let leadsHtml = '';
    if (lj && lj.error) {
      leadsHtml = '<div class="sweep-line bad">The Get Started list did not load (' +
        esc(lj.error) + '), so anyone who pressed it is missing from this screen.</div>';
    } else if (lj && Array.isArray(lj.leads)) {
      const open = lj.leads.filter(leadOpen)
        .sort((a, b) => String(a.at || '').localeCompare(String(b.at || '')));
      const handled = lj.leads.length - open.length;
      if (open.length) {
        leadsHtml =
          '<section class="bucket"><div class="bucket-head"><h2>Someone pressed Get Started</h2>' +
          '<span class="bucket-why">They read their own scan report and left a number. Nothing ' +
          'has been sent to them &mdash; the next thing that happens is you calling.</span></div>' +
          open.map((l) => leadRow(l)).join('') + '</section>';
      }
      if (handled) {
        leadsHtml += '<p class="lead-done">' + handled +
          (handled === 1 ? ' earlier one has' : ' earlier ones have') +
          ' been picked up. <a href="/scan/">The scanner console keeps them, with what was said</a>.</p>';
      }
    }

    // The `||` fallback used to sit after `sweepHtml + ...`, where it could
    // never fire — sweepHtml is never empty, so a board with nothing on it
    // still read as a full one. It now guards the buckets, which are the part
    // that can actually be empty.
    const buckets =
      bucket('Needs you', 'Ours to move. Nothing is stopping these but time.',
             d.needs_me || []) +
      bucket('Waiting on a client', 'We were never given the access. Chasing it is the work.',
             d.waiting_on_client || []) +
      bucket('Running', 'Done and holding. Nothing to do unless a check says otherwise.',
             d.running || []);

    groupsEl.innerHTML = leadsHtml + sweepHtml +
      (buckets || '<p class="status-line">Nothing on any client needs attention.</p>');
  }

  document.querySelector('.day-link').addEventListener('click', e => {
    e.preventDefault(); loadDay();
  });

  // The day is still the front door — open the board cold and you get every
  // client, which is the 8am question. `?client=` is the ONE way in that has
  // already named a client: the "Back to client home" link on a part page.
  // Without this the board could not honour it, so that link could only ever
  // land on the day no matter what it said.
  const wanted = new URLSearchParams(location.search).get('client');
  if (wanted && CLIENTS[wanted]) load(wanted); else loadDay();
</script>
</body>
</html>
