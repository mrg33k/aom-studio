<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Part</title>
<style>
    :root {
      color-scheme: light dark;
      --bg: #ede7dc;
      --panel: #fefcf9;
      --surface: #ffffff;
      --surface-strong: #ffffff;
      --surface-soft: #f5f0e8;
      --text: #262823;
      --muted: #6d7068;
      --line: #ddd8ce;
      --line-strong: #c9c3b7;
      --accent: #176c61;
      --accent-soft: #dbece7;
      --accent-text: #0d5249;
      --good: #26715b;
      --good-soft: #e2f1eb;
      --warn: #9b651b;
      --warn-soft: #faecd3;
      --bad: #a6473f;
      --bad-soft: #f8e3df;
      --quiet: #747870;
      --quiet-soft: #ecece7;
      --shadow: 0 12px 28px rgba(75, 58, 32, .08), 0 2px 8px rgba(75, 58, 32, .04);
      --shadow-hover: 0 18px 38px rgba(75, 58, 32, .14), 0 5px 14px rgba(75, 58, 32, .07);
      --panel-shadow: 0 28px 72px rgba(75, 58, 32, .13), 0 6px 20px rgba(75, 58, 32, .06);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-14: 56px;
      --space-18: 72px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }
    button { font: inherit; }

    .shell {
      width: min(calc(100% - 48px), 1320px);
      min-height: calc(100vh - 48px);
      margin: var(--space-6) auto;
      padding: var(--space-14) clamp(var(--space-8), 4vw, var(--space-14)) var(--space-18);
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: var(--panel-shadow);
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-6);
      margin-bottom: var(--space-6);
    }

    .back {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: var(--space-2);
      color: var(--muted);
      font-weight: 700;
      text-decoration: none;
    }

    .back:hover { color: var(--text); }
    .back svg { width: 18px; height: 18px; }

    .breadcrumbs {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-2);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .breadcrumbs a { overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
    .breadcrumbs a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .breadcrumbs .current { color: var(--text); font-weight: 700; }
    .crumb-separator { color: var(--line-strong); }

    .switcher-block { margin-bottom: var(--space-10); }

    .switcher-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-2);
    }

    .switcher-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .counter { color: var(--muted); font-size: 13px; white-space: nowrap; }

    .part-switcher {
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr) 40px;
      align-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .switch-arrow {
      display: grid;
      width: 40px;
      height: 52px;
      padding: 0;
      place-items: center;
      border: 0;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }

    .switch-arrow:first-child { border-right: 1px solid var(--line); }
    .switch-arrow:last-child { border-left: 1px solid var(--line); }
    .switch-arrow:hover { background: var(--surface-soft); color: var(--accent); }
    .switch-arrow svg { width: 18px; height: 18px; }

    .part-strip {
      display: flex;
      gap: var(--space-1);
      min-width: 0;
      padding: var(--space-2);
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .part-strip::-webkit-scrollbar { display: none; }

    .part-tab {
      display: inline-flex;
      flex: 0 0 auto;
      height: 40px;
      align-items: center;
      gap: var(--space-2);
      padding: 0 var(--space-3);
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }

    .part-tab:hover { background: var(--surface-soft); color: var(--text); }
    .part-tab.current { border-color: color-mix(in srgb, var(--warn) 28%, var(--line)); background: var(--warn-soft); color: var(--warn); }
    .part-tab.current:has(.status-dot.blocked) { border-color: color-mix(in srgb, var(--bad) 28%, var(--line)); background: var(--bad-soft); color: var(--bad); }
    .part-tab:has(.status-dot.unseen) { border-style: dashed; border-color: var(--line-strong); opacity: .58; }

    .status-dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: var(--warn); }
    .status-dot.blocked { background: var(--bad); }
    .status-dot.unseen { background: var(--quiet); }

    .part-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: var(--space-8);
      margin-bottom: var(--space-6);
    }

    .eyebrow {
      margin: 0 0 var(--space-2);
      color: var(--bad);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .part-header .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-1) var(--space-2);
      border-radius: 999px;
      background: var(--bad-soft);
    }

    .part-header .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    h1 {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin: 0;
      font-size: clamp(32px, 4vw, 42px);
      line-height: 1.12;
      letter-spacing: -.035em;
    }

    .part-glyph {
      display: grid;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 13px;
      background: #e8f0fe;
    }

    .part-glyph svg { width: 24px; height: 24px; }
    .header-copy { max-width: 720px; margin: var(--space-3) 0 0; color: var(--muted); font-size: 16px; }

    .external-button,
    .primary-button,
    .claim-button,
    .assistant-button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-6);
      border-radius: 999px;
      font-weight: 750;
      text-decoration: none;
      transition: transform .18s, background .18s, border-color .18s, box-shadow .18s;
    }

    .external-button {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--text);
      white-space: nowrap;
    }

    .external-button:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
    .external-button svg { width: 16px; height: 16px; }

    .consequence {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin-bottom: var(--space-3);
      padding: var(--space-6) var(--space-6);
      border: 1px solid color-mix(in srgb, var(--bad) 26%, var(--line));
      border-radius: 16px;
      background: var(--bad-soft);
      color: var(--text);
      font-size: 20px;
      font-weight: 760;
      line-height: 1.3;
      letter-spacing: -.015em;
    }

    .consequence-icon {
      display: grid;
      flex: 0 0 auto;
      width: 36px;
      height: 36px;
      place-items: center;
      border-radius: 50%;
      background: var(--bad);
      color: #fff;
      font-size: 20px;
    }

    .blocking {
      margin: 0 0 var(--space-10);
      padding: var(--space-4) var(--space-6);
      border-left: 3px solid var(--warn);
      border-radius: var(--space-1) var(--space-3) var(--space-3) var(--space-1);
      background: var(--warn-soft);
      color: color-mix(in srgb, var(--text) 86%, var(--warn));
    }

    .blocking strong { font-weight: 800; }
    .blocking a { color: inherit; font-weight: 750; text-decoration-color: color-mix(in srgb, var(--warn) 60%, transparent); text-underline-offset: 3px; }
    .blocking a:hover { color: var(--warn); }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      align-items: start;
      gap: var(--space-6);
    }

    .main-column, .right-column { min-width: 0; }
    .main-column { display: grid; grid-column: 1; grid-row: 1; gap: var(--space-6); }
    .right-column { display: contents; }
    .right-column > .side-card { grid-column: 2; grid-row: 1; }
    .access-card { grid-column: 1 / -1; grid-row: 2; }

    .panel {
      padding: var(--space-6);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .section-heading { margin-bottom: var(--space-6); }
    h2 { margin: 0; font-size: 20px; line-height: 1.25; letter-spacing: -.02em; }
    .section-note { margin: var(--space-2) 0 0; color: var(--muted); font-size: 13px; }

    /* .timeline / .timeline-item / .timeline-dot deleted 2026-08-05. Nothing on
       this page has ever rendered them — the trail is .trail / .ev — and the
       dot carried the file's only off-scale offset, a three-pixel one. There is
       more dead CSS above and below from the same mock; it is left alone
       deliberately rather than swept in the same pass as behaviour changes. */

    .event-line { margin: 0; font-size: 14px; }
    .event-date { color: var(--muted); font-weight: 750; }
    .event-copy { color: var(--text); font-weight: 650; }

    .actor {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-2);
      color: var(--muted);
      font-size: 12px;
    }

    .actor-type {
      padding: var(--space-1) var(--space-2);
      border-radius: 999px;
      background: var(--quiet-soft);
      color: var(--quiet);
      font-size: 12px;
      font-weight: 750;
    }

    .actor-type.assistant { background: var(--accent-soft); color: var(--accent-text); }

    .action-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-6);
    }

    .primary-button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(23, 108, 97, .2);
    }

    .primary-button:hover { transform: translateY(-1px); box-shadow: 0 12px 24px rgba(23, 108, 97, .26); }
    .primary-button svg, .assistant-button svg { width: 17px; height: 17px; }

    .claim-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-4) 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .claim-state { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
    .claim-avatar { display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: var(--quiet-soft); color: var(--quiet); font-size: 12px; font-weight: 800; }
    .claim-avatar.claimed { background: var(--accent-soft); color: var(--accent-text); }
    .claim-label { color: var(--muted); font-size: 12px; }
    .claim-owner { font-size: 14px; font-weight: 750; }

    .claim-button {
      min-height: 40px;
      padding: var(--space-2) var(--space-4);
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    .claim-button:hover { border-color: var(--accent); color: var(--accent); }

    .assistant-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); padding-top: var(--space-6); }
    .assistant-copy { min-width: 0; }
    .assistant-copy strong { display: block; }
    .assistant-copy span { display: block; margin-top: var(--space-1); color: var(--muted); font-size: 13px; }

    .assistant-button {
      border: 1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
      background: var(--accent-soft);
      color: var(--accent-text);
      cursor: pointer;
      white-space: nowrap;
    }

    .assistant-button:hover { border-color: var(--accent); transform: translateY(-1px); }
    .assistant-button:disabled { cursor: wait; opacity: .72; transform: none; }

    .checklist { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }

    .check-item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr);
      gap: var(--space-3);
      padding: var(--space-4) 0;
      border-top: 1px solid var(--line);
    }

    .check-item:first-child { border-top: 0; padding-top: 0; }

    .check-symbol {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      background: var(--quiet-soft);
      color: var(--quiet);
      font-size: 16px;
      font-weight: 850;
    }

    .check-item[data-state="fail"] .check-symbol { background: var(--bad-soft); color: var(--bad); }
    .check-item[data-state="pass"] .check-symbol { background: var(--good-soft); color: var(--good); }
    .check-item[data-state="unknown"] .check-symbol { border: 1px dashed var(--line-strong); background: transparent; color: var(--quiet); }
    .check-item[data-state="checking"] .check-symbol { background: var(--accent-soft); color: var(--accent); font-size: 0; }

    .check-item[data-state="checking"] .check-symbol::after {
      width: 12px;
      height: 12px;
      border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
      border-top-color: var(--accent);
      border-radius: 50%;
      content: "";
      animation: spin .75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .check-name { font-weight: 700; line-height: 1.35; }
    .check-meta { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-1); color: var(--muted); font-size: 12px; }
    .check-result { font-weight: 750; }
    .check-item[data-state="fail"] .check-result { color: var(--bad); }
    .check-item[data-state="pass"] .check-result { color: var(--good); }
    .check-item[data-state="unknown"] .check-result { color: var(--quiet); }
    .check-item[data-state="checking"] .check-result { color: var(--accent); }

    .recheck-note { margin: var(--space-1) 0 0; padding-top: var(--space-4); border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

    .access-status {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      margin-top: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-radius: 999px;
      background: var(--good-soft);
      color: var(--good);
      font-size: 12px;
      font-weight: 800;
    }

    .access-status::before { width: 7px; height: 7px; border-radius: 50%; background: currentColor; content: ""; }
    .access-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; column-gap: var(--space-6); }
    .access-card .access-status { margin-top: 0; }
    .access-list { display: grid; grid-column: 1 / -1; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); margin: var(--space-6) 0 0; }
    .access-line { display: block; min-width: 0; padding: var(--space-3) 0 0; border-top: 1px solid var(--line); }
    .access-line dt { color: var(--muted); font-size: 13px; }
    .access-line dd { margin: var(--space-1) 0 0; font-weight: 700; }
    .access-line dd.permits { font-weight: 550; }
    .freshness-note { grid-column: 1 / -1; margin: var(--space-4) 0 0; padding: var(--space-3); border-radius: 12px; background: var(--surface-soft); color: var(--muted); font-size: 12px; }

    .toast {
      position: fixed;
      right: var(--space-6);
      bottom: var(--space-6);
      z-index: 10;
      max-width: min(360px, calc(100vw - 40px));
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-strong);
      box-shadow: var(--shadow);
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .2s, transform .2s;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    button:focus-visible, a:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 34%, transparent); outline-offset: 2px; }

    @media (max-width: 900px) {
      .content-grid { grid-template-columns: minmax(0, 1fr) 320px; }
    }

    @media (max-width: 760px) {
      .shell { width: calc(100% - 32px); margin: var(--space-4) auto; padding: var(--space-10) var(--space-6) var(--space-14); border-radius: 24px; }
      .switcher-block { margin-bottom: var(--space-8); }
      .part-header { grid-template-columns: 1fr; align-items: start; gap: var(--space-6); }
      .external-button { justify-self: start; }
      .content-grid { grid-template-columns: 1fr; }
      .main-column { display: contents; }
      .evidence-panel { grid-column: 1; grid-row: 1; }
      .right-column > .side-card { grid-column: 1; grid-row: 2; }
      .actions-panel { grid-column: 1; grid-row: 3; }
      .access-card { grid-column: 1; grid-row: 4; }
      .access-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 520px) {
      .shell { width: calc(100% - 24px); margin: var(--space-3) auto; padding: var(--space-10) var(--space-6) var(--space-14); }
      .top-row { display: block; margin-bottom: var(--space-6); }
      .breadcrumbs { justify-content: flex-start; margin-top: var(--space-4); overflow: hidden; }
      .breadcrumbs a:last-child { max-width: 154px; }
      .switcher-meta { align-items: flex-end; }
      .counter { white-space: normal; text-align: right; }
      .part-switcher { grid-template-columns: 36px minmax(0, 1fr) 36px; }
      .switch-arrow { width: 36px; }
      .part-tab { padding: 0 var(--space-2); }
      .header-copy { font-size: 14px; }
      .consequence { align-items: flex-start; padding: var(--space-4); font-size: 16px; }
      .consequence-icon { width: 28px; height: 28px; font-size: 16px; }
      .blocking { margin-bottom: var(--space-8); padding: var(--space-3) var(--space-4); }
      .action-top { align-items: flex-start; flex-direction: column; }
      .primary-button { width: 100%; }
      .claim-row { align-items: flex-start; }
      .assistant-row { align-items: stretch; flex-direction: column; }
      .assistant-button { width: 100%; white-space: normal; }
      .access-list { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      html, .part-strip { scroll-behavior: auto; }
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }

      
    .board-message { padding: 24px; border-radius: 12px; background: var(--panel);
      border: 1px solid var(--line); max-width: 52ch; }
    .board-message b { display: block; font-size: 16px; margin-bottom: 8px; }
    .board-message p { margin: 0 0 16px; font-size: 14px; color: var(--muted); font-weight: 600; }
    /* THE STRIP SCROLLS, AND IT HAS TO SAY SO. 19 chips is 2885px of content in
       a 314px window on a phone. It clipped "Online reviews" to "Online revi"
       against a hard edge, which reads as a broken layout rather than as more
       to the right. Three parts to the fix and all three are needed:
       the fades (there IS more that way, shown only when there actually is),
       snap (a rest position never leaves a word cut in half), and centring the
       current chip on load — without that, opening part 17 showed chips 1-3
       and the highlighted one sat 2.3k pixels off screen. */
    .switcher-scroll { position: relative; }
    .switcher-scroll::before, .switcher-scroll::after {
      content: ""; position: absolute; top: 0; bottom: 16px; width: 32px;
      z-index: 1; opacity: 0; pointer-events: none; transition: opacity .18s; }
    .switcher-scroll::before { left: 0;
      background: linear-gradient(to right, var(--panel), rgba(254, 252, 249, 0)); }
    .switcher-scroll::after { right: 0;
      background: linear-gradient(to left, var(--panel), rgba(254, 252, 249, 0)); }
    .switcher-scroll[data-more-left]::before { opacity: 1; }
    .switcher-scroll[data-more-right]::after { opacity: 1; }
    .part-switcher { position: relative; display: flex; gap: 8px; overflow-x: auto;
      padding: 8px 0 16px; scroll-snap-type: x proximity; scroll-padding-left: 8px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    /* The native bar renders as a stub of grey cut by the shell's corner and
       reads as debris, not as an affordance. The fades are the affordance. */
    .part-switcher::-webkit-scrollbar { display: none; }
    .chip { display: inline-flex; align-items: center; gap: 8px; flex: none;
      scroll-snap-align: start;
      padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--surface); color: var(--text); text-decoration: none;
      font-size: 13px; font-weight: 700; white-space: nowrap; }
    .chip.on { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
    .chip.dim { opacity: .55; }
    .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
    .chip .dot.completed { background: var(--good); }
    .chip .dot.blocked { background: var(--bad); }
    .chip .dot.cannot { background: var(--quiet); }
    /* side-label was never defined anywhere, so both of these rendered as plain
       14px body text and read like a sentence rather than a rail label. And no
       margin-left:auto on the count: when the two do not fit on one line — and
       with a longer client name they will not — an auto-pushed count lands
       right-aligned under a left-aligned label and reads as a stray fragment. */
    .switcher-meta { display: flex; justify-content: space-between; align-items: baseline;
      gap: 16px; flex-wrap: wrap; }
    .side-label { font-size: 12px; font-weight: 800; text-transform: uppercase;
      letter-spacing: .09em; color: var(--muted); }
    .side-count { font-size: 12px; font-weight: 700; color: var(--muted); }
    .head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 16px 0 8px; }
    .head h1 { display: flex; align-items: center; gap: 16px; margin: 0; min-width: 0; }
    /* The title was a bare text node in a flex row, so it could only shrink to
       the width of its longest word and then pushed past the shell. "Association
       memberships" overran the right padding by 9px at 320. Wrapping it in a real
       element lets it be a flex item that can actually wrap, and anywhere is the
       backstop for a single word longer than the column. */
    .head h1 .t { min-width: 0; overflow-wrap: anywhere; }
    /* The state is the first thing you should read, so it has to look like the
       pill it is on the board — not plain text beside the title. */
    .head .health { display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 750;
      text-transform: uppercase; letter-spacing: .06em;
      background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
    .head .health::before { content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: currentColor; }
    .head .health.blocked { background: var(--bad-soft); color: var(--bad); }
    .head .health.completed { background: var(--good-soft); color: var(--good); }
    .head .health.cannot { background: var(--panel); color: var(--quiet); }
    /* The glyph carries the platform's own logo; without a box it collapsed. */
    .head .glyph { display: inline-flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; border-radius: 12px; background: var(--panel); flex: none; }
    .head .glyph svg { width: 24px; height: 24px; }

    /* Each mark is drawn for ITS OWN tile, not for a cream panel. LinkedIn's is
       a single path filled #fff, so on var(--panel) it was white on white —
       invisible on both LinkedIn part pages. The others carry their colour but
       lose the knockouts that shape them. The board already had these eighteen
       rules; the part page never got them, which is why a logo could look right
       on the card and vanish one tap later. */
    /* ── ONE RULE FOR THE ICON COLUMN ────────────────────────────────────────
       If the platform owns the mark, we show the mark in its own colours on its
       own ground — Google, Yelp, LinkedIn, Jobber. Recognising the platform in
       one glance is the entire job of those four.

       If WE drew it, it is our ink on our ground. It was not: the set invented
       indigo, hot pink, orange, cyan, lime, coral and two purples on a page
       whose palette contains none of them, and the loudest of them was a
       two-point sparkle in ChatGPT purple on the "AI answers" tile. Sparkle
       icons are banned outright and there is no purple here. A drawn glyph's
       hue was carrying no information at all, so it now carries none loudly:
       one ink, one warm tile, and the four brand marks become the only colour
       in the column — which is correct, because they are the wayfinding. */
    .head .glyph.google { background: #e8f0fe; }
    .head .glyph.reviews { background: var(--surface-soft); }
    .head .glyph.website { background: var(--surface-soft); }
    .head .glyph.yelp { background: #fde8e8; }
    .head .glyph.linkedin { background: #0a66c2; }
    .head .glyph.ai { background: var(--surface-soft); }
    .head .glyph.photo { background: var(--surface-soft); }
    .head .glyph.video { background: var(--surface-soft); }
    .head .glyph.case-study { background: var(--surface-soft); }
    .head .glyph.folder { background: var(--surface-soft); }
    .head .glyph.jobber { background: #def5e7; }
    .head .glyph.recurring { background: var(--surface-soft); }
    .head .glyph.follow-up { background: var(--surface-soft); }
    .head .glyph.insurance { background: var(--surface-soft); }
    .head .glyph.target { background: var(--surface-soft); }
    .head .glyph.memberships { background: var(--surface-soft); }
    .head .glyph.outreach { background: var(--surface-soft); }
    .head .glyph.report { background: var(--surface-soft); }
    .consequence { padding: 24px; border-radius: 12px; margin: 16px 0;
      background: var(--warn-soft); color: var(--warn); font-size: 16px; }
    .consequence.blocked { background: var(--bad-soft); color: var(--bad); }
    .consequence.completed { background: var(--good-soft); color: var(--good); }
    .blocks { padding: 16px 24px; border-left: 4px solid var(--warn);
      background: var(--warn-soft); color: var(--text); font-size: 14px;
      font-weight: 600; margin: 0 0 24px; }
    .content-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; }
    /* part.css collapses .main-column to display:contents under 760px, which put
       every card straight into the 24px grid gap while each card still carried
       its own 24px bottom margin — a 48px trench between cards on a phone, off
       the scale and the reason the page read loose. One rhythm, owned by the
       column, and the columns stay real columns at every width. */
    .main-column, .side-column { display: grid; gap: 24px; align-content: start; min-width: 0; }
    .card { padding: 24px; border-radius: 16px; background: var(--surface);
      border: 1px solid var(--line); margin: 0; }
    .card h2 { margin: 0 0 4px; }
    .card .sub { margin: 0 0 16px; font-size: 13px; color: var(--muted); font-weight: 600; }
    /* ── THE TRAIL COLOURED TRUST UPSIDE DOWN ────────────────────────────────
       Every "Assistant" tag was filled in the same green this board uses for
       VERIFIED GOOD, and every "Person" tag was var(--panel) on var(--surface)
       — #fefcf9 on #fff, near-invisible. So a line a machine typed looked
       confirmed and a line a human witnessed looked like nothing. After the
       Wolfpack session it was stark: the two claims now marked DISPUTED were
       wearing the green tag, and the two verified human lines were wearing the
       invisible one. Every dot down the timeline was that same green too —
       including the Aug 4 line that says the check FAILED.

       The rule now: the dot and the pills describe the CLAIM'S STANDING, never
       who typed it. Green is reserved for a machine check that carried a
       receipt (confidence 'verified' — the thing the database constraint
       actually guards), red for disputed, and everything else is neutral,
       because "a person reported this" is not a colour, it is the default. */
    .trail { list-style: none; margin: 0; padding: 0; }
    .ev { padding: 0 0 16px 24px; border-left: 2px solid var(--line); position: relative; }
    .ev:last-child { padding-bottom: 0; }
    .ev::before { content: ""; position: absolute; left: -6px; top: 4px; width: 10px;
      height: 10px; border-radius: 50%; background: var(--line-strong); }
    .ev.is-verified::before { background: var(--good); }
    .ev.is-disputed::before { background: var(--bad); }
    .ev-line { font-size: 14px; margin-bottom: 8px; }
    /* A disputed claim is still on the record — the trail never deletes — but
       it must not read as fact while you skim past it. */
    .ev.is-disputed .ev-line { color: var(--muted); }
    .ev.empty { color: var(--muted); font-weight: 600; font-size: 14px; }
    /* WHO SAID IT, told by structure rather than by hue. Person is the filled
       neutral chip and Assistant is the outlined one; neither borrows a colour
       that means something else three inches away. Both are legible, which is
       the whole of the bug. */
    .actor { display: inline-block; padding: 4px 8px; border-radius: 999px;
      background: var(--quiet-soft); color: var(--text);
      font-size: 12px; font-weight: 700; }
    .actor.assistant { background: transparent; color: var(--muted);
      box-shadow: inset 0 0 0 1px var(--line-strong); }
    /* The standing of the claim IS a state, so these two are filled pills, and
       they come first on the line — before the receipt, before the tag. */
    .standing { display: inline-block; padding: 4px 8px; border-radius: 999px;
      font-size: 12px; font-weight: 750; }
    .standing.verified { background: var(--good-soft); color: var(--good); }
    .standing.disputed { background: var(--bad-soft); color: var(--bad); }
    .receipt { font-size: 12px; font-weight: 700; color: var(--accent); }
    /* ── A SEARCH LINK IS NOT A RECEIPT ──────────────────────────────────────
       The most important claim on the Wolfpack account — "two listings exist
       under different names" — carried a "See the receipt" that opened a Google
       Maps SEARCH. Clicking it returned four results, none of them the second
       listing, and three inches lower the same page says twice that a search
       link is not a listing. The board presented as proof the exact thing it
       declares is not proof, and that unproven line ranked the job first across
       five accounts. A query is not a thing; it is a question, and it can
       answer differently tomorrow. It still opens — the trail deletes nothing —
       it just stops calling itself a receipt. */
    .searchlink { font-size: 12px; font-weight: 700; color: var(--muted); }
    .searchlink:hover { color: var(--text); }
    .not-receipt { display: inline-block; padding: 4px 8px; border-radius: 999px;
      background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong);
      color: var(--muted); font-size: 12px; font-weight: 700; }
    /* ── A QUOTED RECEIPT IS EVIDENCE, AND IT IS NOT A LINK ───────────────────
       The trail drew a receipt only when the proof was a web address. When the
       proof was the exact words somebody read — the OTHER half of what the API
       demands before it writes green, and the half the "Mark it done" box asks
       for by name — it drew nothing, so Gary's line sat badged "Verified, with
       a receipt" beside a receipt that did not exist on the page.

       It must not dress as a link. A link says "go and look"; a quote says
       "somebody looked, and these are the words they read". Rendering the
       second in the first's clothes produces a receipt that opens nothing,
       which is the failure this block exists to end. So: no accent colour, no
       underline, nothing to click. A left rule and a warm ground mark it as a
       transcription, and it takes a block of its own because unlike a chip it
       is meant to be READ, not counted. */
    .quoted { margin-top: 12px; padding: 12px 16px; border-radius: 0 12px 12px 0;
      border-left: 2px solid var(--line-strong); background: var(--surface-soft); }
    .quoted .k { display: block; font-size: 12px; font-weight: 750;
      text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .quoted q { display: block; margin-top: 8px; font-size: 14px; font-weight: 600;
      line-height: 1.5; color: var(--text); overflow-wrap: anywhere; }
    /* A "Disputed" badge whose stored reason is never shown is the same defect
       one paragraph up wearing red: the page states a verdict and withholds the
       thing that earns it. Both disputes on this account name a specific search
       run on a specific day; that sentence is the whole argument. */
    .dispute-note { margin-top: 12px; padding: 12px 16px; border-radius: 0 12px 12px 0;
      border-left: 2px solid var(--bad); background: var(--bad-soft);
      font-size: 13px; font-weight: 600; line-height: 1.5; color: var(--text); }
    .dispute-note .k { display: block; margin-bottom: 4px; font-size: 12px;
      font-weight: 750; text-transform: uppercase; letter-spacing: .06em;
      color: var(--bad); }
    .next { font-size: 16px; font-weight: 700; margin: 0 0 16px; }
    /* part.css gives .claim-row a bottom border, which separated it from the
       block the mock had underneath. Here it is the last thing in the card, so
       that border is a rule hanging under nothing. */
    /* THE OWNER HAS TO BE UNMISSABLE. It was 14px of grey body text at the
       bottom of the card, on a page whose only job is to get one thing done —
       an item nobody owns looked exactly like an item someone owned. Unclaimed
       is a STATE, so it is a solid pill, and it takes the foot of the card as a
       band. Claim/Release are actions, so they are outlined. */
    .claim-row { display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap; padding: 16px 0 0;
      border-top: 1px solid var(--line); border-bottom: 0; }
    .claim-row.unclaimed { margin: 16px -24px -24px; padding: 16px 24px;
      border-top: 1px solid var(--line);
      border-radius: 0 0 16px 16px; background: var(--surface-soft); }
    .claim-state { min-width: 0; }
    .owner-pill { display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 750;
      background: var(--accent-soft); color: var(--accent-text); }
    .owner-pill::before { content: ""; width: 8px; height: 8px; flex: none;
      border-radius: 50%; background: currentColor; }
    /* Not warn, and not quiet. Both already mean something on this board —
       "needs work" and "cannot see" — and ownership is a different axis, so
       borrowing either says something untrue about the state of the work. It
       is instead the only near-black object on a page of white cards and
       muted grey, which is what makes it impossible to skim past. */
    .owner-pill.none { background: var(--text); color: var(--panel); }
    .claim-btn { flex: none; padding: 12px 24px; border-radius: 999px;
      border: 1px solid var(--line-strong); background: var(--surface);
      color: var(--text); font-size: 13px; font-weight: 750; cursor: pointer; }
    .claim-btn:hover { border-color: var(--accent); color: var(--accent); }
    .claim-btn[disabled] { cursor: wait; opacity: .6; }
    /* The label is what tells you this card is the ACTION, not more history. */
    .section-heading { font-size: 12px; font-weight: 750; text-transform: uppercase;
      letter-spacing: .06em; color: var(--accent-text); margin: 0 0 8px; }
    .claim-label { font-size: 12px; color: var(--muted); font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; }
    /* WHAT IT COSTS. status_line above is the finding — "two listings exist" —
       and a finding is not a reason to spend the morning on it. This is the
       same sentence in the client's money terms, and it is the API's
       why_it_matters verbatim: nothing here is derived or scored. */
    .why { padding: 24px; margin: 0 0 24px; border-radius: 16px;
      background: var(--surface); border: 1px solid var(--line); }
    .why .label { font-size: 12px; font-weight: 750; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
    .why p { margin: 0; font-size: 16px; font-weight: 650; line-height: 1.5; }
    /* Only 12 of the 36 have something a client can actually hand over, so this
       block is absent — not empty — on the other 24. An "ask the client" slot
       with nothing in it is how someone ends up asking Ross for the address of
       a photo shoot. */
    .ask-block { margin: 16px 0 0; padding: 16px; border-radius: 12px;
      background: var(--surface-soft); }
    .ask-block .label { font-size: 12px; font-weight: 750; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
    .ask-block p { margin: 0; font-size: 13px; font-weight: 600; line-height: 1.5; }
    /* NOT accent-text. It was the accent colour with cursor:auto and no href —
       "Ask Robert" read as the action on the page and did nothing when tapped.
       It is a fact about who holds the answer, so it looks like one. */
    .ask-block .who { display: block; margin-top: 8px; font-size: 12px;
      font-weight: 750; color: var(--text); }
    /* No width breakpoint here. The row is a two-column table wherever the two
       columns fit — at 390 they do, and that is left alone. Where they do not,
       flex-wrap drops the value onto its own line and space-between puts it at
       the start, so it stacks instead of breaking BOTH columns mid-phrase
       ("Permission / level" set against "Not / applicable" at 320). The key
       never breaks, so the stacked form still reads as a label. */
    .access-line { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px;
      padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; }
    .access-line .k { white-space: nowrap; }
    .access-line:last-child { border-bottom: 0; }
    .access-line .k { color: var(--muted); }
    /* A gap in the record is not a value. It reads lighter than a real one so
       the panel cannot be skimmed as if every line were answered. */
    .access-line .unrecorded { color: var(--quiet); font-weight: 600; }
    /* Sits under the four rows, not beside them, because it is a note about
       the panel rather than another value in it. */
    .access-note { margin: 16px 0 0; font-size: 13px; font-weight: 600;
      line-height: 1.5; color: var(--muted); }
    .not-written { margin: 0; font-size: 14px; color: var(--muted);
      font-weight: 600; line-height: 1.5; }

    /* ── THE SCREEN FOR FIXING ONE THING COULD NOT FIX ANYTHING ───────────────
       "Start here" on the client page sends you here, and here had exactly one
       control: Claim. The page then tells you precisely what to go and get —
       "the Google Maps link for BOTH listings, copied from the address bar" —
       and when you come back holding it there is nowhere to put it. A tester
       got the CID in ninety seconds and had to paste it into the chat box and
       hope an agent read it. The API has taken mark_done, mark_waiting and
       add_evidence since 2026-08-05; only the day and the client page ever
       wired them.

       Outlined, every one of them. A solid fill is a STATE on this board, and
       these are things you DO. The one exception on the page is the state pill
       for a wait, which is a state and therefore filled.

       44px, not 36. This is read one-handed between job sites. */
    .do-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
    .do-btn { flex: none; min-height: 44px; padding: 12px 16px; border-radius: 999px;
      border: 1px solid var(--line-strong); background: transparent; color: var(--text);
      font-family: inherit; font-size: 13px; font-weight: 750; cursor: pointer; }
    .do-btn:hover { border-color: var(--accent); color: var(--accent-text); }
    .do-btn[disabled] { opacity: .55; cursor: progress; }
    /* The way through is an outline in the accent, never a fill. */
    .do-btn.lead { border-color: var(--accent); color: var(--accent-text); }

    /* The question opens UNDER the card, not over it — same motion the day
       view uses, so closing something out never hides the record behind it. */
    .prompt { margin: 16px 0 0; padding: 16px; border-radius: 12px;
      background: var(--surface-soft); border: 1px solid var(--line-strong); }
    .prompt .q { display: block; font-size: 12px; font-weight: 750; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em; margin: 0 0 4px; }
    .prompt .why { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 600; }
    /* Full width, on its own line. On the day this field is 72px wide at 390 —
       narrower than the two buttons beside it — and it is the field carrying
       the entire receipt rule. A real Yelp URL needs 287px. */
    .prompt input { display: block; width: 100%; margin: 0 0 8px; padding: 12px;
      border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface);
      font-family: inherit; font-size: 14px; font-weight: 600; color: var(--text); }
    .prompt input:focus { outline: none; border-color: var(--accent); }
    .prompt .err { margin: 12px 0 0; font-size: 13px; font-weight: 700; color: var(--bad); }

    /* WHO WE ARE CHASING. The API has stored waiting_on since the day the
       prompt started refusing to accept a wait without a name, and not one
       screen printed it — so six rows sat in "waiting on a client" and the
       board could not say who any of them was waiting on. A wait is a state,
       so it is a filled pill. */
    .waiting-pill { display: inline-flex; align-items: center; gap: 8px; margin: 16px 0 0;
      padding: 8px 16px; border-radius: 999px; background: var(--quiet-soft);
      color: var(--text); font-size: 13px; font-weight: 750; }
    .waiting-pill::before { content: ""; width: 8px; height: 8px; flex: none;
      border-radius: 50%; background: var(--quiet); }
    .btn-primary { display: inline-flex; padding: 12px 24px; border-radius: 999px;
      background: var(--accent); color: #fff; text-decoration: none;
      font-size: 14px; font-weight: 700; }
    .btn-ghost { margin-left: auto; padding: 12px 24px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
      text-decoration: none; font-size: 14px; font-weight: 700; }
    .top-row { display: flex; justify-content: space-between; align-items: center;
      margin: 0 0 24px; flex-wrap: wrap; gap: 8px; }
    /* 21px of text was the only way off this page on a phone. The negative
       margin keeps it optically flush with the shell's padding while the tap
       target reaches the 44px floor. */
    .back { display: inline-flex; align-items: center; min-height: 44px;
      margin: 0 0 0 -12px; padding: 0 12px; color: var(--text);
      text-decoration: none; font-size: 14px; font-weight: 700; }
    .crumb { font-size: 13px; color: var(--muted); font-weight: 600; }
    @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } }
    @media (max-width: 520px) {
      /* 320 is the floor body already declares. At that width the shell leaves
         248px of content, and the 48px glyph plus a 16px gap left only 184px
         for a title whose longest word measures 192px. 32/8 gives it 208px. */
      .head { gap: 8px; }
      .head h1 { gap: 8px; }
      .head .glyph { width: 32px; height: 32px; border-radius: 8px; }
      .head .health { padding: 4px 12px; }
      .consequence { padding: 16px; }
      .blocks { padding: 16px; }
      .why { padding: 16px; }
      .btn-ghost { margin-left: 0; }
      .claim-row { gap: 12px; }
      .claim-row.unclaimed .claim-btn { width: 100%; }
      /* Measured at 390: the card's interior is 267px and the three controls
         need 286, so they wrap one per line no matter what. Left-aligned pills
         of three different widths stacked down a card read as leftovers; the
         same three at one width read as a list of what you can do. */
      .do-btn { flex: 1 0 100%; }
    }
</style>
</head>
<body>
  <div class="shell" id="part-root"></div>
<script>
  const ICONS = {"google": "<svg viewBox=\"0 0 24 24\"><path fill=\"#4285F4\" d=\"M21.6 12.23c0-.71-.06-1.4-.18-2.05H12v3.87h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.35Z\"/><path fill=\"#34A853\" d=\"M12 22c2.7 0 4.97-.9 6.62-2.42l-3.24-2.51c-.9.6-2.05.96-3.38.96-2.6 0-4.81-1.76-5.6-4.13H3.06v2.59A10 10 0 0 0 12 22Z\"/><path fill=\"#262823\" d=\"M6.4 13.9A6 6 0 0 1 6.08 12c0-.66.11-1.3.32-1.9V7.51H3.06A10 10 0 0 0 2 12c0 1.61.38 3.14 1.06 4.49L6.4 13.9Z\"/><path fill=\"#EA4335\" d=\"M12 5.97c1.47 0 2.78.5 3.81 1.49l2.86-2.86A9.58 9.58 0 0 0 12 2a10 10 0 0 0-8.94 5.51L6.4 10.1C7.19 7.73 9.4 5.97 12 5.97Z\"/></svg>", "reviews": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"m12 2.6 2.75 5.58 6.16.9-4.46 4.34 1.05 6.14L12 16.66l-5.5 2.9 1.05-6.14-4.46-4.34 6.16-.9L12 2.6Z\"/></svg>", "website": "<svg viewBox=\"0 0 24 24\"><rect x=\"2\" y=\"3\" width=\"20\" height=\"18\" rx=\"3\" fill=\"#262823\"/><path fill=\"#fff\" d=\"M2 8h20v2H2z\"/><circle cx=\"5.2\" cy=\"6\" r=\"1\" fill=\"#fff\"/><circle cx=\"8.2\" cy=\"6\" r=\"1\" fill=\"#fff\"/><rect x=\"5\" y=\"12\" width=\"14\" height=\"6\" rx=\"1.5\" fill=\"#fff\" opacity=\".9\"/></svg>", "yelp": "<svg viewBox=\"0 0 24 24\"><path fill=\"#D32323\" d=\"M10.6 10.2 8.9 3.15A1.45 1.45 0 0 1 10.1 1.4l2.15-.34a1.45 1.45 0 0 1 1.66 1.58l-.75 7.42c-.12 1.16-2.28 1.28-2.56.14ZM14.35 10.95l4.72-2.8a1.45 1.45 0 0 1 2.1.74l.7 1.86a1.45 1.45 0 0 1-1.24 1.95l-5.72.24c-1.12.05-1.53-1.42-.56-2ZM14.26 14.42l4.56 2.94a1.45 1.45 0 0 1 .27 2.2l-1.4 1.44a1.45 1.45 0 0 1-2.3-.3l-2.56-4.9c-.5-.96.52-1.97 1.43-1.38ZM10.76 15.1l-1.5 5.44a1.45 1.45 0 0 1-1.93.96l-1.87-.75a1.45 1.45 0 0 1-.7-2.22l3.42-4.38c.67-.86 2.88-.1 2.58.95ZM8.4 11.6l-5.36-1.56a1.45 1.45 0 0 1-.93-1.98l.82-1.84a1.45 1.45 0 0 1 2.24-.64l4.25 3.57c.84.71.03 2.75-1.02 2.45Z\"/></svg>", "linkedin": "<svg viewBox=\"0 0 24 24\"><path fill=\"#fff\" d=\"M6.15 8.55H2.9V19h3.25V8.55ZM4.53 3.35a1.89 1.89 0 1 0 0 3.78 1.89 1.89 0 0 0 0-3.78ZM18.47 8.3c-1.75 0-2.93.96-3.41 1.88h-.05V8.55H11.9V19h3.24v-5.17c0-1.36.26-2.68 1.95-2.68 1.66 0 1.68 1.55 1.68 2.77V19H22v-5.72c0-2.81-.61-4.98-3.53-4.98Z\"/></svg>", "ai": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9.6L5 21.2V17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z\"/><path fill=\"#fff\" d=\"M6 7.5h12v1.8H6zM6 11h9v1.8H6z\"/></svg>", "photo": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"M4 6h3.4l1.45-2h6.3l1.45 2H20a2 2 0 0 1 2 2v10.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z\"/><circle cx=\"12\" cy=\"13\" r=\"4.2\" fill=\"#fff\"/><circle cx=\"12\" cy=\"13\" r=\"2.45\" fill=\"#262823\"/><circle cx=\"18.5\" cy=\"8.8\" r=\"1\" fill=\"#fff\"/></svg>", "video": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#262823\"/><path fill=\"#fff\" d=\"M9.3 7.8c0-.73.8-1.18 1.43-.8l7.05 4.2c.61.36.61 1.25 0 1.62l-7.05 4.18a.94.94 0 0 1-1.43-.8V7.8Z\"/></svg>", "case-study": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"M5 2h9l5 5v15H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z\"/><path fill=\"#fff\" opacity=\".9\" d=\"M14 2v5h5ZM7 11h8v2H7zM7 15h8v2H7zM7 19h5v2H7z\"/></svg>", "folder": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"M2 5.5A2.5 2.5 0 0 1 4.5 3H10l2.2 2.5h7.3A2.5 2.5 0 0 1 22 8v9.5a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 17.5v-12Z\"/><path fill=\"#8d8f87\" d=\"M2 9h20l-2.25 9H4.25L2 9Z\"/></svg>", "jobber": "<svg viewBox=\"0 0 24 24\"><path fill=\"#12A150\" d=\"M8 3h9v12.1C17 19.5 14.55 22 10.45 22 7 22 4.75 20.1 4.3 16.8l4.2-.65c.2 1.35.78 2.05 1.8 2.05 1.28 0 1.9-.9 1.9-2.75V7H8V3Z\"/></svg>", "recurring": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"M12 3a9 9 0 0 1 7.15 3.53L21 4.7V11h-6.3l1.92-1.92A5.9 5.9 0 0 0 6.3 11H3.06A9 9 0 0 1 12 3Zm8.94 10A9 9 0 0 1 4.85 17.47L3 19.3V13h6.3l-1.92 1.92A5.9 5.9 0 0 0 17.7 13h3.24Z\"/></svg>", "follow-up": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#262823\"/><path fill=\"#fff\" d=\"M11 6h2v5.2l4 2.3-1 1.73-5-2.9V6Z\"/><circle cx=\"12\" cy=\"12\" r=\"1.45\" fill=\"#fff\"/></svg>", "insurance": "<svg viewBox=\"0 0 24 24\"><path fill=\"#262823\" d=\"m12 1.5 9 3.85v6.1c0 5.7-3.52 9.3-9 11.05-5.48-1.75-9-5.35-9-11.05v-6.1L12 1.5Z\"/><path fill=\"#fff\" d=\"m7.5 11.8 2.72 2.72 6.35-7.02 1.78 1.6-8.04 8.9-4.5-4.5 1.69-1.7Z\"/></svg>", "target": "<svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"#262823\"/><circle cx=\"12\" cy=\"12\" r=\"6.2\" fill=\"#fff\"/><circle cx=\"12\" cy=\"12\" r=\"3.1\" fill=\"#262823\"/><circle cx=\"12\" cy=\"12\" r=\"1.15\" fill=\"#fff\"/></svg>", "memberships": "<svg viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"7.5\" r=\"4\" fill=\"#262823\"/><circle cx=\"17.2\" cy=\"8.2\" r=\"3.2\" fill=\"#8d8f87\"/><path fill=\"#262823\" d=\"M1.5 21c.2-5.25 2.35-8 6.5-8s6.3 2.75 6.5 8h-13Z\"/><path fill=\"#8d8f87\" d=\"M13.2 21c.15-4.35 1.65-6.7 4.8-6.7 2.9 0 4.38 2.35 4.5 6.7h-9.3Z\"/></svg>", "outreach": "<svg viewBox=\"0 0 24 24\"><rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"3\" fill=\"#262823\"/><path fill=\"#fff\" d=\"m3.15 6.3 8.85 7 8.85-7 1.25 1.6L12 15.9 1.9 7.9l1.25-1.6Z\" opacity=\".95\"/></svg>", "report": "<svg viewBox=\"0 0 24 24\"><rect x=\"2\" y=\"13\" width=\"5\" height=\"9\" rx=\"1.5\" fill=\"#a3a59d\"/><rect x=\"9.5\" y=\"7\" width=\"5\" height=\"15\" rx=\"1.5\" fill=\"#8d8f87\"/><rect x=\"17\" y=\"2\" width=\"5\" height=\"20\" rx=\"1.5\" fill=\"#262823\"/></svg>"};
  const LABEL = {"completed": "Completed", "needs": "Needs work", "blocked": "Blocked", "cannot": "Cannot see"};
  const NAMES = {"wolfpack": "Wolfpack", "ambition-mechanical": "Ambition Mechanical", "kohrs": "Kohrs"};
  const SB_REF = 'mcngatprgluexjjcqpkp';

  // Same session read as the board: supabase-js stores the session in
  // localStorage, not a cookie, so a cookie-only page can never see it.
  function sessionToken() {
    try {
      let raw = localStorage.getItem('sb-' + SB_REF + '-auth-token');
      if (!raw) {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (/^sb-.*-auth-token$/.test(k)) { raw = localStorage.getItem(k); break; }
        }
      }
      if (!raw) return null;
      if (raw.startsWith('base64-')) raw = atob(raw.slice(7));
      const v = JSON.parse(raw);
      if (typeof v === 'string') return v;
      if (Array.isArray(v)) return v[0] || null;
      return v.access_token || v?.currentSession?.access_token || null;
    } catch (e) { return null; }
  }
  function authed(extra) {
    const t = sessionToken();
    const h = Object.assign({}, extra || {});
    if (t) h.Authorization = 'Bearer ' + t;
    return h;
  }

  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  const CONN = {
    connected:      ['yes', 'Connected'],
    not_applicable: ['na',  'Not applicable'],
    wrong_level:    ['no',  'Wrong level'],
    pending:        ['no',  'Invite pending'],
    expired:        ['no',  'Access expired'],
    never_asked:    ['no',  'Never asked'],
  };

  const qs = new URLSearchParams(location.search);
  const CLIENT = qs.get('client') || 'wolfpack';
  const PART   = qs.get('part') || '';
  const $ = s => document.querySelector(s);
  const root = $('#part-root');

  const when = t => t ? new Date(t).toLocaleDateString('en-US',
    { day: 'numeric', month: 'short' }) : '';

  // A URL that runs a query rather than naming a thing. Maps and Yelp and
  // LinkedIn each spell it differently, so this reads the shape, not the host:
  // a /search segment, or any of the query keys those sites put a phrase into.
  // Deliberately conservative — a false positive costs a link its accent, a
  // false negative lets a question keep calling itself an answer.
  function isSearch(url) {
    let u;
    try { u = new URL(url, location.href); } catch (e) { return false; }
    if (/(^|\/)search(\/|$)/i.test(u.pathname)) return true;
    for (const k of ['q', 'query', 'find_desc', 'keywords', 'search_query', 'text']) {
      if (u.searchParams.has(k)) return true;
    }
    return false;
  }

  function fail(title, body, action) {
    root.innerHTML = '<div class="board-message"><b>' + esc(title) + '</b><p>' +
      esc(body) + '</p>' + (action || '') + '</div>';
  }

  // What the page is looking at right now. Held here so an action can write the
  // one field it changed and re-render, rather than refetching the client and
  // hoping the answer comes back the same.
  let CURRENT = null, PARTS = [], TRAIL = [];

  let toastTimer = null;
  function toast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 4000);
  }

  async function post(payload) {
    let res, data = {};
    try {
      res = await fetch('/api/client-parts', {
        method: 'POST', credentials: 'same-origin', cache: 'no-store',
        headers: authed({ 'Content-Type': 'application/json' }),
        body: JSON.stringify(payload),
      });
      data = await res.json();
    } catch (e) {
      return { status: 0, ok: false, data: {} };
    }
    return { status: res.status, ok: res.ok, data: data || {} };
  }

  async function main() {
    let res, data;
    try {
      res = await fetch('/api/client-parts?client=' + encodeURIComponent(CLIENT),
                        { credentials: 'same-origin', cache: 'no-store', headers: authed() });
      data = await res.json();
    } catch (e) {
      return fail('Could not reach the record.',
                  'Nothing here would be trustworthy, so nothing is shown. Try again.');
    }
    if (res.status === 401 || res.status === 403 || data.auth === false) {
      return fail('You are signed out.',
        'This page shows client information, so it needs you signed in.',
        '<a class="btn-primary" href="/dashboard">Sign in on the dashboard, then come back</a>');
    }
    if (!res.ok) return fail('Could not load this part.', data.error || ('Error ' + res.status));

    const parts = data.parts || [];
    const part = parts.find(p => p.part_key === PART) || parts[0];
    if (!part) {
      return fail('That part is not on this client.',
        'It may have been renamed or removed since this link was made.',
        '<a class="btn-primary" href="/client-engine/">Back to the board</a>');
    }
    render(part, parts, (data.evidence || {})[part.part_key] || []);
  }

  // access_detail is meant to carry the LEVEL — "Manager", "Editor", "Read
  // only", "Field crew level, no reporting" — the fact the connection state
  // cannot tell you and the one that decides what you can actually do. Often it
  // just restates the state, and then the panel read "Connection: Connected /
  // Permission level: Connected": two rows, one fact, and the second one
  // pretending to be an answer. The card grid has refused to print those since
  // it shipped; this panel never got the rule. Saying it is not recorded is
  // true and it is the thing somebody could go and fix.
  const RESTATES = ['connected', 'notconnected', 'notapplicable'];
  const normalise = (t) => String(t || '').toLowerCase().replace(/[^a-z]/g, '');
  function permissionLevel(p, connLabel) {
    const detail = (p.access_detail || '').trim();
    const adds = detail && !RESTATES.includes(normalise(detail)) &&
                 normalise(detail) !== normalise(connLabel);
    return adds ? '<span>' + esc(detail) + '</span>'
                : '<span class="unrecorded">Not recorded</span>';
  }

  function render(p, parts, trail) {
    CURRENT = p; PARTS = parts; TRAIL = trail;
    const clientName = NAMES[CLIENT] || CLIENT;
    document.title = p.name + ' — ' + clientName;
    const [connCls, connLabel] = CONN[p.connection] || ['no', 'Not connected'];
    const idx = parts.findIndex(x => x.part_key === p.part_key);
    const attention = parts.filter(x => x.state === 'needs' || x.state === 'blocked').length;

    // switcher across every part of this client
    const switcher = parts.map(x =>
      '<a class="chip' + (x.part_key === p.part_key ? ' on' : '') +
      (x.state === 'cannot' ? ' dim' : '') +
      '" href="/client-engine/part.html?client=' + encodeURIComponent(CLIENT) +
      '&part=' + encodeURIComponent(x.part_key) + '">' +
      '<span class="dot ' + esc(x.state) + '"></span>' + esc(x.name) + '</a>').join('');

    // the trail is the receipts; an empty one says so rather than looking bare
    const trailHtml = trail.length ? trail.map(e => {
      // Disputed outranks verified: a claim somebody has contested does not get
      // to keep wearing the badge that says a machine confirmed it.
      const disputed = !!e.disputed_at;
      const verified = !disputed && e.confidence === 'verified';
      const standing = disputed
        ? '<span class="standing disputed">Disputed</span> '
        // A person's line and a check's line are both allowed to carry
        // verification standing — the constraint guards the RECEIPT, not the
        // author — but they did not happen the same way, and calling Gary
        // quoting a Google screen "verified by a check" is a small lie that
        // the trail is the last place on this product to tell.
        : verified
          ? '<span class="standing verified">' +
            (e.actor_kind === 'person' ? 'Verified, with a receipt' : 'Verified by a check') +
            '</span> '
          : '';
      // THE QUOTE IS THE RECEIPT, AND IT WAS BEING THROWN AWAY. `artifact_quote`
      // holds the exact words somebody read — the thing the "Mark it done" box
      // asks for in those words, and one of the two facts the database will
      // accept in place of the other before it lets a claim go green. It was
      // fetched to the browser on every load and rendered nowhere, so every
      // quote receipt typed on this product was invisible to the next person,
      // which is precisely who the box says the line is for.
      //
      // What a quote MEANS depends on whether anything else opens. With a page
      // beside it, the quote is the line that was read on that page. With
      // nothing to open — or with only a search, which this page already
      // refuses to call a receipt — the quote is the entire receipt, and
      // saying so is the difference between evidence and a stray note.
      const q = (e.artifact_quote || '').trim();
      const openable = !!e.artifact_url && !isSearch(e.artifact_url);
      const quoteBlock = q
        ? '<div class="quoted"><span class="k">' +
          (openable ? 'The line that was read there' : 'This is the receipt') +
          '</span><q>' + esc(q) + '</q></div>'
        : '';
      // The reason a claim is disputed is stored on the row and was dropped the
      // same way the quote was. A red badge with the argument withheld asks to
      // be taken on trust, on the one page that exists to never do that.
      const disputeNote = disputed && e.disputed_note
        ? '<div class="dispute-note"><span class="k">Why this is disputed</span>' +
          esc(e.disputed_note) + '</div>'
        : '';
      return '<li class="ev' + (disputed ? ' is-disputed' : verified ? ' is-verified' : '') +
        '"><div class="ev-line"><b>' + esc(when(e.at)) + '</b> &middot; ' +
        esc(e.claim) + ' &middot; ' + esc(e.actor || 'Unknown') + '</div>' +
        standing +
        '<span class="actor ' + (e.actor_kind === 'person' ? 'person' : 'assistant') + '">' +
        esc(e.actor_kind === 'person' ? 'Person' : 'Assistant') + '</span>' +
        (e.artifact_url ? (isSearch(e.artifact_url)
          ? ' <span class="not-receipt">A search, not a receipt</span>' +
            ' <a class="searchlink" href="' + esc(e.artifact_url) +
            '" target="_blank" rel="noopener">Open the search that was run</a>'
          : ' <a class="receipt" href="' + esc(e.artifact_url) +
            '" target="_blank" rel="noopener">See the receipt</a>') : '') +
        quoteBlock + disputeNote +
        '</li>';
    }).join('')
      : '<li class="ev empty">Nothing has been recorded for this part yet. ' +
        'Every state on it was entered by a person.</li>';

    const blocks = Array.isArray(p.blocks) ? p.blocks : [];
    const blockNames = blocks
      .map(k => (parts.find(x => x.part_key === k) || {}).name)
      .filter(Boolean);

    // ── WHAT YOU CAN ACTUALLY DO TO IT ────────────────────────────────────
    // Same three the day view offers, plus the one only this screen needs:
    // somewhere to put what you went and found. The page names the errand
    // ("the Maps link for BOTH listings, copied from the address bar") and
    // until now had no field for the answer.
    //
    // A completed part keeps only "Record what you found" — the honest way one
    // comes back is a claim disagreeing with the record, never a button that
    // un-does it.
    const doBtn = (act, label, lead) =>
      '<button type="button" class="do-btn' + (lead ? ' lead' : '') +
      '" data-do="' + act + '">' + label + '</button>';
    const doRow = '<div class="do-row">' +
      (p.state === 'completed' ? '' :
        (p.waiting_on ? doBtn('unwait', 'Not waiting any more')
                      : doBtn('waiting', 'Waiting on someone')) +
        doBtn('done', 'Mark it done')) +
      doBtn('found', 'Record what you found', true) + '</div>';

    // The wait itself, in words, with the name the API refused to take it
    // without. `waiting_since` is the date the ask went out, not today.
    const waitPill = p.waiting_on
      ? '<div class="waiting-pill">Waiting on ' + esc(p.waiting_on) +
        (p.waiting_since ? ' since ' + esc(when(p.waiting_since)) : '') + '</div>'
      : '';

    // OWNER. Unclaimed is a state, so it is a solid pill and it takes the foot
    // of the card; claiming is an act, so the control beside it is outlined.
    const owned = !!p.owner;
    const ownerBlock =
      '<div class="claim-row' + (owned ? '' : ' unclaimed') + '">' +
        '<div class="claim-state"><div class="claim-label">Owner</div>' +
        '<span class="owner-pill' + (owned ? '' : ' none') + '">' +
        esc(owned ? p.owner : 'Unclaimed') + '</span></div>' +
        '<button class="claim-btn" id="claim-btn" type="button">' +
        (owned ? 'Release it' : 'Claim it') + '</button>' +
      '</div>';

    root.innerHTML =
      // Named a client home, so it has to land on one. The bare href sent every
      // part page to whatever the board opens by default — the cross-client day
      // — so from an Ambition part the "back to client home" link put you on a
      // 38-row list of everybody, with Ambition no longer selected.
      '<div class="top-row"><a class="back" href="/client-engine/?client=' +
        encodeURIComponent(CLIENT) + '">&larr; Back to client home</a>' +
      '<div class="crumb">Clients / ' + esc(clientName) + ' / <b>' + esc(p.name) + '</b></div></div>' +

      '<div class="switcher-meta"><span class="side-label">' + esc(clientName) + ' parts</span>' +
      '<span class="side-count">Part ' + (idx + 1) + ' of ' + parts.length +
      ' &middot; ' + attention + ' need attention</span></div>' +
      '<div class="switcher-scroll" id="switch-box">' +
      '<div class="part-switcher" id="part-strip">' + switcher + '</div></div>' +

      '<div class="head">' +
      '<span class="health ' + esc(p.state) + '">' + esc(LABEL[p.state] || p.state) + '</span>' +
      '<h1><span class="glyph ' + esc(p.icon) + '">' + (ICONS[p.icon] || '') + '</span>' +
      '<span class="t">' + esc(p.name) + '</span></h1>' +
      (p.deep_link ? '<a class="btn-ghost" href="' + esc(p.deep_link) +
        '" target="_blank" rel="noopener">Open it</a>' : '') +
      '</div>' +

      (p.status_line ? '<div class="consequence ' + esc(p.state) + '"><b>' +
        esc(p.status_line) + '</b></div>' : '') +

      (blockNames.length ? '<div class="blocks">While this is open, ' + blockNames.length +
        ' other part' + (blockNames.length === 1 ? '' : 's') + ' cannot be fixed &mdash; ' +
        esc(blockNames.join(', ')) + '.</div>' : '') +

      // The finding, then what it blocks, then what it costs — and only if the
      // sentence has been written. An empty "why this matters" is worse than no
      // panel, because it reads as "no reason".
      (p.why_it_matters ? '<section class="why"><div class="label">Why this matters</div>' +
        '<p>' + esc(p.why_it_matters) + '</p></section>' : '') +

      '<div class="content-grid">' +
        '<div class="main-column">' +
          // The action, and who has it, before the history of how it got here.
          '<section class="card" id="action-card"><div class="section-heading">Next action</div>' +
          (p.suggestion
            ? '<div class="next">' + esc(p.suggestion) + '</div>'
            : '<p class="not-written">No next action has been written for this part yet.</p>') +
          waitPill + doRow +
          ownerBlock + '</section>' +

          '<section class="card"><h2>Evidence and history</h2>' +
          '<p class="sub">What we found, and who recorded it.</p>' +
          '<ul class="trail">' + trailHtml + '</ul></section>' +
        '</div>' +

        '<aside class="side-column">' +
          '<section class="card"><h2>What good looks like</h2>' +
          '<p class="sub">The standard this part is measured against.</p>' +
          '<p class="not-written">No standard has been written for this part yet. ' +
          'When one exists it lists the specific checks, and the re-check reports ' +
          'each line as it runs.</p></section>' +

          '<section class="card"><h2>Access</h2>' +
          '<div class="access-line"><span class="k">Connection</span>' +
          '<span class="conn ' + connCls + '">' + esc(connLabel) + '</span></div>' +
          '<div class="access-line"><span class="k">Permission level</span>' +
          permissionLevel(p, connLabel) + '</div>' +
          // ── ONE WORD, TWO QUESTIONS, OPPOSITE ANSWERS ─────────────────────
          // This row read "Last verified: Never" a few inches from a trail line
          // dated Aug 5 and badged "Verified by a check". Nothing false was
          // printed — they answer different questions:
          //
          //   HERE:      has anyone re-confirmed OUR LOGIN on this account?
          //              Written only when a person changes the connection
          //              state on the board.
          //   THE TRAIL: did that CLAIM arrive with a receipt? That is the one
          //              the database constraint guards.
          //
          // But a page whose whole credibility is that a word means one thing
          // cannot spend the same word on two of them, so the login question
          // stops calling itself "verified" and says what it is.
          //
          // "Never" was not the whole truth either: Gary's Aug 3 line confirms
          // this exact access AND carries a receipt. It simply is not what this
          // field records, and an empty field that says "Never" claims more
          // than an empty field knows. "Not recorded" is what is actually so,
          // and it is the word the row above already uses for its own gap, so
          // the panel has ONE way of saying nothing is here.
          '<div class="access-line"><span class="k">Access last confirmed</span>' +
          (p.access_verified_at ? '<span>' + esc(when(p.access_verified_at)) + '</span>'
                                : '<span class="unrecorded">Not recorded</span>') +
          '</div>' +
          // Two nightly passes have now run against this part and BOTH wrote a
          // line saying they could not read it. "Never checked" reports that as
          // though nothing ever tried, which is the opposite of what happened
          // and hides the reason, which is on the trail underneath.
          '<div class="access-line"><span class="k">Last checked</span>' +
          (p.checked_at ? '<span>' + esc(when(p.checked_at)) + '</span>'
                        : '<span class="unrecorded">No check has read it yet</span>') +
          '</div>' +
          // The rename removes the collision from the labels; this removes it
          // from the reader's head. Someone who sees green in the trail and a
          // blank here should not have to work out which of them is lying,
          // because neither is.
          '<p class="access-note">This panel is about our login. A line in the ' +
          'trail marked verified means that claim came with a receipt, which is ' +
          'a different question, and neither one answers the other.</p>' +
          (p.chase_ask ? '<div class="ask-block"><div class="label">What to ask for</div>' +
            '<p>' + esc(p.chase_ask) + '</p>' +
            (p.chase_from ? '<span class="who">Ask ' + esc(p.chase_from) + '</span>' : '') +
            '</div>' : '') +
          '</section>' +
        '</aside>' +
      '</div>';

    wireSwitcher();
    const btn = document.getElementById('claim-btn');
    if (btn) btn.addEventListener('click', () => onClaim(btn));
    const card = document.getElementById('action-card');
    if (card) card.addEventListener('click', onAction);
  }

  // ── THE QUESTIONS THE RECORD REFUSES TO SKIP ──────────────────────────────
  // Two of these need a fact before the API will take them, and that is the
  // product rather than friction: mark_done will not write green without a
  // receipt, and mark_waiting will not accept a wait with nobody's name on it.
  // So the button opens the question instead of firing and eating a 422.
  const ASK = {
    done: {
      q: 'What is the proof?',
      why: 'A link to what changed, or the exact words you saw. Nothing here ' +
           'goes green on memory alone — this line is what the next person reads.',
      fields: [{ key: 'receipt', place: 'https://... or what you saw' }],
      go: 'Mark it done',
      body: (v) => /^https?:\/\//i.test(v.receipt)
        ? { action: 'mark_done', artifact_url: v.receipt, artifact_kind: 'link' }
        : { action: 'mark_done', artifact_quote: v.receipt },
    },
    waiting: {
      q: 'Who are we waiting on?',
      // NOT "it moves to Waiting on a client". Half the rows that see this
      // prompt are already in that bucket — they are there because of ACCESS,
      // which is a different axis — so the old sentence told six rows they were
      // about to become something they already were.
      why: 'Their name, so this becomes a call you can make rather than a row ' +
           'that sits. The board will show who we are chasing, and since when.',
      fields: [{ key: 'who', place: 'Ross, Robert, Mo...' }],
      go: 'Record the wait',
      body: (v) => ({ action: 'mark_waiting', waiting_on: v.who }),
    },
    found: {
      q: 'What did you find?',
      why: 'One line, in your own words. If you opened a page to find it, put ' +
           'the address in too — that is what turns a claim into something the ' +
           'next person can check instead of take on trust.',
      fields: [
        { key: 'claim', place: 'What you saw, in one line' },
        { key: 'url', place: 'The address you opened (optional)', optional: true },
      ],
      go: 'Add it to the record',
      // actor_kind is PERSON, spelled out. add_evidence defaults to 'assistant',
      // and this screen is where a human types their own witness — signing it
      // with a machine's kind is the same inversion the trail's colours had.
      // Confidence stays 'reported': a person looking is a report. Only a check
      // writes 'verified', and only with a receipt.
      body: (v) => {
        const out = { action: 'add_evidence', claim: v.claim, actor_kind: 'person',
                      confidence: 'reported', method: 'Recorded on the part page' };
        // A value that is not a web address is not a link. Putting it in
        // artifact_url anyway is how a trail ends up with a "See the receipt"
        // that opens nothing.
        if (v.url) {
          if (/^https?:\/\//i.test(v.url)) out.artifact_url = v.url;
          else out.artifact_quote = v.url;
        }
        return out;
      },
    },
  };

  function closePrompt() {
    const open = document.querySelector('#action-card .prompt');
    if (open) open.remove();
  }

  async function onAction(e) {
    const b = e.target.closest('[data-do]');
    if (!b) return;
    e.preventDefault();
    const act = b.dataset.do;

    if (act === 'cancel') return closePrompt();

    // The chase simply ended. Nothing to ask for, so nothing is asked.
    if (act === 'unwait') {
      b.disabled = true;
      const out = await post({ action: 'mark_waiting', client: CLIENT,
                               part_key: CURRENT.part_key, clear: true });
      if (!out.ok) { b.disabled = false; return toast(out.data.error || 'That did not save.'); }
      toast('Not waiting on anyone now.');
      return main();
    }

    if (ASK[act]) {
      closePrompt();
      const ask = ASK[act];
      const box = document.createElement('div');
      box.className = 'prompt';
      box.dataset.ask = act;
      box.innerHTML = '<span class="q">' + esc(ask.q) + '</span>' +
        '<p class="why">' + esc(ask.why) + '</p>' +
        ask.fields.map(f => '<input type="text" data-key="' + f.key +
          '" placeholder="' + esc(f.place) + '">').join('') +
        '<div class="do-row"><button type="button" class="do-btn lead" data-do="commit">' +
        esc(ask.go) + '</button>' +
        '<button type="button" class="do-btn" data-do="cancel">Cancel</button></div>';
      b.closest('.do-row').insertAdjacentElement('afterend', box);
      const first = box.querySelector('input');
      first.focus();
      box.addEventListener('keydown', (k) => {
        if (k.key === 'Enter') box.querySelector('[data-do="commit"]').click();
        if (k.key === 'Escape') closePrompt();
      });
      return;
    }

    if (act === 'commit') {
      const box = b.closest('.prompt');
      const ask = ASK[box.dataset.ask];
      const vals = {};
      let missing = null;
      for (const f of ask.fields) {
        const el = box.querySelector('[data-key="' + f.key + '"]');
        vals[f.key] = el.value.trim();
        if (!vals[f.key] && !f.optional && !missing) missing = el;
      }
      // Empty and spaces-only refuse on the spot, with no request sent. The
      // record never sees a blank claim, so it never has to reject one.
      if (missing) return missing.focus();
      const old = box.querySelector('.err');
      if (old) old.remove();
      b.disabled = true;
      const out = await post(Object.assign(
        { client: CLIENT, part_key: CURRENT.part_key }, ask.body(vals)));
      if (!out.ok) {
        b.disabled = false;
        // The API's refusal is written to be read. Surfacing it verbatim beats
        // replacing it with something vaguer, and what was typed stays put.
        const p = document.createElement('p');
        p.className = 'err';
        p.textContent = out.data.error || 'That did not save. Nothing was changed.';
        box.appendChild(p);
        return;
      }
      // `act` is 'commit' here — the button that was clicked. Which question
      // was answered is on the box, and reading it off `act` reported every
      // write as a wait. Caught by driving it, not by reading the diff.
      const kind = box.dataset.ask;
      toast(kind === 'found' ? 'Added to the record, with your name on it.'
            : kind === 'done' ? 'Marked done, with the receipt on the trail.'
            : 'Recorded. The board now says who we are chasing.');
      return main();
    }
  }

  // The strip is a 314px window onto 2885px of chips on a phone. Say so, and
  // start it on the part you are actually looking at.
  function wireSwitcher() {
    const box = document.getElementById('switch-box');
    const strip = document.getElementById('part-strip');
    if (!box || !strip) return;
    const sync = () => {
      const max = strip.scrollWidth - strip.clientWidth;
      if (max <= 1) {
        box.removeAttribute('data-more-left');
        box.removeAttribute('data-more-right');
        return;
      }
      if (strip.scrollLeft > 2) box.setAttribute('data-more-left', '');
      else box.removeAttribute('data-more-left');
      if (strip.scrollLeft < max - 2) box.setAttribute('data-more-right', '');
      else box.removeAttribute('data-more-right');
    };
    strip.addEventListener('scroll', sync, { passive: true });
    window.addEventListener('resize', sync);
    const cur = strip.querySelector('.chip.on');
    if (cur) {
      strip.scrollLeft = Math.max(0,
        cur.offsetLeft - (strip.clientWidth - cur.offsetWidth) / 2);
    }
    sync();
  }

  // Claim writes the owner from the verified session, so this sends no name.
  // A part someone else holds is not silently reassigned — 409 comes back with
  // their name on it and the takeover is a second, deliberate answer.
  async function onClaim(btn) {
    const p = CURRENT;
    if (!p) return;
    const taking = !p.owner;
    btn.disabled = true;
    btn.textContent = taking ? 'Claiming…' : 'Releasing…';

    let out = await post({ action: taking ? 'claim' : 'release',
                           client: CLIENT, part_key: p.part_key });

    if (out.status === 409 && out.data.owner) {
      if (window.confirm(out.data.owner + ' has this one. Take it from them?')) {
        out = await post({ action: 'claim', client: CLIENT,
                           part_key: p.part_key, takeover: true });
      } else {
        return render(p, PARTS, TRAIL);
      }
    }
    if (out.status === 401 || out.status === 403) {
      toast('You are signed out, so nothing was changed. Sign in on the dashboard and try again.');
      return render(p, PARTS, TRAIL);
    }
    if (!out.ok || !out.data.part) {
      toast(out.data.error || 'That did not save. Nothing was changed.');
      return render(p, PARTS, TRAIL);
    }

    p.owner = out.data.part.owner || null;
    const inList = PARTS.find(x => x.part_key === p.part_key);
    if (inList) inList.owner = p.owner;
    toast(p.owner ? 'Yours now — ' + p.owner : 'Put back. Nobody has this one.');
    render(p, PARTS, TRAIL);
  }

  main();
</script>
</body>
</html>
