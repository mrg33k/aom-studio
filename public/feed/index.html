<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AOM — Feed</title>
<meta name="description" content="Ahead of Market — trending videos across AI, construction, and creative workflows.">
<meta property="og:title" content="AOM — Feed">
<meta property="og:description" content="Trending videos every morning. Tap to play.">
<style>
/* ============================================================
   AOM /feed — TikTok-style video feed
   Full-screen YouTube thumbnails with overlay text, snap scroll.
   Data: /feed/data/findings.json (video items with youtube_id)
   Brand: obsidian/ivory + bronze accent, flat surfaces.
   ============================================================ */
@font-face{font-family:'Schibsted Grotesk';src:url('/feed/assets/fonts/SchibstedGrotesk-var.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}

:root{
  --obsidian:#0B0B0B;
  --ink-800:#161615;
  --ink-700:#2A2A28;
  --ink-500:#6E6E66;
  --ink-300:#B6B2AB;
  --ivory:#F6F6F4;
  --gold:#B58A38;
  --mast-h:48px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--obsidian);color:var(--ivory);overflow:hidden}
body{font-family:'Schibsted Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}
a{color:inherit}

/* ---- compact masthead ---- */
.mast{position:fixed;top:0;left:0;right:0;height:var(--mast-h);z-index:30;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  background:linear-gradient(to bottom,rgba(11,11,11,.92) 0%,rgba(11,11,11,.6) 70%,transparent 100%);
  pointer-events:none}
.mast>*{pointer-events:auto}
.mast .mark{width:22px;height:22px;display:block;color:var(--ivory);flex:none}
.mast .mark svg{width:100%;height:100%;display:block}
.wordmark{font-size:13px;font-weight:700;line-height:1;
  letter-spacing:.26em;text-transform:uppercase;display:flex;align-items:baseline;gap:3px}
.wordmark .period{width:4px;height:4px;background:var(--gold);display:inline-block;flex:none}
.mast .counter{margin-left:auto;font-size:11px;letter-spacing:.14em;color:rgba(246,246,244,.5);
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- tab pills (overlaid on feed) ---- */
.tabs{position:fixed;top:calc(var(--mast-h) + 4px);left:50%;transform:translateX(-50%);z-index:29;
  display:flex;gap:2px;background:rgba(11,11,11,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(246,246,244,.08);padding:3px}
.tab{padding:6px 16px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(246,246,244,.4);transition:all .15s}
.tab.active{color:var(--ivory);background:rgba(246,246,244,.1)}

/* ---- feed container ---- */
.feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.feed::-webkit-scrollbar{display:none}
.feed.hidden{display:none}

/* ---- video card: full viewport ---- */
.vcard{height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  position:relative;overflow:hidden;background:var(--obsidian)}

/* thumbnail fills card */
.vcard .thumb{position:absolute;inset:0;background-size:cover;background-position:center;
  background-repeat:no-repeat;transition:transform 8s ease-out}
.vcard.active .thumb{transform:scale(1.05)}

/* gradient overlay: bottom third */
.vcard .grad{position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    rgba(11,11,11,.3) 0%,
    transparent 30%,
    transparent 45%,
    rgba(11,11,11,.65) 65%,
    rgba(11,11,11,.92) 85%,
    rgba(11,11,11,.98) 100%
  )}

/* play button */
.vcard .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:72px;height:72px;cursor:pointer;z-index:5;
  display:flex;align-items:center;justify-content:center;
  border:2px solid rgba(246,246,244,.7);border-radius:50%;
  background:rgba(11,11,11,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:all .2s}
.vcard .play:hover{border-color:var(--ivory);background:rgba(11,11,11,.55);transform:translate(-50%,-50%) scale(1.08)}
.vcard .play svg{width:28px;height:28px;fill:var(--ivory);margin-left:3px}

/* text overlay at bottom */
.vcard .info{position:absolute;bottom:0;left:0;right:0;z-index:4;
  padding:0 72px 32px 20px;
  padding-bottom:calc(32px + var(--safe-b))}
@media (min-width:700px){.vcard .info{padding:0 100px 40px 40px}}

.vcard .lane-pill{display:inline-block;font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--obsidian);background:var(--gold);padding:3px 8px;margin-bottom:10px}

.vcard .vtitle{font-size:clamp(22px,5.5vw,32px);font-weight:700;line-height:1.12;
  letter-spacing:-0.01em;text-wrap:balance;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;
  text-shadow:0 1px 4px rgba(0,0,0,.5)}
@media (min-width:700px){.vcard .vtitle{font-size:28px;-webkit-line-clamp:2}}

.vcard .meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;
  font-size:12px;font-weight:500;letter-spacing:.06em;color:rgba(246,246,244,.6)}
.vcard .meta .dot{width:3px;height:3px;background:rgba(246,246,244,.3);border-radius:50%;flex:none}
.vcard .channel{font-weight:700;color:rgba(246,246,244,.8)}

.vcard .why{margin-top:8px;font-size:13px;line-height:1.45;color:rgba(246,246,244,.5);
  max-width:48ch;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}

/* card index */
.vcard .vidx{position:absolute;top:calc(var(--mast-h) + 44px);left:20px;z-index:4;
  font-size:11px;font-weight:700;letter-spacing:.14em;
  color:rgba(246,246,244,.3);font-variant-numeric:tabular-nums}
@media (min-width:700px){.vcard .vidx{left:40px}}

/* ---- right action rail ---- */
.rail{position:fixed;right:12px;bottom:calc(120px + var(--safe-b));z-index:31;
  display:flex;flex-direction:column;gap:6px}
@media (min-width:700px){.rail{right:24px;bottom:calc(140px + var(--safe-b))}}
.rail button{width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(246,246,244,.15);border-radius:50%;
  background:rgba(11,11,11,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:rgba(246,246,244,.7);transition:all .15s}
.rail button:hover{border-color:rgba(246,246,244,.3);color:var(--ivory)}
.rail button:active{transform:scale(.92)}
.rail svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.6}
.rail .on{color:var(--gold);border-color:var(--gold)}
.rail .on svg{fill:var(--gold);stroke:var(--gold)}

/* ---- YouTube full-screen overlay ---- */
.yt-overlay{position:fixed;inset:0;z-index:50;background:rgba(11,11,11,.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  opacity:0;pointer-events:none;transition:opacity .2s}
.yt-overlay.open{opacity:1;pointer-events:auto}
.yt-overlay .yt-wrap{width:100%;max-width:960px;aspect-ratio:16/9}
@media (max-width:699px){.yt-overlay .yt-wrap{width:100vw}}
.yt-overlay iframe{width:100%;height:100%;border:none}
.yt-overlay .yt-bar{display:flex;align-items:center;gap:12px;width:100%;max-width:960px;padding:0 16px}
@media (max-width:699px){.yt-overlay .yt-bar{padding:0 20px;max-width:100vw}}
.yt-overlay .yt-close{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--obsidian);border:1px solid var(--ink-700);color:var(--ivory);font-size:20px;cursor:pointer}
.yt-overlay .yt-close:hover{border-color:var(--gold);color:var(--gold)}
.yt-overlay .yt-title{font-size:14px;font-weight:600;color:var(--ivory);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.yt-overlay .yt-ext{font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-300);text-decoration:none;border-bottom:1px solid var(--ink-700);padding-bottom:2px;margin-left:auto;flex:none}
.yt-overlay .yt-ext:hover{color:var(--ivory);border-color:var(--gold)}

/* ---- toast ---- */
.toast{position:fixed;top:calc(var(--mast-h) + 52px);left:50%;transform:translateX(-50%);
  z-index:40;padding:8px 16px;background:var(--gold);color:var(--obsidian);
  font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---- empty state ---- */
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;text-align:center;gap:16px;scroll-snap-align:start}
.empty .headline{font-size:clamp(28px,7vw,40px);font-weight:700;line-height:1.08;letter-spacing:-0.01em}
.empty .body{font-size:15px;line-height:1.5;color:var(--ink-300);max-width:36ch}
.empty .pill{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--obsidian);background:var(--gold);padding:4px 10px}

/* ---- keyboard hint ---- */
.hint{position:fixed;left:20px;bottom:calc(18px + var(--safe-b));z-index:31;
  font-size:11px;letter-spacing:.18em;color:rgba(246,246,244,.2);text-transform:uppercase;display:none}
@media (min-width:700px){.hint{display:block}}

/* ---- agent feed (kept as-is) ---- */
.item{height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  position:relative;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;
  justify-content:flex-start;overflow:hidden;
  padding:24px 20px calc(24px + var(--safe-b));background:var(--obsidian)}
@media (min-width:700px){
  .stage{width:auto;aspect-ratio:9/16;height:min(100%,92vh);border:1px solid var(--ink-700);padding:32px}
}
.head{display:flex;align-items:flex-start;gap:8px}
.lane{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--obsidian);background:var(--gold);padding:4px 8px}
.date{font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-300);border:1px solid var(--ink-700);padding:4px 8px}
.core{flex:1;display:flex;flex-direction:column;gap:16px;justify-content:center;padding:16px 0}
.headline{font-weight:700;line-height:1.04;letter-spacing:-0.01em;
  font-size:clamp(32px,8.6vw,48px);text-wrap:balance;overflow-wrap:break-word}
@media (min-width:700px){.headline{font-size:44px}}
.subtitle{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.abody{font-size:16px;line-height:1.5;color:var(--ink-300);max-width:52ch;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}
.act{display:flex;gap:12px;align-items:flex-start;max-width:52ch}
.act .sq{width:8px;height:8px;background:var(--gold);flex:none;margin-top:8px}
.act p{font-size:16px;line-height:1.5;font-weight:600}
.foot{margin-top:auto;display:flex;align-items:center;gap:8px}
.idx{font-size:12px;font-weight:700;letter-spacing:.14em;
  color:var(--obsidian);background:var(--gold);padding:4px 8px;font-variant-numeric:tabular-nums}
.progress{font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-500);font-variant-numeric:tabular-nums;margin-left:auto}
</style>
</head>

<script>
/* ============================================================
   AOM /feed — TikTok-style video feed engine
   Items must have youtube_id. Legacy article items are skipped.
   ============================================================ */
const LANES = {
  'ai-builds':          {tag:'AI Builds',          color:'var(--gold)'},
  'ai-tools':           {tag:'AI Tools',           color:'var(--gold)'},
  'construction':       {tag:'Construction',       color:'var(--gold)'},
  'creative-workflows': {tag:'Creative Workflows', color:'var(--gold)'},
  /* legacy lanes (for any old data that leaks through) */
  'yt-ai-workflows':    {tag:'AI Workflows',       color:'var(--gold)'},
  'yt-music-production':{tag:'Music Production',   color:'var(--gold)'},
  'yt-filmmaking':      {tag:'Filmmaking',         color:'var(--gold)'},
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n+1).padStart(2,'0');

/* ---- state ---- */
const state = {
  tab: 'videos',
  videos: { items:[], els:[], active:-1, observer:null },
  agents: { items:[], els:[], active:-1, observer:null }
};
function cur(){ return state[state.tab]; }

const feedVideos = document.getElementById('feed-videos');
const feedAgents = document.getElementById('feed-agents');
const counterEl  = document.getElementById('counter');
const likes = new Set(JSON.parse(localStorage.getItem('aom-feed-likes')||'[]'));

/* ---- YouTube thumbnail URL (tries maxres, falls back to hq) ---- */
function thumbUrl(ytId){
  return 'https://img.youtube.com/vi/'+ytId+'/hqdefault.jpg';
}
function maxThumbUrl(ytId){
  return 'https://img.youtube.com/vi/'+ytId+'/maxresdefault.jpg';
}

/* ---- video card builder ---- */
function videoCardHTML(it, i, total){
  const lane = LANES[it.lane] || {tag: it.lane || 'Video', color:'var(--gold)'};
  const views = it.views || '';
  const channel = it.channel || '';
  const title = it.title || it.headline || '';
  const why = it.why || it.body || '';
  const ytId = it.youtube_id;

  return `<div class="thumb" style="background-image:url('${esc(maxThumbUrl(ytId))}'),url('${esc(thumbUrl(ytId))}')"></div>
    <div class="grad"></div>
    <button class="play" data-yt-id="${esc(ytId)}" data-title="${esc(title)}" aria-label="Play video">
      <svg viewBox="0 0 24 24"><polygon points="8,4 20,12 8,20"/></svg>
    </button>
    <span class="vidx">${pad(i)} / ${String(total).padStart(2,'0')}</span>
    <div class="info">
      <span class="lane-pill">${esc(lane.tag)}</span>
      <h2 class="vtitle">${esc(title)}</h2>
      <div class="meta">
        ${channel ? '<span class="channel">'+esc(channel)+'</span>' : ''}
        ${channel && views ? '<span class="dot"></span>' : ''}
        ${views ? '<span>'+esc(views)+' views</span>' : ''}
      </div>
      ${why ? '<p class="why">'+esc(why)+'</p>' : ''}
    </div>`;
}

/* ---- build video feed ---- */
function buildVideoFeed(items){
  const s = state.videos;
  s.items = items;
  feedVideos.innerHTML = '';
  if(s.observer) s.observer.disconnect();

  if(items.length === 0){
    feedVideos.innerHTML = '<section class="empty"><span class="pill">Coming Soon</span><h2 class="headline">First videos drop tomorrow.</h2><p class="body">The morning sweep finds trending YouTube videos across AI builds, construction, and creative workflows. Check back after the run.</p></section>';
    counterEl.textContent = '-- / --';
    return;
  }

  items.forEach((it,i)=>{
    const sec = document.createElement('section');
    sec.className = 'vcard';
    sec.dataset.i = i;
    sec.id = it.id;
    sec.innerHTML = videoCardHTML(it, i, items.length);
    feedVideos.appendChild(sec);
  });
  s.els = [...feedVideos.children];

  /* try loading maxres thumbnail, fall back to hq on error */
  s.els.forEach(el=>{
    const thumb = el.querySelector('.thumb');
    if(!thumb) return;
    const style = thumb.style.backgroundImage;
    const img = new Image();
    const ytId = el.querySelector('.play')?.dataset?.ytId;
    if(!ytId) return;
    img.onload = ()=>{ if(img.naturalWidth>120) thumb.style.backgroundImage = "url('"+maxThumbUrl(ytId)+"')"; };
    img.onerror = ()=>{ thumb.style.backgroundImage = "url('"+thumbUrl(ytId)+"')"; };
    img.src = maxThumbUrl(ytId);
  });

  /* intersection observer for active card */
  const ratios = new Map();
  s.observer = new IntersectionObserver(entries=>{
    entries.forEach(e=>ratios.set(+e.target.dataset.i, e.intersectionRatio));
    let best=-1, bestR=0;
    ratios.forEach((r,i)=>{ if(r>bestR){bestR=r;best=i;} });
    if(best>=0 && best!==s.active && bestR>=.5){
      /* remove active class from old */
      if(s.active>=0 && s.els[s.active]) s.els[s.active].classList.remove('active');
      s.active = best;
      s.els[best].classList.add('active');
      if(state.tab==='videos') updateCounter();
    }
  },{root:feedVideos,threshold:[0,.25,.5,.75,1]});
  s.els.forEach(el=>s.observer.observe(el));

  /* hash jump */
  const start = items.findIndex(it=>'#'+it.id===decodeURIComponent(location.hash));
  if(start>0) s.els[start].scrollIntoView();
  updateCounter();
}

function updateCounter(){
  const s = cur();
  if(s.items.length===0){ counterEl.textContent='-- / --'; return; }
  counterEl.textContent = pad(s.active>=0?s.active:0) + ' / ' + String(s.items.length).padStart(2,'0');
}

/* ---- tab switching ---- */
const tabBtns = document.querySelectorAll('.tab');
function switchTab(key){
  if(key===state.tab) return;
  state.tab = key;
  tabBtns.forEach(b=>{
    const on = b.dataset.tab===key;
    b.classList.toggle('active',on);
    b.setAttribute('aria-selected',String(on));
  });
  feedVideos.classList.toggle('hidden', key!=='videos');
  feedAgents.classList.toggle('hidden', key!=='agents');
  updateCounter();
  likeUI();
}
tabBtns.forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

/* ---- rail ---- */
const likeBtn=document.getElementById('likeBtn'), shareBtn=document.getElementById('shareBtn');
function likeUI(){
  const s=cur();
  const on = s.active>=0 && s.items[s.active] && likes.has(s.items[s.active].id);
  likeBtn.classList.toggle('on',on);
  likeBtn.setAttribute('aria-pressed',String(on));
}
likeBtn.addEventListener('click',()=>{
  const s=cur(); if(s.active<0||!s.items[s.active]) return;
  const id=s.items[s.active].id;
  likes.has(id)?likes.delete(id):likes.add(id);
  localStorage.setItem('aom-feed-likes',JSON.stringify([...likes]));
  likeUI();
});
shareBtn.addEventListener('click',async()=>{
  const s=cur();
  if(s.active>=0 && s.items[s.active] && s.items[s.active].youtube_id){
    const url = 'https://www.youtube.com/watch?v='+s.items[s.active].youtube_id;
    try{
      if(navigator.share) await navigator.share({title:s.items[s.active].title||'AOM Feed',url});
      else{ await navigator.clipboard.writeText(url); showToast('Link copied'); }
    }catch(_){}
  } else {
    const url = location.origin+'/feed'+(s.active>=0&&s.items[s.active]?'#'+s.items[s.active].id:'');
    try{
      if(navigator.share) await navigator.share({title:'AOM Feed',url});
      else{ await navigator.clipboard.writeText(url); showToast('Link copied'); }
    }catch(_){}
  }
});

/* ---- keyboard ---- */
function jump(d){
  const s=cur();
  const t=Math.min(s.items.length-1,Math.max(0,(s.active<0?0:s.active)+d));
  const feedEl = state.tab==='videos' ? feedVideos : feedAgents;
  if(s.els[t]) s.els[t].scrollIntoView({behavior:'smooth'});
}
addEventListener('keydown',e=>{
  if(ytOverlay.classList.contains('open')){
    if(e.key==='Escape'){e.preventDefault();closeYT();}
    return;
  }
  if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();jump(1);}
  else if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();jump(-1);}
  else if(e.key==='Enter'){
    e.preventDefault();
    const s=cur();
    if(s.active>=0&&s.items[s.active]&&s.items[s.active].youtube_id){
      openYT(s.items[s.active].youtube_id, s.items[s.active].title||'');
    }
  }
  else if(e.key==='1'){e.preventDefault();switchTab('videos');}
  else if(e.key==='2'){e.preventDefault();switchTab('agents');}
});

/* ---- YouTube overlay ---- */
const ytOverlay=document.getElementById('ytOverlay');
const ytFrame=document.getElementById('ytFrame');
const ytExtLink=document.getElementById('ytExtLink');
const ytTitle=document.getElementById('ytTitle');
function openYT(ytId,title){
  ytFrame.src='https://www.youtube.com/embed/'+ytId+'?autoplay=1&rel=0&modestbranding=1&playsinline=1';
  ytExtLink.href='https://www.youtube.com/watch?v='+ytId;
  ytTitle.textContent=title||'';
  ytOverlay.classList.add('open');
}
function closeYT(){ytOverlay.classList.remove('open');ytFrame.src='';}
document.addEventListener('click',e=>{
  const p=e.target.closest('.play');
  if(p){e.preventDefault();e.stopPropagation();openYT(p.dataset.ytId,p.dataset.title);return;}
  if(e.target===ytOverlay) closeYT();
});
ytOverlay.querySelector('.yt-close').addEventListener('click',closeYT);

/* ---- toast ---- */
const toastEl=document.getElementById('toast');
function showToast(msg){toastEl.textContent=msg;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1400);}

/* ---- load video feed ---- */
fetch('/feed/data/findings.json',{cache:'no-store'})
  .then(r=>r.json())
  .then(data=>{
    const items=[];
    data.days.sort((a,b)=>b.date.localeCompare(a.date)).forEach(day=>{
      day.items.forEach((it,j)=>{
        /* only include items with youtube_id */
        if(!it.youtube_id) return;
        items.push({...it, date:day.date, id:day.date+'-yt-'+(j+1)});
      });
    });
    buildVideoFeed(items);
  })
  .catch(()=>{
    buildVideoFeed([]);
  });

/* ---- load agent feed (kept from prior version) ---- */
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function agentCardHTML(it, i){
  const d = new Date(it.date + 'T12:00:00');
  const dateTxt = MONTHS[d.getMonth()] + ' ' + String(d.getDate()).padStart(2,'0');
  const subBlock = it.subtitle ? '<p class="subtitle">'+esc(it.subtitle)+'</p>' : '';
  const progressTag = it.progress ? '<span class="progress">'+esc(it.progress)+'</span>' : '';
  return '<div class="stage"><div class="head"><span class="lane">'+esc('Agent')+'</span><span class="date">'+dateTxt+'</span></div>'
    +'<div class="core"><h2 class="headline">'+esc(it.headline)+'</h2>'+subBlock
    +'<p class="abody">'+esc(it.body)+'</p>'
    +(it.action?'<div class="act"><span class="sq"></span><p>'+esc(it.action)+'</p></div>':'')
    +'</div><div class="foot"><span class="idx">'+pad(i)+'</span>'+progressTag+'</div></div>';
}

function buildAgentFeed(items){
  const s = state.agents;
  s.items = items;
  feedAgents.innerHTML = '';
  if(s.observer) s.observer.disconnect();

  items.forEach((it,i)=>{
    const sec = document.createElement('section');
    sec.className='item'; sec.dataset.i=i; sec.id=it.id;
    sec.innerHTML = agentCardHTML(it,i);
    feedAgents.appendChild(sec);
  });
  s.els = [...feedAgents.children];

  const ratios = new Map();
  s.observer = new IntersectionObserver(entries=>{
    entries.forEach(e=>ratios.set(+e.target.dataset.i, e.intersectionRatio));
    let best=-1, bestR=0;
    ratios.forEach((r,i)=>{ if(r>bestR){bestR=r;best=i;} });
    if(best>=0 && best!==s.active && bestR>=.5){
      s.active=best;
      if(state.tab==='agents') updateCounter();
    }
  },{root:feedAgents,threshold:[0,.25,.5,.75,1]});
  s.els.forEach(el=>s.observer.observe(el));
  if(state.tab==='agents') updateCounter();
}

fetch('/feed/data/agent-updates.json',{cache:'no-store'})
  .then(r=>r.json())
  .then(data=>{
    const items = [];
    data.roster.forEach(ag=>{
      const ups = ag.updates||[];
      const total = 1 + ups.length;
      items.push({
        lane:'agent', date:ag.last_updated, id:'agent-'+ag.slug,
        headline:ag.name, subtitle:ag.title,
        body:ag.summary, action:ag.bar,
        progress: total>1 ? ag.name+' · 1 / '+total : ''
      });
      ups.forEach((u,j)=>{
        items.push({
          lane:'agent', date:ag.last_updated,
          id:'agent-'+ag.slug+'-u'+(j+1),
          headline:u.headline, subtitle:u.tag,
          body:u.body, action:ag.name,
          progress: ag.name+' · '+(j+2)+' / '+total
        });
      });
    });
    buildAgentFeed(items);
    const urlTab = new URLSearchParams(location.search).get('tab');
    if(urlTab==='agents') switchTab('agents');
  })
  .catch(()=>{
    buildAgentFeed([{lane:'agent', date:new Date().toISOString().slice(0,10), id:'agent-boot',
      headline:'Agent roster loading.',
      body:'The morning routine scans agent changes. The first scan populates this tab.',
      action:'Check back after the next morning run.'}]);
  });
</script>
