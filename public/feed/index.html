<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f7f6f3">
<title>Morning</title>
<style>
/* /feed: Patrik's private morning report (v3, 2026-09-25).
   Light, one color per section, everything folds to headlines. Data comes from the studio Mac
   (rag.aheadofmarket.com/morning/*), gated by the token in Patrik's private link (#k=...).
   Type 12/14/16/20/28, spacing on the 4px scale, one sans family. */
:root{--bg:#f7f6f3;--card:#fff;--line:#e8e5df;--ink:#1d1b18;--soft:#4a463f;--mute:#8a847a;
  --violet:#7c5cff;--orange:#ff7a1a;--blue:#2f7cf6;--green:#18a867;--yellow:#f2b705;--red:#ec4c4c;--teal:#0fb3a9;--pink:#e2489a;--indigo:#5561f2;--slate:#64748b}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;font-size:16px;line-height:1.5;padding:24px 16px 120px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.wrap{max-width:680px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.date{color:var(--mute);font-size:14px;font-weight:600}
select.days{background:var(--card);color:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:14px}
.new{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600}
.new[disabled]{opacity:.5;cursor:default}
.spin{width:12px;height:12px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
h1{font-size:28px;line-height:1.2;font-weight:700;margin:12px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px}
.applied{background:#e9f8f0;color:#0d6b42;border-radius:12px;padding:12px 16px;font-size:14px;margin-top:16px}
.glance{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 24px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:600;text-decoration:none}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip b{color:var(--c)}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;scroll-margin-top:16px}
details.sec>summary{list-style:none;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:16px;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
.badge{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.badge.dark{color:var(--ink)}
.stitle{font-weight:700;font-size:16px}
.speek{color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:24px;height:24px;color:var(--mute);transition:transform .2s;flex:none}
details[open]>summary .chev{transform:rotate(180deg)}
.body{padding:0 16px 8px;border-top:1px solid var(--line)}
details.it{border-bottom:1px solid var(--line)}
details.it:last-child{border-bottom:0}
details.it>summary{list-style:none;display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:start;padding:16px 0;cursor:pointer}
details.it>summary::-webkit-details-marker{display:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);margin-top:8px}
.head{font-weight:600;font-size:16px;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:12px;color:var(--mute)}
.src{display:inline-flex;align-items:center;background:var(--bg);border-radius:6px;padding:2px 8px;font-weight:600}
.tag{font-weight:600;color:var(--c)}
.amt{font-weight:700;color:var(--ink)}
.ball{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.you{background:#fde8e8;color:#c42f2f} .them{background:#e7f6ee;color:#12804e}
.detail{padding:0 0 16px 20px;color:var(--soft);font-size:14px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:8px 12px}
.kv b{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--soft)}
.btn.go{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#fff}
.btn.go.dark{color:var(--ink)}
.read-body{color:var(--soft);font-size:16px;padding-top:16px}
.unseen{margin-top:12px;padding:0}
.unseen li{list-style:none;position:relative;padding:8px 0 8px 20px;font-size:14px;color:var(--soft);border-top:1px solid var(--line)}
.unseen li:before{content:"";position:absolute;left:4px;top:16px;width:6px;height:6px;border-radius:50%;background:var(--c)}
pre.prompt{white-space:pre-wrap;font-family:inherit;font-size:14px;background:var(--bg);border-radius:8px;padding:12px;margin-top:8px;color:var(--soft)}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--c)}
.empty{color:var(--mute);font-size:14px;padding:16px 0}
.undo{color:var(--blue);font-size:14px;font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(247,246,243,0),var(--bg) 40%);display:flex;justify-content:center;pointer-events:none}
.dock button{pointer-events:auto;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.on{display:flex}
.sheet{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:680px;padding:24px 16px 32px;max-height:88vh;overflow:auto}
.sheet h3{font-size:20px;font-weight:700;margin-bottom:8px}
.sheet label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:16px 0 4px;font-weight:600}
.sheet input,.sheet textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;font-size:16px}
.sheet textarea{min-height:140px;resize:vertical}
.reasons{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.reason{border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px}
.reason.on{border-color:var(--ink);background:var(--ink);color:#fff}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-96px);background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:12px 16px;border-radius:999px;transition:transform .25s;z-index:20}
.toast.on{transform:translateX(-50%) translateY(0)}
.lock{max-width:420px;margin:24vh auto 0;text-align:center}
.lock p{color:var(--mute)}
</style></head>
<body><div class="wrap" id="app"></div>
<div class="dock"><button class="new" id="fb-open">Tell me what to change</button></div>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
(() => {
  const API = 'https://rag.aheadofmarket.com/morning';
  const KEY = 'aom-morning-token', OPEN = 'aom-morning-open';
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if (m) { localStorage.setItem(KEY, m[1]); history.replaceState(null, '', location.pathname); }
  const token = localStorage.getItem(KEY);
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
  let state = { report: null, cleared: {}, generating: null, dates: [], day: null, feedback_count: 0 };
  const byId = {};
  const openSecs = new Set(JSON.parse(localStorage.getItem(OPEN) || '[]'));

  // One color per section, in reading order.
  const SECTIONS = [
    { key: 'read', title: 'The big picture', c: 'var(--violet)' },
    { key: 'ideas', title: 'Ideas you might not see', c: 'var(--orange)' },
    { key: 'others', title: 'Other computers', c: 'var(--pink)' },
    { key: 'take', title: 'My take on what’s in flight', c: 'var(--blue)' },
    { key: 'playbook', title: 'Add for clients', c: 'var(--green)' },
    { key: 'money', title: 'Money in your inbox', c: 'var(--yellow)', dark: true },
    { key: 'left', title: 'Waiting on you', c: 'var(--red)' },
    { key: 'moves', title: 'Today’s moves', c: 'var(--teal)' },
    { key: 'prompts', title: 'Prompts', c: 'var(--indigo)' },
    { key: 'corner', title: 'Corner', c: 'var(--slate)' },
    { key: 'alerts', title: 'Heads up', c: 'var(--red)' },
  ];

  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200); }
  async function api(path, opts = {}) {
    const r = await fetch(API + path, { ...opts, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } });
    if (r.status === 401) { localStorage.removeItem(KEY); locked('That link has expired. Open your private link again.'); throw new Error('401'); }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }
  const act = body => api('/action', { method: 'POST', body: JSON.stringify(body) });
  function locked(msg) { app.innerHTML = `<div class="lock"><h1>This page is private.</h1><p>${esc(msg || 'Open it from your private link.')}</p></div>`; }

  async function load(day) {
    try {
      const d = await api('/report' + (day ? '?date=' + day : ''));
      state = { ...state, ...d, day: d.report ? d.report.id : day };
      render();
      if (state.generating) setTimeout(() => load(), 30000);
    } catch (e) {
      if (e.message !== '401') app.innerHTML = `<div class="lock"><h1>Can't reach the Mac.</h1><p>The studio Mac serves this page. If it's asleep or offline, try again in a bit.</p></div>`;
    }
  }

  const live = arr => (arr || []).filter(x => x && !state.cleared[x.id]);
  const src = x => x && x.source ? `<span class="src">${esc(x.source)}</span>` : '';
  const ctlBtns = (id, label) => `<button class="btn" data-do="done" data-id="${esc(id)}" data-label="${esc(label)}">Done</button><button class="btn" data-do="dismiss" data-id="${esc(id)}" data-label="${esc(label)}">Dismiss</button>`;

  function item(x, c, head, metaBits, detailHtml, extraActs = '') {
    const label = x.title || x.name || x.who || x.add || x.text || '';
    return `<details class="it" data-item="${esc(x.id)}" style="--c:${c}"><summary><span class="dot"></span><div><div class="head">${head}</div><div class="meta">${metaBits.filter(Boolean).join('')}${src(x)}</div></div>${CHEV}</summary>
      <div class="detail">${detailHtml}<div class="acts">${extraActs}${ctlBtns(x.id, label)}</div></div></details>`;
  }

  function sections(r) {
    const pr = r.prompts || {};
    const out = {};
    if (r.read) out.read = { count: '', peek: r.read.headline || r.read.body, html: `<p class="read-body">${esc(r.read.body)}</p>${(r.read.unseen || []).length ? `<ul class="unseen">${r.read.unseen.map(u => `<li>${esc(u)}</li>`).join('')}</ul>` : ''}${r.read.source ? `<div class="meta" style="margin:12px 0 8px">${src(r.read)}</div>` : ''}` };
    const ideas = live(r.ideas);
    if ((r.ideas || []).length) out.ideas = { count: ideas.length, peek: ideas[0] && ideas[0].title, html: ideas.map(x => item(x, 'var(--orange)', esc(x.title), [x.lane ? `<span class="tag">${esc(x.lane)}</span>` : '', x.size ? `<span class="amt">${esc(x.size)}</span>` : ''],
      `<div class="kv"><b>Why</b><span>${esc(x.why)}</span><b>First step</b><span>${esc(x.how)}</span></div>`)).join('') };
    const others = live(r.others);
    if ((r.others || []).length || r.others_note) out.others = { count: others.length, peek: (others[0] && others[0].title) || r.others_note, html: (r.others_note ? `<p class="empty">${esc(r.others_note)}</p>` : '') + others.map(x => item(x, 'var(--pink)', esc(x.title), [x.machine ? `<span class="tag">${esc(x.machine)}</span>` : '', x.when ? `<span>${esc(x.when)}</span>` : ''], `<p>${esc(x.body || '')}</p>`)).join('') };
    const take = live(r.take);
    if ((r.take || []).length) out.take = { count: take.length, peek: take.map(t => t.name).join(', '), html: take.map(x => item(x, 'var(--blue)', `${esc(x.name)}`, [], `<p>${esc(x.think)}</p><div class="kv" style="margin-top:8px"><b>Where it is</b><span>${esc(x.state)}</span><b>What I'd do</b><span>${esc(x.do)}</span></div>`)).join('') };
    const pb = live(r.playbook);
    if ((r.playbook || []).length) out.playbook = { count: pb.length, peek: pb[0] && pb[0].add, html: pb.map(x => item(x, 'var(--green)', esc(x.add), [`<span class="tag">${esc(x.client)}</span>`, x.effort ? `<span>${esc(x.effort)} effort</span>` : ''], `<p>${esc(x.why)}</p>`)).join('') };
    const money = live(r.money);
    if ((r.money || []).length) out.money = { count: money.length, peek: money[0] && money[0].title, html: money.map(x => item(x, 'var(--yellow)', esc(x.title), [x.tag ? `<span class="tag" style="color:#a67c00">${esc(x.tag)}</span>` : ''], `<p>${esc(x.body)}</p>`, x.action ? `<button class="btn go dark" style="--c:var(--yellow)" data-open="${esc(x.id)}">${esc(x.action.label || 'Open')}</button>` : '')).join('') };
    const left = live(r.left);
    if ((r.left || []).length) out.left = { count: left.filter(x => x.ball !== 'them').length, peek: left.map(x => x.who.split(' · ')[0]).join(', '), html: left.map(x => item(x, 'var(--red)', esc(x.who), [`<span class="ball ${x.ball === 'them' ? 'them' : 'you'}">${x.ball === 'them' ? 'Their move' : 'Your move'}</span>`], `<p>${esc(x.what)}</p>`)).join('') };
    const moves = live(r.moves);
    const sys = r.system && !state.cleared[r.system.id] ? r.system : null;
    if ((r.moves || []).length) out.moves = { count: moves.length, peek: moves[0] && moves[0].title, html: moves.map(x => item(x, 'var(--teal)', esc(x.title), [], `<p>${esc(x.sub)}</p>`)).join('') + (sys ? item(sys, 'var(--teal)', esc(sys.title || 'System to build') + ': ' + esc(sys.body), [], `<p>${esc(sys.sub || '')}</p>`) : '') };
    const written = live(pr.written), found = live(pr.today);
    if (written.length || found.length || pr.note) out.prompts = { count: written.length + found.length, peek: (written[0] && written[0].title) || pr.note, html:
      written.map(p => item(p, 'var(--indigo)', esc(p.title), ['<span class="tag">Written for you</span>'], `<pre class="prompt">${esc(p.text)}</pre>`, `<button class="btn go" style="--c:var(--indigo)" data-copy="${esc(p.id)}">Copy prompt</button>`)).join('') +
      found.map(p => item(p, 'var(--indigo)', esc(p.text.slice(0, 90)) + (p.text.length > 90 ? '...' : ''), [p.who ? `<span class="tag">${esc(p.who)}</span>` : '', p.engagement ? `<span>${esc(p.engagement)}</span>` : ''], `<pre class="prompt">${esc(p.text)}</pre>${p.url ? `<p style="margin-top:8px"><a href="${esc(p.url)}" target="_blank" rel="noopener">Source</a></p>` : ''}`)).join('') +
      (pr.note ? `<p class="empty">${esc(pr.note)}</p>` : '') +
      ((pr.leaderboard || []).length ? `<p class="empty"><b>This month:</b> ${pr.leaderboard.slice(0, 5).map((p, i) => `${i + 1}. ${esc(p.text.slice(0, 60))}`).join(' · ')}</p>` : '') };
    if (r.corner) { const c = r.corner; out.corner = { count: '', peek: c.next, html: `<div style="padding:16px 0 8px;color:var(--soft);font-size:14px">${typeof c.pct === 'number' ? `<div class="bar" style="--c:var(--slate)"><i style="width:${Math.max(0, Math.min(100, c.pct))}%"></i></div>` : ''}<p>${esc(c.body)}</p><p style="margin-top:8px"><b>Next step:</b> ${esc(c.next)}</p>${c.source ? `<div class="meta" style="margin-top:8px">${src(c)}</div>` : ''}</div>` }; }
    const alerts = live(r.alerts);
    if ((r.alerts || []).length) out.alerts = { count: alerts.length, peek: alerts[0] && alerts[0].title, html: alerts.map(a => item(a, a.level === 'red' ? 'var(--red)' : 'var(--yellow)', esc(a.title), [], `<p>${esc(a.sub || '')}</p>`)).join('') };
    return out;
  }

  function render() {
    const r = state.report;
    if (!r) { app.innerHTML = header() + `<p class="empty">No report yet for this day.</p>`; wire(); return; }
    const pr = r.prompts || {};
    [...(r.money||[]), ...(r.left||[]), ...(r.moves||[]), ...(r.alerts||[]), ...(r.ideas||[]), ...(r.take||[]), ...(r.playbook||[]), ...(r.others||[]), ...(pr.today||[]), ...(pr.written||[]), r.system].forEach(x => { if (x && x.id) byId[x.id] = x; });
    const secs = sections(r);
    let h = header();
    if (r.feedback_applied) h += `<div class="applied"><b>From your note:</b> ${esc(r.feedback_applied)}</div>`;
    h += `<div class="glance">${SECTIONS.filter(s => secs[s.key] && secs[s.key].count > 0).map(s => `<a class="chip" href="#sec-${s.key}" data-jump="${s.key}" style="--c:${s.c}"><i></i>${esc(s.title)} <b>${secs[s.key].count}</b></a>`).join('')}</div>`;
    h += SECTIONS.filter(s => secs[s.key]).map(s => {
      const x = secs[s.key];
      return `<details class="sec" id="sec-${s.key}" data-sec="${s.key}" style="--c:${s.c}" ${openSecs.has(s.key) ? 'open' : ''}><summary><span class="badge ${s.dark ? 'dark' : ''}">${x.count === '' ? '&bull;' : x.count}</span><div style="min-width:0"><div class="stitle">${esc(s.title)}</div><div class="speek">${esc(x.peek || '')}</div></div>${CHEV}</summary><div class="body">${x.html || '<p class="empty">All clear.</p>'}</div></details>`;
    }).join('');
    const clearedHere = Object.entries(state.cleared).filter(([id]) => byId[id]);
    if (clearedHere.length) h += `<details class="sec" style="--c:var(--slate)"><summary><span class="badge">${clearedHere.length}</span><div><div class="stitle">Cleared</div><div class="speek">Things you marked done or dismissed</div></div>${CHEV}</summary><div class="body">${clearedHere.map(([id, c]) => `<div style="display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)"><div><div style="font-size:14px;font-weight:600">${esc(c.label || id)}</div><div class="meta">${c.status === 'done' ? 'Done' : 'Dismissed'}${c.note ? ' · ' + esc(c.note) : ''}</div></div><button class="undo" data-undo="${esc(id)}">Undo</button></div>`).join('')}</div></details>`;
    app.innerHTML = h;
    wire();
  }

  function header() {
    const r = state.report || {};
    const d = r.id ? new Date(r.id + 'T12:00:00') : new Date();
    const label = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    const gen = state.generating;
    return `<div class="top"><div class="date">${esc(label)}</div><div style="display:flex;gap:8px;align-items:center">
        ${state.dates.length > 1 ? `<select class="days" id="days">${state.dates.map(x => `<option ${x === state.day ? 'selected' : ''}>${x}</option>`).join('')}</select>` : ''}
        <button class="new" id="new" ${gen ? 'disabled' : ''}>${gen ? '<span class="spin"></span>Making it' : 'New report'}</button></div></div>
      <h1>${esc(r.greeting || 'Good morning, Patrik.')}</h1><div class="sub">${esc(r.sources || '')}</div>`;
  }

  function sheet(html) { document.getElementById('sheet').innerHTML = html; document.getElementById('scrim').classList.add('on'); }
  function close() { document.getElementById('scrim').classList.remove('on'); }
  document.getElementById('scrim').addEventListener('click', e => { if (e.target.id === 'scrim') close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  async function clearItem(kind, id, label, note) {
    try {
      await act({ type: kind, id, label, note });
      state.cleared[id] = { status: kind === 'dismiss' ? 'dismissed' : 'done', label, note, at: new Date().toISOString() };
      render();
      toast(kind === 'dismiss' ? "Dismissed. It won't come back." : 'Marked done.');
    } catch (e) { toast("Didn't save. Try again."); }
  }

  function askDismiss(id, label) {
    const reasons = ['Not relevant', 'Already handled', 'Wrong or out of date', "Don't suggest this kind again"];
    sheet(`<h3>Dismiss this?</h3><p style="color:var(--mute);font-size:14px">${esc(label)}</p><label>Why (tomorrow's report learns from it)</label>
      <div class="reasons">${reasons.map(r => `<button class="reason" data-reason="${esc(r)}">${esc(r)}</button>`).join('')}</div>
      <div class="acts" style="margin-top:24px"><button class="btn go" style="--c:var(--ink)" id="go">Dismiss</button><button class="btn" id="cancel">Cancel</button></div>`);
    let note = '';
    document.querySelectorAll('.reason').forEach(c => c.onclick = () => { document.querySelectorAll('.reason').forEach(x => x.classList.remove('on')); c.classList.add('on'); note = c.dataset.reason; });
    document.getElementById('cancel').onclick = close;
    document.getElementById('go').onclick = () => { close(); clearItem('dismiss', id, label, note); };
  }

  function openFeedback() {
    const gen = state.generating;
    sheet(`<h3>Tell me what to change</h3><p style="color:var(--mute);font-size:14px">Anything: what's wrong or out of date, what to cut, what to go deeper on. Every note shapes every report after this one.${state.feedback_count ? ' ' + state.feedback_count + ' notes so far.' : ''}</p>
      <textarea id="fb-text" placeholder="e.g. The Kohrs thing is wrong. More on clipping. Ideas for Ambition."></textarea>
      <div class="acts" style="margin-top:16px"><button class="btn go" style="--c:var(--ink)" id="fb-go" ${gen ? 'disabled' : ''}>${gen ? 'Already making one' : 'Send and remake report'}</button><button class="btn" id="fb-save">Just send</button></div>`);
    const sendFb = async (regenerate) => {
      const text = (document.getElementById('fb-text').value || '').trim();
      if (!text) { toast('Type a note first.'); return; }
      try {
        const r = await act({ type: 'feedback', text, regenerate, report: state.day });
        close(); state.feedback_count = (state.feedback_count || 0) + 1;
        if (r.message === 'generating' || r.message === 'already generating') { state.generating = { started_at: new Date().toISOString() }; render(); setTimeout(() => load(), 30000); toast('Got it. Making a new one, about 10 minutes.'); }
        else toast(regenerate ? 'Got it. The next report will use it.' : 'Got it. Saved for the next report.');
      } catch (e) { toast("Didn't send. Try again."); }
    };
    document.getElementById('fb-go').onclick = () => sendFb(true);
    document.getElementById('fb-save').onclick = () => sendFb(false);
  }
  document.getElementById('fb-open').onclick = () => { if (token) openFeedback(); };

  function openAction(id) {
    const x = byId[id]; if (!x || !x.action) return;
    const a = x.action;
    if (a.type === 'draft') {
      sheet(`<h3>Reply</h3><label>To</label><input id="f-to" value="${esc(a.to)}"><label>Subject</label><input id="f-su" value="${esc(a.subject)}">
        <label>Message</label><textarea id="f-body">${esc(a.body)}</textarea>
        <div class="acts" style="margin-top:16px"><button class="btn go" style="--c:var(--ink)" id="gmail">Open in Gmail</button><button class="btn" id="copy">Copy</button><button class="btn" id="sent">I sent it</button></div>`);
      const val = k => document.getElementById(k).value;
      document.getElementById('gmail').onclick = () => window.open('https://mail.google.com/mail/?authuser=' + encodeURIComponent(a.from || 'hello@aom-inhouse.com') + '&view=cm&fs=1&to=' + encodeURIComponent(val('f-to')) + '&su=' + encodeURIComponent(val('f-su')) + '&body=' + encodeURIComponent(val('f-body')), '_blank', 'noopener');
      document.getElementById('copy').onclick = async () => { try { await navigator.clipboard.writeText(val('f-body')); toast('Copied.'); } catch (e) { toast("Couldn't copy."); } };
      document.getElementById('sent').onclick = () => { close(); clearItem('done', id, x.title, 'replied'); };
    } else if (a.type === 'approve-outreach') {
      sheet(`<h3>${esc(a.label || 'Approve')}?</h3><p style="color:var(--mute);font-size:14px">This lets the daily drip start first emails to everyone on the ${esc(a.day)} list. Follow-ups continue on their own.</p>
        <div class="acts" style="margin-top:24px"><button class="btn go" style="--c:var(--ink)" id="go">Approve</button><button class="btn" id="cancel">Cancel</button></div>`);
      document.getElementById('cancel').onclick = close;
      document.getElementById('go').onclick = async () => {
        close(); toast('Approving...');
        try { const r = await act({ type: 'approve-outreach', id, label: x.title, day: a.day }); if (r.ok) { state.cleared[id] = { status: 'done', label: x.title }; render(); toast('Approved.'); } else toast("Didn't approve: " + (r.error || r.message || 'error')); }
        catch (e) { toast("Didn't approve. Try again."); }
      };
    }
  }

  function wire() {
    app.querySelectorAll('details.sec[data-sec]').forEach(d => d.addEventListener('toggle', () => { d.open ? openSecs.add(d.dataset.sec) : openSecs.delete(d.dataset.sec); localStorage.setItem(OPEN, JSON.stringify([...openSecs])); }));
    app.querySelectorAll('[data-jump]').forEach(a => a.onclick = e => { e.preventDefault(); const d = document.getElementById('sec-' + a.dataset.jump); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth' }); } });
    app.querySelectorAll('[data-do]').forEach(b => b.onclick = () => b.dataset.do === 'dismiss' ? askDismiss(b.dataset.id, b.dataset.label) : clearItem('done', b.dataset.id, b.dataset.label, ''));
    app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openAction(b.dataset.open));
    app.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(byId[b.dataset.copy].text); toast('Copied.'); } catch (e) { toast("Couldn't copy."); } });
    app.querySelectorAll('[data-undo]').forEach(b => b.onclick = async () => { try { await act({ type: 'undo', id: b.dataset.undo }); delete state.cleared[b.dataset.undo]; render(); toast('Back on the list.'); } catch (e) { toast("Didn't undo."); } });
    const days = document.getElementById('days'); if (days) days.onchange = () => load(days.value);
    const nb = document.getElementById('new');
    if (nb) nb.onclick = async () => {
      nb.disabled = true;
      try {
        const r = await act({ type: 'regenerate' });
        if (r.message === 'generating' || r.message === 'already generating') { state.generating = { started_at: new Date().toISOString() }; render(); setTimeout(() => load(), 30000); toast('Making a fresh one, about 10 minutes.'); }
        else { toast('Asked for a new one.'); nb.disabled = false; }
      } catch (e) { nb.disabled = false; toast("Didn't go through."); }
    };
  }

  if (!token) locked(); else load();
})();
</script>
</body></html>
