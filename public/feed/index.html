<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AOM — Feed</title>
<meta name="description" content="Ahead of Market — the feed. Production reels and client work, one frame at a time.">
<meta property="og:title" content="AOM — Feed">
<meta property="og:description" content="Production reels and client work, one frame at a time.">
<style>
/* ============================================================
   AOM /feed — TikTok-grammar vertical feed, AOM editorial chrome.
   Patterns vendored from MIT react-tiktok-style-video-scroller
   (snap + windowed mounting + autoplay-policy mute handling) and
   toptop-clone's most-visible-plays observer; re-expressed vanilla.
   Brand: obsidian #0B0B0B / ivory #F6F6F4 / bronze #B58A38 only.
   ============================================================ */
@font-face{font-family:'Schibsted Grotesk';src:url('/feed/assets/fonts/SchibstedGrotesk-var.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}

:root{
  --obsidian:#0B0B0B;
  --ink-800:#161615;
  --ink-700:#2A2A28;
  --ink-500:#6E6E66;
  --ink-300:#B6B2AB;
  --ivory:#F6F6F4;
  --gold:#B58A38;
  --mast-h:56px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--obsidian);color:var(--ivory);overflow:hidden}
body{font-family:'Schibsted Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}

/* ---- masthead ---- */
.mast{position:fixed;top:0;left:0;right:0;height:var(--mast-h);z-index:30;
  display:flex;align-items:center;gap:16px;padding:0 20px;
  background:var(--obsidian);border-bottom:1px solid var(--ink-700)}
.mast .mark{width:26px;height:26px;display:block;color:var(--ivory);flex:none}
.mast .mark svg{width:100%;height:100%;display:block}
.wordmark{font-size:14px;font-weight:700;line-height:1;
  letter-spacing:.26em;text-transform:uppercase;display:flex;align-items:baseline;gap:4px}
.wordmark .period{width:5px;height:5px;background:var(--gold);display:inline-block;flex:none}
.mast .count{margin-left:auto;font-size:11px;letter-spacing:.18em;color:var(--ink-300);
  border:1px solid var(--ink-700);padding:4px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.mast .count b{color:var(--ivory);font-weight:500}

/* ---- feed ---- */
.feed{position:fixed;inset:0;top:var(--mast-h);
  overflow-y:scroll;scroll-snap-type:y mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.feed::-webkit-scrollbar{display:none}
.item{height:100%;scroll-snap-align:start;scroll-snap-stop:always;
  position:relative;display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage video{width:100%;height:100%;object-fit:contain;display:block;background:var(--obsidian)}

/* desktop: constrain to a 9/16 card on the obsidian ground */
@media (min-width:700px){
  .stage{width:auto;aspect-ratio:9/16;height:min(100%,92vh);border:1px solid var(--ink-700)}
}

/* ---- per-item overlay (anchored to the stage, so it rides the card on desktop) ---- */
.meta{position:absolute;left:16px;right:88px;bottom:calc(18px + var(--safe-b));z-index:5;
  display:flex;flex-direction:column;gap:0;align-items:flex-start;pointer-events:none}
@media (min-width:700px){.meta{right:16px;bottom:18px}}
.idx{font-size:12px;font-weight:700;letter-spacing:.14em;
  color:var(--obsidian);background:var(--gold);padding:4px 8px;font-variant-numeric:tabular-nums}
.label{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--ivory);
  background:var(--obsidian);padding:8px 12px}
.progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink-700);z-index:6}
.progress i{display:block;height:100%;width:0;background:var(--gold)}
.paused-flag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;
  width:14px;height:14px;background:var(--ivory);opacity:0;transition:opacity 140ms linear;pointer-events:none}
.item.is-paused .paused-flag{opacity:.9}

/* ---- fixed action rail (acts on the active item) ---- */
.rail{position:fixed;right:16px;bottom:calc(24px + var(--safe-b));z-index:31;
  display:flex;flex-direction:column;gap:8px}
.rail button{width:46px;height:46px;border:1px solid var(--ink-700);background:var(--obsidian);
  display:flex;align-items:center;justify-content:center;color:var(--ivory)}
.rail button:active{background:var(--ink-800)}
.rail svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.6}
.rail button.on{color:var(--obsidian);background:var(--gold);border-color:var(--gold)}
.rail button.on svg{fill:currentColor}
@media (min-width:700px){.rail{right:calc(50% - min(50vh*9/16,46vw) - 62px)}}

/* keyboard hint, desktop only */
.hint{position:fixed;left:20px;bottom:calc(18px + var(--safe-b));z-index:31;
  font-size:10px;letter-spacing:.18em;color:var(--ink-500);text-transform:uppercase;display:none}
@media (min-width:700px){.hint{display:block}}
</style>
</head>

  <div class="count"><b id="pos">01</b>&nbsp;/&nbsp;<span id="total">00</span></div>
</header>

<main class="feed" id="feed" aria-label="AOM video feed"></main>

<nav class="rail" aria-label="Actions for current video">
  <button id="muteBtn" aria-label="Unmute" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><line id="muteSlash" x1="19" y1="5" x2="15" y2="19"/></svg>
  </button>
  <button id="likeBtn" aria-label="Like" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20l-7-7a4.2 4.2 0 010-6 4.2 4.2 0 016 0l1 1 1-1a4.2 4.2 0 016 0 4.2 4.2 0 010 6l-7 7z"/></svg>
  </button>
  <button id="shareBtn" aria-label="Share">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 13v6h14v-6"/></svg>
  </button>
</nav>

<p class="hint">Scroll · J / K · Space</p>

<script>
/* ---- the set: real files, real names, nothing invented ---- */
const ITEMS = (() => {
  const named = [
    ['/paired/day-3-reel.mp4',        'AOM Social — Day 3'],
    ['/videos/ambition-vertical.mp4', 'Ambition Mechanical'],
    ['/videos/isa-brand.mp4',         'ISA Energy'],
    ['/videos/ih-life.mp4',           'Included Health'],
    ['/videos/spacerising-event.mp4', 'Space Rising'],
    ['/videos/isa-demo.mp4',          'ISA Energy'],
    ['/videos/collage-01.mp4',        'AOM — Production Collage'],
    ['/videos/ih-culture.mp4',        'Included Health'],
    ['/videos/isa-validation.mp4',    'ISA Energy'],
    ['/videos/collage-02.mp4',        'AOM — Production Collage'],
    ['/videos/collage-03.mp4',        'AOM — Production Collage'],
  ];
  const reels = Array.from({length:26},(_,i)=>{
    const n = String(i+1).padStart(2,'0');
    return [`/videos/reel-${n}.mp4`, `AOM — Production Reel ${n}`];
  });
  // interleave: a named piece every third slot while both pools last
  const out=[]; let a=0,b=0;
  while(a<named.length||b<reels.length){
    if(a<named.length) out.push(named[a++]);
    if(b<reels.length) out.push(reels[b++]);
    if(b<reels.length) out.push(reels[b++]);
  }
  return out.map(([src,label],i)=>({src,label,id:src.split('/').pop().replace('.mp4','')}));
})();

const WINDOW = 2;                      // mounted video sources: active ± 2
const feed   = document.getElementById('feed');
const posEl  = document.getElementById('pos');
const pad    = n => String(n+1).padStart(2,'0');
document.getElementById('total').textContent = String(ITEMS.length).padStart(2,'0');

/* ---- build shells (cheap divs; <video> src is windowed) ---- */
ITEMS.forEach((it,i)=>{
  const s = document.createElement('section');
  s.className='item'; s.dataset.i=i; s.id=it.id;
  s.innerHTML =
    `<div class="stage">
       <video playsinline loop muted preload="none" aria-label="${it.label}"></video>
       <span class="paused-flag" aria-hidden="true"></span>
       <div class="progress" aria-hidden="true"><i></i></div>
       <div class="meta">
         <span class="idx">${pad(i)}</span>
         <span class="label">${it.label}</span>
       </div>
     </div>`;
  feed.appendChild(s);
});
const shells = [...feed.children];

/* ---- state ---- */
let active = -1;
let userUnmuted = false;               // persists the explicit unmute across items
const likes = new Set(JSON.parse(localStorage.getItem('aom-feed-likes')||'[]'));

/* ---- windowed source mounting (decoder budget) ---- */
function syncWindow(center){
  shells.forEach((el,i)=>{
    const v = el.querySelector('video');
    if(Math.abs(i-center)<=WINDOW){
      if(!v.src){ v.src = ITEMS[i].src; v.preload='metadata'; }
    }else if(v.src){
      v.pause(); v.removeAttribute('src'); v.load();
    }
  });
}

/* ---- most-visible-plays observer ---- */
const ratios = new Map();
const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>ratios.set(+e.target.dataset.i, e.intersectionRatio));
  let best=-1, bestR=0;
  ratios.forEach((r,i)=>{ if(r>bestR){bestR=r;best=i;} });
  if(best>=0 && best!==active && bestR>=.5) setActive(best);
},{root:feed,threshold:[0,.25,.5,.75,1]});
shells.forEach(el=>io.observe(el));

function setActive(i){
  if(active>=0){
    const prev = shells[active].querySelector('video');
    prev.pause(); prev.currentTime=0;
    shells[active].classList.remove('is-paused');
  }
  active=i;
  syncWindow(i);
  const v = shells[i].querySelector('video');
  v.muted = !userUnmuted;
  v.play().catch(()=>{ v.muted=true; muteUI(); v.play().catch(()=>{}); });
  posEl.textContent = pad(i);
  likeUI(); muteUI();
  history.replaceState(null,'','#'+ITEMS[i].id);
}

/* ---- progress ---- */
setInterval(()=>{
  if(active<0) return;
  const v = shells[active].querySelector('video');
  const bar = shells[active].querySelector('.progress i');
  if(v.duration) bar.style.width = (v.currentTime/v.duration*100)+'%';
},120);

/* ---- tap to pause ---- */
feed.addEventListener('click',e=>{
  const item = e.target.closest('.item');
  if(!item || +item.dataset.i!==active) return;
  const v = item.querySelector('video');
  if(v.paused){ v.play().catch(()=>{}); item.classList.remove('is-paused'); }
  else{ v.pause(); item.classList.add('is-paused'); }
});

/* ---- rail ---- */
const muteBtn=document.getElementById('muteBtn'),
      likeBtn=document.getElementById('likeBtn'),
      shareBtn=document.getElementById('shareBtn'),
      slash=document.getElementById('muteSlash');
function muteUI(){
  const muted = active<0 || shells[active].querySelector('video').muted;
  slash.style.display = muted?'':'none';
  muteBtn.classList.toggle('on',!muted);
  muteBtn.setAttribute('aria-pressed',String(!muted));
  muteBtn.setAttribute('aria-label',muted?'Unmute':'Mute');
}
muteBtn.addEventListener('click',()=>{
  if(active<0) return;
  const v = shells[active].querySelector('video');
  v.muted = !v.muted;
  userUnmuted = !v.muted;
  muteUI();
});
function likeUI(){
  const on = active>=0 && likes.has(ITEMS[active].id);
  likeBtn.classList.toggle('on',on);
  likeBtn.setAttribute('aria-pressed',String(on));
}
likeBtn.addEventListener('click',()=>{
  if(active<0) return;
  const id=ITEMS[active].id;
  likes.has(id)?likes.delete(id):likes.add(id);
  localStorage.setItem('aom-feed-likes',JSON.stringify([...likes]));
  likeUI();
});
shareBtn.addEventListener('click',async()=>{
  const url = location.origin+'/feed#'+(active>=0?ITEMS[active].id:'');
  try{
    if(navigator.share) await navigator.share({title:'AOM — Feed',url});
    else{ await navigator.clipboard.writeText(url);
      shareBtn.classList.add('on'); setTimeout(()=>shareBtn.classList.remove('on'),700); }
  }catch(_){}
});

/* ---- keyboard ---- */
function jump(d){
  const t=Math.min(ITEMS.length-1,Math.max(0,(active<0?0:active)+d));
  shells[t].scrollIntoView({behavior:'smooth'});
}
addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();jump(1);}
  else if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();jump(-1);}
  else if(e.key===' '){e.preventDefault();
    const item=shells[active]; if(!item) return;
    const v=item.querySelector('video');
    if(v.paused){v.play().catch(()=>{});item.classList.remove('is-paused');}
    else{v.pause();item.classList.add('is-paused');}}
});

/* ---- deep link ---- */
const start = ITEMS.findIndex(it=>'#'+it.id===location.hash);
if(start>0) shells[start].scrollIntoView();
syncWindow(Math.max(start,0));
</script>
