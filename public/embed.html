<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Corner Embed — Space Rising Website EA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink-0: #06090d;
      --ink-1: #0b1015;
      --ink-2: #131a22;
      --bone: #ecece2;
      --bone-dim: #9aa3ad;
      --accent: #E5451F;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--ink-0); color: var(--bone); font-family: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(229,69,31,0.12) 0%, rgba(11,15,21,0) 60%),
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(229,69,31,0.06) 0%, rgba(11,15,21,0) 70%),
        var(--ink-0);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    /* Drifting starfield */
    body::before, body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.5;
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent 50%),
        radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.4), transparent 50%),
        radial-gradient(1px 1px at 80% 50%, rgba(255,255,255,0.5), transparent 50%),
        radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,0.3), transparent 50%),
        radial-gradient(1px 1px at 70% 70%, rgba(255,255,255,0.45), transparent 50%),
        radial-gradient(1px 1px at 45% 45%, rgba(255,255,255,0.35), transparent 50%),
        radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.55), transparent 50%),
        radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.4), transparent 50%);
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }
    body::after {
      opacity: 0.25;
      animation: drift 90s linear infinite;
    }
    @keyframes drift {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-40px, -30px, 0); }
    }

    header {
      padding: 28px 32px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-size: 22px;
      letter-spacing: -0.01em;
      color: var(--bone);
    }
    .brand .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
    }
    .crumb {
      font-family: "Oswald", sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--bone-dim);
    }
    .crumb a { color: var(--bone-dim); text-decoration: none; }
    .crumb a:hover { color: var(--bone); }

    main {
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      justify-items: center;
      padding: 32px 24px 48px;
      position: relative;
      z-index: 1;
    }
    .hero {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .label {
      font-family: "Oswald", sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(34px, 5vw, 48px);
      line-height: 1.05;
      letter-spacing: -0.015em;
      margin: 0;
      text-align: center;
      color: var(--bone);
    }
    h1 .accent { color: var(--accent); }
    .sub {
      font-size: 15px;
      line-height: 1.55;
      color: var(--bone-dim);
      text-align: center;
      max-width: 540px;
      margin: 0;
    }

    #corner-embed {
      width: 100%;
      max-width: 640px;
      display: block;
    }

    footer {
      padding: 18px 32px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: "Oswald", sans-serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #4d5763;
      position: relative;
      z-index: 1;
    }
    footer a { color: #4d5763; text-decoration: none; }
    footer a:hover { color: var(--bone-dim); }

    @media (max-width: 640px) {
      header { padding: 20px 20px 0; }
      main { padding: 24px 16px 32px; }
      footer { padding: 14px 20px 18px; flex-direction: column; gap: 6px; }
    }

    /* corner:embeddable-agents/support N3 — bare mode for iframed embeds.
       When the page loads with ?bare=1 the host (e.g. CornerSupportModal)
       already provides its own chrome and the in-iframe test scaffold
       (header / hero copy / footer / starfield) reads as a second modal.
       Strip everything except the mount target and let the widget fill. */
    body.ce-bare { background: transparent; display: block; height: 100%; }
    body.ce-bare::before, body.ce-bare::after { display: none; }
    body.ce-bare > header,
    body.ce-bare > footer,
    body.ce-bare main > .hero > .label,
    body.ce-bare main > .hero > h1,
    body.ce-bare main > .hero > .sub { display: none; }
    body.ce-bare main { padding: 0; height: 100%; }
    body.ce-bare .hero { gap: 0; height: 100%; max-width: none; }
    body.ce-bare #corner-embed { max-width: none; height: 100%; }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span><span>Corner</span></div>
    <div class="crumb"><a href="/dashboard">Workspace</a> &middot; Embed Test</div>
  </header>

  <main>
    <section class="hero">
      <div class="label">Embeddable Agents — R0 Preview</div>
      <h1>Space Rising <span class="accent">Website</span> mission, anywhere.</h1>
      <p class="sub">One script tag, one chat, one mission. Talk to the SRW EA right here. Every message lands in the mission room inside Corner.</p>
      <div id="corner-embed" aria-label="Space Rising Website EA"></div>
    </section>
  </main>

  <footer>
    <div>Powered by Corner Embeddable Agents</div>
    <div><a href="/dashboard">↩ Back to workspace</a></div>
  </footer>

  <script>
    // Allow ?id=<embed_id> for cycling test embeds at the same URL.
    // Falls back to the SR website mission embed (R0 default).
    // Allow ?visitor_id=<id> to scope the session (e.g. "support-bens-arsenal").
    // Allow ?bare=1 to strip the test-page scaffold + force the widget to
    // mount inline (used by CornerSupportModal so the iframe shows ONLY the
    // chat, not a nested test page inside the host modal).
    (function () {
      var params = new URLSearchParams(window.location.search);
      var id = (params.get('id') || 'emb_sr_website').trim();
      if (!/^emb_[a-z0-9_-]{3,40}$/.test(id)) id = 'emb_sr_website';
      var visitorId = (params.get('visitor_id') || '').trim();
      var bare = params.get('bare') === '1';
      if (bare) document.body.classList.add('ce-bare');
      var s = document.createElement('script');
      s.src = '/embed/v1/widget.js';
      s.setAttribute('data-embed-id', id);
      s.setAttribute('data-mount', '#corner-embed');
      // Pass visitor_id override if provided so tenant support threads stay scoped.
      if (visitorId) s.setAttribute('data-visitor-id', visitorId);
      // Force inline mount in bare mode so the widget fills the iframe instead
      // of spawning its own fixed bottom-right launcher (which read as the
      // "second modal" inside CornerSupportModal).
      if (bare) s.setAttribute('data-force-inline', '1');
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
