<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/hero/assets/tokens.css">
<title>Ahead of Market — You never built a marketing department. So we become it.</title>
<style>
/* ============================================================
   Ahead of Market — homepage hero.
   Type and color are the Ahead of Market design system, copied
   verbatim from .claude/skills/ahead-of-market-design/tokens/.
   ============================================================ */
@font-face{font-family:'Druk Cond';src:url('/hero/assets/fonts/DrukCond-Super-subset.woff2') format('woff2'),url('/hero/assets/fonts/DrukCond-Super-Trial.otf') format('opentype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Schibsted Grotesk';src:url('/hero/assets/fonts/SchibstedGrotesk-var.woff2') format('woff2');font-weight:400 700;font-style:normal;font-display:swap}

:root{
  --page-x:100px;
  /* The MEASURE is the design's one governing number. It is the smaller of the
     system's 1240px container, the window minus its gutters, and what the
     viewport HEIGHT can carry (310px of fixed chrome, 3 lines x 0.84 leading,
     5.371em on the longest line). When height binds, the column narrows with
     the type instead of the type shrinking inside a column it no longer fills,
     so the monument stays flush at every window size. */
  --measure:min(1120px, calc(100vw - 2 * var(--page-x)), calc((100svh - 310px) * 2.1314));
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--paper);
  font-family:'Schibsted Grotesk',system-ui,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  caret-color:var(--accent);
  scrollbar-color:var(--divider) var(--bg);
}
::selection{background:var(--accent);color:var(--text-on-accent)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--paper);outline-offset:3px}

/* ---------- the frame ---------- */
.hero{
  min-height:100svh;
  width:var(--measure);
  margin:0 auto;
  display:flex;
  flex-direction:column;
}

/* ---------- masthead ---------- */
.masthead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:var(--space-8) 0;
  border-bottom:1px solid var(--divider);
}
.identity{display:flex;align-items:center;gap:var(--space-4)}
.mark{width:32px;height:32px;display:block;color:var(--paper);transition:color 160ms cubic-bezier(0.2,0,0,1)}
.mark:hover{color:var(--accent)}
.mark svg{width:100%;height:100%;display:block}
.label{
  font-size:12px;
  font-weight:500;
  letter-spacing:0.18em;
  text-transform:uppercase;
  line-height:1.2;
}
.identity .label{color:var(--paper)}
.nav{display:flex;align-items:center;gap:var(--space-16)}
.nav a{color:var(--text-muted);transition:color 160ms cubic-bezier(0.2,0,0,1)}
.nav a:hover{color:var(--paper)}
.menu{display:flex;align-items:center;gap:var(--space-2)}
.menu svg{display:block;width:16px;height:16px;stroke:currentColor;stroke-width:2;stroke-linecap:square;fill:none}

/* ---------- the monument ---------- */
.stage{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:var(--space-4) 0;
  container-type:inline-size;
}
.monument{
  margin:0;
  font-family:'Druk Cond','Schibsted Grotesk',system-ui,Helvetica,Arial,sans-serif;
  font-weight:400;
  /* sized from the MEASURE, not guessed: 100/5.371em is the width of the
     longest line, so the block spans its column exactly at every width. */
  font-size:18.55cqw;
  line-height:0.79;
  text-transform:uppercase;
  color:var(--paper);
}
.monument span{display:block;white-space:nowrap}
.monument .m{display:none}
/* Every line is force-justified to the same measure, so the block is flush on
   both edges and each break sits on a sense unit rather than where the width ran
   out. The deficit is split the way a typesetter splits it — a word space takes
   twice a letter space — and the terminal period HANGS outside the measure, so
   what lines up is the letterforms, not the punctuation. Values solved by
   measuring the rendered line, not by eye. Positive tracking only. */
/* REVISED 2026-08-05 (Patrik: "I like A but the text spacing is weird").
   The block was one size with every line PRIED APART to reach the measure:
   at 230px the lines are naturally 926 / 1260 / 870 wide against a 1240
   column, so lines 1 and 3 were tracked ~30% open while line 2 sat tight.
   That unevenness IS the weirdness. Fixed at the cause: each line is SIZED
   to the measure at one uniform tracking, so the block stays flush on both
   edges and the type colour is even. Sizes solved by measuring each line's
   natural width, not by eye. */
.monument span{letter-spacing:0.005em;word-spacing:normal}
.d1{font-size:24.84cqw}
.d2{font-size:18.26cqw}
.d3{font-size:26.44cqw}

/* ---------- the answer ---------- */
.answer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:var(--space-12);
  padding:var(--space-6) 0;
  border-top:1px solid var(--divider);
}
.subline{
  margin:0;
  font-size:20px;
  font-weight:400;
  line-height:1.4;
  color:var(--text-muted);
  max-width:62ch;
  text-wrap:balance;
}
.subline b{font-weight:500;color:var(--paper)}
.cta{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:var(--space-6);
  padding:var(--space-4) var(--space-8);
  background:var(--accent);
  border:1px solid var(--accent);
  color:var(--bg);
  transition:color 180ms cubic-bezier(0.2,0,0,1);
  font-size:14px;
  font-weight:600;
  letter-spacing:0.14em;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
}
.cta span,.cta svg{position:relative;z-index:1}
.cta svg{display:block;width:14px;height:14px;stroke:currentColor;stroke-width:2;stroke-linecap:square;fill:none}
.cta::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--bg);
  transform:scaleX(0);
  transform-origin:left center;
  transition:transform 180ms cubic-bezier(0.2,0,0,1);
}
.cta:hover::before{transform:scaleX(1)}
.cta:hover{color:var(--accent)}
.cta:active{transform:translateY(1px)}

/* ---------- the base band ---------- */
.disciplines{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--divider);
  padding:var(--space-6) 0 var(--space-8);
}
.disciplines span{color:var(--text-muted)}
.disciplines span+span{
  border-left:1px solid var(--divider);
  padding-left:var(--space-6);
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:1ms !important}
}

/* ---------- tablet ---------- */
@media (max-width:1024px){
  :root{--page-x:48px}
  .nav{gap:var(--space-8)}
}

/* ---------- 390 ---------- */
@media (max-width:640px){
  :root{
    --page-x:24px;
    /* 4 lines at this width, 3.702em on the longest, 0.86 leading */
    --measure:min(calc(100vw - 2 * var(--page-x)), calc((100svh - 410px) * 1.0762));
  }
  .masthead{padding:var(--space-6) 0}
  .identity .label{display:none}
  .nav{gap:var(--space-6)}
  .nav .role{display:none}
  .stage{padding:var(--space-4) 0}
  /* four hand-placed lines at this width, force-justified the same way */
  /* Slack on a phone: the stage is 474 tall for a 345 monument, so 128px is
     spare. Impeccable's own reviewer recommended top-aligning to collect it as
     one gap instead of two. TRIED IT AND LOOKED: worse. Centred, the slack reads
     as breathing room above and below; top-aligned, all 128px lands between the
     headline and the answer line and reads as a dead band, which is the exact
     defect we killed in the incumbent. Kept centred deliberately. The real fix
     is not alignment - the type is already 100% of the measure, so its height is
     locked by the column width, and the band is simply taller than four lines of
     it need. That is a round-2 layout question, not a spacing tweak. */
  .monument{font-size:26.9cqw;line-height:0.82}
  .monument .d{display:none}
  .monument .m{display:block}
  .m1{font-size:27.36cqw}
  .m2{font-size:34.71cqw}
  .m3{font-size:34.64cqw}
  .m4{font-size:26.42cqw}
  .answer{
    flex-direction:column;
    align-items:stretch;
    gap:var(--space-6);
    padding:var(--space-6) 0;
  }
  .subline{font-size:16px}
  .cta{justify-content:space-between;padding:var(--space-4)}
  .disciplines{
    display:block;
    padding:var(--space-4) 0 var(--space-4);
  }
  .disciplines span{display:block;padding:var(--space-2) 0}
  .disciplines span+span{border-left:0;padding-left:0;border-top:1px solid var(--divider)}
  .label{font-size:10px;letter-spacing:0.1em}
}
</style>
</head>
