<!-- @dsCard group="Wired Templates" viewport="430x800" subtitle="Chat phone home · the conversations list (agents + projects) with live status + needs-you. Stripped, scoped [data-cv6], labeled. Tapping a row opens the Goal Thread (tools/chat)." name="Wired · Chat list (mobile)" -->
<!--
  ============================================================================
  WIRED — Chat list, mobile   ·   Source: ui_kits/mobile/chat-list.html
  Contract: wired/mobile/chat-list.json   (rows open wired/tools/chat.html)
  ----------------------------------------------------------------------------
  The conversations list: Agents (avatar, status, last-message snippet, time,
  needs-count) and Projects (folder glyph, name, sub-line, rollup status dot).
  Lists use data-each; per-item visuals use data-mod="is-:path".
  ============================================================================
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../cv6.css">
<style> body { margin:0; background:#e8e6e2; display:flex; justify-content:center; padding:40px; } </style>
</head>
<body>

<div data-cv6 data-theme="dark" data-screen="chat-list" data-screen-label="Chat · list" class="cv6-screen" style="width:390px;height:760px;border-radius:24px;overflow:hidden;box-shadow:0 30px 70px -28px rgba(0,0,0,.5);display:flex;flex-direction:column;">
  <div class="mhdr">
    <div class="mback" data-action="nav" data-target="back"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="mhtitle"><div class="mttl">Chat</div><div class="msub"><span data-bind="counts.live">3</span> live · <span data-bind="counts.needsYou">1</span> needs you</div></div>
    <div class="mhactions"><button class="mhcta" data-action="newGoal"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New goal</button><div class="ib" style="width:36px;height:36px;border-radius:10px;" data-action="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></div><div class="ib" style="width:36px;height:36px;border-radius:10px;" data-action="openNav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></div></div>
  </div>
  <!-- filter chips: drive a real client-side filter of the list below (All/Agents/Projects/Needs you). Active state via data-mod is-on/is-off. -->
  <div class="mhchips"><span class="mhchip" data-mod="is-:chips.all" data-action="setFilter" data-target="all">All <span class="ct" data-bind="counts.all">12</span></span><span class="mhchip" data-mod="is-:chips.agents" data-action="setFilter" data-target="agents">Agents <span class="ct" data-bind="counts.agentsTotal">4</span></span><span class="mhchip" data-mod="is-:chips.projects" data-action="setFilter" data-target="projects">Projects <span class="ct" data-bind="counts.projectsTotal">8</span></span><span class="mhchip" data-mod="is-:chips.needs" data-action="setFilter" data-target="needs">Needs you <span class="ct" data-bind="counts.needsYou">1</span></span></div>
  <div data-state="ready" style="flex:1;overflow:hidden;padding-bottom:8px;">
    <div class="sec" data-mod="is-:secVis.agents"><span class="eyebrow">Agents</span><span class="mono" style="font-size:10.5px;color:var(--faint);" data-bind="agents.count">4</span></div>
    <!-- ONE row per agent; is-:agent.tint on .av; is-:agent.status on .sdot AND .astat; needs-count only when agent.needsCount > 0 -->
    <div class="crow" data-each="agents" data-action="openRoom" data-arg="agent.id"><div class="cav"><div class="av is-green" data-mod="is-:agent.tint" style="width:42px;height:42px;font-size:14px;" data-bind="agent.initials">EL</div><span class="sdot is-live" data-mod="is-:agent.status"></span></div><div style="flex:1;min-width:0;"><div style="display:flex;align-items:center;gap:8px;"><span class="cname" data-bind="agent.name">Elon</span><span class="astat is-live" data-mod="is-:agent.status"><span class="sd"></span><span data-bind="agent.statusLabel">LIVE</span></span></div><div class="csnip" data-bind="agent.snippet">Patching the resolver · step 3 of 4</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;"><span class="mono" style="font-size:10.5px;color:var(--faint);" data-bind="agent.time">2m</span><span class="needs-count" data-bind="agent.needsCount">1</span></div></div>
    <div class="sec" style="padding-top:8px;" data-mod="is-:secVis.projects"><span class="eyebrow">Projects</span><span class="mono" style="font-size:10.5px;color:var(--faint);" data-bind="projects.count">8</span></div>
    <!-- ONE row per project; is-:project.tint on .gly; is-:project.status on .sdot -->
    <div class="crow" data-each="projects" data-action="openRoom" data-arg="project.id"><div class="gly is-violet" data-mod="is-:project.tint"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg></div><div style="flex:1;min-width:0;"><div class="cname" data-bind="project.name">Space Rising</div><div class="csnip" data-bind="project.snippet">4 missions · 2 live</div></div><span class="sdot is-live" data-mod="is-:project.status" style="flex:none;"></span></div>
  </div>
</div>

</body>
</html>
