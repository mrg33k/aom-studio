<!-- @dsCard group="Wired Templates" viewport="486x962" subtitle="Shared empty / loading / error fragment · label ONCE, reuse in every tool. data-state + data-bind + data-action only." name="Wired · Shared states" -->
<!--
  SHARED STATES — the one empty / loading / error look every tool reuses.
  Do NOT redraw these per tool. Wire by swapping which [data-state] block is shown
  and binding the copy. Mount each block where a tool's body would render.

  Bindable copy lets the SAME fragment carry tool-specific words:
    empty.title / empty.body / empty.actionLabel
    loading.label
    error.title / error.body / error.code
  Actions: emptyAction, retry, viewOffline.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../cv6.css">
</head>
<body style="margin:0;background:#e8e6e2;display:flex;gap:32px;flex-wrap:wrap;padding:32px;">

<!-- ============ EMPTY (caught-up calm) ============ -->
<div data-cv6 data-theme="dark" class="cv6-screen" data-screen="state-empty" data-screen-label="State · Empty" style="width:390px;height:560px;border-radius:24px;overflow:hidden;">
  <div class="scr">
    <div data-state="empty" style="flex:1;display:flex;align-items:center;justify-content:center;">
      <div class="empty">
        <div class="e-ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <div class="e-t" data-bind="empty.title">You're all caught up</div>
        <div class="e-s" data-bind="empty.body">Nothing needs you right now. New asks the agent flags as real will land here.</div>
        <button class="assign is-quiet" data-action="emptyAction" data-bind="empty.actionLabel">Browse watching (9)</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ LOADING (Corner fullscreen language) ============ -->
<div data-cv6 data-theme="dark" class="cv6-screen" data-screen="state-loading" data-screen-label="State · Loading" style="width:390px;height:560px;border-radius:24px;overflow:hidden;">
  <div class="scr">
    <div data-state="loading" data-cv6-logo-loader class="scrbody cv6-logo-loader is-inline" role="status" aria-live="polite" data-delayed-label="Still working" data-delayed-detail="This is taking longer than expected. Corner will show the real state as soon as it settles.">
      <div class="cv6-logo-loader__inner">
        <span class="cv6-logo-loader__mark" aria-hidden="true"><span class="cv6-logo-loader__base"></span><span class="cv6-logo-loader__fill"></span></span>
        <div class="cv6-logo-loader__label" data-bind="loading.label">Preparing your workspace</div>
        <div class="cv6-logo-loader__detail" hidden></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ ERROR (recoverable) ============ -->
<div data-cv6 data-theme="dark" class="cv6-screen" data-screen="state-error" data-screen-label="State · Error" style="width:390px;height:560px;border-radius:24px;overflow:hidden;">
  <div class="scr">
    <div data-state="error" style="flex:1;display:flex;align-items:center;justify-content:center;">
      <div class="empty">
        <div class="e-ico" style="background:var(--warn-weak,rgba(251,191,36,.16));color:var(--warn);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg></div>
        <div class="e-t" data-bind="error.title">We couldn't reach the board</div>
        <div class="e-s" data-bind="error.body">Your connection dropped. Nothing was lost. Your last view is saved.</div>
        <div style="display:flex;gap:9px;margin-top:4px;">
          <button class="assign" data-action="retry"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>Retry</button>
          <button class="assign is-quiet" data-action="viewOffline" data-mod="is-:error.offlineState">View offline copy</button>
        </div>
        <div class="mono" style="font-size:10.5px;color:var(--faint);margin-top:6px;" data-bind="error.code">net::ERR_TIMED_OUT · 11:42 PM</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
