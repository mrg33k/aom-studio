<!-- Confirm Dialog Modal -->
<div id="confirm-dialog-overlay" class="modal-overlay" style="display: none;">
  <div class="modal-content confirm-modal">
    <h2 class="modal-title" id="confirm-title">Confirm Action</h2>
    <p class="modal-message" id="confirm-message">Are you sure?</p>
    <div class="modal-buttons">
      <button id="confirm-cancel-btn" class="btn-secondary">Cancel</button>
      <button id="confirm-ok-btn" class="btn-primary">Confirm</button>
    </div>
  </div>
</div>

<style>
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  .modal-content {
    background: var(--c-s1);
    border: 1px solid var(--c-border);
    border-radius: 12px;
    padding: var(--sp-lg);
    max-width: clamp(300px, 90vw, 500px);
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes slideUp {
    from {
      transform: translateY(20px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  .modal-title {
    font-size: var(--fs-lg);
    font-weight: var(--fw-bold);
    color: var(--c-text);
    margin: 0 0 var(--sp-md) 0;
  }

  .modal-message {
    font-size: var(--fs-base);
    color: var(--c-text2);
    margin: 0 0 var(--sp-lg) 0;
    line-height: 1.5;
  }

  .modal-buttons {
    display: flex;
    gap: var(--sp-md);
    justify-content: flex-end;
  }

  .btn-primary,
  .btn-secondary {
    padding: var(--sp-md) var(--sp-lg);
    border-radius: 6px;
    font-size: var(--fs-sm);
    font-weight: var(--fw-semibold);
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid transparent;
  }

  .btn-primary {
    background-color: var(--c-accent);
    color: white;
  }

  .btn-primary:hover {
    background-color: var(--c-accent-dark, var(--c-accent));
    opacity: 0.9;
  }

  .btn-secondary {
    background-color: var(--c-dim);
    color: var(--c-text);
    border-color: var(--c-border);
  }

  .btn-secondary:hover {
    background-color: var(--c-dim-ghost);
    border-color: var(--c-accent);
  }

  @media (max-width: 389px) {
    .modal-content {
      max-width: 85vw;
      padding: var(--sp-md);
    }

    .modal-buttons {
      flex-direction: column;
    }

    .btn-primary,
    .btn-secondary {
      width: 100%;
    }
  }
</style>

<script>
  window.ConfirmDialog = (function() {
    const overlay = document.getElementById('confirm-dialog-overlay');
    const titleEl = document.getElementById('confirm-title');
    const messageEl = document.getElementById('confirm-message');
    const cancelBtn = document.getElementById('confirm-cancel-btn');
    const okBtn = document.getElementById('confirm-ok-btn');

    let resolveFn = null;

    function show(config = {}) {
      return new Promise((resolve) => {
        titleEl.textContent = config.title || 'Confirm Action';
        messageEl.textContent = config.message || 'Are you sure?';
        cancelBtn.textContent = config.cancelLabel || 'Cancel';
        okBtn.textContent = config.okLabel || 'Confirm';

        resolveFn = resolve;
        overlay.style.display = 'flex';
      });
    }

    function hide() {
      overlay.style.display = 'none';
      if (resolveFn) {
        resolveFn(false);
        resolveFn = null;
      }
    }

    cancelBtn.addEventListener('click', hide);

    okBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      if (resolveFn) {
        resolveFn(true);
        resolveFn = null;
      }
    });

    // Close on overlay click (outside modal)
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        hide();
      }
    });

    return {
      show,
      hide,
    };
  })();
</script>
