# corner:integrations — opt-in staging deploy to aom-studio-lab.
#
# Lab is not product production. This workflow is intentionally manual-only and must
# be dispatched only when the user explicitly asks for a Lab/staging deployment.
# Normal `main` pushes deploy through the `aom-studio` Vercel project and are verified
# at https://aheadofmarket.com/dashboard.
#
# Vercel's `--prod` flag below selects the stable alias inside the separate Lab project;
# it does not make Lab the AOM production environment.

name: Deploy Lab Staging (Manual Only)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Explicit reason for deploying to Lab staging'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Publish the Lab staging alias
        run: |
          vercel --prod --yes \
            --token ${{ secrets.VERCEL_TOKEN }}

      - name: Confirm staging URL
        run: |
          echo "Staging deploy complete. Verify at: https://lab.aheadofmarket.com"
          vercel ls --prod \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --scope aheads-projects-d2a4c70f \
            2>/dev/null | head -5 || echo "(listing requires scoped access)"
