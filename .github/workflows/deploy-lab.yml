# corner:integrations — auto-deploy to aom-studio-lab (lab.aheadofmarket.com)
# Triggers on pushes to `main` OR `lab` branches, or manual dispatch.
#
# Root cause history (2026-08-06):
#  - R2 added `main` to trigger branches (was lab-only for 7 days) — necessary but not sufficient.
#  - Actual failures had two separate causes:
#    1. VERCEL_TOKEN lacked team scope ("You do not have access to the specified account")
#       → Fixed: replaced with fresh token that has aheads-projects-d2a4c70f team access.
#    2. Aug-06 runner not acquired (15m timeout) — transient GitHub infra issue, not a config bug.
#  - Pattern: use VERCEL_ORG_ID + VERCEL_PROJECT_ID env vars instead of --scope/--project flags;
#    this is Vercel's recommended CI pattern and avoids scope resolution issues.
#  - Added workflow_dispatch for manual re-trigger without a dummy commit.
#
# Staleness guard: the "check-staleness" job runs on schedule and alerts when origin/main
# is ahead of the latest production deployment. Not a hard block — just an early warning.
#
# Deployment verification: NEVER claim fixed until `vercel ls --prod` shows a NEW Production
# entry that post-dates the push. A triggered run is not a deployed run.

name: Deploy Lab to Production

on:
  push:
    branches:
      - main
      - lab
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deploy'
        required: false
        default: 'Manual redeploy'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to aom-studio-lab (production)
        run: |
          vercel --prod --yes \
            --token ${{ secrets.VERCEL_TOKEN }}

      - name: Confirm production URL
        run: |
          echo "Deploy complete. Verify at: https://lab.aheadofmarket.com"
          vercel ls --prod \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --scope aheads-projects-d2a4c70f \
            2>/dev/null | head -5 || echo "(listing requires scoped access)"
