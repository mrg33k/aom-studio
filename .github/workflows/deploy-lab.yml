# corner:integrations R2 — auto-deploy to aom-studio-lab (lab.aheadofmarket.com)
# Triggers on pushes to `main` OR `lab` branches.
#
# Root cause of the 7-day stale deploy (2026-08-06): this workflow only fired on
# `lab` pushes, but all work lands on `main`. Production was silently skipping
# every commit for 7 days. Fix: add `main` as a trigger branch. `actions/checkout`
# with no ref argument checks out the branch that triggered the push, so main
# pushes deploy main code, lab pushes deploy lab code.
#
# The lab branch carries extra experimental features (ManifestScene, Members tab)
# that aren't on main yet. Either branch is valid for lab.aheadofmarket.com — the
# important thing is that production stays current whenever main is pushed.

name: Deploy Lab to Production

on:
  push:
    branches:
      - main
      - lab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to aom-studio-lab (production)
        run: |
          vercel --prod --yes \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --scope aheads-projects-d2a4c70f \
            --project aom-studio-lab
