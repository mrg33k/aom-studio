    <script>
      (function () {
        var path = window.location && window.location.pathname ? window.location.pathname : '';
        if (!(/^\/dashboard(?:\/|$)/.test(path) || /^\/cvg(?:\/|$)/.test(path) || /^\/cv6(?:\/|$)/.test(path))) return;
        var theme = 'dark';
        try {
          var stored = window.localStorage && window.localStorage.getItem('cv6-theme');
          if (stored === 'light' || stored === 'glass' || stored === 'dark') theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute('data-cv6-boot', 'on');
        document.documentElement.setAttribute('data-app-theme', theme);
      })();
    </script>
    <!-- Portrait lock: the manifest sets orientation:portrait (Android PWA), but iOS
         web apps ignore that, so we block mobile landscape with a full-screen overlay.
         Phones only (max-width 1023px); tablets/desktop are unaffected. -->
    <style>
      html[data-app-theme="dark"] {
        --cv6-boot-ground: #0A0A0B;
        --cv6-boot-surface: #161619;
        --cv6-boot-fg: #E9E9EC;
        --cv6-boot-muted: #9a9aa2;
        --cv6-boot-hair: rgba(255,255,255,.09);
        --cv6-boot-chip: rgba(255,255,255,.06);
        --cv6-boot-accent: #3B82F6;
        --cv6-boot-mask: url('/cv6/assets/corner-logo-white.svg');
      }
      html[data-app-theme="light"] {
        --cv6-boot-ground: #F6F6F7;
        --cv6-boot-surface: #FFFFFF;
        --cv6-boot-fg: #18181B;
        --cv6-boot-muted: #6a6a72;
        --cv6-boot-hair: rgba(0,0,0,.08);
        --cv6-boot-chip: rgba(0,0,0,.04);
        --cv6-boot-accent: #0066FF;
        --cv6-boot-mask: url('/cv6/assets/corner-logo.svg');
      }
      html[data-app-theme="glass"] {
        --cv6-boot-ground:
          radial-gradient(54% 40% at 22% 12%, rgba(74,116,148,.55), transparent 62%),
          radial-gradient(50% 34% at 86% 20%, rgba(206,148,70,.34), transparent 58%),
          radial-gradient(46% 34% at 72% 86%, rgba(46,96,128,.45), transparent 64%),
          linear-gradient(180deg, #0c1218 0%, #080b10 55%, #05080b 100%);
        --cv6-boot-surface: rgba(22,26,33,.55);
        --cv6-boot-fg: #F3F4F6;
        --cv6-boot-muted: #c0c4cc;
        --cv6-boot-hair: rgba(255,255,255,.16);
        --cv6-boot-chip: rgba(255,255,255,.1);
        --cv6-boot-accent: #5B9BFF;
        --cv6-boot-mask: url('/cv6/assets/corner-logo-white.svg');
      }
      html[data-cv6-boot="on"],
      html[data-cv6-boot="on"] body {
        min-height: 100%;
        background: var(--cv6-boot-ground);
      }
      /* Keep the ground on the page canvas AFTER boot too. FullscreenLoading
         removes data-cv6-boot once the app mounts, which dropped html/body to a
         flat canvas — so the strips behind the app (the notch safe-area above the
         header, the home-indicator area below the content, and any iOS overscroll)
         flashed a flat dark band instead of the wallpaper. On glass that read as a
         "border" on the top and bottom that didn't blend with the body (Patrik
         2026-07-19). Painting the same per-theme ground here means the canvas
         behind the app always matches the shell, so those strips blend seamlessly.
         --cv6-boot-ground is defined per data-app-theme (always set), so it tracks
         dark/light/glass. */
      html,
      html body {
        min-height: 100%;
        background: var(--cv6-boot-ground);
      }
      #cv6-boot-loader {
        display: none;
      }
      html[data-cv6-boot="on"] #cv6-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        min-height: 100dvh;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding:
          calc(env(safe-area-inset-top, 0px) + 28px)
          calc(env(safe-area-inset-right, 0px) + 20px)
          calc(env(safe-area-inset-bottom, 0px) + 28px)
          calc(env(safe-area-inset-left, 0px) + 20px);
        background: var(--cv6-boot-ground);
        color: var(--cv6-boot-fg);
        font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
      }
      .cv6-boot-card {
        width: min(280px, 100%);
        display: grid;
        justify-items: center;
        gap: 14px;
        padding: 20px;
        text-align: center;
      }
      .cv6-boot-mark {
        position: relative;
        display: block;
        width: clamp(138px, 30vw, 184px);
        aspect-ratio: 110.72 / 24;
      }
      .cv6-boot-base,
      .cv6-boot-fill {
        position: absolute;
        inset: 0;
        display: block;
        background: var(--cv6-boot-fg);
        -webkit-mask: var(--cv6-boot-mask) center / contain no-repeat;
        mask: var(--cv6-boot-mask) center / contain no-repeat;
      }
      .cv6-boot-base { opacity: .24; }
      .cv6-boot-fill {
        background: var(--cv6-boot-accent);
        clip-path: inset(100% 0 0 0);
        animation: cv6BootFill 2.2s cubic-bezier(.22, 1, .36, 1) infinite;
      }
      .cv6-boot-label {
        font-size: 13px;
        line-height: 1.4;
        color: var(--cv6-boot-muted);
      }
      @keyframes cv6BootFill {
        0% { clip-path: inset(100% 0 0 0); opacity:.72; }
        72%, 88% { clip-path: inset(0); opacity:1; }
        100% { clip-path: inset(0); opacity:.3; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cv6-boot-fill { animation:none; clip-path:inset(0); }
      }
      #cv6-rotate-lock { display: none; }
      @media only screen and (max-width: 1023px) and (orientation: landscape) {
        #cv6-rotate-lock {
          display: flex; position: fixed; inset: 0; z-index: 2147483647;
          flex-direction: column; align-items: center; justify-content: center;
          gap: 14px; padding: 24px; text-align: center;
          background: #0A0A0B; color: #E9E9EC;
          font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
        }
        html, body { overflow: hidden; }
      }
    </style>
