    <!-- ===================================================================
         Surface identity: favicon set + bookmark identity, per route.
         Mission: aom:favicon-system.

         THE INVARIANT: after an in-app navigation to path P, this head must
         match what a hard load of P produces — canonical, og:url, og:title,
         title, icon, ico, apple-touch-icon, manifest, theme-color.

         This document is one SPA serving three brands. React Router changes
         the URL without reloading the document, so a run-once version of this
         script goes stale the instant anyone clicks a link: the Corner
         dashboard kept the AOM favicon, the AOM manifest, a canonical pointing
         at whatever marketing page you came from, and that page's name. Safari
         and the iOS share sheet read rel=canonical and document.title when
         saving a bookmark, which is why every bookmark came out as the bare
         domain under the wrong name.

         TWO PLACEMENT RULES, both learned the hard way:
         1. This script must stay LAST in <head>. It writes to <title>, the OG
            tags and the icon links, and a tag the parser has not reached yet
            cannot be written to. An earlier version sat at the top and set
            document.title before <title> was parsed — which silently created a
            SECOND <title> element and only worked because it happened to come
            first in tree order.
         2. Add a surface to SURFACES below. Never a second hardcoded <link>.
         =================================================================== -->
    <script>
      (function () {
        /* manifest:null is deliberate and load-bearing. "Add to Home Screen" on
           iOS 16.4+ takes its URL from the manifest's start_url, NOT from the
           page you are looking at. aom.webmanifest declares start_url "/" and
           scope "/", so while it was linked site-wide every single page offered
           to save as the bare domain — /work/kohrs, /about, all of them.

           Before this mission index.html linked /corner/manifest.json instead,
           whose scope is /dashboard. On marketing pages that scope did not match
           the document, so the manifest was ignored and iOS fell back to the
           real URL. It worked by accident, and swapping in a site-wide AOM
           manifest broke it.

           The marketing site is not an installable app. With no manifest, iOS
           saves the page you are actually on and still takes the icon from
           apple-touch-icon and the name from apple-mobile-web-app-title, so
           nothing about the favicon system is lost. Only the real apps below
           get a manifest. */
        var DEFAULT = {
          slug: 'aom', theme: '#0B0B0B', title: 'Ahead of Market',
          manifest: null,
          doc: 'AOM | We Make Companies Impossible to Ignore'
        };
        var SURFACES = [
          { re: /^\/(?:dashboard|cvg|cv6)(?:\/|$)/, slug: 'corner', theme: '#0A0F1E', title: 'Corner', manifest: '/corner/manifest.json', manifestRe: /^\/dashboard(?:\/|$)/, doc: 'Corner — Your AI Team in a Dashboard' },
          { re: /^\/moguls(?:\/|$)/,                slug: 'moguls', theme: '#050505', title: 'Moguls', manifest: '/brand/favicon/moguls.webmanifest', manifestRe: /^\/moguls\/?$/, doc: 'Moguls — The market for music fans' }
        ];

        /* The set of titles that BELONG to a surface. Used as a floor: if the
           document is showing one surface's title while we are on a different
           surface, that is stale by definition and gets corrected. Nothing else
           is touched, so a route component's own title ("Kohrs Construction
           Social Content") is never clobbered. */
        var KNOWN_DOCS = [DEFAULT.doc];
        for (var s = 0; s < SURFACES.length; s++) KNOWN_DOCS.push(SURFACES[s].doc);
        var wantDoc = DEFAULT.doc;

        /* Tracking params are noise in a canonical and noise in a saved
           bookmark. Everything else (?view=files, ?mission=x) is part of the
           page's identity and has to survive. */
        var JUNK = /^(?:utm_.*|gclid|fbclid|msclkid|mc_cid|mc_eid|_hsenc|_hsmi|igshid|si)$/i;

        function surfaceFor(path) {
          for (var i = 0; i < SURFACES.length; i++) {
            if (SURFACES[i].re.test(path)) return SURFACES[i];
          }
          return DEFAULT;
        }

        function cleanHref() {
          try {
            var u = new URL(window.location.href);
            var drop = [];
            u.searchParams.forEach(function (v, k) { if (JUNK.test(k)) drop.push(k); });
            for (var i = 0; i < drop.length; i++) u.searchParams.delete(drop[i]);
            return u.origin + u.pathname + (u.search || '');
          } catch (e) {
            return window.location.origin + window.location.pathname;
          }
        }

        function set(key, attr, val) {
          var el = document.querySelector('[data-fav="' + key + '"]');
          if (el) el.setAttribute(attr, val);
        }

        /* A manifest cannot be "turned off" by blanking its href — an empty
           href resolves to the page itself, which is worse. Detach the element
           and keep the reference so a later navigation can put it back. */
        var manifestEl = document.querySelector('[data-fav="manifest"]');
        var manifestHome = manifestEl && manifestEl.parentNode;
        function setManifest(href) {
          if (!manifestEl || !manifestHome) return;
          if (href) {
            manifestEl.setAttribute('href', href);
            if (!manifestEl.parentNode) manifestHome.appendChild(manifestEl);
          } else if (manifestEl.parentNode) {
            manifestEl.parentNode.removeChild(manifestEl);
          }
        }

        /* og:title is the name a share sheet offers, so it has to equal
           document.title at all times. We do not own that value — route
           components set it whenever their data lands, which can be several
           frames after navigation — so mirror it instead of trying to time it. */
        function mirrorOgTitle() {
          var el = document.querySelector('[data-fav="ogtitle"]');
          if (el && el.getAttribute('content') !== document.title) {
            el.setAttribute('content', document.title);
          }
        }

        /* Several route components capture document.title on mount and RESTORE
           it on unmount. That restore fires while React commits the next route
           — after we have already claimed the title — so navigating from a
           marketing page into Corner left the AOM marketing headline sitting on
           the dashboard. Waiting a frame does not help: the value it restores is
           not the one we were watching for.

           The rule that does hold: a surface's title on a different surface is
           always wrong. Correct only that, and only ever back to the current
           surface's own title. Anything a component genuinely authored is not in
           KNOWN_DOCS and is left alone. */
        function enforceSurfaceTitle() {
          var t = document.title;
          if (t === wantDoc) return;
          for (var i = 0; i < KNOWN_DOCS.length; i++) {
            if (t === KNOWN_DOCS[i]) { try { document.title = wantDoc; } catch (e) {} return; }
          }
        }

        function onHeadMutation() {
          enforceSurfaceTitle();
          mirrorOgTitle();
        }

        function apply() {
          var path = (window.location && window.location.pathname) || '';
          var hit = surfaceFor(path);
          var href = cleanHref();

          set('canonical', 'href', href);
          set('ogurl', 'content', href);

          set('icon', 'href', '/brand/favicon/' + hit.slug + '.svg');
          set('ico', 'href', '/brand/favicon/' + hit.slug + '.ico');
          set('apple', 'href', '/brand/favicon/' + hit.slug + '-180.png');
          /* manifestRe: attach the manifest ONLY on the app's real front door.
             /cv6 and /cvg render the same app but sit outside corner
             manifest.json's scope, so a browser would reject it there anyway —
             and this bug was caused by relying on exactly that kind of silent
             rejection. Say it out loud instead: no manifest, so those save as
             themselves. */
          setManifest(
            hit.manifest && (!hit.manifestRe || hit.manifestRe.test(path))
              ? hit.manifest : null
          );
          set('theme', 'content', hit.theme);
          set('title', 'content', hit.title);

          /* A bookmark is NAMED from document.title. Only about half the route
             components set one, and several restore whatever title was up when
             they mounted — so left alone, a page inherits the name of the page
             you came from. Claim the title now, then yield a frame: if a
             component sets its own it wins, and if nothing does we re-assert
             rather than let the previous page's name stand. */
          var prev = document.title;
          var want = hit.doc;
          wantDoc = want;
          if (prev !== want) { try { document.title = want; } catch (e) {} }
          mirrorOgTitle();

          if (prev === want || typeof requestAnimationFrame !== 'function') return;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              if (document.title === prev) { try { document.title = want; } catch (e) {} }
              mirrorOgTitle();
            });
          });
        }

        apply();

        /* Catches every later title write — a route component's effect, a data
           fetch resolving, anything. One observer on <head> covers text edits
           and a wholesale <title> replacement alike. */
        try {
          if (typeof MutationObserver === 'function' && document.head) {
            new MutationObserver(onHeadMutation).observe(document.head, {
              subtree: true, childList: true, characterData: true
            });
          }
        } catch (e) {}

        /* React Router mutates history directly and neither pushState nor
           replaceState fires an event, so there is nothing to listen to until
           we wrap them. This is the whole reason the head used to go stale. */
        ['pushState', 'replaceState'].forEach(function (name) {
          var orig = history[name];
          if (typeof orig !== 'function') return;
          history[name] = function () {
